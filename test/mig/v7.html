<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quản lý Golden Bee</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed left rail with the 15 modules (drawer on phones), content column on the right; sheets and timetables scroll inside their own containers. Identity: honey yellow and brand red from the Golden Bee logo on warm paper neutrals. */
:root{--bg:#faf6ec;--card:#fffdf8;--tx:#2b2118;--mu:#756652;--bd:#e9dec8;--side:#2b2118;--sidetx:#eadfcb;--sidemu:#a99a85;--ac:#c8372b;--onac:#ffffff;--acs:#fbe5e1;--sun:#f4d133;--sus:#fff4c2;--onsun:#2b2118;--ok:#1e7a4c;--oks:#dcf2e5;--wa:#8a5a00;--was:#fff0c7;--er:#b42318;--ers:#fde7e4;--in:#265fb0;--ins:#e2ecfb;--f1:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f2:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16120d;--card:#1f1913;--tx:#f1e9da;--mu:#b5a590;--bd:#382e22;--side:#0e0b07;--sidetx:#eadfcb;--sidemu:#9d8e79;--ac:#ff8272;--onac:#2a0d09;--acs:#3c1f1a;--sun:#f4d133;--sus:#3a3211;--onsun:#2b2118;--ok:#52c68e;--oks:#133324;--wa:#f0b84a;--was:#3a2b0c;--er:#ff8a7d;--ers:#40201c;--in:#8db6f5;--ins:#1a2a45}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16120d;--card:#1f1913;--tx:#f1e9da;--mu:#b5a590;--bd:#382e22;--side:#0e0b07;--sidetx:#eadfcb;--sidemu:#9d8e79;--ac:#ff8272;--onac:#2a0d09;--acs:#3c1f1a;--sun:#f4d133;--sus:#3a3211;--onsun:#2b2118;--ok:#52c68e;--oks:#133324;--wa:#f0b84a;--was:#3a2b0c;--er:#ff8a7d;--ers:#40201c;--in:#8db6f5;--ins:#1a2a45}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:15px/1.55 var(--f1);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1{font:700 26px/1.2 var(--f2);margin:0 0 2px;text-wrap:balance}h2{font:600 17px/1.3 var(--f2);margin:0 0 10px;text-wrap:balance}h3{font-size:14px;margin:0 0 6px}
p{margin:0}.mu{color:var(--mu)}.sm{font-size:13px}.r{text-align:right}.nw{white-space:nowrap}.b{font-weight:700}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--sidetx);padding:18px 12px 24px;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 14px}
.brand img{width:48px;height:48px;border-radius:50%;flex:none;background:#fff}
.brand b{font:700 13px/1.25 var(--f2);letter-spacing:.02em;text-transform:uppercase}
.ng{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--sidemu);padding:14px 10px 4px}
.nav button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;padding:8px 10px;border-radius:9px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--sidetx);font-size:14px}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:var(--sun);color:var(--onsun);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
.bdg{background:var(--ac);color:var(--onac);border-radius:99px;font-size:11px;padding:0 7px;line-height:18px;font-weight:700}
main{padding:22px 28px 56px;min-width:0}
.bar0{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--sun);color:var(--onsun);display:grid;place-items:center;font:700 16px var(--f2);flex:none}
.hamb{display:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.kpi{margin:0;padding:14px}.kpi .big{font:700 28px/1.15 var(--f2)}.kpi .big.er{color:var(--er)}.kpi .big.ok{color:var(--ok)}
.kpi{container-type:inline-size}.kpi .big{font-size:clamp(17px,12.5cqi,28px);overflow-wrap:anywhere}
.kpi.mini{padding:10px}.kpi.mini .big{font-size:clamp(15px,11cqi,22px)}
@media (max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{padding:12px}.kpi.mini{padding:10px}}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.btn{border:1px solid var(--bd);background:var(--card);padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ac)}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.btn.y{background:var(--sun);border-color:var(--sun);color:var(--onsun);font-weight:600}
.btn.s{padding:3px 10px;font-size:13px}.btn.no{color:var(--er)}.btn:disabled{opacity:.5;cursor:not-allowed}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--acs);color:var(--ac);white-space:nowrap}
.tag.ok{background:var(--oks);color:var(--ok)}.tag.wa{background:var(--was);color:var(--wa)}.tag.er{background:var(--ers);color:var(--er)}.tag.in{background:var(--ins);color:var(--in)}.tag.gy{background:var(--bd);color:var(--mu)}.tag.y{background:var(--sus);color:var(--wa)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.tab{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 14px;border-bottom:3px solid transparent;color:var(--mu);font-weight:500;white-space:nowrap}
.tab.on{color:var(--tx);border-color:var(--ac);font-weight:600}
.tab:focus-visible{outline:2px solid var(--ac)}
.tw{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--bd);vertical-align:top}
th{font-size:12.5px;color:var(--mu);font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right}tr.k{cursor:pointer}tr.k:hover td{background:var(--sus)}tr.tot td{font-weight:700}
.empty{padding:16px;color:var(--mu)}
label{display:block;font-size:13px;color:var(--mu);margin:0 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg)}
input[type=checkbox],input[type=radio]{width:auto}
.f{display:grid;gap:12px}.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.chk{display:flex;gap:6px;align-items:center;color:var(--tx);font-size:14px;margin:0}
.err{color:var(--er);font-size:13px;min-height:18px}
.mdl{position:fixed;inset:0;background:rgba(20,14,8,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.mdc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;width:100%;max-width:580px;margin:auto 0}
.mdc.w{max-width:920px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:60;font-size:14px;max-width:90vw}
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.stp{padding:2px 10px;border-radius:99px;background:var(--bd);color:var(--mu);font-weight:600}
.stp.on{background:var(--sun);color:var(--onsun)}.stp.ok{background:var(--oks);color:var(--ok)}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--ac)}
.rw{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd);align-items:center;flex-wrap:wrap}.rw:last-child{border:0}
.note{background:var(--sus);border-radius:10px;padding:10px 12px;font-size:13.5px}
.lg{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.lgl{background:var(--side);color:var(--sidetx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 24px;text-align:center}
.lgl img{width:min(250px,60vw);border-radius:50%;background:#fff}
.lgl h1{color:var(--sun);font-size:24px;letter-spacing:.02em;max-width:18ch}
.lgr{display:flex;align-items:center;justify-content:center;padding:32px 16px}
.lgc{width:100%;max-width:430px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roles .btn{text-align:left;padding:10px 12px}.roles .btn b{display:block;font-size:14px}.roles .btn span{font-size:12px;color:var(--mu)}
@media (max-width:900px){
.lg{grid-template-columns:1fr}.lgl{padding:24px 16px}.lgl img{width:120px}
.shell{display:block}
.side{position:fixed;left:0;top:0;bottom:0;align-self:stretch;width:min(300px,86vw);height:auto;z-index:40;transform:translateX(-102%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px))}
.side.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(20,14,8,.5);z-index:39}
.hamb{display:inline-flex}
main{padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:22px}}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
/* Lịch tuần */
.wkt{min-width:760px;table-layout:fixed}
.wkt th,.wkt td{padding:4px;border:1px solid var(--bd);vertical-align:top;text-align:left}
.wkt th:first-child{width:104px}
.wkt .cell{height:56px}
.wkt .cell.off{background:var(--ers)}
.ls{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:3px 6px;border-radius:7px;background:var(--acs);color:var(--tx);font-size:12.5px;line-height:1.3;margin-bottom:3px}
.ls small{display:block;color:var(--mu);font-size:11.5px}
.ls.bu{background:var(--sus);outline:1px solid var(--sun)}
.ls.x{background:var(--ers)}
.ls.add{background:transparent;border:1px dashed var(--bd);color:var(--mu);text-align:center;font-size:16px;padding:1px 6px}
.ls:focus-visible{outline:2px solid var(--ac)}
/* Nút trạng thái điểm danh */
.stb{display:flex;gap:4px;flex-wrap:wrap}
.st{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:4px 9px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.st:hover:not(:disabled){border-color:var(--ac)}
.st:disabled{opacity:.55;cursor:not-allowed}
.st.on{color:var(--bg);font-weight:600}
.st.on.st-cm{background:var(--ok);border-color:var(--ok)}.st.on.st-p{background:var(--wa);border-color:var(--wa)}.st.on.st-kp{background:var(--er);border-color:var(--er)}.st.on.st-tt{background:var(--in);border-color:var(--in)}.st.on.st-bv{background:var(--ac);border-color:var(--ac)}
/* Bảng chấm công dạng lưới */
.sheet{min-width:0;width:auto;font-size:12.5px;border-collapse:separate;border-spacing:0}
.sheet th,.sheet td{padding:5px 6px;white-space:nowrap;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
.sheet th.r,.sheet td.r{text-align:right}
.sheet th{background:var(--card)}
.sheet .s1{position:sticky;left:0;z-index:2;background:var(--card);width:170px;min-width:170px;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.sheet .s2{position:sticky;left:170px;z-index:2;background:var(--card);border-right:1px solid var(--bd)}
.sheet .dc{width:30px;min-width:30px;text-align:center;padding:3px 1px}
.sheet th.dc{font-size:11.5px;line-height:1.25}
.sheet .sun{background:var(--bd)}
.sheet td.er,.sheet td.r.er{color:var(--er);font-weight:700}
.dcell{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:1px;justify-content:center;align-items:center;min-height:22px;min-width:22px;border-radius:6px}
.dcell:hover{background:var(--sus)}
.dcell:focus-visible{outline:2px solid var(--ac)}
.sc{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:5px;font:700 11.5px/1 var(--f1);font-style:normal;padding:0 3px;box-sizing:border-box}
button.sc{border:0;cursor:pointer}button.sc:disabled{cursor:default}
.sc-x{background:var(--oks);color:var(--ok)}
.sc-P,.sc-M{background:var(--was);color:var(--wa)}
.sc-K,.sc-A{background:var(--ers);color:var(--er)}
.sc-N{background:var(--ins);color:var(--in)}
.sc-V{background:var(--acs);color:var(--ac)}
.sc-B{background:var(--sus);color:var(--tx);outline:1px solid var(--sun)}
.sc-q{background:transparent;color:var(--mu);border:1px dashed var(--mu)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--mu);margin-bottom:10px;align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.lk{all:unset;cursor:pointer;color:var(--ac);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.lk:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* Lịch tháng của phụ huynh */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal>div{min-height:56px;border:1px solid var(--bd);border-radius:8px;padding:4px;font-size:12.5px;min-width:0}
.cal>div.sun{background:var(--bd);opacity:.6}
.cal .sc{margin:1px}
#demo-role{max-width:190px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:700px){.grid.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
/* Hồ sơ xuất PDF luôn dùng nền sáng */
.pdfbox{--bg:#fff;--card:#fff;--tx:#1d1a16;--mu:#6b5f50;--bd:#e3d9c3;--ac:#c8372b;color-scheme:light;color:#1d1a16}
.pdfbox table{min-width:0;width:100%;border-collapse:collapse;font-size:12px}
.pdfbox th,.pdfbox td{border:1px solid #d9cfb8;padding:4px 6px;color:#1d1a16;background:#fff;white-space:normal}
.pdfbox th{background:#fbf3d6;font-size:12px}
.pdfbox h3{margin:0 0 6px;font-size:14px}
@media (max-width:600px){
.bar0 .acts label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}#demo-role{max-width:150px}
.sheet .s1{width:118px;min-width:118px;max-width:118px}
.sheet th.s2,.sheet td.s2{display:none}
.top .acts{width:100%}
}
/* ===== Can thiệp cá nhân: kế hoạch, buổi can thiệp, thư viện mục tiêu, biểu đồ tiến bộ ===== */
/* Màu biểu đồ: một sắc xanh ngọc đơn sắc, đậm dần theo mức độc lập (đã kiểm tra tương phản và phân biệt màu) */
:root{--c1:#047781;--onc1:#ffffff;--cg:#8f8370;--o1:#03464c;--o2:#0b5e65;--o3:#047781;--o4:#0f919c;--o5:#39aab6;--o6:#57c3cf;--ot1:#ffffff;--ot2:#ffffff;--ot3:#ffffff;--ot4:#0b0b0b;--ot5:#0b0b0b;--ot6:#0b0b0b;--b1:#024c52;--b2:#118a95;--b3:#57c3cf;--bt1:#ffffff;--bt2:#0b0b0b;--bt3:#0b0b0b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#4cbac6;--onc1:#0b0b0b;--cg:#8c7f6b;--o1:#7de8f3;--o2:#65d0dc;--o3:#4cbac6;--o4:#31a4af;--o5:#058e99;--o6:#047781;--ot1:#0b0b0b;--ot2:#0b0b0b;--ot3:#0b0b0b;--ot4:#0b0b0b;--ot5:#0b0b0b;--ot6:#ffffff;--b1:#6cd7e3;--b2:#31a4af;--b3:#06717a;--bt1:#0b0b0b;--bt2:#0b0b0b;--bt3:#ffffff}}
:root[data-theme="dark"]{--c1:#4cbac6;--onc1:#0b0b0b;--cg:#8c7f6b;--o1:#7de8f3;--o2:#65d0dc;--o3:#4cbac6;--o4:#31a4af;--o5:#058e99;--o6:#047781;--ot1:#0b0b0b;--ot2:#0b0b0b;--ot3:#0b0b0b;--ot4:#0b0b0b;--ot5:#0b0b0b;--ot6:#ffffff;--b1:#6cd7e3;--b2:#31a4af;--b3:#06717a;--bt1:#0b0b0b;--bt2:#0b0b0b;--bt3:#ffffff}
/* Bộ lọc dạng nút */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;line-height:1.35;min-height:32px;cursor:pointer}
.chip:hover{border-color:var(--ac)}
.chip.on{background:var(--sun);border-color:var(--sun);color:var(--onsun);font-weight:600}
.lb{display:block;font-size:13px;color:var(--mu);margin:0 0 6px}
/* Nhãn mức hỗ trợ */
.sp{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;line-height:1.5;white-space:nowrap}
.sp.sp-I{background:var(--o1);color:var(--ot1)}.sp.sp-TD{background:var(--o2);color:var(--ot2)}.sp.sp-GP{background:var(--o3);color:var(--ot3)}
.sp.sp-MP{background:var(--o4);color:var(--ot4)}.sp.sp-PP{background:var(--o5);color:var(--ot5)}.sp.sp-FP{background:var(--o6);color:var(--ot6)}
/* Kế hoạch mục tiêu */
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;padding:11px 0;border-bottom:1px solid var(--bd);align-items:start}
.pl:last-child{border-bottom:0}
.pl-m{min-width:0}.pl-m>b{display:block;line-height:1.4}
.pl-t{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:5px}
.pl-r{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;justify-content:flex-end}
.pl-a{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.pl.dn .pl-m>b{color:var(--mu)}
.spk{display:inline-flex;align-items:flex-end;gap:2px;height:20px}
.spk i{display:block;width:5px;min-height:2px;background:var(--c1);border-radius:2px 2px 0 0}
/* Dải kết quả 10 lượt */
.trs{display:inline-flex;gap:2px;vertical-align:middle}
.trs i{display:block;width:8px;height:16px;border-radius:2px;box-sizing:border-box}
.trs i.tv{background:var(--c1)}.trs i.tx{border:2px solid var(--cg)}.trs i.to{background:var(--bd)}
/* Danh sách buổi can thiệp */
.sess{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card);min-width:0}
.sess-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sess-d{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sess-i{list-style:none;margin:8px 0 4px;padding:0}
.sess-i li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:6px 0;border-top:1px dashed var(--bd)}
.sess-i .gn{flex:1 1 240px;min-width:0;font-weight:600}
/* Biểu mẫu ghi buổi */
.si{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--bg);min-width:0}
.si-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.si-l{font-size:12.5px;font-weight:600;color:var(--mu);margin:10px 0 5px}.si-l .mu{font-weight:400}

'use strict';
/* ===== Tiện ích chung ===== */
const $q=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>new Date(s+'T00:00:00');
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>pd(s).getDay();
const isW=s=>dow(s)!==0;
const vd=s=>s?s.split('-').reverse().join('/'):'';
const vdm=s=>vd(s).slice(0,5);
const NOW=new Date(),TODAY=iso(NOW);
const lastWork=s=>{while(!isW(s))s=addD(s,-1);return s};
const WD=lastWork(TODAY),CM=TODAY.slice(0,7);
const sm=(m,n)=>iso(new Date(+m.slice(0,4),+m.slice(5,7)-1+n,1)).slice(0,7);
const mDates=m=>Array.from({length:new Date(+m.slice(0,4),+m.slice(5,7),0).getDate()},(_,i)=>m+'-'+pad(i+1));
const mLabel=m=>'Tháng '+(+m.slice(5,7))+'/'+m.slice(0,4);
const mLow=m=>'tháng '+(+m.slice(5,7))+'/'+m.slice(0,4);
const DAYN=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const DAYS=['CN','T2','T3','T4','T5','T6','T7'];
const fmt=n=>Math.round(+n||0).toLocaleString('vi-VN')+'\u00a0₫';
const fnum=n=>Math.round(+n||0).toLocaleString('vi-VN');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const mo=dob=>{const d=pd(dob);return (NOW.getFullYear()-d.getFullYear())*12+NOW.getMonth()-d.getMonth()-(NOW.getDate()<d.getDate()?1:0)};
const age=dob=>{const m=mo(dob);return m>=24?Math.floor(m/12)+' tuổi'+(m%12?' '+(m%12)+' tháng':''):m+' tháng'};
const ascii=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]/g,'');
const given=n=>n.split(' ').slice(-2).join(' ');

/* ===== Trạng thái ===== */
let DB=null,U=null;
const S={v:'dash',menu:false,modal:null,pg:{}};
const ACT={},FORM={},CHG={},INP={},VIEWS={},MODALS={};
const KEY='gb_v2';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
function go(v,p){S.v=v;S.modal=null;S.menu=false;S.top=1;if(p)Object.assign(S,p)}
ACT.nav=v=>go(v);
ACT.menu=()=>{S.menu=!S.menu};
ACT.pg=v=>{const [k,p]=v.split(':');S.pg[k]=+p};

/* ===== Thành phần giao diện ===== */
const head=(t,s,x)=>`<div class="top"><div><h1>${t}</h1>${s?`<p class="mu">${s}</p>`:''}</div><div class="acts">${x||''}</div></div>`;
const tabsH=(items,cur,act)=>`<div class="tabs" role="tablist">${items.map(([k,t])=>`<button class="tab ${cur===k?'on':''}" role="tab" data-a="${act}" data-v="${k}">${t}</button>`).join('')}</div>`;
const tg=(t,c)=>`<span class="tag ${c||''}">${esc(t)}</span>`;
const kpi=(l,v,s,c)=>`<div class="card kpi"><div class="mu sm">${l}</div><div class="big ${c||''}">${v}</div><div class="sm mu">${s||''}</div></div>`;
const tbl=(th,rows,empty)=>`<div class="tw"><table><thead><tr>${th.map(h=>`<th class="${h[0]==='>'?'r':''}">${esc(h.replace(/^>/,''))}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${th.length}" class="empty">${empty||'Chưa có dữ liệu.'}</td></tr>`}</tbody></table></div>`;
const opts=(list,cur)=>list.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${esc(l)}</option>`).join('');
const bar=(p,c)=>`<div class="bar" role="img" aria-label="${Math.round(p)}%"><i style="width:${Math.max(0,Math.min(100,p))}%${c?';background:'+c:''}"></i></div>`;
function pg(key,list,per){const n=Math.max(1,Math.ceil(list.length/per)),p=Math.min(S.pg[key]||1,n);S.pg[key]=p;

hực hiện được 1 lần thưởng)"],["3","sẽ lại gần và thực hiện một số yêu cầu (mỗi lần thực hiện được 1 lần thưởng)"],["2","sẵn sàng lại gần thậm chí nhiều lần và thực hiện nhiều mệnh lệnh đơn đã học"],["1","thỉnh thoảng lại gần và thực hiện ít nhất một yêu cầu để được vật yêu thích"]]],["A6",2,0,"Hồi đáp với vật/ hành động yêu thích mà GV đang cầm/kiểm soát","HS sẽ chịu làm theo yêu cầu khi GV đang cầm/kiểm soát vật yêu thích","Khi đưa 3 mảnh ráp hình, mỗi lần 1 mảnh, HS sẽ ghép mảnh ráp vào khung để được 1 quả nho (vật HS thích) cho mỗi lần ghép",-1,[["4","thực hiện 5 bài tập/hồi đáp mới sau ít nhất 5 lần đưa ra vật yêu thích"],["3","2 bài tập/hồi đáp mới và 3 bài tập/hồi đáp đã học sau ít nhất 5 lần đưa ra vật yêu thích"],["2","5 bài tập/hồi đáp đã học sau 5 lần đưa ra vật yêu thích"],["1","3 bài tập/hồi đáp đã học sau 3 lần đưa ra vật yêu thích"]]],["A7",2,0,"Hợp tác/hồi đáp với nhiều GV","HS thể hiện và sử dụng những kỹ năng đã học từ 1 GV khi làm việc với các GV khác","HS được 1 GV dạy bắt chước vỗ tay và sờ mũi, và sẽ làm những hành động này theo yêu cầu của GV khác",-1,[["2","sẵn sàng hợp tác với ít nhất 3 GV VÀ với các GV mới mà vẫn hồi đáp với tốc độ và chất lượng như với GV cũ"],["1","sẵn sàng hợp tác với ít nhất 3 GV mà vẫn hồi đáp với tốc độ và chất lượng như với GV cũ"]]],["A8",2,0,"Đợi trong giờ học mà không sờ vào vật kích thích","Trong giờ học (trên bàn, chơi dưới sàn nhà, gần giáo cụ), HS sẽ bình tĩnh đợi và vẫn tập trung nghe hướng dẫn của GV và giáo cụ mà không sờ vào chúng nếu GV chưa có chỉ dẫn","Ngồi yên để tay trên bàn mà không với lấy dụng cụ học tập, đợi GV ra bài tập, không phải để GV nhắc nhiều lần \"ngồi yên\", \"bỏ tay ra\", v.v…",-1,[["2","Khi để giáo cụ trước mặt, HS luôn nhìn giáo cụ và bình tĩnh đợi mà không cần nhắc không được sờ vào giáo cụ"],["1","chỉ phải nhắc 1 lần ngồi/đứng yên hoặc không được lấy giáo cụ"]]],["A9",2,0,"Nhìn GV đợi chỉ dẫn","Khi đang thực hiện các bài tập, HS sẽ nhìn bao quát các giáo cụ và nhìn GV đợi chỉ dẫn cho bài tập tiếp theo","Sau khi nhìn bao quát các tranh bài tập trên bàn, HS nhìn GV đợi chỉ dẫn tiếp theo mà không cần nhắc \"Nhìn\"",-1,[["2","sau khi nhìn bao quát các giáo cụ, HS luôn nhìn GV đợi chỉ dẫn tiếp theo"],["1","sau khi nhìn bao quát các giáo cụ, chỉ cần nhắc 1 lần phải tập trung đợi chỉ dẫn của GV"]]],["A10",2,0,"Nhìn bao quát chuỗi các vật trước khi hồi đáp","Khi GV ra bài tập có dùng giáo cụ, HS sẽ chú ý nghe chỉ dẫn sau đó nhìn bao quát các giáo cụ trước khi trả lời","Khi yêu cầu HS \"đưa cho cô đôi giầy\", HS sẽ nhìn bao quát các vật quanh chỗ mình ngồi xem có giầy không",-1,[["2","luôn nhìn bao quát ít nhất 6 vật liên quan đến bài tập trong vòng 3 giây (trước khi trả lời)"],["1","có thể nhìn bao quát 3 vật liên quan đến bài tập trong vòng 3 giây (trước khi trả lời)"]]],["A11",2,0,"Hồi đáp ngay sau khi GV ra yêu cầu","Khi đang học, HS sẽ hồi đáp ngay sau khi GV ra yêu cầu","Khi được yêu cầu chỉ tranh con chim, HS sẽ lập tức với lấy tranh con chim và chỉ vào con chim",-1,[["2","luôn hồi đáp trong vòng 3 giây sau khi ra yêu cầu"],["1","luôn hồi đáp trong vòng 5 giây sau khi ra yêu cầu"]]],["A12",2,0,"Thích nhiều vật (ngoài đồ ăn)","Có thể lấy nhiều vật và hoạt động làm vật củng cố/phần thưởng","Hành động: cù, nhặt đồ, đồ chơi quay vòng, các vật kích thích thính giác: nhạc; xúc giác: xoa và cù; giao lưu: vỗ tay, khen; một loại đồ chơi nào đó; trò chơi: ráp hình, vi tính",-1,[["2","có thể lấy ít nhất 10 vật/ hành động (được GV cầm/kiểm soát) để làm phần thưởng trong khi học"],["1","có thể lấy ít nhất 5 vật/hành động để làm phần thưởng"]]],["A13",2,0,"Thưởng không liên tục vật hữu hình","HS nghe lời khi không thưởng liên tục","HS chịu gọi tên các thẻ tranh nếu có lúc trả lời khoảng 4 lần mới được thưởng một quả nho khô",-1,[["4","làm 5 bài tập/hồi đáp mới để được một phần thưởng hữu hình hoặc ăn được"],["3","làm 2 bài tập/hồi đáp mới và 3 bài tập/hồi đáp đã học để được một phần thưởng hữu hình hoặc ăn được"],["2","làm 4 bài tập/hồi đáp đã học để được một phần thưởng hữu hình hoặc ăn được"],["1","làm 2 bài tập/hồi đáp đã học để được một phần thưởng hữu hình hoặc ăn được"]]],["A14",2,0,"Phần thưởng là được giao lưu/chơi đùa với GV","HS sẽ nghe lời nếu phần thưởng là được giao lưu/chơi đùa với GV","HS chịu làm theo yêu cầu nếu được chơi trò \"Ring around the Rosie\" với GV",-1,[["4","làm 5 bài tập/hồi đáp mới để được chơi đùa với GV"],["3","làm 2 bài tập/hồi đáp mới và 3 bài tập/hồi đáp đã học để được chơi đùa với GV"],["2","làm 4 bài tập/hồi đáp đã học để được chơi đùa với GV"],["1","làm 2 bài tập/hồi đáp đã học để được chơi đùa với GV"]]],["A15",2,0,"Nhận ra thay đổi trong nét mặt và giọng nói của GV","Sau khi trả lời, HS sẽ nhìn GV và thăm dò sự thay đổi trong nét mặt giọng nói để phỏng đoán phản hồi của GV về độ chính xác của câu trả lời","Quan sát xem GV có cười không, theo dõi sự thay đổi trong giọng nói của cô khi khen",-1,[["2","nhìn GV để thăm dò phản hồi khi đã trả lời xong 7/10 lần"],["1","thỉnh thoảng nhìn GV để thăm dò phản hồi khi đã trả lời xong (nếu GV không thay đổi hành vi một cách rõ rệt để HS nhận ra)"]]],["A16",2,0,"Hưởng ứng với khen thưởng mang tính xã hội","HS sẽ nghe lời nếu được khen","",-1,[["4","chịu nghe lời trong 15 phút chỉ vì lời khen"],["3","chịu nghe lời trong 15 phút khi được khen kèm phần thưởng"],["2","chịu nghe lời trong 5 phút khi được khen kèm phần thưởng"],["1","chịu làm 3 bài tập/hồi đáp trước khi thưởng"]]],["A17",2,0,"Biết chờ nếu không được thưởng ngay","HS biết chờ nếu không được thưởng ngay khi làm xong bài tập","",-1,[["4","chờ 5 phút"],["3","1 phút"],["2","10 giây"],["1","5 giây"]]],["A18",2,0,"Chờ được khen thưởng khi làm xong việc","HS sẽ chờ được khen thưởng/ghi nhận vì đã làm xong việc","",-1,[["2","yêu cầu người khác để ý nhìn những việc mình đã làm"],["1","quan sát xem người khác có nhận ra mình đã làm được những gì không"]]],["A19",2,0,"Tự hài lòng khi mình làm xong một việc","Hoàn tất 1 việc chính là phần thưởng cho HS","",-1,[["2","tự làm trong 10 phút cho đến khi xong việc để được ghi nhận là đã hoàn thành 1 việc"],["1","tự làm trong 5 phút cho đến khi xong việc chỉ cần được khen"]]],["B1",4,1,"Chơi ghép hình loại 1 miếng ghép vào 1 hình","Khi được trao những miếng ghép đơn hình khác biệt rõ ràng về hình dáng trong cùng 1 bộ ghép hình, HS biết ghép những miếng ghép đó vào khung","",-1,[["4","ghép được cả 5 miếng ghép bằng cách nhìn và định vị"],["3","ghép được cả 3 miếng ghép bằng cách nhìn và định vị"],["2","ghép được 5 miếng được đưa riêng rẽ, bằng cách thử, nếu sai thì làm lại"],["1","ghép được 3 miếng được đưa riêng rẽ, bằng cách thử, nếu sai thì làm lại"]]],["B2",4,1,"Hộp hình dạng","Khi được đưa 1 hộp hình dạng hay hộp phân loại các hình dạng và miếng hình khối, học sinh có biết thả từng miếng hình khối vào lỗ tương ứng ở hộp","",-1,[["4","thả được 6 miếng bằng cách quan sát miếng hình khối rồi tìm lỗ tương ứng"],["3","4 miếng bằng cách quan sát miếng hình khối rồi tìm lỗ tương ứng"],["2","4 miếng bằng cách thử thả vào các lỗ, sai thì làm lại"],["1","2 miếng bằng cách thử thả vào các lỗ, sai thì làm lại"]]],["B3",4,1,"Tìm vật giống với vật mẫu","Khi được đưa 1 vật mẫu, học sinh sẽ tìm được vật giống vật mẫu trong số 3 vật bày ra","",-1,[["4","ghép được vật mẫu với một trong số 8 vật bày ra ít nhất 10 lần"],["3","ghép được vật mẫu với một trong số 4 vật bày ra ít nhất 5 lần"],["2","ghép được vật mẫu với một trong số 2 vật bày ra ít nhất 2 lần"],["1","ghép được vật mẫu với một trong số 2 vật bày ra 1 lần"]]],["B4",4,1,"Ghép vật với ảnh tương ứng","Khi được đưa 1 vật, học sinh sẽ ghép được với một trong số 3 ảnh","",-1,[["2","có thể ghép 3 vật liên tiếp"],["1","có thể ghép từng vật cho mỗi lần yêu cầu"]]],["B5",4,1,"Tìm ảnh giống ảnh mẫu","Khi được đưa 1 ảnh, học sinh sẽ ghép ảnh đó với ảnh giống nó trong số 3 ảnh bày ra","",-1,[["4","ít nhất 10 ảnh khi bày mỗi lần 8 ảnh"],["3","ít nhất 5 ảnh khi bày mỗi lần 4 ảnh"],["2","ít nhất 2 ảnh khi bày mỗi lần 2 ảnh"],["1","1 ảnh khi bày mỗi lần 2 ảnh"]]],["B6",4,1,"Ghép ảnh với vật","Khi đưa ảnh của 1 vật, học sinh sẽ ghép ảnh đó với một trong số 3 vật bày ra","",-1,[["2","có thể ghép 3 vật liên tiếp"],["1","có thể ghép từng vật cho mỗi lần yêu cầu"]]],["B7",4,1,"Ghép nhuần nhuyễn thành thạo","Khi cho xem 10 ảnh các vật, HS sẽ ghép liên tiếp từng ảnh với một ảnh giống nó trong số 10 ảnh bày ra","Khi đưa một chồng ảnh, HS có thể ghép liên tiếp từng ảnh với ảnh giống nó trong các loạt tranh bày ra không?",-1,[["2","có thể ghép ít nhất 10 thứ trong vòng 30 giây"],["1","có thể ghép 5 thứ riêng rẽ trong vòng 15 giây"]]],["B8",4,1,"Phân loại các vật không giống nhau","Khi được đưa 1 loạt vật hay ảnh không giống nhau thuộc 3 nhóm khác nhau, và đưa một loạt vật mẫu cho từng nhóm, HS sẽ phân loại những vật không giống nhau vào các nhóm thích hợp (VD: các ảnh về chó, các ảnh về cây, các ảnh người)","Đưa học sinh tập hợp nhiều ảnh chó và cây, rồi để ảnh mẫu của mỗi loại trên bàn. Học sinh phân loại các ảnh bằng cách đặt ảnh chó vào chồng chó và cây vào chồng cây",-1,[["4","đưa 20 vật (5 vật x 4 loại), phân loại được 10 vật thành 4 loại"],["3","đưa 12 vật (3 vật x 4 loại), phân loại được ít nhất 6 vật thành 4 loại"],["2","đưa 6 vật (2 vật x 3 loại), phân loại được ít nhất 4 vật thành 3 loại"],["1","đưa 4 vật (2 vật x 2 loại), phân loại được ít nhất 2 vật thành 2 loại"]]],["B9",4,1,"Sắp xếp khối hình trên thẻ tranh","Khi được đưa thẻ tranh vẽ các kiểu sắp xếp khối hình, HS sẽ xếp khối hình lên vị trị tương ứng trên thẻ tranh và không bị phân tán bởi những khối hình thừa không cần dùng đến","",-1,[["4","nhanh chóng xếp xong với 6 khối hình hoặc hơn (có khối hình thừa không dùng đến)"],["3","4 hay hơn (có khối hình thừa không dùng đến)"],["2","tối đa 4 (không có khối thừa)"],["1","xếp được tối đa 2 khối (không có khối thừa)"]]],["B10",4,1,"Ghép nhiều mảnh liên kết với nhau thành 1 hình lấp đầy khung hình","Khi đưa những mảnh ghép hình dáng đặc thù, liên kết với nhau, để lấp đầy một khung hình, học sinh sẽ ghép được.","",-1,[["4","4 khung hình loại 8 mảnh"],["3","4 khung hình loại 5 mảnh"],["2","2 khung hình loại 5 mảnh"],["1","1 khung hình loại 5 mảnh tối thiểu"]]],["B11",4,1,"Ghép hình loại khung hình có cạnh là góc vuông","Khi đưa ghép hình loại khung hình có cạnh là góc vuông, học sinh sẽ ghép được.","",-1,[["4","3 khung hình loại 5 mảnh"],["3","3 khung hình loại 4 mảnh"],["2","3 khung hình loại 3 mảnh"],["1","3 khung hình loại 2 mảnh tối thiểu"]]],["B12",4,1,"Sắp xếp khối hình giống trong ảnh","Khi đưa ảnh vẽ các kiểu sắp xếp khối hình, HS biết sắp xếp các khối hình giống trong ảnh","Để khối tam giác lên tấm bìa có vẽ hình tam giác",-1,[["4","nhanh chóng xếp xong ít nhất 6 khối hình (có khối thừa không dùng đến)"],["3","ít nhất 4 khối hình (có khối thừa không dùng đến)"],["2","tối đa 4 (không có khối thừa)"],["1","tối đa 2 (không có khối thừa)"]]],["B13",4,1,"Sắp xếp theo quy luật trình tự quan sát được","Khi cho xem 1 chuỗi trình tự các vật (VD các khối màu), học sinh sẽ sắp xếp các khối theo quy luật trình tự quan sát được","",-1,[["4","có thể xếp theo quy luật trình tự có 8 vật trong đó 4 vật khác nhau, có vật thừa không dùng đến"],["3","chuỗi 8 vật trong đó 4 vật khác nhau (không có vật thừa không dùng đến)"],["2","chuỗi 6 vật trong đó 3 vật khác nhau (không có vật thừa không dùng đến)"],["1","chuỗi 6 vật trong đó 2 vật khác nhau (không có vật thừa không dùng đến)"]]],["B14",4,1,"Tạo bức tranh bằng cách xếp nhiều mảnh rời cạnh nhau (chú thích của người dịch: không nối kết với nhau)","Khi được trao những mảnh ghép có hình dạng khác nhau, không nối kết với nhau, học sinh sẽ đặt các mảnh ghép cạnh nhau để tạo thành 1 bức tranh","",-1,[["4","ghép 4 tranh loại 5 mảnh"],["3","ghép 4 tranh loại 4 mảnh"],["2","ghép 2 tranh loại 3 mảnh"],["1","ghép 1 tranh loại tối thiểu 3 mảnh"]]],["B15",4,1,"Chơi ghép hình chuẩn","Khi đưa một bộ ghép hình chuẩn thông thường, (các mảnh ghép liên kết với nhau, không có khung hình), học sinh sẽ ghép được","",-1,[["4","ít nhất 4 bộ loại 12 mảnh"],["3","2 bộ loại 12 mảnh"],["2","2 bộ loại 8 mảnh"],["1","1 bộ loại tối thiểu 8 mảnh"]]],["B16",4,1,"Ghép các tranh có liên quan với nhau","Bày một loạt các vật hoặc ảnh, HS sẽ biết ghép một vật với vật có liên quan trong loạt đó (VD ghép que đánh bóng chày với quả bóng chày)","",-1,[["4","ghép được ít nhất 2 tranh liên quan trong số 20 tranh hay hơn"],["3","2 tranh trong số 10 tranh"],["2","1 tranh trong số 10 tranh"],["1","ít nhất 1 tranh trong số 5 tranh"]]],["B17",4,1,"Phân loại theo chức năng","Khi đưa ra 2 vật đại diện cho 2 chức năng khác nhau, và sếp mẫu một vật khác có cùng chức năng với vật mẫu vào cùng nhóm, HS sẽ biết phân loại các vật còn lại theo chức năng","Khi đưa một cái bút và một chai thổi bong bóng, sau đó đặt bút sáp vào cùng nhóm với bút, nến vào cùng nhóm với bong bóng, HS sẽ tiếp tục phân nhóm các vật còn lại theo tiêu chí vật để viết và vật để thổi thành từng chồng",-1,[["4","ít nhất 5 vật thuộc 4 chức năng"],["3","ít nhất 5 vật thuộc 3 chức năng"],["2","ít nhất 5 vật thuộc 2 chức năng"],["1","ít nhất 2 vật thuộc 2 chức năng"]]],["B18",4,1,"Phân loại theo đặc tính","Khi đưa 2 vật mẫu có các đặc tính/bộ phận khác nhau và ghép mẫu với một vật khác có cùng đặc tính/bộ phận, HS sẽ biết phân loại các vật tiếp theo có cùng đặc tính vào cùng nhóm với đúng vật mẫu tương ứng","Khi cho xem con khỉ và ôtô, rồi xếp chó cùng chồng với khỉ và xe đạp cùng chồng với ôtô, HS sẽ tiếp tục xếp các tranh khác theo nhóm những con có đuôi, và vật có bánh",-1,[["4","ít nhất 5 vật thuộc 4 đặc tính"],["3","ít nhất 5 vật thuộc 3 đặc tính"],["2","ít nhất 5 vật thuộc 2 đặc tính"],["1","ít nhất 2 vật thuộc 2 đặc tính"]]],["B19",4,1,"Phân loại theo chủng loại","Khi đưa ra 3 vật mẫu thuộc 3 chủng loại khác nhau, và ghép mẫu một vật khác vào từng chủng loại, HS sẽ biết phân loại các tranh còn lại vào cùng chủng loại với đúng vật mẫu","Khi cho xem con mèo và cái giày, rồi đặt con chó vào cùng nhóm với con mèo, cái áo vào cùng nhóm với cái giày, HS sẽ tiếp tục đặt các vật khác vào chồng con vật và chồng đồ để mặc",-1,[["4","ít nhất 5 vật thuộc 4 chủng loại"],["3","ít nhất 5 vật thuộc 3 chủng loại"],["2","ít nhất 5 vật thuộc 2 chủng loại"],["1","ít nhất 2 vật thuộc 2 chủng loại"]]],["B20",4,1,"Lặp lại 1 trình tự sau một thời gian","Cho học sinh xem vật mẫu xếp theo 1 trình tự nhất định, rồi xóa đi, học sinh sẽ có thể sắp xếp lại theo trình tự ban đầu","Sau khi cho xem 3 vật xếp theo một trình tự nào đó, rồi xóa đi, học sinh lặp lại trình tự ban đầu.",-1,[["4","ngay lập tức với 3 vật, sau 5 giây."],["3","3 vật sau 2 giây hoặc 2 vật sau 5 giây"],["2","2 vật sau 2 giây không nhắc"],["1","2 vật sau 2 giây có nhắc bằng lời hay cử chỉ"]]],["B21",4,1,"Từ một loạt vật đưa ra, tìm vật mẫu ban đầu sau một thời gian chờ","Khi đưa cho xem 1 vật nhất định, sau đó lấy đi, rồi cho xem 3 vật (trong đó có 1 vật học sinh đã thấy), HS có thể tìm ra vật đã đưa xem ban đầu","Sau khi cho học sinh xem ảnh con mèo, giấu ảnh đi, chờ vài giây, rồi đưa ra ảnh chó, mèo và chim rồi yêu cầu tìm ảnh HS được xem ban đầu",-1,[["4","sau 5 giây, tìm ra trong số 5 ảnh trong vòng 3 giây được 10 lần"],["3","sau 3 giây, tìm ra trong vòng 3 giây được 5 lần"],["2","sau 3 giây, tìm ra trong số 3 vật trong vòng 3 giây được 5 lần"],["1","sau 2 giây, tìm ra trong số 2 vật trong vòng 3 giây được 3 lần"]]],["B22",4,1,"Tiếp tục một chuỗi trình tự","Khi được cho xem 1 số vật mẫu xếp theo 1 trình tự nhất định (cả đồng nhất và không đồng nhất), học sinh có thể tiếp tục thêm vào những vật khác theo đúng quy luật trình tự đó (VD ABABAB, ABCABC, ABBABB, ÂBÂB, ABBCABBC)","Khi cho xem 1 số hình khối sắp xếp theo một quy luật trình tự nhất định (thí dụ: đỏ, xanh, đỏ, xanh), học sinh sẽ xếp tiếp 1 khối đỏ rồi đến 1 khối xanh",-1,[["4","tiếp tục xếp thêm 3 vật theo 1 quy luật không đồng nhất, khi để cả những vật thừa không thích hợp với quy luật trình tự đó"],["3","xếp thêm 3 vật theo quy luật đồng nhất, khi để cả những vật thừa không thích hợp với quy luật trình tự đó"],["2","xếp thêm 3 vật theo quy luật đồng nhất"],["1","2 vật theo quy luật trình tự xen kẽ"]]],["B23",4,1,"Lặp lại mô hình 3 chiều","Khi được đưa 1 bộ hình khối hay vật khác và mô hình 3 chiều đơn giản (VD: nhà hay xe), học sinh sẽ có thể sắp xếp các khối hình hay các vật khác đó theo cấu trúc mô hình đó","Sau khi xem mô hình mẫu, học sinh xếp các hình khối thành 1 ngôi nhà",-1,[["2","có thể xếp được 2 mô hình với ít nhất 6 khối hình hoặc những vật khác"],["1","có thể xếp được 2 mô hình với ít nhất 3 khối hình hoặc những vật khác"]]],["B24",4,1,"Xếp những vật tương ứng với nhau cạnh nhau","HS sẽ biết quan sát khi một người đặt các vật khác nhau lên bàn, thì HS sẽ đặt một vật thứ hai lên từng vật ngay sau khi mỗi loại vật ban đầu được đặt lên bàn","Hễ ta đặt giấy ăn lên bàn, HS sẽ lập tức đặt thìa lên giấy ăn, sau khi GV đặt khối hình màu trắng, HS sẽ xếp tiếp khối màu xanh, bày một hộp đựng nước hoa quả lên bàn, học sinh sẽ cắm một ống hút vào hộp",-1,[["2","lập tức đặt một vật lên vật tương ứng liên tiếp ít nhất 6 lần"],["1","lập tức đặt một vật lên vật tương ứng liên tiếp ít nhất 3 lần"]]],["B25",4,1,"Xếp theo sê ri","Khi được đưa 1 mô hình chuỗi tịnh tiến có đầu và cuối, học sinh sẽ có thể xếp tiếp theo thứ tự hợp lý về kích cỡ, số lượng, màu sắc và thứ tự","",-1,[["4","có thể xếp ít nhất 4 tập hợp các vật với 4 đặc tính"],["3","2 tập hợp các vật với 3 đặc tính"],["2","2 tập hợp với 2 đặc tính"],["1","2 tập hợp với 1 đặc tính"]]],["B26",4,1,"Xếp các ảnh theo trình tự","Học sinh sẽ có thể xếp 1 bộ ảnh theo trình tự hợp lý","Xếp 4 ảnh rửa tay theo trình tự : mở nước, sát xà phòng, rửa tay, lau tay bằng khăn",-1,[["4","có thể xếp thứ tự ít nhất 5 bộ ảnh 4 bước"],["3","5 bộ ảnh 3 bước"],["2","3 bộ ảnh 3 bước"],["1","2 bộ ảnh 3 bước"]]],["B27",4,1,"Mê cung","Học sinh có thể kẻ đường thẳng nối từ điểm đầu đến điểm cuối của 1 mê cung đơn giản","",-1,[["2","có thể vẽ đường thẳng nối từ điểm đầu đến điểm cuối 1 mê cung, có 3 lựa chọn để tìm ra phương án đúng"],["1","có thể vẽ đường thẳng nối từ điểm đầu đến điểm cuối 1 mê cung, chỉ có 1 lựa chọn để tìm ra phương án đúng"]]],["C1",0,2,"Có đáp lại khi nghe gọi tên mình","HS sẽ nhìn hoặc lại gần người gọi tên mình","",-1,[["2","nhìn hoặc lại gần ít nhất 80% số lần gọi"],["1","có đáp lại khi được nhắc đôi chút"]]],["C2",0,2,"Làm một việc yêu thích đúng ngữ cảnh theo yêu cầu","Khi yêu cầu HS làm một việc yêu thích đúng ngữ cảnh hiện tại, HS sẽ làm theo","nhún nhảy trên bạt lò xo, đu xích đu",-1,[["4","ít nhất 3 hoạt động không cần nhắc nhở"],["3","ít nhất 3 hoạt động có nhắc nhở bằng lời hay khi có người chỉ tay nhắc"],["2","ít nhất 3 hoạt động có làm mẫu và không cần nhắc"],["1","ít nhất 3 hoạt động có nhắc bằng cử chỉ"]]],["C3",0,2,"Nhìn vào vật củng cố theo yêu cầu","Học sinh sẽ nhìn vật củng cố giáo viên đang cầm khi yêu cầu","",-1,[["2","nhìn vào vật ở mọi vị trí (trái, phải, trên, dưới) trong vòng 3 giây"],["1","nhìn vào vật khi có nhắc nhở hoặc phản ứng sau 3 giây"]]],["C4",0,2,"Sờ vào vật củng cố đặt ở các vị trí theo yêu cầu","Học sinh sẽ chạm vào vật yêu thích đặt ở các vị trí khác nhau","khoai tây chiên để trên đầu, đưa qua trái, qua phải ....",-1,[["2","sẵn sàng chạm vào vật đặt ở mọi vị trí (trên/dưới/ trái/ phải) trong vòng 3 giây"],["1","chạm vào hoặc lấy vật trong vòng 3 giây nếu vật đó được để trước mặt học sinh"]]],["C5",0,2,"Chạm vào vật thông thường đặt ở nhiều vị trí khác nhau theo yêu cầu","Học sinh sẽ chạm vào một vật thông thường đặt ở nhiều vị trí khác nhau theo yêu cầu","Cây bút để trên đầu, qua trái, qua phải...",-1,[["2","sẵn sàng chạm vào vật đặt ở mọi vị trí (trên/dưới/ trái/ phải) trong vòng 3 giây"],["1","chạm vào hoặc lấy vật trong vòng 3 giây nếu để vật ở trước mặt học sinh"]]],["C6",0,2,"Theo lệnh làm 1 việc yêu thích không phù hợp với ngữ cảnh","Học sinh sẽ theo lệnh làm 1 việc yêu thích mặc dù việc đó không xảy ra tại thời điểm đó","Trong khi đang ngồi ở bàn, học sinh sẽ theo lệnh lên bạt lò xo nhảy v.v...",-1,[["4","ít nhất 3 hoạt động không có nhắc nhở"],["3","ít nhất 3 hoạt động có nhắc nhở bằng lời hay cử chỉ"],["2","ít nhất 3 hoạt động có làm mẫu và không nhở nhở bằng lời"],["1","ít nhất 3 hoạt động có nhắc nhở bằng cử chỉ"]]],["C7",0,2,"Theo lệnh trong những tình huống thường ngày","Học sinh sẽ theo lệnh làm 1 việc mà mình không thích khi đến giờ diễn ra hoạt động đó","Sau khi đi vệ sinh học sinh sẽ phải theo lệnh \"rửa tay\".",-1,[["4","ít nhất 3 việc không nhắc nhở"],["3","ít nhất 3 có nhắc nhở bằng lời hoặc bằng cử chỉ"],["2","ít nhất 3 có làm mẫu, không nhắc nhở bằng cử chỉ"],["1","ít nhất 3 hoạt động có nhắc nhở phần nào bằng cử chỉ"]]],["C8",0,2,"Theo lệnh đưa 1 vật học sinh không thích","Học sinh sẽ có thể theo lệnh đưa một vật HS không thích","Theo lệnh, học sinh sẽ cầm giày đưa cho giáo viên",-1,[["2","thường làm theo trong vòng 3 giây"],["1","thường phải nhắc thêm (không kể việc xỏe tay nhận vật)"]]],["C9",0,2,"Theo lệnh làm 1 động tác đơn giản","Học sinh sẽ theo lệnh làm 1 động tác đơn giản (VD: vỗ tay, quay tròn, giơ tay lên cao)","nhảy, ngồi xuống, giơ 2 tay lên cao, vỗ tay, thổi, gõ",-1,[["4","ít nhất 6 lệnh không cần nhắc nhở VÀ có thể làm theo ít nhất 4 động tác khác trong vòng 10 giây"],["3","ít nhất 6 lệnh không nhắc nhở"],["2","ít nhất 4 lệnh không nhắc nhở"],["1","ít nhất 2 lệnh không nhắc nhở"]]],["C10",0,2,"Theo lệnh chạm vào 1 vật thay vì 1 vật đánh lạc hướng chú ý","Khi được lệnh chạm vào 1 vật cầm ở 1 tay còn tay kia giơ ra nhưng không cầm gì để đánh lạc hướng chú ý (hay để vật đó ở trên bàn cạnh 1 vật trung tính như ống bọt xà phòng để đánh lạc hướng chú ý), học sinh sẽ chạm vào vật nêu tên","Khi 1 tay cầm cốc, 1 tay không cầm gì ở 1 tư thế khác, học sinh sẽ chọn cốc theo yêu cầu",-1,[["2","sẵn sàng tìm và chạm vào vật ở mọi vị trí trong vòng 3 giây"],["1","sẽ chạm vào vật nếu vật đó ở trước mặt học sinh"]]],["C11",0,2,"Theo lệnh chọn lấy vật yêu thích từ 2 vật bày ra","Khi được hỏi, học sinh sẽ chọn 1 vật mình thích mà GV nói tên từ 2 vật bày ra ở bất cứ vị trí nào trước mặt học sinh","Khi để 1 bên là chiếc giày, 1 bên là chai bọt xà phòng - vật yêu thích) học sinh sẽ chọn ống bọt xà phòng theo lệnh",-1,[["2","sẵn sàng tìm chọn vật đó ở mọi vị trí trong vòng 3 giây"],["1","tìm chọn vật đó nếu để trước mặt học sinh"]]],["C12",0,2,"Theo lệnh chọn 1 trong 2 vật yêu thích","Theo lệnh, học sinh sẽ chọn vật nêu tên từ 2 đồ vật yêu thích để ở bất kì vị trí nào trước mặt học sinh","Khi 1 hộp nho (vật yêu thích) và 1 chai bọt xà phòng (vật yêu thích) được đặt trước mặt học sinh, học sinh sẽ chọn chai bọt xà phòng theo yêu cầu",-1,[["2","sẵn sàng tìm ra và chọn lấy vật đó ở mọi vị trí trong vòng 3 giây"],["1","tìm lấy được vật yêu thích nếu vật ấy để trước mặt học sinh"]]],["C13",0,2,"Theo lệnh chọn lấy 1 trong 2 vật thông thường","Theo lệnh, học sinh sẽ chọn lấy một vật giáo viên nêu tên từ 2 vật thông thường bày trước mặt học sinh","Khi bày để cái cốc và 1 cái giày trước mặt học sinh, học sinh sẽ chọn giày khi GV yêu cầu lấy \"giầy\"",-1,[["4","lấy được 50 vật và biết vài ví dụ cho hầu hết những vật đó"],["3","25 vật khác nhau"],["2","10 vật"],["1","ít nhất 2 vật"]]],["C14",0,2,"Chọn lấy 1 trong 2 ảnh những vật thông thường","Theo lệnh, học sinh sẽ chọn lấy ảnh một vật giáo viên nêu tên từ 2 ảnh những vật thông thường bày trước mặt học sinh","Khi bày 1 ảnh con chó và ảnh 1 chiếc giày trước mặt học sinh, học sinh sẽ chọn giày khi GV yêu cầu lấy \"giầy\"",-1,[["4","lấy được ảnh của hơn 50 vật và biết vài ví dụ cho hầu hết những vật đó."],["3","25 tranh các vật khác nhau"],["2","10 vật"],["1","ít nhất 2 vật"]]],["C15",0,2,"Chạm vào các bộ phận trên cơ thể mình","Học sinh sẽ có thể theo lệnh chạm vào các bộ phận trên cơ thể mình","",-1,[["4","ít nhất 10 bộ phận"],["3","6 bộ phận"],["2","4 bộ phận"],["1","2 bộ phận"]]],["C16",0,2,"Tìm chọn 1 trong số ít nhất 6 vật trên bàn","Học sinh sẽ tìm chọn được ít nhất 100 vật thông thường khi bày mỗi lần ít nhất 6 vật trên bàn ở bất cứ vị trí nào trước mặt học sinh","có thể thực hiện kỹ năng này bằng bất cứ dạng hồi đáp nào (VD chỉ, nhặt lên, đưa, chạm vào, cho xem, ở đâu, tìm cái...)",-1,[["4","tìm chọn được ít nhất 100 vật và có thể chỉ ra được vài ví dụ (kể cả ví dụ mới) cho hầu hết các vật (khi bày mỗi lần ít nhất 6 vật)"],["3","50 vật, mỗi vật một ví dụ (khi bày mỗi lần ít nhất 3 vật)"],["2","10 vật (mỗi lần bày 3 vật)"],["1","5 vật (mỗi lần bày ít nhất 3 vật)"]]],["C17",0,2,"Tìm chọn 1 trong số ít nhất 6 ảnh trên bàn","Học sinh sẽ tìm chọn được ảnh về ít nhất 100 vật thông thường khi bày mỗi lần ít nhất 6 ảnh trên bàn ở bất cứ vị trí nào trước mặt học sinh","có thể thực hiện kỹ năng này bằng bất cứ dạng hồi đáp nào (VD chỉ, nhặt lên, đưa, chạm vào, cho xem, ở đâu, tìm cái...)",-1,[["4","tìm chọn được ít nhất 100 ảnh và có thể chỉ ra được vài ví dụ (kể cả ví dụ mới) cho hầu hết các vật (khi bày mỗi lần ít nhất 6 ảnh)"],["3","50 ảnh, mỗi vật một ví dụ (khi bày mỗi lần ít nhất 3 ảnh)"],["2","10 ảnh (mỗi lần bày 3 ảnh)"],["1","5 ảnh (mỗi lần bày ít nhất 3 ảnh)"]]],["C18",0,2,"Biết thêm nhiều kỹ năng tìm chọn mới mà không cần tập luyện nhiều","Học sinh sẽ học thêm các kĩ năng tìm chọn mới sau khi thực hiện lệnh tìm chọn không quá 5 lần","Học sinh tập tìm lấy được ảnh điện thoại sau không quá 5 lần hỏi",-1,[["2","sẵn sàng tìm lấy nhiều vật mới sau không quá 5 lần hỏi"],["1","sẵn sàng tìm lấy nhiều vật mới sau không quá 10 lần hỏi"]]],["C19",0,2,"Phân biệt nhận biết thành thạo","Học sinh sẽ có thể tìm chọn các vật đã biết từ nhiều vật theo các yêu cầu liên tiếp","yêu cầu \"hãy chỉ giầy\", học sinh làm theo, tiếp đến chỉ sách, táo liên tiếp",-1,[["2","có thể lần lượt chỉ hay chọn ít nhất 10 vật đã biết trong vòng 30 giây"],["1","có thể chỉ hay chọn 5 vật đã biết trong 15 giây"]]],["C20",0,2,"Hồi đáp với các lệnh tìm chọn khác nhau","Học sinh sẽ có thể tìm chọn vật và ảnh khi giáo viên ra các lệnh tìm chọn khác nhau (ví dụ: \"cho cô xem___\", \"cái.... đâu?\", \"con có thấy cái__ không?\", \"hãy chạm vào cái....\")","\"Cho cô xem__\" \"Cái__ ở đâu\" \"Con có thấy cái ___không?\" \"Em có nhìn thấy__\" \"Hãy tìm cái__\"",-1,[["2","tìm chọn g (VD: đứng lên hay vỗ tay khi GV chỉ tay yêu cầu)","Học sinh ra cửa khi giáo viên chỉ ra cửa, học sinh vỗ tay khi giáo viên chỉ (ngụ ý đến lượt học sinh đó), học sinh chọn cái tách to khi giáo viên chỉ vào cái to nhất trong số những cái tách ở trên bàn",-1,[["4","hồi đáp chuẩn xác với cả 5 kiểu lệnh chỉ tay"],["3","hồi đáp chuẩn xác với ít nhât 4 kiểu lệnh chỉ tay"],["2","hồi đáp chuẩn xác với ít nhât 3 kiểu lệnh chỉ tay"],["1","hồi đáp chuẩn xác với ít nhât 2 kiểu lệnh chỉ tay"]]],["C27",0,2,"Theo lệnh để đến bên 1 người nào đó","Học sinh sẽ có thể đi ngang qua phòng để lại chỗ 1 người được chỉ định","Học sinh sẽ đi qua phòng khi được yêu cầu \"Ra chỗ Tim đi\".",-1,[["2","có thể lại chỗ ít nhất 4 người theo lệnh"],["1","ít nhất 2 người theo lệnh"]]],["C28",0,2,"Theo lệnh đưa 1 vật cho 1 người nào đó hay đặt vật đó lên 1 vật khác","Học sinh sẽ có thể ngang qua phòng, để hay đưa 1 vật cho 1 người (VD: hãy đưa cái bút này cho Jim)","\"Hãy đưa cái bút này cho Jim\"",-1,[["4","có thể lại chỗ ít nhất 2 người và 2 nơi để đưa hay đặt vật"],["3","2 người hay 2 nơi không nhắc nhở"],["2","2 người hay 2 nơi có nhắc nhở bằng lời"],["1","1 người hay 1 nơi có nhắc nhở bằng lời."]]],["C29",0,2,"Theo lệnh đến chỗ 1 người nào đó và cầm 1 vật nhất định","Học sinh sẽ đi ngang qua phòng để đến 1 nơi hay chỗ 1 người nào đó và lấy vật được chỉ định","\"Đi lấy quyển sách ở bàn làm việc và mang lại đây cho cô\".",-1,[["4","có thể đến ít nhất 2 nơi và lại chỗ 2 người để lấy 1 vật được chỉ định"],["3","2 người hay 2 nơi không nhắc nhở"],["2","2 người hay 2 nơi có nhắc nhở bằng lời"],["1","1 người hay 1 nơi có nhắc nhở bằng lời"]]],["C30",0,2,"Theo lệnh đến chỗ 1 người nào đó và làm 1 hành động","Học sinh sẽ ra khỏi phòng để đến chỗ 1 người nào đó và làm 1 hành động yêu cầu (VD: Hãy ôm Jim)","\"Lại ôm Jim đi\"",-1,[["4","có thể lại chỗ của ít nhất 3 người và làm ít nhất 2 động tác"],["3","2 người và 2 động tác"],["2","2 người và 1 động tác"],["1","1 người và 1 động tác"]]],["C31",0,2,"Hồi đáp bằng các động tác với các bài tập nhận biết","Học sinh sẽ chọn vật và ảnh thông thường bằng một động tác tùy theo yêu cầu tìm chọn (sờ, chỉ, đưa, nhặt lên, lấy...)","\"Sờ vào cái tách\" \"Chỉ con chim\" \"Đưa cô chiếc giày\" \"Nhặt cái mũ lên\" \"Lấy cái đĩa này\" \"Khoác cho con khỉ\" \"Dấu cái thìa này đi\" \"Đẩy xe\"",-1,[["4","hồi đáp chuẩn xác với bất cứ 5 loại yêu cầu tìm chọn nào"],["3","4 yêu cầu tìm chọn"],["2","3 yêu cầu tìm chọn khác nhau"],["1","2 yêu cầu tìm chọn khác nhau"]]],["C32",0,2,"Sử dụng 1 vật trong số nhiều vật đưa ra để thực hiện một hành động","Học sinh sẽ theo lệnh làm 1 động tác đơn giản với 1 vật khi được trao nhiều vật khác nhau, trong đó chỉ có 1 vật đó là phù hợp","ngủ / viết / gõ / cắt / lăn cho cô xem nào\"",-1,[["2","ít nhất 5 hoạt động không nhắc nhở"],["1","ít nhất 2 có nhắc nhở bằng lời hay bằng cử chỉ"]]],["C33",0,2,"Làm nhiều hoạt động với 1 vật","Học sinh sẽ có thể làm 1 động tác nào đó với 1 vật khi có nhiều vật khác cũng phù hợp để làm hành động đó","đập bóng, lăn bóng, ném bóng, chải tóc, chải lông cho chó",-1,[["4","có thể làm ít nhất 4 hoạt động với ít nhất 4 vật"],["3","ít nhất 3 hoạt động với 4 vật"],["2","ít nhất 2 hoạt động với 4 vật"],["1","ít nhất 2 hoạt động với 2 vật"]]],["C34",0,2,"Giả vờ làm một hành động","Học sinh sẽ có thể theo lệnh làm 1 hoạt động giả vờ","Cười / khóc / ngáp / ngủ / viết / gõ /cắt / lăn cô xem",-1,[["2","ít nhất 5 hành động không cần nhắc"],["1","ít nhất 2 hoạt động có nhắc nhở bằng lời hay cử chỉ"]]],["C35",0,2,"Lấy 1 trong số 3 ảnh diễn tả hoạt động","Theo lệnh, học sinh sẽ lấy ảnh về 1 hoạt động nào đó từ chuỗi 3 ảnh bày trên bàn ở các vị trí khác nhau trước mặt học sinh","cho xem ảnh 1 cậu bé đang viết, đá và ăn và yêu cầu lấy tranh \"viết\", học sinh sẽ lấy ảnh cậu bé đang viết",-1,[["4","lấy ít nhất 20 ảnh về các hoạt động và có thể chỉ ra vài ví dụ khác nhau (gồm ví dụ mới) cho hầu hết các hoạt động đó"],["3","10 hoạt động"],["2","5 hoạt động"],["1","2 ảnh hoạt động"]]],["C36",0,2,"Lấy ra những ảnh có liên quan","đưa nhiều vật hay ảnh vật và hỏi \"Cái gì đi với cái này?\", học sinh sẽ có thể lấy vật đi đôi với vật giơ ra. (VD: lấy ảnh cái vợt khi giơ ảnh 1 quả bóng)","lưới và bóng, cốc và nước trái cây, tất và giày, dao/dĩa và thìa, áo và mũ",-1,[["4","có thể lấy ít nhất 2 ảnh có liên quan trong ít nhất 20 vật bày ra"],["3","2 ảnh liên quan trong số 10 vật"],["2","1 ảnh liên quan trong số 10 vật"],["1","1 ảnh liên quan trong số 5 vật"]]],["C37",0,2,"Lấy theo chức năng","Học sinh có thể lấy vật hay ảnh vật khi biết chức năng của nó","Khi xem ảnh về cái kéo, giày, ngựa và được hỏi: \"Em cắt bằng gì?\", học sinh sẽ trả lời kéo.",-1,[["4","có thể lấy ít nhất 25 đồ vật khi biết chức năng của chúng VÀ có thể lấy ít nhất 2 vật với 1 chức năng trong số ít nhất 6 vật bày ra"],["3","ít nhất 25 vật"],["2","ít nhất 5 vật"],["1","ít nhất 2 vật"]]],["C38",0,2,"Lấy theo đặc tính","Học sinh sẽ có thể lấy vật và ảnh vật khi biết về đặc tính hay các bộ phận của chúng","Khi xem ảnh về 1 cái kéo giày, và ngựa và được hỏi \"vật nào có đuôi?\" học sinh sẽ lấy ngựa",-1,[["4","lấy 25 vật với ít nhất 2 đặc tính hay bộ phận VÀ có thể lấy ít nhất 2 vật với 1 đặc tính hay bộ phận từ ít nhất 6 vật"],["3","lấy 25 vật với ít nhất 2 đặc tính hay bộ phận"],["2","lấy 5 vật với ít nhất 1 đặc tính hay bộ phận"],["1","lấy 2 vật có ít nhất 1 đặc tính hay bộ phận"]]],["C39",0,2,"Lấy theo loại","Học sinh sẽ có thể lấy vật hoặc ảnh vật khi biết chủng loại của chúng","Khi xem ảnh, 1 cái kéo, 1 chiếc giày, và 1 con ngựa và được hỏi \"em mang gì?\" học sinh sẽ trả lời \"giày\".",-1,[["4","có thể lẩy ít nhất 5 vật thuộc 4 loại VÀ có thể lấy ít nhất 2 vật cùng loại từ ít nhất 6 vật bày ra"],["3","ít nhất 5 vật thuộc 4 loại"],["2","ít nhất 5 vật thuộc 2 loại"],["1","ít nhất 5 vật thuộc 1 loại"]]],["C40",0,2,"Lấy 2 vật từ 1 loạt nhiều đồ vật","Theo lệnh, học sinh sẽ lấy 2 vật hay 2 ảnh từ 1 loạt nhiều đồ vật ở trên bàn trước mặt học sinh theo chỉ định","Khi để 1 loạt nhiều đồ vật thường lên bàn và học sinh được lệnh lấy giày và cốc đưa cho giáo viên, học sinh sẽ nhặt giày và cốc",-1,[["2","có thể lấy 2 vật hay ảnh theo chỉ định trong 1 loạt từ 10 vật trở lên"],["1","có thể lấy 2 vật hay ảnh theo chỉ định trong 1 loạt từ 4 vật trở lên"]]],["C41",0,2,"Lấy 2 vật theo thứ tự từ 1 loạt nhiều đồ vật","Theo lệnh, học sinh sẽ lấy 2 vật hay ảnh nào đó theo thứ tự yêu cầu từ 1 loạt nhiều ảnh ở trên bàn trước mặt học sinh","Để 10 đồ vật hay ảnh về đồ vật thông thường trên bàn. Khi nghe lệnh đưa giày và cốc học sinh sẽ nhặt ảnh giày và cốc theo thứ tự đó",-1,[["2","có thể lấy 2 vật theo thứ tự chỉ định từ 1 loạt ít nhất 10 ảnh"],["1","có thể lấy 2 vật theo thứ tự chỉ định từ 1 loạt ít nhất 4 ảnh"]]],["C42",0,2,"Chọn ra nhân viên công ích / phục vụ cộng đồng","Học sinh sẽ có thể chọn lấy ra ảnh nhân viên công ích ở quanh mình","giáo viên, cảnh sát, lính cứu hỏa, bác sĩ, công nhân",-1,[["4","chọn ảnh của ít nhất 4 nhân viên công ích"],["3","3"],["2","2"],["1","1"]]],["C43",0,2,"Tìm ra đồ vật trong 1 ảnh lớn, nhiều chi tiết","Học sinh sẽ có thể tìm ra ảnh ảnh vật trong 1 ảnh lớn, nhiều chi tiết","Tìm tất cả những con cá trong 1 ảnh chụp dưới nước",-1,[["2","có thể tìm ra ít nhất 3 trong 4 vật có ít nhất 10 vật khác"],["1","có thể tìm ít nhất 2 trong 4 vật trong 1 ảnh có ít nhất 5 vật khác nhau"]]],["C44",0,2,"Tìm vật khi cho xem một phần của vật trong một ảnh lớn, nhiều chi tiết","Học sinh sẽ có thể tìm ra vật khi thấy 1 phần của vật đó trong 1 ảnh lớn và nhiều chi tiết","Tìm ra tất cả các con cá khi chỉ được xem 1 phần của con cá (VD: đầu hay đuôi cá) trong ảnh chụp dưới nước.",-1,[["2","có thể tìm ra ít nhất 3 trong 4 vật trong 1 ảnh lớn có ít nhất 10 vật khác"],["1","có thể tìm ra ít nhất 2 trong 4 vật trong 1 ảnh có ít nhất 5 vật khác nữa"]]],["C45",0,2,"Tìm ra âm thanh quen thuộc từ môi trường tự nhiên","Học sinh sẽ có thể chọn ra ảnh tương ứng với âm thanh của một vật","Dụng cụ, máy móc, cưa, khoan, báo động: còi xe, còi tàu, còi xe cứu thương, còi xe cảnh sát, động vật, sự kiện, hành động, tiệc sinh nhật, trận đấu bóng, tàu, máy bay",-1,[["4","ít nhất 8 âm thanh"],["3","ít nhất 6 âm thanh"],["2","ít nhất 4 âm thanh"],["1","ít nhất 2 âm thanh"]]],["C46",0,2,"Chọn tất cả các ví dụ của 1 vật","Học sinh sẽ theo lệnh chọn tất cả những ví dụ cho 1 vật nhất định khi được yêu cầu (VD: tất cả những con mèo)","\"Đưa cho cô tất cả những con chó\"",-1,[["4","6 vật giống nhau từ ít nhất 15 vật"],["3","3 vật từ ít nhất 10 đồ vật"],["2","3 vật từ ít nhất 6 vật"],["1","ít nhất 2 vật giống nhau từ ít nhất 4 vật"]]],["C47",0,2,"Lấy ra 1 vật có 2 đặc tính nhất định","Khi được đưa nhiều vật hay ảnh vật khác nhau, học sinh sẽ có thể chọn lấy ra 1 vật có 2 đặc tính nhất định theo yêu cầu (VD: quả bóng đỏ to, cốc lúa mạch nóng)","Quả bóng đỏ to, Bát lúa mạch nóng Đồ đi ở chân",-1,[["4","20 vật với 2 đặc tính"],["3","10 vật với 2 đặc tính"],["2","5 vật với 2 đặc tính"],["1","2 vật với 2 đặc tính"]]],["C48",0,2,"Chọn 1 nhóm vật có chung 1 đặc tính nào đó","Khi được đưa 1 nhóm các vật hay ảnh vật chỉ khác nhau ở 1 đặc tính, học sinh sẽ có thể chọn lấy ra những vật có chung 1 đặc tính (VD: tính từ như \"những cái màu đỏ\")","những thứ màu đỏ, những cái có lỗ, những cái nhăn/ phẳng; bẩn/sạch; những cái mới/cũ",-1,[["4","lấy được vật có chung ít nhất 20 tính từ (gồm ít nhất 3 màu sắc, 2 hình dáng, 2 kích cỡ)"],["3","ít nhất 10 tính từ (ít nhất 5 trong số đó không phải màu sắc)"],["2","ít nhất 5 tính từ (có thể tất cả đều là màu sắc)"],["1","ít nhất 1 tính từ"]]],["C49",0,2,"Chọn 1 nhóm vật có chung 2 đặc tính nào đó","Khi được đưa 1 nhóm vật / ảnh vật, học sinh có thể chọn tất cả các vật có 2 đặc tính chung (ví dụ: các tính từ, bộ phận, đặc tính, chức năng, chủng loại)","những vật to màu đỏ, những vật màu xanh có lỗ; những chiếc xe hơi to; những vật màu xanh nhỏ; những đồ ăn màu đỏ",-1,[["4","lấy được 20 lần các vật có 2 đặc tính chung"],["3","10 lần có 2 đặc tính chung"],["2","5 lần có 2 đặc tính chung"],["1","2 lần có 2 đặc tính chung"]]],["C50",0,2,"Thực hiện yêu cầu có trình tự nhiều bước","Học sinh sẽ có thể chọn lấy 3 vật theo thứ tự nhất định","\"Sờ giầy, rồi sờ tất\"",-1,[["2","chọn lấy đúng 3 vật theo thứ tự nhất định sau khi nói tên tất cả các vật đó"],["1","chọn lấy đúng 2 vật theo thứ tự nhất định sau khi nói tên tất cả các vật đó"]]],["C51",0,2,"Nhận ra các giới từ","Học sinh biết lựa chọn liên quan đến giới từ khi yêu cầu","lấy cho cô cái ở trên bàn - chỉ cho cô con chim ở dưới hiên nhà",-1,[["4","ít nhất 6 giới từ"],["3","ít nhất 5 giới từ"],["2","ít nhất 3 giới từ"],["1","ít nhất 2 giới từ"]]],["C52",0,2,"Nhận ra các đại từ","Học sinh biết lựa chọn liên quan đến đại từ khi yêu cầu","Chỉ cô mũ của mẹ - lấy cô tranh bà/ông/",-1,[["4","ít nhất 8 đại từ"],["3","ít nhất 4 đại từ"],["2","ít nhất 3 đại từ"],["1","ít nhất 2 đại từ"]]],["C53",0,2,"Chọn lấy ảnh về nơi chốn hay hoạt động ở một nơi","Học sinh có thể chọn lấy ảnh về phong cảnh hay sinh hoạt","Nhà đang cháy, xe cứu hỏa, kéo vòi nước, phun nước vào nhà, cảnh 1 bãi biển, 1 bữa tiệc sinh nhật, 1 buổi cắm trại, 1 trận đấu bóng, 1 cuộc diễu hành, 1 cửa hàng tạp hóa, 1 buổi biểu diễn xiếc",-1,[["2","chọn lấy được ít nhất 4 ảnh về nơi chốn hay sinh hoạt"],["1","chọn lấy được ít nhất 2 ảnh về nơi chốn hay sinh hoạt"]]],["C54",0,2,"Chọn lấy ảnh về cảm xúc","Học sinh có thể chọn lấy ảnh khuôn mặt biểu thị nhiều cảm xúc","vui sướng, buồn, ngạc nhiên, sợ hãi, giận, sợ sệt ...",-1,[["4","ít nhất 4 cảm xúc"],["3","ít nhất 3 cảm xúc"],["2","ít nhất 2 cảm xúc"],["1","ít nhất 1 cảm xúc"]]],["C55",0,2,"Lấy ra vật \"giống\" và \"khác\"","Khi bày ra 2 vật, sau đó đưa tiếp vật thứ 3 giống 1 trong 2 vật kia và yêu cầu \"tìm vật giống như vậy\" hay \"tìm vật khác vật này\", học sinh sẽ lấy được vật tương ứng trong số vật bày ra","",-1,[["2","có thể chon được cả vật giống và khác khi 2 vật bày ra chỉ khác nhau ở 1 điểm"],["1","có thể chon được cả vật giống và khác khi 2 vật bày ra khác nhau ở ít nhất 2 điểm"]]],["C56",0,2,"Lấy ra vật không cùng chủng loại","Học sinh có thể chỉ hay lấy ra vật không cùng loại với một nhóm vật (ví dụ: không phải thực phẩm, không phải màu vàng, không dùng để nấu, không có đuôi)","Khi đang xem sách và được yêu cầu chỉ vào cái không phải là thức ăn, học sinh sẽ chỉ vào ảnh chiếc xe hơi",-1,[["4","ít nhất 3 ví dụ thuộc 10 loại (liên quan đến chức năng, đặc tính, loại)"],["3","3 ví dụ thuộc ít nhất 5 loại"],["2","3 ví dụ thuộc ít nhất 3 loại"],["1","3 ví dụ thuộc ít nhất 2 loại"]]],["C57",0,2,"Chọn lấy ảnh về tình huống giao tiếp xã hội","Học sinh có thể chọn lấy ảnh về tình huống giao tiếp xã hội (ví dụ: đang chơi, đang cãi nhau)","ngượng, tranh cãi, đánh nhau, trò chuyện, trêu trọc, vui chơi, làm việc, thực hành, bận rộn, giận, thân thiện, căng thẳng, vui nhộn.",-1,[["4","chọn lấy ảnh về ít nhất 4 tình huống giao tiếp xã hội"],["3","chọn lấy ít nhất 3 tình huống giao tiếp xã hội"],["2","chọn lấy ít nhất 2 tình huống giao tiếp xã hội"],["1","chọn lấy ít nhất 1 tình huống giao tiếp xã hội"]]],["D1",2,3,"Bắt chước động tác với đồ vật","Theo lệnh, học sinh sẽ bắt chước 1 động tác với đồ vật","Làm bộ uống từ tách, đẩy xe dọc tay vịn cầu thang",-1,[["4","ít nhất 10 động tác với 2 động tác khác nhau mỗi vật"],["3","10 động tác"],["2","5 động tác"],["1","2 động tác"]]],["D2",2,3,"Bắt chước động tác cơ bắp với đồ vật có ý thức phân biệt","Theo lệnh , học sinh sẽ lặp lại 1 động tác cơ bắp yêu cầu có phân biệt đồ vật","HS có 1 cây bút và 1 cái thìa, cho cây bút vào cốc, HS sẽ bắt chước làm theo khi yêu cầu",-1,[["4","ít nhất 10 động tác và sẵn sàng bắt chước động tác mới"],["3","10 động tác"],["2","5 động tác"],["1","2 động tác"]]],["D3",2,3,"Bắt chước các vận động thô bằng cơ bắp khi nhắc bằng lời","Học sinh sẽ bắt chước vận động tác thô bằng cơ bắp khi được nhắc bằng lời","Nhảy lên, vỗ tay",-1,[["4","ít nhất 10 động tác và sẵn sàng bắt chước động tác mới"],["3","10 động tác"],["2","5 động tác"],["1","2 động tác"]]],["D4",2,3,"Bắt chước các động tác chân và đùi","Theo lệnh, học sinh sẽ lặp lại 1 động tác cơ bắp với chân và đùi","Dậm chân",-1,[["4","ít nhất 10 động tác và sẵn sàng bắt chước động tác mới"],["3","10 động tác"],["2","5 động tác"],["1","2 động tác"]]],["D5",2,3,"Bắt chước các động tác với bàn tay và cánh tay","Theo lệnh, HS sẽ bắt chước các động tác thô bằng cơ bắp với bàn tay và cánh tay","đưa tay lên và xuống dọc bên hông",-1,[["4","ít nhất 10 động tác và sẵn sàng bắt chước động tác mới"],["3","10 động tác"],["2","5 động tác"],["1","2 động tác"]]],["D6",2,3,"Bắt chước cả động tác cần di chuyển cơ thể và không cần di chuyển","Theo lệnh, HS sẽ lặp lại các động tác gần giống nhau đòi hỏi học sinh biết phân biệt đó là động tác cần di chuyển hay không cần","Đập tay xuống bàn và để tay trên bàn, vỗ tay và úp hai lòng bàn tay lại, đập chân xuống vòng tròn với đặt chân vào trong vòng tròn",-1,[["4","ít nhất 10 cặp động tác và sẵn sàng lặp lại nhiều động tác mới"],["3","10 cặp"],["2","2 cặp"],["1","2 cặp các động tác giống nhau, 1 động tác cần di chuyển, 1 không"]]],["D7",2,3,"Dùng các lệnh khác nhau yêu cầu học sinh bắt chước","Học sinh sẽ bắt chước các động tác dù ta có dùng các câu lệnh khác nhau yêu cầu bắt chước","Lặp lại theo mẫu khi được lệnh \"xem cô này, đến lượt con\"; \"làm như cô làm này\", \"làm theo cô\", \"Em thứ làm đi\", \"Đến lượt cô, và bây giờ con làm\" hay \"làm như thế này nhé\"",-1,[["2","làm theo các động tác khi dùng 1 trong 4 câu lệnh khác nhau yêu cầu HS bắt chước"],["1","làm theo các động tác khi dùng 1 trong ít nhất 2 câu lệnh khác nhau yêu cầu HS bắt chước"]]],["D8",2,3,"Bắt chước các động tác thô bằng cơ bắp được làm mẫu trong gương","Theo lệnh, học sinh sẽ lặp lại các động tác thô bằng cơ bắp đã quan sát thấy qua gương","học sinh đặt tay lên đầu, vỗ tay, xoa bụng ...",-1,[["4","ít nhất 10 động tác và sẵn sàng bắt chước động tác mới"],["3","10 động tác"],["2","5 động tác"],["1","2 động tác"]]],["D9",2,3,"Bắt chước các động tác đầu","Theo lệnh, học sinh sẽ lặp lại 1 động tác vận động thô với đầu","Lắc đầu qua lại",-1,[["2","lặp lại 3 động tác"],["1","1 động tác"]]],["D10",2,3,"Bắt chước các động tác với lưỡi, miệng","Theo lệnh, học sinh sẽ lặp lại 1 động tác với lưỡi và miệng","Thè lưỡi ra liếm",-1,[["2","lặp lại 4 động tác"],["1","lặp lại 2 động tác"]]],["D11",2,3,"Làm theo động tác với mặt/miệng làm mẫu trong gương","Theo lệnh, học sinh có lặp lại các động tác mặt, miệng khi xem mẫu trong gương","Há mồm, bặm môi vào nhau, thè lưỡi, đưa lưỡi qua lại, đặt môi ở vị trí thổi; phồng má, giương mày, chớp mắt",-1,[["4","ít nhất 6 động tác mặt, miệng (gồm cả động tác tĩnh và động)"],["3","6 động tác bất kỳ"],["2","4 động tác bất kỳ"],["1","2 động tác với miệng/mặt bất kỳ"]]],["D12",2,3,"Bắt chước động tác vận động tinh","Theo lệnh, học sinh sẽ lặp lại 1 đông tác vận động tinh","Chạm đầu 2 ngón trỏ vào nhau",-1,[["4","ít nhất 10 động tác và sẵn sàng lặp lại những động tác mới"],["3","10 động tác"],["2","5 động tác"],["1","2 động tác"]]],["D13",2,3,"Bắt chước chạm tay vào các đồ vật theo thứ tự","Theo lệnh, học sinh sẽ bắt chước chạm tay vào đồ vật theo thứ tự cùng lúc với người làm mẫu","Với loạt 4 vật, học sinh sẽ làm theo mẫu lần lượt chạm tay vào xe hơi, sau đó là giày, rồi đến tách và cuối cùng là ngựa",-1,[["2","có thể lặp lại động tác chạm tay vào 4 trong 6 đồ vật theo bất kì thứ tự nào"],["1","có thể chạm vào 2 trong 4 vật theo bất cứ thứ tự nào"]]],["D14",2,3,"Bắt chước thổi","Theo lệnh, học sinh sẽ lặp lại động tác thổi ngắn và dài theo mẫu","học sinh làm động tác thổi đơn giản và động tác thổi kéo dài 2 giây...",-1,[["2","bắt chước cả thổi ngắn và thổi dài trong ít nhất 2 giây"],["1","có thể bắt chước thổi ngắn hoặc thổi dài"]]],["D15",2,3,"Bắt chước một động tác đang diễn ra với cùng tốc độ","Theo lệnh, học sinh sẽ lặp lại 1 động tác đang diễn ra với 1 vật đúng tốc độ đang làm mẫu","Bắt chước vận tốc của người làm mẫu di chuyển 1 vật (ví dụ: lắc con lục lặc nhanh hay chậm cùng 1 lúc với người làm mẫu)",-1,[["2","sẵn sàng lặp lại động tác theo tốc độ của người làm mẫu"],["1","chỉ cần nhắc 1 lần"]]],["D16",2,3,"Bắt chước tốc độ của 1 động tác với đồ vật vừa làm mẫu xong","Theo lệnh, học sinh sẽ lặp lại 1 động tác với 1 vật đúng bằng tốc độ vừa làm mẫu xong","Ngay sau khi xem mẫu, học sinh sẽ lặp lại 1 động tác theo đúng tốc độ vừa làm mẫu xong để di chuyển 1 vật (ví dụ: lắc lục lạc nhanh hay chậm)",-1,[["2","sẵn sàng lặp lại các động tác theo tốc độ của người làm mẫu vừa làm"],["1","cần nhắc 1 lần để làm theo"]]],["D17",2,3,"Lặp lại tốc độ của 1 động tác","Theo lệnh, học sinh sẽ lặp lại một động tác cơ bắp để theo vận tốc của người làm mẫu","Đưa tay lên xuống dọc hông nhanh hay chậm",-1,[["2","Sẵn sàng lặp lại các động tác của người làm mẫu"],["1","Đòi hỏi có nhắc nhở bằng lời"]]],["D18",2,3,"Bắc chước chạm tay vào một chuỗi vật theo mẫu","Theo lệnh, học sinh sẽ bắt chước chạm tay vào chuỗi đồ vật theo mẫu","Khi đưa một loạt 4 đồ vật, học sinh sẽ chạm tay vào ô tô, giày, chén và sau đó là ngựa đúng theo trình tự làm mẫu",-1,[["2","Có thể bắt chước chạm vào 4 trong 6 vật theo bất kỳ thứ tự nào theo bất kỳ thứ tự nào ngay sau khi xem mẫu"],["1","Có thể bắt chước chạm tay vào 2 trong 4 vật theo bất kỳ thứ tự nào ngay sau khi xem mẫu"]]],["D19",2,3,"Bắt chước chuỗi động tác và chuyển động tác theo người làm mẫu","Theo lệnh \"làm thế này\", học sinh sẽ lặp lại chuỗi các hoạt động theo mẫu, ngay lập tức chuyển từ 1 hoạt động này sang 1 hoạt động khác theo lệnh của giáo viên","Vỗ tay, lắc tay, xoa tay, đập đùi, sau đó chuyển ngay từ động tác này sang động tác khác khi giáo viên thay đổi động tác",-1,[["2","Có thể lặp lại chuỗi 6 động tác khác nhau theo mẫu trong 10 giây"],["1","Có thể lặp lại 1 chuỗi 4 động tác theo mẫu trong 10 giây"]]],["D20",2,3,"Lặp lại 1 chuỗi các động tác","Theo lệnh, học sinh sẽ lặp lại 1 chuỗi các động tác","Vỗ tay, rồi đập đùi",-1,[["4","Ít nhất 10 chuỗi 2 động tác và sẵn sàng lặp lại nhiều chuỗi mới"],["3","10 chuỗi 2 động tác"],["2","5 chuỗi 2 động tác"],["1","2 chuỗi 2 động tác sau khi xem mẫu"]]],["D21",2,3,"Bắt chước cường độ của động tác","Theo lệnh, học sinh sẽ lặp lại một động tác cơ bắp theo đúng cường độ của ngưòi làm mẫu","Đập mạnh/nhẹ xuống bàn, vỗ tay mạnh/nhẹ. Lưu ý: vỗ tay mạnh/nhẹ có thể được coi là vỗ nhanh/chậm",-1,[["2","Sẵn sàng lặp lại các động tác theo cường độ của người làm mẫu"],["1","cần phải nhắc bằng lời"]]],["D22",2,3,"Lặp lại đúng số lần thực hiện một động tác","Theo lệnh, học sinh sẽ lặp lại một động tác đúng số lần của động tác mẫu","dùng dùi gõ trống 1 lần/3 lần",-1,[["2","lặp lại 3 lần một động tác mà không cần nhắc"],["1","lặp lại được 3 lần nhưng phải nhắc bằng lời hoặc cử chỉ"]]],["D23",2,3,"Bắt chước đồng thời 1 động tác đi kèm lời nói","Theo lệnh, học sinh sẽ lặp lại 1 động tác kèm lời nói","Vẫy tay trên cao, và nói \"vun vút,vun vút,vun vút\", làm động tác ru bé ngủ và nói \"à í à ơi\"",-1,[["2","lặp lại đến 3 lần lặp lại ít nhất 4 động tác kèm với lời nói không nhắc"],["1","lặp lại ít nhất 1 động tác kèm lời nói mà không cần nhắc"]]],["D24",2,3,"Bắt chước chuỗi các hoạt động cơ bắp với nhiều đồ vật","Theo lệnh, học sinh sẽ lặp lại 1 chuỗi các động tác với nhiều đồ vật","Khi đưa ra 1 xe tải đồ chơi, 1 hộp nhỏ, 1 khối hình màu đỏ, xanh, vàng và trắng, học sinh sẽ lặp lại động tác đặt khối xanh lên khối trắng, rồi đặt khối đỏ vào hộp và khối vàng phía sau xe tải",-1,[["2","Có thể lặp lại ít nhất 6 chuỗi gồm 3 động tác với 4 vật có vật mẫu trước mặt"],["1","Có thể lặp lại ít nhất 6 chuỗi gồm ít nhất 2 động tác với 4 đồ vật theo mẫu hiện diện"]]],["D25",2,3,"Bắt chước động tác cơ bắp mà không cần nhắc trực tiếp","Không cần ra lệnh lặp lại từng động tác, học sinh sẽ lặp lại những động tác dễ theo mẫu, chỉ để được khen vì đã biết lặp lại các động tác đó","Bắt chước một loạt các động tác đầu, mặt mà người khác đang làm",-1,[["4","ít nhất 10 động tác và sẵn sàng lặp lại những động tác mới"],["3","10 động tác"],["2","5 động tác"],["1","2 động tác"]]],["D26",2,3,"Tự động bắt chước các động tác của người khác","Học sinh có thể lặp lại ngay các động tác cơ bắp của người khác không đứng trước mặt mình","Quan sát và làm theo người khác. Ví dụ: tất cả cùng nhảy, vỗ tay, đứng, ngồi, tay chống hông",-1,[["4","Ít nhất 10 động tác và sẵn sàng lặp lại những động tác mới (không nhất thiết phải làm liền một mạch 10 động tác)"],["3","10 động tác"],["2","5 động tác"],["1","2 động tác"]]],["D27",2,3,"Bắt chước sau một thời gian ngắt quãng","Khi được yêu cầu, hoặc khi nói tên một hành động, HS sẽ thể hiện hành động đã quan sát được vài tiếng trước đó","\"Đây là những gì con sư tử làm\" hay \"cho cô xem nàng Bạch tuyết cọ sàn nhà như thế nào\"",-1,[["4","Gọi tên và lặp lại nhiều động tác đã thấy cách đó 4 tiếng"],["3","Gọi tên và lặp lại sau 1 tiếng"],["2","Gọi tên và lặp lại sau 10 phút"],["1","Theo lệnh, 1 hành động sau 5 phút"]]],["E1",1,4,"Lặp lại âm thanh theo lệnh","Học sinh có thể lặp lại 1 âm thanh khi nghe lệnh \"Nói..........\"","",-1,[["4","Sẵn sàng lặp lại chính xác hầu hết các âm"],["3","15 âm"],["2","5 âm"],["1","2 âm"]]],["E2",1,4,"Lặp lại chuỗi từng âm thanh, và chuyển âm theo người làm mẫu","Học sinh sẽ có thể lặp lại 1 chuỗi các âm, liên tiếp chuyển từ âm này sang âm khác","Học sinh lặp lại liên tiếp từ âm thanh sang âm thanh khác với tốc độ cao (Ví dụ: nói \"may\", \"moe\", \"me\", \"ah\", \"buh\", \"ee\", \"oh\")",-1,[["2","Có thể lặp lại ít nhất 10 âm riêng biệt trong 15 giây"],["1","Có thể lặp lại ít nhất 5 âm riêng biệt trong 10 giây"]]],["E3",1,4,"Lặp lại âm đầu của từ","Khi đọc mẫu 1 từ cho học sinh, học sinh sẽ có thể lặp lại âm đầu của từ đó","Với từ \"Bat\" nói là \"ba\", từ \"Shoe\" nói là \"Sh\", \"apple\" nói là \"ap\", từ \"up\" nói là \"ich\"",-1,[["4","Sẵn sàng lặp lại chính xác ít nhất âm đầu của hầu như tất cả các từ"],["3","15 âm"],["2","5 âm"],["1","2 âm"]]],["E4",1,4,"Bắt chước các cách kết hợp âm","Học sinh sẽ có thể bắt chước các cách kết hợp âm đòi hỏi học sinh phải chú ý đến cả 2 âm","Nói \"ma\" \"ma\", \"ma\" \"me\", \"ma\" \"moe\". Nói \"ee\" \"o\"; \"ee\" \"ee\" và \"ee\" \"ah\"",-1,[["2","Có thể nhắc lại ít nhất 4 cặp kết hợp âm với ít nhất 4 âm đầu"],["1","có thể nhắc lại ít nhất 3 cặp kết hợp âm với ít nhất 2 âm đầu"]]],["E5",1,4,"Bắt chước lặp lại các âm ngắn và bật hơi nhanh; kéo dài và giữ hơi lâu","Học sinh có thể lặp lại âm đúng tốc độ của âm đọc mẫu","Nói \"mm\" và \"mmmm\"",-1,[["2","Sẵn sàng lặp lại âm đúng tốc độ của người làm mẫu"],["1","cần nhắc bằng cử chỉ"]]],["E6",1,4,"Lặp lại 1 âm đúng số lần đọc mẫu","Theo lệnh, học sinh sẽ lặp lại 1 âm thanh đúng số lần đọc mẫu","Nói \"ah\" 1 lần và \"ah\" \"ah\" \"ah\"",-1,[["2","lặp lại được tối đa 3 lần theo đúng số lần đọc mẫu không cần nhắc"],["1","lặp lại khi được nhắc bằng cử chỉ"]]],["E7",1,4,"Bắt chước đọc kéo dài âm đầu nối tiếp sang âm thứ 2","Học sinh có thể lặp lại một tổ hợp âm, trong đó giáo viên yêu cầu học sinh phải giữ hay kéo dài âm đầu và đọc nối sang âm thứ 2 một cách trơn tru (chứ không đọc rời 2 âm)","Nói \"mmmeeee\" chuyển từ âm \"mm\" sang âm \"eee\" một cách trơn tru (chứ không đọc rời rạc thành 2 âm \"mm\"....\"eee\" \"aaaaammmm\" là \"am\" được đọc kéo dài",-1,[["2","Có thể đọc kéo dài từ ít nhất 4 âm đầu nối sang ít nhất 4 âm tiếp theo"],["1","Có thể đọc kéo dài từ ít nhất 2 âm đầu nối sang ít nhất 2 âm tiếp theo"]]],["E8",1,4,"Bắt chước các tổ hợp phụ âm - nguyên âm; nguyên âm - phụ âm","Học sinh có thể bắt chước các tổ hợp phụ âm - nguyên âm và nguyên âm-phụ âm (vd \"đi\", \"ma\" và \"ăn\", \"ao\" \"em\")","đi, ma, ăn, ao, em",-1,[["2","Có thể bắt chước 3 tổ hơp nguyên âm - phụ âm VÀ 3 tổ hợp phụ âm - nguyên âm mà không bị đứt quãng giữa các âm"],["1","Có thể bắt chước 3 tổ hơp nguyên âm - phụ âm HOẶC 3 tổ hợp phụ âm - nguyên âm mà không bị đứt quãng giữa các âm"]]],["E9",1,4,"Tổ hợp phụ âm-nguyên âm-phụ âm-nguyên âm","Học sinh có thể bắt chước các tổ hợp phụ âm - nguyên âm - phụ âm - nguyên âm (Ví dụ: \"mama\" \"dada\" \"peepee\" \"meme\")","mama, dada, peepee, meme, booboo, byebye",-1,[["2","Có thể nhắc lại ít nhất 6 tổ hợp kiểu này mà không bị ngắt quãng giữa các âm"],["1","Có thể nhắc lại ít nhất 3 tổ hợp kiểu này mà không bị ngắt quãng giữa các âm"]]],["E10",1,4,"Tổ hợp phụ âm - nguyên âm - phụ âm","Học sinh có thể nhắc lại các tổ hợp phụ âm-nguyên âm-phụ âm theo mẫu","nằm, canh, nhất, lớn",-1,[["2","Có thể nhắc lại ít nhất 12 tổ hợp kiểu này mà không bị ngắt quãng giữa các âm"],["1","Có thể nhắc lại ít nhất 3 tổ hợp kiểu này mà không bị ngắt quãng giữa các âm"]]],["E11",1,4,"Bắt chước các cặp phụ âm ghép","Học sinh có thể nhắc lại chính xác những từ có cặp phụ âm ghép theo mẫu hay không?","2 phụ âm ghép \"tr\" 3 phụ âm ghép \"ng\"",-1,[["4","Sẵn sàng lặp lại chính xác hầu hết các từ có phụ âm ghép"],["3","15 từ"],["2","5 từ"],["1","2 từ"]]],["E12",1,4,"Lặp lại các từ theo lệnh","Học sinh có thể lặp lại 1 từ khi giáo viên đưa lệnh \"Hãy nói..........\"","",-1,[["4","Sẵn sàng và lặp lại chính xác hầu hết các từ"],["3","gần chính xác 15 từ"],["2","gần chính xác 5 từ"],["1","gần chính xác 2 từ"]]],["E13",1,4,"Lặp lại cụm từ theo lệnh","Học sinh có thể lặp lại 1 cụm từ theo lệnh khi giáo viên yêu cầu \"Nói...........\"","",-1,[["4","Sẵn sàng lặp lại chính xác cụm từ gồm ít nhất 6 từ"],["3","Câu 4 từ"],["2","Câu 3 từ"],["1","Câu 2 từ"]]],["E14",1,4,"Lặp lại các chuỗi số theo lệnh","Học sinh có thể lặp lại các chuỗi số theo lệnh \"Nói.....\"","Nhắc lại số điện thoại",-1,[["4","Sẵn sàng và lặp lại chính xác chuẩn gồm ít nhất 7 số từ"],["3","4 số"],["2","3 số"],["1","2 số"]]],["E15",1,4,"Lặp lại các từ ngắn, nhanh >< kéo dài, chậm","Học sinh có thể lặp lại các từ theo tốc độ của người đọc mẫu","Hãy nói từ \"Movie\" ở mức vừa, chậm như: \"mooooveeee\" và nhanh",-1,[["2","Có thể nhắc lại các từ nhanh VÀ chậm hơn bình thường"],["1","Có thể nhắc lại nhanh HOẶC chậm hơn bình thường"]]],["E16",1,4,"Bắt chước nói to/nhỏ các từ/âm theo mẫu","Học sinh có thể lặp lại từ đúng âm lượng đọc mẫu","Nói to/nhỏ từ \"apple\"",-1,[["2","Sẵn sàng lặp lại từ đúng âm lượng của người đọc mẫu"],["1","cần nhắc nhở bằng cử chỉ"]]],["E17",1,4,"Lặp lại từ/âm ở cao độ khác nhau","Học sinh có thể lặp lại các từ đúng cao độ/âm điệu của người đọc mẫu","Nói \"apple\" với cao độ khác nhau",-1,[["2","Sẵn sàng lặp lại đúng cao độ/âm điệu đọc mẫu"],["1","cần nhắc nhở bằng cử chỉ"]]],["E18",1,4,"Nhắc lại lời nhắn ngắn cho 1 người khác","H/s sẽ có thể đi đến một người nào đó và nhắc lời nhắn ngắn của một người khác","Mẹ bảo con nói với bố \"Con muốn piza\" và con sẽ đi đến chỗ bố và nói \"Con muốn piza\"",-1,[["2","Có thể chuyển lời nhắn 3 từ đến một người đứng cách đó ít nhất 10 feet"],["1","Có thể chuyển lời nhắn 2 từ đến một người đứng cách đó ít nhất 5 feet"]]],["E19",1,4,"Tự động nói theo các từ","H/s có thể tự nói theo các từ","",-1,[["4","nói theo chính xác ít nhất 20 từ mỗi ngày"],["3","15 từ"],["2","5 từ"],["1","2 từ"]]],["E20",1,4,"Tự động nói theo các cụm từ","H/s có thể tự nói theo các cụm từ","",-1,[["4","Lặp lại chính xác cụm 6 từ hoặc hơn ít nhất 3 lần mỗi ngày"],["3","cụm 4 từ 3 lần mỗi ngày"],["2","cụm 3 từ 3 lần mỗi ngày"],["1","cụm 2 từ ít nhất 3 lần ngày"]]],["F1",1,5,"Yêu cầu bằng cách chỉ","Học sinh sẽ có thể chỉ những đồ vật hay hành động mình muốn bằng cách chỉ, kéo lại mình hay đứng kế bên vật mình muốn (mà không dùng từ hay ngôn ngữ ra hiệu)","",-1,[["2","ít nhất 5 yêu cầu một ngày về 3 vật hoặc hoạt động khác nhau"],["1","yêu cầu 1 vật hoặc hoạt động khác nhau"]]],["F2",1,5,"Ra các yêu cầu khi có người chi phối / điều khiển","Học sinh sẽ yêu cầu có điều mình muốn khi có vật yêu thích và được đưa một từ hoặc một ký hiệu","Để quả táo trước mặt HS, và hỏi \"Con muốn gì?..(nhắc) Táo\" HS sẽ ra dấu hoặc nói \"Táo\"",-1,[["4","ít nhất 10 vật hoặc hoạt động"],["3","6 vật hoặc hoạt động"],["2","4 vật hoặc hoạt động"],["1","1 vật hoặc hoạt động"]]],["F3",1,5,"Yêu cầu khi có vật yêu thích hiện hữu và khi được hỏi \"Con muốn gì?\"","Học sinh sẽ yêu cầu vật mình muốn bằng lời hay bằng cử chỉ khi vật đó hiện hữu","Để quả táo trước mặt HS, và hỏi \"Con muốn gì?\" HS sẽ ra dấu hoặc nói \"Táo\"",-1,[["4","ít nhất 10 vật hoặc hoạ )"]]],["F22",1,5,"Yêu cầu dùng phó từ","Học sinh sẽ có thể yêu cầu những hành động dùng phó từ, (thí dụ: đẩy tôi nhanh lên, đi nhẹ chân thôi).","Trong khi ngồi trên xe đẩy, học sinh yêu cầu \"đẩy tôi nhanh lên\", \"chúng mình nói khẽ thôi\", \"hãy ném mạnh tay hơn\"",-1,[["2","tự động dùng ít nhất 4 phó từ kèm 1 danh từ khi yêu cầu 1 hành động"],["1","dùng ít nhất 2 phó từ có / không kèm hành động trong tình huống có dàn dựng"]]],["F23",1,5,"Yêu cầu dùng đại từ","Học sinh sẽ có thể yêu cầu nhiều đồ vật dùng đại từ (thí dụ: Tôi muốn nón của bạn)","Trong khi chơi trò chơi mặc quần áo, học sinh bảo \"tôi muốn nón của bạn\"",-1,[["2","tự động dùng ít nhất 4 đại từ kèm 1 danh từ khi yêu cầu 1 vật"],["1","dùng ít nhất 2 đại từ có / không kèm 1 danh từ trong tình huống có dàn dựng"]]],["F24",1,5,"Hỏi thông tin bằng câu hỏi \"Cái nào?\"","Học sinh sẽ đặt câu hỏi để lấy thông tin","",-1,[["2","hỏi câu hỏi \"Cái nào?\" ngoài giờ học với những vật lạ"],["1","có thể hỏi trong giờ học (hay khi được nhắc)"]]],["F25",1,5,"Hỏi thông tin bằng câu hỏi \"Khi nào?\"","Học sinh sẽ đặt câu hỏi để lấy thông tin","",-1,[["2","hỏi câu hỏi \"Khi nào?\" ngoài giờ học với những vật lạ"],["1","có thể hỏi trong giờ học (hay khi được nhắc)"]]],["F26",1,5,"Hỏi thông tin bằng câu hỏi \"Như thế nào?\"","Học sinh sẽ đặt câu hỏi để lấy thông tin","Hãy chỉ tôi cách bạn làm việc đó",-1,[["2","hỏi những câu hỏi \"Như thế nào?\" ngoài giờ học với những vật lạ"],["1","có thể hỏi trong giờ học (hay khi được nhắc)"]]],["F27",1,5,"Hỏi thông tin bằng câu hỏi \"….có thể…không?\", \"có phải…không?\", hoặc \"...sẽ….không?\"","Học sinh sẽ đặt câu hỏi để lấy thông tin","Tôi có thể mua giầy ở trạm xăng hay không?",-1,[["2","tự dùng ít nhất 2 dạng câu hỏi đảo \"có/không\""],["1","tự dùng ít nhất 1 dạng câu hỏi đảo \"có/không\""]]],["F28",1,5,"Hỏi thông tin bằng câu hỏi \"Tại sao\"","Học sinh sẽ đặt câu hỏi để lấy thông tin","",-1,[["2","tự hỏi \"Tại sao?\" ngoài giờ học với những vật lạ"],["1","Có thể hỏi trong giờ h
