8",0,25,"Thể hiện sự quan tâm với các câu chuyện ngắn và hiểu được các phần của câu chuyện tương ứng với các câu hỏi đơn giản (cái gì và ai).","Trẻ lắng nghe những câu chuyện đơn giản khi người lớn đọc (5 trang). Trẻ thể hiện sự quan tâm chú ý bằng cách cùng người lớn nhìn vào cuốn sách và phản ứng lại một cách chính xác câu hỏi ai/cái gì bằng lời hoặc bằng chỉ tay. Cuối cùng trả lời được 2-3 câu hỏi.","",3],["GTN.4.9",0,25,"Trả lời câu hỏi \"có/không\" để nhận dạng .","Trả lời đúng bằng cách phát âm hoặc gật/lắc đầu khi người lớn hỏi \"Có phải là….?\" hoặc \"Tên con là Nam phải không?\".","",3],["GTN.4.10",0,25,"Trả lời câu hỏi về các trạng thái thể chất.","Trẻ phản ứng đúng với cụm câu hỏi \"Con sẽ làm gì nếu….?\" cho 4 trạng thái hoặc nhiều hơn: đau, mệt, đói, khát.","",3],["GTN.4.11",0,25,"Trả lời các câu hỏi về thông tin cá nhân.","Phản ứng đúng với 3 câu hỏi liên quan đến thông tin cá nhân hoặc nhiều hơn. Các VD: \"Tên con là gì?\" (Họ và tên), \"Số điện thoại của nhà con là bao nhiêu?\" và \"Địa chỉ của nhà con là gì?\".","",3],["GTN.4.12",0,25,"Hiểu \"giống\" và \"khác nhau\".","Cầm lên, đưa, chỉ tay và cho xem các đồ vật/tranh ảnh đáp lại những hướng dẫn như tìm đồ vật giống nhau, và các đồ vật/tranh ảnh khác nhau.","",3],["GTN.4.13",0,25,"Hiểu các khái niệm về số lượng.","Cầm lên, đưa, chỉ tay hoặc cho xem đồ vật hoặc tranh ảnh phản ứng lại với các từ chỉ số lượng : một, một vài, tất cả, một ít, hầu hết. Cần phải vượt qua được hết mới đạt.","",3],["GTN.4.14",0,25,"Nhận diện được đặc điểm của các đồ vật.","Cầm lên, đưa, chỉ tay hoặc cho xem đồ vật với đặc điểm như người lớn thể hiện. VD: người lớn nói \"Đưa cho cô con chó có tai dài\" và trẻ chỉ đúng. Các đặc điểm bao gồm kích cỡ, hình dáng, chất liệu, trạng thái thể chất (lỏng/rắn, mềm/cứng, nhũn/dai,…) Vượt qua nếu hiểu được 10-15 đặc điểm.","",3],["GTN.4.15",0,25,"Trả lời các câu hỏi liên quan đến các đặc điểm của của đồ vật/tranh ảnh.","Trẻ hiểu các đặc điểm đồ vật bao gồm: màu sắc, hình dạng, kích cỡ hoặc chức năng, cái màu xanh, cái nào hình tròn, cái nào to, cái nào dùng để ăn.","",3],["GTN.4.16",0,25,"Hiểu việc đã xảy ra trong quá khứ và việc sẽ xảy ra trong tương lai.","Trẻ xác định được việc đã xảy ra trong quá khứ. \"Chỉ cho cô bạn trai đã nhảy\" và xác định việc sắp xảy ra trong tương lai. Hiểu và phân biệt được mốc thời gian.","",3],["GTN.4.17",0,25,"Hiểu thể bị động.","Trẻ hiểu được thể bị động thông qua hành động với đồ vật hoặc sự lựa chọn tranh ảnh (VD: \"Con chó bị quả bóng đập vào\". \"Cô bé bị cậu bé đuổi\").","",3],["GTN.4.18",0,25,"Hiểu các mối liên hệ thuộc thời gian.","Trẻ phản ứng lại chính xác với 3 hướng dẫn có liên hệ thời gian: đầu tiên/cuối cùng, trước/sau, cùng lúc.","",3],["GTN.4.19",0,25,"Làm theo được các hướng dẫn bằng lời không có liên quan gồm 3 phần.","Tuân theo yêu cầu của người lớn gồm 3 phần, VD: người lớn nói \"Đưa cho cô cái cốc\", \"Hôn con gấu\", và \"Đóng hộp\", \"Vượt qua nếu thể hiện đúng.","",3],["GTD.4.1",1,26,"Trả lời các câu hỏi phức tạp (\"Tại sao?\", \"Như thế nào\").","Trẻ trả lời đúng các câu hỏi liên quan đến các khái niệm này (VD: \"Tại sao chúng ta rửa tay?\", \"Con đánh răng như thế nào?\".","",3],["GTD.4.2",1,26,"Miêu tả các chức năng của đồ vật để trả lời câu hỏi (VD: \"Con làm gì với cái thìa?).","Có thể mô tả chức năng của 5 đồ vật thông thường hoặc nhiều hơn bằng cách sử dụng các cụm từ đơn giản.","",3],["GTD.4.3",1,26,"Nói câu 3-4 từ một cách nhất quán.","Hiểu để diễn đạt phù hợp đúng một số ngữ cảnh, các đối tác và các hoạt động.","",3],["GTD.4.4",1,26,"Sử dụng các cụm danh từ khác nhau.","Trẻ kết hợp được một số từ và tạo các cụm danh từ có thể dài 4 từ, gồm các mạo từ, đại từ sở hữu, tính từ và số từ (VD: \"Chú ngựa nhỏ\", \"Bút chì màu đỏ của con\", \"Chiếc xe tải này\", \"Hai cái bánh quy\", \"Hình vuông to màu đỏ\").","",3],["GTD.4.5",1,26,"Sử dụng các cụm giới từ, VD: dưới, kế tiếp, đằng sau, đằng trước.","Trẻ nói các giới từ như được lên danh sách ở bên để mô tả đồ vật, trả lời câu hỏi và hướng dẫn người khác cách phân bố/sắp xếp.","",3],["GTD.4.6",1,26,"Sử dụng các động từ khác nhau đúng ngữ pháp và bối cảnh.","Tự giải thích. (VD: cậu bé khóc, cô ấy thích cậu ấy, cậu ấy ngã, cậu ấy đã vui vẻ, cậu ấy đang vui).","",3],["GTD.4.7",1,26,"Thể hiện chính xác ít nhất 80%tất cả các phụ âm và các hỗn hợp nguyên âm, phụ âm trong lời nói.","Trẻ thể hiện chính xác được 80% âm thanh trong hội thoại, lời nói dễ hiểu với người bản xứ.","",3],["GTD.4.8",1,26,"Miêu tả trải nghiệm hiện tại bằng cách sử dụng câu 3-4 từ.","Khi được hỏi, trẻ miêu tả trải nghiệm gần đây với tối thiểu là 2 thành phần (ai, cái gì, ở đâu, khi nào). VD: \"Con đã làm gì vào tiệc sinh nhật của mình?\", \"Con nhận được quà từ bạn An\".","",3],["GTD.4.9",1,26,"Yêu cầu sự chấp nhận được theo đuổi một hoạt động nào đó.","Trẻ xin phép trước khi điều chỉnh cái gì đó: \"Con có thể mở quạt to hơn được không?\" (khi thấy nóng), \"Con có thể ăn món này được không?\" (hỏi xin phép người lớn). Cũng có thể khi trẻ muốn bắt đầu một hoạt động khác \"Chúng ta có thể nghe nhạc được không?\".","",3],["GTD.4.10",1,26,"Sử dụng số nhiều.","Trẻ sử dụng từ chỉ số nhiều một cách nhất quán và tự phát (VD: vài, các, những, mấy,…).","",3],["GTD.4.11",1,26,"Sử dụng các từ sở hữu (VD: của cô ấy, của anh ấy,…).","Trẻ sử dụng đều đặn những từ này.","",3],["GTD.4.12",1,26,"Sử dụng câu diễn tả một hoạt động đã xảy ra trong quá khứ bằng cách sử dụng một số từ phù hợp (vừa, đã + động từ).","Trẻ sử dụng đều đặn mẫu câu này một cách tự phát và thường xuyên.","",3],["GTD.4.13",1,26,"Sử dụng từ \"một\" như \"1 con chó, 1 cái bàn\".","Trẻ sử dụng những từ đó thường xuyên trong các câu và cụm từ.","",3],["GTD.4.14",1,26,"Sử dụng các từ so sánh hơn, hơn nhất.","Sử dụng 5 từ đúng hoặc nhiều hơn, tốt hơn, tốt nhất, to hơn, to nhất, bé hơn, bé nhất,…","",3],["GTD.4.15",1,26,"Sử dụng động từ ở dạng phủ định (không + động từ).","VD: \"Con không khóc\", \"Con không đánh bạn ấy\".","",3],["GTD.4.16",1,26,"Sử dụng câu diễn tả hoạt động đang diễn ra (đang + động từ).","Diễn đạt câu mô tả hoạt động đang xảy ra \"Con đang ăn bánh\".","",3],["GTD.4.17",1,26,"Sử dụng từ mô tả các trạng thái của cơ thể.","Trẻ sử dụng 5 từ hoặc nhiều hơn để mô tả trạng thái của bản thân. \"Con đói/lạnh/khát/mệt/đau\".","",3],["GTD.4.18",1,26,"Trả lời các câu hỏi về các trạng thái thể chất: \"Con làm gì khi con…….?\"","Trẻ phản ứng đúng với 5 trạng thái hoặc nhiều hơn.","",3],["GTD.4.19",1,26,"Sử dụng tên các nhóm để phân loại đồ vật theo nhóm cho các đồ vật quen thuộc (3 cấp độ: tên - nhóm - lớp/loại/loài).","VD: con cá là động vật sống dưới nước.","",3],["GTD.4.20",1,26,"Mô tả các đặc điểm của đồ vật.","Trẻ có thể gọi tên 3 đặc điểm hoặc nhiều hơn của 5 đồ vật thông thường khi được hỏi \"Kể cho cô về…..\".","",3],["GTD.4.21",1,26,"Sử dụng các đại từ phản thân (tự ai đó đã làm điều gì).","Sử dụng 2 đại từ phản thân hoặc nhiều hơn, gồm: tự tôi, tự bạn, tự anh ấy, tự cô ấy, tự ai đó, tự chúng tôi, tự chúng nó, tự họ.","",3],["GTD.4.22",1,26,"Trả lời điện thoại một cách phù hợp.","Di chuyển tới chỗ điện thoại đang kêu, cầm lên và đặt vào tai, nói lời chào và nhận ra người đang gọi.","",3],["GTD.4.23",1,26,"Tham gia vào hội thoại được người lớn khởi xướng trong 2 – 3 lượt liên quan đến các chức năng khác nhau (VD: bình luận, trả lời và yêu cầu thông tin).","Trẻ duy trì hội thoại bằng cách thêm các yếu tố, hỏi câu hỏi, bình luận hoặc hỏi và duy trì chủ đề xuyên suốt 2 – 3 lượt hội thoại.","",3],["GTD.4.24",1,26,"Khởi xướng và duy trì hội thoại với chủ đề tự tạo với một người lớn.","Trẻ bắt đầu hội thoại với một người khác bằng một bình luận hoặc câu hỏi và duy trì chủ đề xuyên suốt tối thiểu 4 lượt hội thoại.","",3],["GTD.4.25",1,26,"Mô tả chuỗi các hoạt động gồm từ 2 – 3 sự kiện (VD: đi thăm bà).","Trong phản ứng lại với một câu hỏi mở - kết (VD: “Kể cho cô về chuyến thăm bà ngoại”, trẻ sẽ miêu tả 1 hoặc 3 hoạt động hoặc sự kiện bằng cách sử dụng cụm lời nói).","",3],["GTD.4.26",1,26,"Thể hiện “Con không biết”bằng cách nói kèm cử chỉ/điệu bộ.","Khi được hỏi câu hỏi mà trẻ không biết câu trả lời, trẻ phản ứng lại một cách phù hợp.","",3],["GTD.4.27",1,26,"Yêu cầu được làm rõ nếu không hiểu.","Trẻ nói “Cái gì?” hoặc phản ứng tương tự khi trẻ không nghe thấy hoặc không hiểu câu bình luận, câu hỏi, hoặc hướng dẫn dành cho trẻ.","",3],["GTD.4.28",1,26,"Tham gia vào các chủ đề khác nhau trong suốt cuộc hội thoại.","Trẻ khởi xướng và tham gia hội thoại theo các chủ đề khác nhau.","",3],["GTD.4.29",1,26,"Tự sửa lời nói của mình nếu người nghe không hiểu.","Trẻ thể hiện các kỹ năng sửa lỗi (VD: lặp lại, nói lại cụm từ, kết hợp phát âm với cử chỉ/điệu bộ, nhấn mạnh) để làm rõ ý khi đối tác không hiểu.","",3],["GTD.4.30",1,26,"Trả lời các câu hỏi về bản thân và về những người khác.","Trẻ có thể trả lời một số câu hỏi đơn giản khác nhau về bản thân và cũng có thể trả lời các câu hỏi về những người thân thuộc khác – các thành viên trong gia đình, thú cưng, bạn thân….","",3],["XH.4.1",3,27,"Mời các bạn cùng lứa chơi.","Nói hoặc dùng cử chỉ/điệu bộ với bạn cùng lứa (“Lại đây chơi tàu hỏa đi”, “Hãy chơi đuổi bắt” hoặc vẫy tay với bạn).","",3],["XH.4.2",3,27,"Sử dụng các mẫu lịch sự, kiểu như “Xin lỗi”.","Sử dụng một số mẫu lịch sự như “Không, cảm ơn”, “Cảm ơn”, “Rất hân hạnh”, “Xin lỗi” và “Rất tiếc”.","",3],["XH.4.3",3,27,"Tìm kiếm những người khác để có cảm giác an toàn, thuận tiện khi ở trong một nhóm đông.","Khi trẻ sợ, đau, hoặc thất vọng, trẻ lại gần người lớn hoặc tiếp xúc thể chất với người lớn (ôm, ngồi vào lòng, cầm tay).","",3],["XH.4.4",3,27,"Thể hiện các cảm xúc của bản thân một cách hợp lí.","Nói cảm xúc của bản thân “Tôi đang bực”.","",3],["XH.4.5",3,27,"Biết lần lượt trong khi chơi độc lập.","Lần lượt với người lớn/bạn cùng lứa khi tham gia chơi mà không cần phải xác định lượt rõ ràng.","",3],["XH.4.6",3,27,"Miêu tả một sự kiện nào đó hoặc trải nghiệm với bạn cùng lứa.","Kể lại một câu chuyện bằng lời nói cho một người bạn gồm tối thiểu là 3 chi tiết.","",3],["XH.4.7",3,27,"Xác định được điều làm bản thân cảm thấy vui vẻ, buồn bã, giận dữ hay sợ hãi.","Nói 1 hoặc nhiều VD cho mỗi khái niệm (VD: vui, buồn, điên, sợ). VD: người lớn nói “Tại sao con buồn?” và trẻ nói “Cô ấy lấy sách của con và con buồn”.","",3],["XH.4.8",3,27,"Xác định được cảm xúc của người khác dựa trên tình huống.","Trong các hoạt động đọc hoặc hội thoại, trẻ trả lời đúng khi được hỏi “Tại sao cô ấy khóc?” hoặc “Tại sao cậu bé sợ?”.","",3],["XH.4.9",3,27,"Bắt đầu phát triển các cách giải quyết khi cảm thấy thất vọng, giận dữ hay sợ hãi.","Tham gia vào một hoặc nhiều cách giải quyết. VD: yêu cầu được nghỉ giải lao, yêu cầu trợ giúp, tới ôm, lấy một đồ vật yêu thích.","",3],["NT.4.1",4,29,"Đếm thuộc lòng đến 20.","Đếm to từ 1 – 20 đúng theo thứ tự.","",3],["NT.4.2",4,29,"Đếm các đồ vật tương ứng 1:1 cho đến 10.","Chạm hoặc chỉ tay vào tranh ảnh hoặc đồ vật trong khi đếm, chạm hoặc chỉ một lần cho mỗi số.","",3],["NT.4.3",4,29,"Đưa “1”, “một vài”, “nhiều”, “một chút”, “tất cả”, “thêm” và “hầu hết”.","Cầm số đồ vật đúng cho người lớn khi được yêu cầu.","",3],["NT.4.4",4,29,"Đưa ra số lượng đến 10.","Cầm số đồ vật đúng khi người lớn yêu cầu (“Đưa cho con bánh” hoặc “Mẹ có thể được hai cái gối không?”.)","",3],["NT.4.5",4,29,"Biết các thuật ngữ về số lượng.","Phát âm 2 khái niệm hoặc nhiều hơn, gồm “1”, “vài” và “tất cả”.","",3],["NT.4.6",4,29,"Biết các thuật ngữ có liên quan đến không gian.","Phát âm 2 khái niệm hoặc nhiều hơn, gồm bên cạnh, đằng sau và đằng trước.","",3],["NT.4.7",4,29,"Hiểu và ghép được 5 – 10 từ/đồ vật có liên quan.","Ghép 5 đồ vật hoặc nhiều hơn với các từ gồm 3 – 4 chữ cái được viết ra.","",3],["NT.4.8",4,29,"Có thể đọc được một số từ.","Đọc và phát âm 10 từ có 3 – 4 chữ cái hoặc nhiều hơn về các hành động và đồ vật thông thường.","",3],["NT.4.9",4,29,"Có thể xác định được tên mình được viết cùng với 5 tên khác nhau.","Đưa, chỉ tay, cho xem hoặc nói chính tên mình trong nhóm 3 tên khác, trong đó có 1 tên có chữ cái đầu tiên giống với tên của trẻ.","",3],["NT.4.10",4,29,"“Đọc” các kí hiệu và biểu tượng.","Đề cập đến ý nghĩa của 3 kí hiệu và biểu tượng hoặc nhiều hơn. VD: kí hiệu dừng lại, đèn xanh, biểu tượng “không” nói chung.","",3],["NT.4.11",4,29,"Xác định các số và các chữ cái.","Xác định hoặc thể hiện tên của tất cả các chữ cái có trong bảng chữ cái và các số từ 0 – 30.","",3],["NT.4.12",4,29,"Đề cập sự đối lập và các điểm tương đồng.","Khi người lớn đề cập đến một khái niệm nào đó, trẻ nói tên khái niệm ngược lại. VD: Người lớn nói “Con chuột nhỏ, nhưng con voi thì….” Và trẻ nói “to”. Hoặc “Con chuột nhỏ, con chim cũng….” và trẻ nói “nhỏ”.","",3],["C.4.1",3,30,"Sử dụng mô hình để mô phỏng các hành động trong các trò chơi.","Sử dụng các mô hình để thực hiện 5 hoặc nhiều hơn các hành động trong ít nhất 3 kịch bản chơi. VD: mẹ lái xe tới cửa hàng, anh trai đuổi bắt chị gái hoặc con chó nhỏ đang ăn.","",3],["C.4.2",3,30,"Sử dụng vật thay thế để chơi những trò chơi tưởng tượng.","Sử dụng 3 vật thay thế hoặc nhiều hơn. VD: sử dụng một khối gỗ giả làm điện thoại, một ống nhỏ giả làm cái chai hoặc một hộp nhỏ giả làm ô tô.","",3],["C.4.3",3,30,"Gọi tên hành động chơi giả vờ và biết chơi giả vờ chơi.","Gọi tên 10 hành động giả vờ hoặc hơn và/hoặc giả vờ chơi ít nhất 3 hành động chơi một cách tự phát hoặc phản ứng lại với các câu hỏi.","",3],["C.4.4",3,30,"Liên hệ một cách tự phát 3 hành vi có liên quan hoặc nhiều hơn trong trò chơi chủ đề.","VD: rót nước, trộn thức ăn, đổ thức ăn vào bát, đặt vào trong mũ cứu hỏa, “lái” xe cứu hỏa, và nhảy ra khỏi lửa.","",3],["C.4.5",3,30,"Hướng đối tác vào trò chơi.","Đưa ra tối thiểu 3 chỉ dẫn phù hợp để đối tác thực hiện trong vài khía cạnh trò chơi, thực hiện qua 2 đến 3 trò chơi.","",3],["C.4.6",3,30,"Chơi theo kiểu một số các sự kiện (VD: tiệc sinh nhật, trò chơi bác sĩ), bao gồm cả phát âm.","Chơi 3 sự kiện hoặc nhiều hơn, mỗi sự kiện gồm ít nhất 3 hoạt động được gắn kết vào nhau (xem mục 4 ở trên), tương tác với người khác trong suốt hoạt động với đồ vật và khi nói.","",3],["C.4.7",3,30,"Chơi theo chủ đề của một số câu chuyện.","Chơi theo chủ đề của 3 câu chuyện hoặc nhiều hơn với đối tác bằng cách sử dụng hành động và lời nói như được mô tả trong mục trên. VD: 3 chú lợn con…","",3],["C.4.8",3,30,"Nhập vai vào nhân vật trong trò chơi đóng vai.","Đề cập đến vai trò (VD: “Con là mẹ”) và thực hiện các màn chơi cùng lời nói, hoạt động và cử chỉ/điệu bộ phù hợp với vai trò, có 3 hoặc nhiều hơn 3 hoán đổi vai với đối tác.","",3],["C.4.9",3,30,"Theo sự hướng dẫn của người khác trong trò chơi.","Làm theo 5 hoặc nhiều hơn hướng dãn bằng lời hoặc phi ngôn ngữ của đối tác bằng cách bắt chước hành động của đối tác hoặc phản ứng lại những chỉ dẫn của đối tác.","",3],["VDT.4.1",5,31,"Tô màu bức tranh một cách chính xác có sử dụng các màu khác nhau.","Trẻ tô màu chủ yếu trong hình và chọn các màu khác nhau để hoàn thành bức tranh trên giấy.","",3],["VDT.4.2",5,31,"Bắt chước vẽ hình tam giác, các chữ cái có sử dụng dụng cụ vẽ phù hợp.","Trẻ sao chép hình tròn, hình vuông, hình tam giác và một số chữ cái có thể nhận dạng được.","",3],["VDT.4.3",5,31,"Vẽ các đường thẳng, các hình và một số chữ cái, chữ số theo trí nhớ.","Trẻ tự vẽ một số hình dạng và chữ cái/con số có thể nhận dạng được.","",3],["VDT.4.4",5,31,"Bắt chước và copy các chữ cái, các số và hình dạng khác nhau.","Trẻ thực hiện cả copy và tự vẽ 4 – 5 hình dạng, 4 – 5 chữ cái và một vài con số có thể nhận dạng được.","",3],["VDT.4.5",5,31,"Viết tên mà không cần mẫu.","Tự giải thích.","",3],["VDT.4.6",5,31,"Tô theo các hình dạng và các chữ.","Tự giải thích.","",3],["VDT.4.7",5,31,"Tô màu trong những hình dạng đã được phác thảo.","Nhìn chung trẻ tô màu bên trong đường viền.","",3],["VDT.4.8",5,31,"Nối các điểm chấm bằng bút vẽ.","Trẻ có thể tô theo các dấu chấm trong chuỗi con số.","",3],["VDT.4.9",5,31,"Vẽ các đường thẳng để nối từ những bức tranh, các từ hoặc các hình dạng tương ứng.","Trẻ có thể tiếp tục ghép hoặc nối tranh ảnh của đồ vật bằng một đường thẳng (như trong sách hoạt động của bé).","",3],["VDT.4.10",5,31,"Copy những nét vẻ đơn giản khác nhau (VD: khuôn mặt, cái cây, ngôi nhà, bông hoa).","Trẻ copy 5 nét vẽ hoặc nhiều hơn và tự tao 2 – 3 bức tranh có thể nhận dạng được.","",3],["VDT.4.11",5,31,"Gập đôi giấy và cho vào phong bì.","Tự giải thích, theo mẫu.","",3],["VDT.4.12",5,31,"Cắt các góc, các đường thẳng và đường cong.","Trẻ cắt các góc và cạnh cảu các hình dạng lớn (7.5 cm hoặc lớn hơn) bằng cách tự sử dụng kéo.","",3],["VDT.4.13",5,31,"Cắt các hình dạng đơn giản.","Trẻ cắt được các hình dạng to khoảng 7.5 cm.","",3],["VDT.4.14",5,31,"Hoàn thành một tác phẩm nghệ thuật gồm 3 bước – cắt, tô màu và dán.","Khi người lớn làm mẫu hoạt động, trẻ có thể xâu chuỗi hoạt động và tự hoàn thiện, mỗi bước gồm 1 kỹ năng và trẻ có thể thực hiện được một cách tự tin.","",3],["VDT.4.15",5,31,"Sử dụng bút vẽ, con dấu, bút dầu, bút chì và tẩy để hoàn thành một hoạt động về nghệ thuật nào đó.","Trẻ sử dụng một số dụng cụ nghệ thuật để tạo bức tranh. Trẻ cũng có thể bắt chước mô hình của người lớn bằng cách sử dụng từng dụng cụ này.","",3],["VDT.4.16",5,31,"Cầm bút vẽ bằng 3 ngón tay.","Trẻ cầm một cách nhất quán bằng 3 ngón tay.","",3],["VDT.4.17",5,31,"Xây dựng bằng các vật liệu khác nhau theo thiết kế của riêng mình và copy những mẫu đơn giản từ tranh ảnh hoặc những mẫu 3D.","Trẻ thu thập các dụng cụ xây dựng để thiết kế các hình phức tạp, và cũng có thể copy các thiết kế của người khác, cả mô hình 3D lẫn tranh ảnh hoặc các hình vẽ. Trẻ có thể thể hiện 5 mô hình hoặc nhiều hơn.","",3],["VDT.4.18",5,31,"Xếp các miếng ghép ăn khớp, trên sàn hoặc trong khay với nhau.","Tự giải thích.","",3],["VDT.4.19",5,31,"Sử dụng băng keo, kẹp giấy, chìa khóa một cách phù hợp.","Tự sử dụng tất cả các công cụ.","",3],["VDTH.4.1",6,32,"Chơi bắt với bóng cùng một người bạn.","Có thể chơi bắt bóng gồm 6 lượt hoặc nhiều hơn.","",3],["VDTH.4.2",6,32,"Ném bóng tennis hoặc bóng rổ cho người khác có định hướng và theo cách giơ tay lên cao.","Tự giải thích.","",3],["VDTH.4.3",6,32,"Sử dụng tất cả các dụng cụ trong sân chơi một cách độc lập, như: sử dụng xích đu, vòng quay ngựa gỗ.","Tự giải thích, đối với tất cả các dụng cụ phù hợp độ tuổi.","",3],["VDTH.4.4",6,32,"Đá một quả bóng đang lăn.","Trẻ điều chỉnh thân người và đá được quả bóng.","",3],["VDTH.4.5",6,32,"Chơi một số trò chơi với bóng: ném bóng vào giỏ, đánh bóng chày bằng gậy, bóng nhảy, chơi golf, ném túi hạt đậu.","Chơi 5 trò hoặc nhiều hơn với bóng.","",3],["VDTH.4.6",6,32,"Đạp xe một cách tự tin; có thể kiểm soát được tốc độ, điều khiển và phanh.","Tự giải thích.","",3],["VDTH.4.7",6,32,"Chạy nhanh và nhảy.","Bắt chước cả 2 và thể hiện một cách trôi chảy.","",3],["VDTH.4.8",6,32,"Đi bộ mà không bị mất thăng bằng, đi đúng hàng, đúng lối.","Tự giải thích; đi bộ thoải mái và không quá chậm.","",3],["VDTH.4.9",6,32,"Chơi những trò chơi vận động điển hình (VD: “đèn đỏ, đèn xanh”…).","Chơi 5 trò hoặc nhiều hơn – biết luật chơi và tham gia tích cực suốt trò chơi mà không cần nhắc nhở hoặc kèm cặp.","",3],["TL.4.1",7,45,"Kiểm soát tất cả các bước bao gồm tự đi vệ sinh theo như mức độ phù hợp với lứa tuổi.","Sử dụng bô khi cần (mặc dù người lớn có thể nhắc đường tới phòng vệ sinh), tự kéo quần/đồ lót lên và xuống, xả nước và rửa tay.","",3],["TL.4.2",7,45,"Đi vệ sinh khi có nhu cầu.","Tự đi vệ sinh khi cần (không cần người lớn nhắc).","",3],["TL.4.3",7,45,"Tự rửa tay theo như mức độ phù hợp với lứa tuổi.","Trẻ vặn vòi nước, để tay dưới vòi nước, sử dụng xà phòng, xoa xà phòng vsof hai tay, rửa sạch xà phòng, tắt nước và lau khô tay bằng khăn.","",3],["TL.4.4",7,45,"Tự rửa mặt bằng khăn.","Trong khi rửa, trẻ làm ướt khăn, sử dụng xà phòng (sữa rửa mặt) và lau mặt bằng khăn.","",3],["TL.4.5",7,45,"Tự chải đầu bằng lược.","Khi người lớn bảo trẻ chải đầu, trẻ lấy lược và chải. Có thể có những ngoại lệ khó đối với mái tóc dài hoặc xoăn.","",3],["TL.4.6",7,45,"Phối hợp tích cực khi tắm và lau khô người sau khi tắm.","Xoa người bằng khăn, sử dụng xà phòng và xoa khắp cơ thể . Tự lau khô, có thể cần nhắc bằng hành động.","",3],["TL.4.7",7,45,"Tự thực hiện tất cả các bước đánh răng, mặc dù không kĩ lưỡng như người lớn.","Từ khi trẻ vào phòng tắm cho đến khi bàn chải và kem đánh răng được đặt lại vào chỗ thích hợp, trẻ có thể tự thực hiện được tất cả các bước.","",3],["TL.4.8",7,45,"Tự mặc quần áo một cách nhanh chóng – cài cúc, kéo khóa.","Tự cài nút, mặc quần, kéo khóa một cách nhanh chóng.","",3],["TL.4.9",7,45,"Tự xì mũi, dùng khăn giấy để xì mũi, dùng tay che khi ho hay xì mũi.","Khi người lớn nói “xì mũi”, trẻ lấy khăn giấy và xì mũi ra. Khi trẻ hắt hơi có lấy tay che miệng.","",3],["TL.4.10",7,45,"Dừng lại khi ra đến đường; nhìn cả hai phía trước khi qua đường.","Khi đến lề đường cùng một người nào đó, trẻ tự động dừng lại, chờ đợi, nhìn và chờ cho người kia thể hiện là trẻ có thể qua đường.","",3],["TL.4.11",7,45,"Đi bên cạnh người lớn một cách an toàn tới điểm đỗ xe, nhà hàng…","Trẻ đi bộ không cần cầm tay và đi sát người lớn, kiểm soát được vị trí và duy trì khoảng cách của chính bản thân.","",3],["TL.4.12",7,45,"Trợ giúp dọn bàn.","Trẻ có thể tự đặt đĩa, cốc, khăn ăn và các đồ dùng khác vào đúng chỗ và ngăn nắp. người lớn có thể cần đánh dấu nơi cần đặt và cung cấp dụng cụ cho trẻ trên bàn.","",3],["TL.4.13",7,45,"Dùng dao để phết lên thức ăn.","Trẻ có thể quét mứt/bơ lên bánh mì mà không cần xé bánh mì ra.","",3],["TL.4.14",7,45,"Lau những chỗ bị đổ nước.","Trẻ tự khởi xướng lau chỗ nước bị đổ trên bàn.","",3],["TL.4.15",7,45,"Rót đồ uống vào những vật chứa nhỏ hơn.","Trẻ có thể tự rót chất lỏng từ bình đựng vào cốc nhỏ hơn một cách gọn gàng.","",3],["TL.4.16",7,45,"Đặt chén đĩa vào bồn hoặc máy rửa chén bát.","Sau bữa ăn, trẻ tự lau dọn và đặt dụng cụ vào đúng chỗ.","",3],["TL.4.17",7,45,"Tiến hành bữa ăn phụ gồm 2 bước.","Lấy ra 2 thứ khác nhau từ hộp bỏ ra đĩa, đặt lên bàn. VD: dọn nộm rau, bơ và bánh, kem bơ để quét lên bánh, hỗ hợp ngũ cốc và sữa.","",3],["TL.4.18",7,45,"Hỗ trợ các hoạt động nấu ăn, khuấy, đổ….","Trẻ thực hiện một số trong các bước nấu ăn như làm b /* --- Học phí và bảng tính chấm công học sinh --- */
const fee11=k=>k.f11||DB.cfg.p11;

function sched(k,m){const out=[],ls=DB.lich.filter(l=>l.hs===k.id);
 for(const d of mDates(m)){const w=dow(d);if(!w)continue;
  ls.forEach(l=>{if((l.type==='11'&&l.day===w)||(l.type==='bu'&&l.date===d))out.push({d,sid:l.id,kind:l.type,slot:l.slot})});
  if(k.gr&&w<=5)out.push({d,sid:k.gr,kind:'bt',slot:'07:30'})}
 return out}
function invoice(k,m){if(k.st!=='dang'||k.sd.slice(0,7)>m)return 0;return sched(k,m).filter(x=>x.kind==='11').length*fee11(k)+(k.bt?DB.cfg.pbtCN+DB.cfg.pbtKhac:0)}
const makeupFor=(h,d,s)=>DB.mk.find(r=>r.hs===h&&r.from.d===d&&r.from.sid===s&&(r.s==='xn'||r.s==='xong'));
const CL={cm:'x',p:'P',kp:'K',tt:'N',bv:'V'};
function feeOf(k,kind,d,sid,code,m){
 const R=DB.cfg.rule,f=fee11(k),bd=btDays(m)||1,dCN=DB.cfg.pbtCN/bd,dAll=(DB.cfg.pbtCN+DB.cfg.pbtKhac)/bd;
 let rf=0,ls=0,note='';
 if(kind==='11'){const mk=makeupFor(k.id,d,sid);
  if(code==='p'){if(mk)note='Đã thỏa thuận học bù nên không tính phí nghỉ';else{rf=f*(100-R.pLoss)/100;ls=f*R.pLoss/100;note='Có phép: mất '+R.pLoss+'% phí buổi, hoàn '+(100-R.pLoss)+'% trừ vào học phí tháng sau'}}
  else if(code==='kp'){if(mk)note='Đã thỏa thuận học bù nên không tính phí nghỉ';else{ls=f;note='Không phép: mất 100% phí buổi'}}
  else if(code==='tt'){if(mk)note='Trung tâm hoặc giáo viên nghỉ, hai bên đã thỏa thuận học bù';else{rf=f*R.ttRefund/100;note='Trung tâm hoặc giáo viên nghỉ, không học bù: hoàn '+R.ttRefund+'% phí buổi'}}}
 else{
  if(code==='p'){rf=dCN;ls=dAll-dCN;note='Báo trước 1 ngày hoặc trước 7g sáng: hoàn phí can thiệp cá nhân, không hoàn chi phí khác'}
  else if(code==='kp'){ls=dAll;note='Báo muộn hoặc không báo: không hoàn phí'}
  else if(code==='bv'){rf=dAll*R.bvRefund/100;note='Nhập viện có giấy: hoàn '+R.bvRefund+'% phí của ngày nhập viện'}
  else if(code==='tt'){note='Trung tâm cho nghỉ (thiên tai, dịch bệnh...): xếp học bù, không tính phí nghỉ'}}
 return{rf:Math.round(rf),ls:Math.round(ls),note}}
function settle(k,m){
 const r={k:k.id,m,rows:[],cells:{},plan:0,planBt:0,cm:0,p:0,kp:0,tt:0,bv:0,bu:0,none:0,lost:0,refund:0,stop:k.st==='nghi'};
 const put=(d,c)=>{const a=r.cells[d]=r.cells[d]||[];if(!a.includes(c))a.push(c)};
 for(const x of sched(k,m)){
  const code=DB.att[x.d+'|'+x.sid+'|'+k.id]||'';
  if(x.kind==='bu'){if(code==='cm'){r.bu++;put(x.d,'B')}else if(x.d<WD)put(x.d,'?');continue}
  if(x.kind==='11')r.plan++;else r.planBt++;
  if(!code){if(x.d<WD){r.none++;put(x.d,'?')}continue}
  put(x.d,CL[code]);r[code]++;
  if(code==='cm')continue;
  const o=feeOf(k,x.kind,x.d,x.sid,code,m);
  r.rows.push({d:x.d,kind:x.kind,slot:x.slot,code,note:o.note,rf:o.rf,ls:o.ls});
  r.refund+=o.rf;r.lost+=o.ls}
 if(r.stop){r.refund=0;r.rows.forEach(x=>{x.rf=0;x.note+=' (bé đã ngưng can thiệp: không hoàn)'})}
 r.refund=Math.round(r.refund);r.lost=Math.round(r.lost);return r}
function postSettle(k,m){const key=k.id+'|'+m,old=DB.set[key],r=settle(k,m);
 if(old)DB.lg=DB.lg.filter(x=>x.id!==old.ref);
 if(r.refund>0){const nm=sm(m,1),e={id:uid(),hs:k.id,date:nm+'-01',kind:'hoan',amt:r.refund,m:nm,note:'Hoàn phí nghỉ '+mLow(m)+', trừ vào học phí tháng sau',src:key};DB.lg.push(e);DB.set[key]={ref:e.id,amt:e.amt,at:TODAY}}
 else delete DB.set[key]}

 if(DB.groups.some(g=>(g.gv===x.gv||g.tg===x.gv)&&w>=1&&w<=5))return 'Giáo viên đang phụ trách lớp bán trú vào ngày này';

 rs.forEach(r=>{const k=key(r.d),o=st[k]=st[k]||{k,c:{I:0,TD:0,GP:0,MP:0,PP:0,FP:0},t:0};o.c[r.sup]++;o.t++});

 return{from,to,ss:ss.length,recs:rs.length,goals,doms,weeks,stack,unit,dat,

 <div class="pl-r">${lr?`${supTag(lr.sup)} <b>${trPct(lr.tr)}%</b><span class="spk" aria-hidden="true">${spark}</span><span class="sm mu">${m.cnt} buổi</span>`:'<span class="sm mu">Chưa có số liệu</span>'}</div>

 if(done.length)h+=`<h3 style="margin-top:12px">Đã đạt <span class="mu sm">· ${done.length} mục tiêu</span></h3>`+done.sort((a,b)=>(b.dt||'')<(a.dt||'')?-1:1).map(planRow).join('');

 const m={t:'se',id:'',k:o.k,date:o.date,by:isGV()?U.id:(kidGV(k)||U.id),dom:[],it:[],note:'',home:'',back};

 return`<div class="card"><h2>${esc(g.n)} <span class="mu sm">· ${ks.length} trẻ</span></h2><div class="f2">${sel('gv',g.gv,'Giáo viên chính')}${sel('tg',g.tg,'Trợ giảng')}</div>
 <details style="margin-top:10px"><summary class="sm" style="cursor:pointer">Danh sách trẻ và chuyển nhóm</summary>${ks.map(k=>`<div class="rw"><span>${esc(k.n)} <span class="mu sm">${age(k.dob)}</span></span><select data-c="pcmvg" data-k="${k.id}" aria-label="Chuyển nhóm cho ${esc(k.n)}" style="width:auto">${opts(DB.groups.map(x=>[x.id,x.n]),k.gr)}</select></div>`).join('')||'<p class="empty">Nhóm chưa có trẻ.</p>'}</details></div>`}).join('')+`</div><p class="note sm">Giáo viên bán trú phải rảnh từ thứ Hai đến thứ Sáu, nên chỉ những giáo viên không có buổi 1-1 cố định các ngày này mới được chọn.</p>`}

 if(v!==g[role]&&DB.groups.some(x=>x.id!==id&&(x.gv===v||x.tg===v))){toast('Người này đã phụ trách nhóm bán trú khác');return}

function lhWeek(h){const mon=h.wk,days=[0,1,2,3,4,5].map(i=>addD(mon,i));
 const ctl=isGV()?'':`<div class="f2" style="margin-bottom:12px"><div><label for="lhm">Xem theo</label><select id="lhm" data-c="lhmode">${opts([['gv','Giáo viên'],['room','Phòng'],['kid','Từng bé'],['all','Tổng hợp số buổi']],h.mode)}</select></div>
 ${h.mode==='gv'?`<div><label for="lhg">Giáo viên</label><select id="lhg" data-c="lhgv">${opts(pool11().map(s=>[s.id,s.n]),h.gv)}</select></div>`:h.mode==='room'?`<div><label for="lhr">Phòng</label><select id="lhr" data-c="lhroom">${opts(ROOMS.map(r=>[r,r]),h.room)}</select></div>`:h.mode==='kid'?`<div><label for="lhk">Bé</label><select id="lhk" data-c="lhkid">${opts(DB.kids.filter(k=>k.st==='dang'&&wk11(k.id)).map(k=>[k.id,k.n]),h.kid)}</select></div>`:''}</div>`;
 const gr=h.mode==='gv'&&DB.groups.find(g=>g.gv===h.gv||g.tg===h.gv);
 const rows=SLOTS.map(s=>`<tr><th class="nw">${slotLb(s)}</th>${days.map((d,i)=>lhCell(h,d,i+1,s)).join('')}</tr>`).join('');
 return`<div class="card">${ctl}<div class="acts" style="justify-content:space-between;margin-bottom:10px"><div class="acts"><button class="btn s" data-a="lhwk" data-v="-7">Tuần trước</button><button class="btn s" data-a="lhwk" data-v="0">Tuần này</button><button class="btn s" data-a="lhwk" data-v="7">Tuần sau</button></div><b>${vd(days[0])} đến ${vd(days[5])}</b></div>
 ${gr?`<p class="note sm" style="margin-bottom:10px">${esc(sn(h.gv))} phụ trách ${esc(gr.n)} (${gr.gv===h.gv?'giáo viên chính':'trợ giảng'}) từ thứ Hai đến thứ Sáu nên không có ca 1-1 các ngày này.</p>`:''}
 <div class="tw"><table class="wkt"><thead><tr><th></th>${days.map(d=>`<th>${DAYN[dow(d)]}<br><span class="mu">${vdm(d)}</span></th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
 <p class="sm mu" style="margin-top:8px">Ô vàng là buổi học bù, ô đỏ nhạt là buổi nghỉ. ${isLead()&&h.mode==='gv'?'Bấm dấu cộng để thêm buổi cố định cho giáo viên đang chọn.':''}</p></div>`}
function lhCell(h,d,w,s){const ls=lichAt(w,s,d);
 if(h.mode==='all')return`<td class="cell"><span class="tag ${ls.length>=ROOMS.length?'er':ls.length?'in':'gy'}">${ls.length}/${ROOMS.length}</span></td>`;
 const mine=ls.filter(l=>h.mode==='gv'?l.gv===h.gv:h.mode==='room'?l.room===h.room:l.hs===h.kid),off=h.mode==='gv'&&onLeave(h.gv,d);
 const it=l=>{const k=kidBy(l.hs),c=DB.att[d+'|'+l.id+'|'+l.hs],sub=h.mode==='gv'?l.room:h.mode==='room'?given(sn(l.gv)):given(sn(l.gv))+' · '+l.room;
  return`<button class="ls ${l.type==='bu'?'bu':''} ${c&&c!=='cm'?'x':''}" data-a="lsopen" data-v="${l.id}|${d}">${esc(h.mode==='kid'?'Buổi 1-1':given(k?k.n:'?'))}<small>${esc(sub)}${l.type==='bu'?' · bù':''}${c&&c!=='cm'?' · '+AC[c]:''}</small></button>`};
 const add=isLead()&&h.mode==='gv'&&!off&&!mine.length&&!isGrStaff(h.gv)&&w>=1?`<button class="ls add" data-a="lsadd" data-v="${w}|${s}" aria-label="Thêm buổi">+</button>`:'';
 return`<td class="cell ${off?'off':''}">${off?'<span class="sm mu">Nghỉ phép</span>':mine.map(it).join('')+add}</td>`}

 <div class="acts" style="justify-content:space-between"><span>${l?`<button class="btn no" type="button" data-a="lsdel" data-v="${l.id}">Xóa buổi này</button>`:''}</span><span class="acts"><button class="btn" type="button" data-a="mx">Hủy</button><button class="btn p" type="submit">Lưu</button></span></div></form>`)};

FORM.tpf=f=>{const v={t:f.elements.t.value.trim(),h:f.elements.h.value.trim()};if(!v.t)return false;if(S.modal.id)Object.assign(DB.tpl.find(x=>x.k===S.modal.id),v);else DB.tpl.push(Object.assign({k:'x'+uid()},v));S.modal=null;toast('Đã lưu mẫu')};

/* ===== 12. Quản lý tài liệu và video ===== */
const MAXUP=20*1024*1024,DCAT=['Giáo án','Biểu mẫu','Hồ sơ trẻ','Hướng dẫn phụ huynh','Khác'];
const mb=n=>(n/1048576).toFixed(1)+' MB';
const canUpload=()=>!!(CAP.as&&CAP.db)&&(isLead()||isGV());
const me=()=>CAP.uid||(U&&U.id);
const atD=at=>at?iso(new Date(at)):'';
const vidsOf=k=>SH.videos.filter(v=>(!k||v.k===k)&&canKid(v.k)&&(!isPH()||v.sh));
const docsOf=k=>SH.docs.filter(d=>{if(k&&d.k!==k)return false;if(isLead())return true;if(isPH())return(d.aud==='ph'||d.aud==='all')&&(!d.k||canKid(d.k));return d.by===me()||d.aud!=='ph'||canKid(d.k)});
const upNote=()=>`<p class="note sm" style="margin-bottom:12px">${!CAP.db||!CAP.as?'Tải lên chưa khả dụng ở chế độ xem này. Cần mở trang bằng tài khoản có quyền chỉnh sửa hoặc đóng góp để tải video và tài liệu.':!SH.ready?'Đang tải danh sách...':'Video và tài liệu được lưu trong kho riêng của trang này. Mỗi tệp tối đa 20 MB; video nên quay ngắn, định dạng MP4 hoặc WebM.'}</p>`;
VIEWS.td=()=>{const t=S.td=Object.assign({tab:'vid',k:'',q:''},S.td);
 return head(isGV()?'Tài liệu và video':'Quản lý tài liệu','Video buổi can thiệp, giáo án, biểu mẫu và hồ sơ',canUpload()?(t.tab==='vid'?'<button class="btn p" data-a="upvid" data-v="">Tải video lên</button>':'<button class="btn p" data-a="updoc" data-v="">Tải tài liệu lên</button>'):'')
 +tabsH([['vid','Video buổi can thiệp'],['doc','Tài liệu']],t.tab,'tdtab')+upNote()
 +`<div class="card"><div class="f2" style="margin-bottom:12px"><div><label for="tdk">Lọc theo bé</label><select id="tdk" data-c="tdk"><option value="">Tất cả</option>${opts(myKids().filter(k=>k.st==='dang').map(k=>[k.id,k.n]),t.k)}</select></div><div><label for="tdq">Tìm theo tiêu đề</label><input id="tdq" data-i="tdq" value="${esc(t.q)}"></div></div>${t.tab==='vid'?vidGrid(t.k,t.q):docTable(t.k,t.q)}</div>`};
ACT.tdtab=v=>{S.td.tab=v};CHG.tdk=v=>{S.td.k=v};INP.tdq=v=>{S.td.q=v};
const vidCard=v=>`<div class="card" style="margin:0"><video controls preload="metadata" src="${esc(v.u)}" style="width:100%;max-height:300px;background:#000;border-radius:10px"></video><div style="margin-top:8px"><b>${esc(v.t)}</b><div class="sm mu">${esc(kn(v.k))} · ${vd(v.d)} · ${esc(v.bn||'')}</div>${v.n?`<p class="sm" style="margin-top:4px">${esc(v.n)}</p>`:''}<div class="acts" style="margin-top:6px">${isPH()?'':tg(v.sh?'Đã chia sẻ phụ huynh':'Chỉ nội bộ',v.sh?'ok':'gy')}${isPH()||!(isLead()||v.by===me())?'':`<button class="btn s no" data-a="tddel" data-v="videos|${v.id}">Xóa</button>`}</div></div></div>`;
function vidGrid(k,q){const vs=vidsOf(k).filter(v=>!q||v.t.toLowerCase().includes(q.toLowerCase()));
 return vs.length?`<div class="two">${vs.map(vidCard).join('')}</div>`:`<p class="empty">${SH.ready?'Chưa có video nào.':'Đang tải...'}</p>`}
function docTable(k,q){const ds=docsOf(k).filter(d=>!q||d.t.toLowerCase().includes(q.toLowerCase()));
 return tbl(['Tiêu đề','Loại','Bé','Đối tượng','Người tải','Ngày',''],ds.map(d=>`<tr><td><a href="${esc(d.u)}" target="_blank" rel="noopener"><b>${esc(d.t)}</b></a><div class="sm mu">${mb(d.sz||0)}</div></td><td>${esc(d.cat)}</td><td>${d.k?esc(kn(d.k)):'–'}</td><td>${d.aud==='nb'?'Nội bộ':d.aud==='ph'?'Phụ huynh':'Mọi người'}</td><td>${esc(d.bn||'')}</td><td class="nw">${vd(atD(d.at))}</td><td class="nw">${isPH()||!(isLead()||d.by===me())?'':`<button class="btn s no" data-a="tddel" data-v="docs|${d.id}">Xóa</button>`}</td></tr>`).join(''),SH.ready?'Chưa có tài liệu nào.':'Đang tải...')}
const vidList=k=>`<div class="acts" style="margin-bottom:10px">${canUpload()&&!isPH()?`<button class="btn p" data-a="upvid" data-v="${k}">Tải video lên</button>`:''}</div>`+(vidsOf(k).length?`<div class="two">${vidsOf(k).map(vidCard).join('')}</div>`:'<p class="empty">Chưa có video nào của bé.</p>');
const docList=k=>`<div class="acts" style="margin-bottom:10px">${canUpload()&&!isPH()?`<button class="btn p" data-a="updoc" data-v="${k}">Tải tài liệu lên</button>`:''}</div>`+docTable(k,'');
/* --- tải lên --- */
ACT.upvid=v=>{if(!canUpload())return false;S.up={busy:false,err:''};S.modal={t:'upv',k:v||''}};
ACT.updoc=v=>{if(!canUpload())return false;S.up={busy:false,err:''};S.modal={t:'upd',k:v||''}};
const upBtn=l=>`<button class="btn p" type="submit" ${S.up&&S.up.busy?'disabled':''}>${S.up&&S.up.busy?'Đang tải lên...':l}</button>`;
MODALS.upv=()=>{const ks=myKids().filter(k=>k.st==='dang');
 return mdl('Tải video buổi can thiệp',`<form id="upvf" class="f"><div class="f2"><div><label for="uv-k">Bé</label><select id="uv-k" name="k" required>${opts(ks.map(k=>[k.id,k.n]),S.modal.k)}</select></div><div><label for="uv-d">Ngày quay</label><input id="uv-d" name="d" type="date" value="${WD}" max="${TODAY}" required></div></div><div><label for="uv-t">Tiêu đề</label><input id="uv-t" name="t" required placeholder="Ví dụ: Luyện gọi tên đồ vật"></div><div><label for="uv-n">Ghi chú cho phụ huynh</label><input id="uv-n" name="n"></div><div><label for="uv-f">Tệp video (MP4 hoặc WebM, tối đa 20 MB)</label><input id="uv-f" name="f" type="file" accept="video/mp4,video/webm" required></div>
 <label class="chk"><input type="checkbox" name="sh" checked> Chia sẻ cho phụ huynh của bé</label><div class="err" role="alert">${esc(S.up.err)}</div><div class="acts" style="justify-content:flex-end"><button class="btn" type="button" data-a="mx">Hủy</button>${upBtn('Tải lên')}</div></form>`)};
MODALS.upd=()=>{const ks=myKids().filter(k=>k.st==='dang');
 return mdl('Tải tài liệu lên',`<form id="updf" class="f"><div><label for="ud-t">Tiêu đề</label><input id="ud-t" name="t" required></div><div class="f2"><div><label for="ud-c">Loại</label><select id="ud-c" name="cat">${opts(DCAT.map(x=>[x,x]),'')}</select></div><div><label for="ud-k">Gắn với bé (không bắt buộc)</label><select id="ud-k" name="k"><option value="">Không gắn</option>${opts(ks.map(k=>[k.id,k.n]),S.modal.k)}</select></div><div><label for="ud-a">Ai xem được</label><select id="ud-a" name="aud">${opts([['nb','Chỉ nhân viên'],['ph','Phụ huynh của bé'],['all','Mọi người']],'nb')}</select></div></div><div><label for="ud-f">Tệp (PDF, ảnh, CSV, văn bản; tối đa 20 MB)</label><input id="ud-f" name="f" type="file" accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.csv,.txt,.md,.json,application/pdf,image/*,text/*" required></div><p class="sm mu">Tệp Word và Excel chưa tải lên được; hãy lưu thành PDF hoặc CSV trước.</p><div class="err" role="alert">${esc(S.up.err)}</div><div class="acts" style="justify-content:flex-end"><button class="btn" type="button" data-a="mx">Hủy</button>${upBtn('Tải lên')}</div></form>`)};
function doUpload(f,col,pick){const e=f.elements,file=e.f.files[0];
 if(!file){S.up.err='Hãy chọn một tệp';return}
 if(file.size>MAXUP){S.up.err='Tệp lớn hơn 20 MB. Hãy cắt ngắn hoặc nén video rồi tải lại.';return}
 S.up={busy:true,err:''};BUSY++;
 (async()=>{try{const a=await CAP.as.upload(file);
   await CAP.db.collection(col).doc(uid()).set(Object.assign(pick(e),{by:me(),bn:U.name,a:a.id,u:a.url,ct:a.contentType||file.type,sz:a.sizeBytes||file.size,at:Date.now()}));
   S.modal=null;toast('Đã tải lên')}
  catch(x){S.up.err='Chưa tải lên được'+(x&&x.message?': '+x.message:'')+'. Có thể tài khoản này chưa có quyền tải.'}
  finally{S.up.busy=false;BUSY--;render()}})()}
FORM.upvf=f=>{doUpload(f,'videos',e=>({k:e.k.value,t:e.t.value.trim(),n:e.n.value.trim(),d:e.d.value,sh:e.sh.checked?1:0}))};
FORM.updf=f=>{doUpload(f,'docs',e=>({k:e.k.value,t:e.t.value.trim(),cat:e.cat.value,aud:e.aud.value}))};
ACT.tddel=v=>{const [col,id]=v.split('|'),item=(col==='videos'?SH.videos:SH.docs).find(x=>x.id===id);if(!item||!CAP.db)return false;
 ask('Xóa “'+item.t+'”? Tệp sẽ không xem được nữa.',async()=>{try{await CAP.db.collection(col).doc(id).delete();try{if(CAP.as&&item.a)await CAP.as.delete(item.a)}catch(x){}toast('Đã xóa')}catch(x){toast('Chưa xóa được, bạn có thể không có quyền')}render()},'Xóa')};
/* ===== 13. Cổng phụ huynh ===== */
VIEWS.cp=()=>isPH()?cpParent():cpLead();
ACT.cpkid=v=>{S.cp.kid=v};ACT.cptab=v=>{S.cp.tab=v};ACT.cpm=v=>{S.cp.m=sm(S.cp.m,+v)};
function upcoming(k,n){const out=[];for(let i=0;i<10&&out.length<n;i++){const d=addD(TODAY,i);if(!isW(d))continue;sched(k,d.slice(0,7)).filter(x=>x.d===d).forEach(x=>out.push(x))}return out}
function cpParent(){const ks=myKids();
 if(!ks.length)return head('Cổng phụ huynh','')+'<div class="card"><p class="empty">Tài khoản này chưa gắn với bé nào. Hãy liên hệ Trung tâm.</p></div>';
 const c=S.cp=Object.assign({tab:'tq',kid:ks[0].id,m:WD.slice(0,7)},S.cp);if(!ks.some(k=>k.id===c.kid))c.kid=ks[0].id;const k=kidBy(c.kid);
 return head('Xin chào, '+esc(given(U.name)),'Thông tin học tập của bé trong '+esc(DB.cfg.name))+(ks.length>1?tabsH(ks.map(x=>[x.id,given(x.n)]),c.kid,'cpkid'):'')
 +`<div class="card" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><span class="av" style="width:52px;height:52px;font-size:22px" aria-hidden="true">${esc(given(k.n).split(' ').pop().charAt(0))}</span><div><h2 style="margin:0">${esc(k.n)}</h2><p class="mu sm">${age(k.dob)} · ${esc(progOf(k))} · Giáo viên ${esc(mainGV(k))}</p></div></div>`
 +tabsH([['tq','Tổng quan'],['tb','Tiến bộ của bé'],['ch','Chuyên cần và học phí'],['bc','Báo cáo'],['vd','Video và tài liệu']],c.tab,'cptab')+(c.tab==='tq'?cpHome(k):c.tab==='tb'?progView(k,{parent:true}):c.tab==='ch'?cpMonth(k):c.tab==='bc'?cpReports(k):vidList(k.id)+'<h2 style="margin-top:18px">Tài liệu</h2>'+docList(k.id))}
function cpHome(k){const up=upcoming(k,6),last=DB.sess.filter(s=>s.k===k.id&&s.note).sort((a,b)=>a.date<b.date?1:-1)[0],b=balance(k.id);
 return`<div class="grid">${kpi('Học phí',b>0?fmt(b):b<0?fmt(-b):'Đủ',b>0?'còn phải đóng':b<0?'dư có, trừ vào tháng sau':'đã đóng đủ',b>0?'er':'ok')}${kpi('Thông báo mới',unread(),'chưa đọc')}${kpi('Báo cáo đã nhận',DB.rp.filter(r=>r.hs===k.id&&r.s==='gui').length,'từ giáo viên')}</div>`
 +`<div class="two"><div class="card"><h2>Lịch học sắp tới</h2>${up.length?up.map(x=>`<div class="rw"><span><b>${DAYS[dow(x.d)]} ${vdm(x.d)}</b> · ${x.kind==='bt'?'Bán trú '+esc((grBy(x.sid)||{}).n||''):x.kind==='bu'?'Học bù '+slotLb(x.slot):'Can thiệp 1-1 '+slotLb(x.slot)}</span></div>`).join(''):'<p class="empty">Chưa có lịch trong 10 ngày tới.</p>'}<div class="acts" style="margin-top:10px"><button class="btn s" data-a="nav" data-v="hb">Đăng ký học bù</button></div></div>
 <div class="card"><h2>Nhận xét buổi gần nhất</h2>${last?`<p class="mu sm">${vd(last.date)}</p><p>${esc(last.note)}</p>`:'<p class="empty">Chưa có nhận xét.</p>'}</div></div>`
 +`<div class="card"><h2>Tiến bộ của bé</h2>${progMini(k)}</div>`}
function cpMonth(k){const c=S.cp,m=c.m,r=settle(k,m),ds=mDates(m),lead=(dow(ds[0])+6)%7,billedM=billed(k.id,m),nm=sm(m,1);
 const cells=Array.from({length:lead},()=>'<div style="border:0"></div>').concat(ds.map(d=>`<div class="${dow(d)===0?'sun':''}"><b>${pd(d).getDate()}</b><div>${(r.cells[d]||[]).map(x=>`<i class="sc sc-${symCls(x)}">${x}</i>`).join('')}</div></div>`)).join('');
 return`<div class="card"><div class="top"><h2>${mLabel(m)}</h2><div class="acts"><button class="btn s" data-a="cpm" data-v="-1">Tháng trước</button><button class="btn s" data-a="cpm" data-v="1" ${m>=CM?'disabled':''}>Tháng sau</button></div></div>
 <div class="legend">${Object.entries(SYM).map(([x,l])=>`<span><i class="sc sc-${symCls(x)}">${x}</i> ${l}</span>`).join('')}</div>
 <div class="cal" role="img" aria-label="Lịch điểm danh ${mLabel(m)}">${['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<span class="sm mu" style="text-align:center">${x}</span>`).join('')}${cells}</div>
 <div class="grid" style="margin-top:14px">${kpi('Có mặt',r.cm+r.bu,'trong tháng','ok')}${kpi('Nghỉ',r.p+r.kp+r.tt+r.bv,'P '+r.p+', KP '+r.kp+', TT/GV '+r.tt+', viện '+r.bv)}${kpi('Học phí tháng',fmt(billedM),'')}${kpi('Hoàn trừ tháng sau',fmt(r.refund),'phí mất '+fmt(r.lost),'ok')}</div></div>`
 +`<div class="card"><h2>Các buổi nghỉ và cách tính</h2>`+tbl(['Ngày','Loại','Trạng thái','Cách tính','>Mất (₫)','>Hoàn (₫)'],r.rows.sort((a,b)=>a.d<b.d?-1:1).map(x=>`<tr><td class="nw">${DAYS[dow(x.d)]} ${vdm(x.d)}</td><td>${x.kind==='11'?'1-1':'Bán trú'}</td><td>${tg(AC[x.code],x.code==='kp'?'er':x.code==='p'?'wa':'gy')}</td><td>${esc(x.note)}</td><td class="r nw">${fnum(x.ls)}</td><td class="r nw">${fnum(x.rf)}</td></tr>`).join(''),'Bé không có buổi nghỉ nào trong tháng.')
 +`<p class="sm mu" style="margin-top:8px">Khoản hoàn được trừ vào học phí ${mLow(nm)}. Nếu bé nghỉ, vui lòng báo trong nhóm chung trước 7g sáng hôm đó (ca chiều và tối: trước 12g); xem quy định đầy đủ bên dưới.</p><details style="margin-top:8px"><summary class="sm" style="cursor:pointer"><b>Quy định học phí và hoàn phí</b></summary>${k.m11||wk11(k.id)?policyH('m11'):''}${k.bt?policyH('bt'):''}</details></div>`}
function cpReports(k){const rs=DB.rp.filter(r=>r.hs===k.id&&r.s==='gui').sort((a,b)=>a.per<b.per?1:-1);

 const lv=bands?BANDS.map((b,i)=>({n:b.n,s:b.s,c:'var(--b'+(i+1)+')',t:'var(--bt'+(i+1)+')',h:b.s.map(x=>SUP[x].p).join(', ')})):SUPK.map((s,i)=>({n:SUP[s].n,s:[s],c:'var(--o'+(i+1)+')',t:'var(--ot'+(i+1)+')',h:SUP[s].h}));
 const rows=P.stack.map(r=>{const lab=P.unit==='m'?moLab(r.k):'Tuần '+wkLab(r.k);
  return`<div class="sk-r"><div class="sk-l">${esc(lab)}<small>${r.t} lượt</small></div><div class="sk-b" role="img" aria-label="${esc(lab)}: ${lv.map(L=>{const c=L.s.reduce((a,s)=>a+r.c[s],0);return L.n+' '+r0(c*100/r.t)+'%'}).join(', ')}">${lv.map(L=>{const c=L.s.reduce((a,s)=>a+r.c[s],0),p=c*100/r.t;return c?`<i class="sk-s" tabindex="0" style="flex:${c} 1 0%;background:${L.c};color:${L.t}" data-tip="${esc(lab+' · '+L.n+': '+r0(p)+'% ('+c+' lượt)')}">${p>=14?r0(p)+'%':''}</i>`:''}).join('')}</div></div>`}).join('');
 return`<div class="sk">${rows}</div><div class="lgd">${lv.map(L=>`<span title="${esc(L.h)}"><i class="sw" style="background:${L.c}"></i>${esc(L.n)}</span>`).join('')}</div><p class="sm mu" style="margin-top:6px">Mỗi thanh là 100% lượt luyện của ${P.unit==='m'?'tháng':'tuần'}. Thanh càng nhiều màu đậm bên trái, bé càng cần ít hỗ trợ.</p>`}

/* --- biểu đồ 3: xu hướng theo tuần --- */
function chTrend(P,pdf){const w=P.weeks,n=w.length;if(n<2)return'<p class="mu sm">Cần số liệu của ít nhất 2 tuần để vẽ xu hướng.</p>';
 const X=i=>4+92*i/(n-1),Y=v=>100-v,pts=w.map((p,i)=>[+X(i).toFixed(2),Y(p.sc)]),line='M'+pts.map(p=>p[0]+' '+p[1]).join('L'),area=line+`L${pts[n-1][0]} 100L${pts[0][0]} 100Z`;
 const step=Math.ceil(n/6),col=pdf?PDFC.c1:'var(--c1)',sty=a=>pdf?a:'',attr=(f,s)=>pdf?`fill="${f}" stroke="${s}"`:`style="fill:${f};stroke:${s}"`;
 return`<div class="tr" role="img" aria-label="Chỉ số tự làm theo tuần, từ ${w[0].sc} điểm ở tuần ${wkLab(w[0].w)} đến ${w[n-1].sc} điểm ở tuần ${wkLab(w[n-1].w)}">
 <div class="tr-y" aria-hidden="true">${[0,25,50,75,100].map(v=>`<span style="bottom:${v}%">${v}</span>`).join('')}</div>
 <div class="tr-p">${[0,25,50,75,100].map(v=>`<i class="tgl" style="bottom:${v}%"></i>`).join('')}
 <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="${area}" ${attr(col,'none')} fill-opacity=".1"/><path d="${line}" ${attr('none',col)} stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>
 ${w.map((p,i)=>`<b class="dt" tabindex="0" style="left:${X(i)}%;bottom:${p.sc}%" data-tip="${esc('Tuần '+wkLab(p.w)+': '+p.sc+' điểm ('+p.n+' lượt luyện)')}"></b>`).join('')}
 <span class="dtl" style="left:${X(n-1)}%;bottom:${w[n-1].sc}%">${w[n-1].sc}</span></div>
 <div class="tr-x" aria-hidden="true">${w.map((p,i)=>i%step===0||i===n-1?`<span style="left:${X(i)}%">${wkLab(p.w)}</span>`:'').join('')}</div></div>`}

/* --- mục tiêu nổi bật, gợi ý ở nhà, bảng số liệu --- */
function gcard(kind,x,par){const dm=x.dm||gDom(x.g);
 const tagk={dat:tg('Mới đạt','ok'),top:tg('Tiến bộ nhiều','in'),slow:tg('Cần thêm thời gian','wa')}[kind];
 const body=kind==='dat'?`<p class="sm">${x.dt?'Đạt ngày '+vd(x.dt)+': bé tự làm đúng từ 80% trở lên trong 3 buổi liên tiếp.':''}</p>`
  :`<div class="gc-l">${spChip(x.fs)}<span class="gc-t"><span aria-hidden="true">→</span> ${spChip(x.ls)}</span></div><p class="sm mu">Số lượt đúng: ${x.fk} → ${x.lk}${x.dl!=null?' · '+(x.dl>=0?'+':'−')+Math.abs(r0(x.dl))+' điểm':''}</p>`;
 return`<div class="gc"><div class="gc-h">${tagk} ${domTag(dm)}</div><b>${esc(gName(x.g))}</b>${body}</div>`}
function goalCards(P,par){const c=[],dg=P.dat.map(p=>p.g);P.dat.forEach(p=>c.push(gcard('dat',{g:p.g,dt:p.dt},par)));P.top.filter(x=>!dg.includes(x.g)).slice(0,4).forEach(x=>c.push(gcard('top',x,par)));if(!par)P.slow.forEach(x=>c.push(gcard('slow',x,par)));
 return c.length?`<div class="gc-grid">${c.join('')}</div>`:'<p class="mu sm">Chưa có mục tiêu nổi bật trong khoảng thời gian này. Khi bé có thêm buổi luyện, các mục tiêu mới đạt và tiến bộ nhiều sẽ hiện ở đây.</p>'}
function tipsBox(k,P){const t=homeTips(k.id,P,3);return t.length?`<ul class="tips">${t.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="mu sm">Chưa có gợi ý.</p>'}
function tvDom(P){return`<details class="tvw"><summary class="sm">Xem số liệu dạng bảng</summary>`+tbl(['Lĩnh vực','>Số mục tiêu','>Đầu kỳ','>Hiện tại','>Thay đổi'],LDOM.map(dd=>{const d=P.doms.find(x=>x.id===dd.id);return`<tr><td>${esc(dd.n)}</td><td class="r">${d.n}</td><td class="r">${d.f==null?'–':r0(d.f)}</td><td class="r">${d.l==null?'–':r0(d.l)}</td><td class="r">${d.f==null||d.l==null?'–':(d.l-d.f>=0?'+':'−')+Math.abs(r0(d.l-d.f))}</td></tr>`}).join(''))+`</details>`}
function tvStack(P){return`<details class="tvw"><summary class="sm">Xem số liệu dạng bảng</summary>`+tbl(['Kỳ',...SUPK.map(s=>'>'+SUP[s].a),'>Tổng lượt'],P.stack.map(r=>`<tr><td>${esc(P.unit==='m'?moLab(r.k):'Tuần '+wkLab(r.k))}</td>${SUPK.map(s=>`<td class="r">${r.c[s]}</td>`).join('')}<td class="r">${r.t}</td></tr>`).join(''))+`</details>`}
function tvTrend(P){return`<details class="tvw"><summary class="sm">Xem số liệu dạng bảng</summary>`+tbl(['Tuần bắt đầu','>Chỉ số tự làm','>Số lượt'],P.weeks.map(w=>`<tr><td>${vd(w.w)}</td><td class="r">${w.sc}</td><td class="r">${w.n}</td></tr>`).join(''))+`</details>`}
function goalTable(P){return tbl(['Mục tiêu','Lĩnh vực','Đầu kỳ','Hiện tại','>Số buổi','>Thay đổi'],P.goals.sort((a,b)=>a.dm<b.dm?-1:a.dm>b.dm?1:b.cnt-a.cnt).map(x=>`<tr><td>${esc(gName(x.g))}</td><td>${domTag(x.dm)}</td><td>${spChip(x.fs)} <span class="sm">${x.fk}</span></td><td>${spChip(x.ls)} <span class="sm">${x.lk}</span></td><td class="r">${x.cnt}</td><td class="r">${x.dl==null?'–':(x.dl>=0?'+':'−')+Math.abs(r0(x.dl))}</td></tr>`).join(''),'Chưa có mục tiêu nào có số liệu trong kỳ.')}
const readHelp=par=>`<details class="tvw"><summary class="sm"><b>Cách đọc các biểu đồ</b></summary><div class="sm" style="padding-top:6px"><p><b>Chỉ số tự làm (0 đến 100):</b> kết hợp hai điều, bé làm đúng bao nhiêu trong 10 lượt và cần cô hỗ trợ nhiều hay ít.</p><ul class="rd">${SUPK.map(s=>`<li>${spChip(s)} ${esc(SUP[s].h)}</li>`).join('')}</ul><p style="margin-top:6px">${par?'Bé càng tự làm, thanh màu đậm bên trái càng dài và chỉ số càng gần 100.':'Mục tiêu được đánh dấu đạt khi bé làm độc lập từ 80% trở lên trong 3 buổi liên tiếp.'} Đầu kỳ và hiện tại được so sánh trên cùng các mục tiêu đã luyện từ 2 buổi trở lên.</p></div></details>`;

/* --- trang Tiến bộ (cổng phụ huynh và hồ sơ bé) --- */
ACT.prp=v=>{S.pr=Object.assign({p:'90'},S.pr,{p:v})};
function periodChips(st){return`<div class="chips" role="group" aria-label="Khoảng thời gian" style="margin-bottom:12px">${PRD.map(([v,l])=>`<button type="button" class="chip ${st.p===v?'on':''}" data-a="prp" data-v="${v}" aria-pressed="${st.p===v}">${l}</button>`).join('')}</div>`}
function progView(k,o){o=o||{};const par=!!o.parent,st=S.pr=Object.assign({p:'90'},S.pr),R=prRange(st.p),P=progData(k.id,R.from,R.to);
 if(!P.ss)return periodChips(st)+`<div class="card"><p class="empty">${par?'Chưa có buổi can thiệp nào được ghi trong khoảng thời gian này. Khi giáo viên ghi buổi học, biểu đồ tiến bộ của bé sẽ hiện ở đây.':'Chưa có buổi can thiệp nào được ghi trong khoảng thời gian này.'}</p></div>`;
 const recent=sessOf(k.id,R.from,R.to).filter(s=>s.note).slice(-3).reverse();
 return periodChips(st)+`<p class="mu sm" style="margin:-4px 0 12px">Từ ${vd(R.from)} đến ${vd(R.to)}${par?'':' · '+esc(k.n)}</p>`
 +`<div class="card">${heroFig(P,par)}</div>`+tiles(k,P)
 +`<div class="card"><h2>${par?'Bé tiến bộ ở lĩnh vực nào?':'Tiến bộ theo lĩnh vực'}</h2>${chDom(P)}${par?'':tvDom(P)}</div>`
 +`<div class="card"><h2>${par?'Bé cần cô hỗ trợ ít dần':'Mức hỗ trợ theo '+(P.unit==='m'?'tháng':'tuần')}</h2>${chStack(P,par)}${par?'':tvStack(P)}</div>`
 +`<div class="card"><h2>Xu hướng chỉ số tự làm theo tuần</h2>${chTrend(P)}${par?'':tvTrend(P)}</div>`
 +`<div class="card"><h2>${par?'Điểm nổi bật của bé':'Mục tiêu nổi bật'}</h2>${goalCards(P,par)}</div>`
 +(par?'':`<div class="card"><h2>Chi tiết theo mục tiêu</h2>${goalTable(P)}</div>`)
 +`<div class="card"><h2>Gợi ý luyện tập tại nhà</h2>${tipsBox(k,P)}${recent.length?`<h3 style="margin-top:12px">Nhận xét gần đây của giáo viên</h3>${recent.map(s=>`<div class="rw"><span><b>${vd(s.date)}</b> · ${esc(s.note)}</span></div>`).join('')}`:''}</div>`
 +`<div class="card">${readHelp(par)}<div class="acts" style="margin-top:12px"><button class="btn p" data-a="prpdf" data-v="${k.id}">Tải báo cáo tiến bộ (PDF)</button></div></div>`}
/* bản gọn cho trang Tổng quan của phụ huynh */
function progMini(k){const R=prRange('90'),P=progData(k.id,R.from,R.to);
 if(!P.ss)return'<p class="empty">Chưa có số liệu buổi can thiệp. Khi giáo viên ghi buổi học, biểu đồ sẽ hiện ở đây.</p>';
 return heroFig(P,true)+`<h3 style="margin:14px 0 8px">Bé tiến bộ ở lĩnh vực nào?</h3>`+chDom(P)+`<div class="acts" style="margin-top:12px"><button class="btn p" data-a="cptab" data-v="tb">Xem đầy đủ tiến bộ của bé</button></div>`}
/* khối biểu đồ đưa vào báo cáo chuyên môn hằng tháng và tệp PDF (mỗi khối .nb không bị cắt giữa hai trang PDF) */
function progBlocks(P,T,k,pdf,o){const nb=(t,h)=>`<div class="nb"><h4>${t}</h4>${h}</div>`,rg=`từ ${vd(T.from)} đến ${vd(T.to)}`;
 return`<div class="nb">${heroFig(P,true)}</div>`
  +nb('Tiến bộ theo lĩnh vực'+(o&&o.m?' trong tháng':''),chDom(P))
  +nb('Bé cần cô hỗ trợ ít dần <span class="mu">('+rg+')</span>',chStack(T,true))
  +nb('Xu hướng chỉ số tự làm theo tuần <span class="mu">('+rg+')</span>',chTrend(T,pdf))
  +nb('Điểm nổi bật',goalCards(P,true))
  +(o&&o.tips?nb('Gợi ý luyện tập tại nhà',tipsBox(k,P)):'')}
function progReport(k,per,pdf){const from=per+'-01',to=mDates(per).slice(-1)[0],P=progData(k.id,from,to);
 if(!P.ss)return'';
 return`<div class="prg"><h3 style="margin-top:14px">Biểu đồ tiến bộ của bé trong ${mLow(per)}</h3>${progBlocks(P,progData(k.id,addD(from,-60),to),k,pdf,{m:1})}</div>`}
ACT.prpdf=v=>{const k=kidBy(v);if(!k||!canKid(k.id))return false;const st=S.pr||{p:'90'},R=prRange(st.p),P=progData(k.id,R.from,R.to);
 const html=`<h2 style="margin:0 0 4px;font:700 17px 'Baloo 2','Be Vietnam Pro',sans-serif">BÁO CÁO TIẾN BỘ CỦA BÉ</h2><p style="margin-bottom:8px"><b>${esc(k.n)}</b> · ${age(k.dob)} · Từ ${vd(R.from)} đến ${vd(R.to)}</p><div class="prg">${P.ss?progBlocks(P,P,k,true,{tips:1}):'<p>Chưa có buổi can thiệp nào được ghi trong khoảng thời gian này.</p>'}</div>`;
 exportPDF('tien-bo-'+ascii(k.n)+'-'+R.to+'.pdf',html);return false};
/* ===== Khởi động ===== */
/* Nâng cấp dữ liệu đã lưu từ bản 2 (chưa có thư viện mục tiêu) lên bản 3, giữ nguyên nhân sự, học sinh, lịch, điểm danh, học phí */
function migrate(d){
 DB=d;
 d.cfg.addr=d.cfg.addr||'28 Trường Thi 1, Quận Hải Châu, TP. Đà Nẵng';d.cfg.tel=d.cfg.tel||'0793502567';
 delete d.goals;
 seedProg(d);
 d.rp.forEach(r=>{if(/^r\d{1,3}$/.test(r.id)){const k=d.kids.find(x=>x.id===r.hs);if(k)r.sec=autoSec(k,r.per)}});
 d.v=3}
const okDB=d=>d&&Array.isArray(d.staff)&&Array.isArray(d.kids)&&d.cfg&&d.cfg.rule&&d.set&&d.rd&&d.att&&Array.isArray(d.rp)&&Array.isArray(d.tpl);
(function boot(){
 let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 if(okDB(d)&&d.v===3&&Array.isArray(d.plans)&&Array.isArray(d.sess)&&Array.isArray(d.cg))DB=d;
 else if(okDB(d)&&d.v===2){try{migrate(d);save()}catch(e){DB=null;seed();save()}}
 else{seed();save()}
 try{const th=localStorage.getItem('gb_th');if(th)document.documentElement.dataset.theme=th}catch(e){}
 try{const em=localStorage.getItem('gb_u');if(em){const a=findAccount(em);if(a){U=a;S.v=ACCESS[a.role][0]}}}catch(e){}
 render();initCaps();
})();

</script>
