ọc (hay khi được nhắc)"]]],["F29",1,5,"Tự động yêu cầu","HS sẽ tự động yêu cầu các vật, hành động, hoặc thông tin suốt cả ngày","",-1,[["2","tự động yêu cầu vật, hành động, hoặc thông tin ít nhất 20 lần trong ngày"],["1","tự động yêu cầu vật, hành động, hoặc thông tin ít nhất 10 lần trong ngày"]]],["G1",1,6,"Gọi tên vật yêu thích","HS sẽ gọi tên những vật yêu thích","",-1,[["4","ít nhất 10 lần gọi tên vật"],["3","6 lần"],["2","4 lần"],["1","2 lần"]]],["G2",1,6,"Gọi tên đồ vật thông thường","HS sẽ gọi tên được ít nhất 100 đồ vật thường thấy quanh mình.","",-1,[["4","ít nhất 100 lần gọi tên vật, và biết vài ví dụ (bao gồm cả ví dụ mới) cho hầu hết các vật đó"],["3","50 lần gọi tên vật với ít nhất 1 ví dụ cho 1 vật"],["2","10 lần gọi tên vật"],["1","5 lần gọi tên vật"]]],["G3",1,6,"Gọi tên những người thường gặp (người chứ không phải nghề nghiệp)","HS sẽ gọi tên những người quanh mình","Mẹ, bố, anh chị (Rachel), các bạn (Jason, Emily)",-1,[["4","ít nhất 10 người"],["3","6 người"],["2","4 người"],["1","2 người"]]],["G4",1,6,"Gọi tên tranh ảnh về những đồ vật thông thường","HS sẽ gọi tên ít nhất 100 tranh ảnh về những đồ vật thông thường","",-1,[["4","ít nhất 100 lần gọi tên tranh vẽ vật và biết vài ví dụ (bao gồm cả ví dụ mới) cho hầu hết các vật đó"],["3","50 lần gọi tên với ít nhất 1 ví dụ cho một vật"],["2","10 lần gọi tên"],["1","5 lần gọi tên"]]],["G5",1,6,"Gọi tên các bộ phận cơ thể","HS sẽ gọi tên được các bộ phận thông thường trên cơ thể mình và người khác","mũi, mắt, tóc trên người mình, trên búp bê và trên cơ thể người khác hoặc trên ảnh 1 người nào đó",-1,[["4","Có thể gọi tên ít nhất 20 bộ phận cơ thể trên người mình hay người khác"],["3","10 bộ phận"],["2","5 bộ phận"],["1","Ít nhất 2 bộ phận cơ thể trên người mình hay người khác."]]],["G6",1,6,"Gọi tên các loại quần áo","HS biết kể tên các loại quần áo","",-1,[["2","Kể tên ít nhất 4 thứ quần áo"],["1","Kể tên 2 thứ quần áo"]]],["G7",1,6,"Gọi tên những hành động thông thường","Học sinh sẽ gọi tên những hành động thông thường","",-1,[["4","ít nhất 20 lần gọi tên hành động và có thể nói được vài thí dụ khác nhau (kể cả thí dụ mới) cho hầu hết các hành động"],["3","10 hành động"],["2","5 hành động"],["1","2 hành động"]]],["G8",1,6,"Gọi tên tranh ảnh miêu tả những hành động thông thường","Học sinh sẽ có thể gọi tên tranh ảnh miêu tả những hành động thông thường","",-1,[["4","20 lần kể tên các tranh miêu tả hành động và có nói được vài thí dụ khác nhau (kể cả thí dụ mới) cho hầu hết các hành động đó"],["3","10 hành động"],["2","5 hành động"],["1","2 hành động"]]],["G9",1,6,"Gọi tên đến thành thục","HS có thể liên tiếp gọi tên các vật quen thuộc","Khi yêu cầu HS kể tên các vật trong quyển sổ hoặc trong quyển sách, HS có thể nói tên liên tiếp giầy, cốc và táo, có thể kể tên các màu, số, chữ, v.v…",-1,[["2","có thể gọi tên liên tiếp 10 vật quen thuộc trong vòng 15 giây"],["1","có thể gọi tên 5 vật quen thuộc trong vòng 10 giây"]]],["G10",1,6,"Gọi tên thứ mới không cần luyện tập nhiều","Học sinh sẽ có thể gọi tên nhiều vật hay hình ảnh vật mới sau khi nghe người khác gọi tên vật đó không quá 5 lần (không được dạy trực tiếp)","",-1,[["2","sẵn sàng học tên nhiều vật mới khi nghe người khác gọi tên của những đồ vật này (không được dạy trực tiếp)"],["1","sẵn sàng học tên những vật thông thường khi được dạy không quá 5 lần"]]],["G11",1,6,"Gọi tên các vật dùng cụm từ kết nối thành câu","Học sinh có thể dùng các cụm từ kết nối thành câu khi gọi tên vật và sẽ thường xuyên dùng những cụm từ đó không cần nhắc","\"Đây là chiếc máy bay\", \"Nhìn kìa, 1 chiếc máy bay!\", \"Một chiếc máy bay đang bay trên kia kìa\"",-1,[["2","khi tự động gọi tên các vật, học sinh sẽ dùng ít nhất 2 cụm từ kết nối khác nhau ít nhất 50% số lần gọi tên"],["1","Khi được nhắc, học sinh sẽ gọi tên đồ vật với ít nhất 2 cụm từ kết nối khác nhau"]]],["G12",1,6,"Gọi tên các bộ phận hoặc đặc tính của các vật.","Học sinh sẽ có thể gọi tên các bộ phận hay đặc tính của các vật","Khi nhìn ảnh một chiếc ô tô, học sinh kể ra cửa xe, bánh xe, và cửa sổ",-1,[["4","3 bộ phận hoặc đặc tính của ít nhất 10 vật"],["3","3 bộ phận hoặc đặc tính của 4 vật"],["2","2 bộ phận hoặc đặc tính của 4 vật"],["1","2 bộ phận hoặc đặc tính của 2 vật"]]],["G13",1,6,"Gọi tên tính từ","Học sinh sẽ có thể dùng tính từ để mô tả các vật","Xe tải màu đỏ, chiếc giầy này… to/nhỏ, nước này…. nóng/lạnh",-1,[["4","gọi tên dùng ít nhất 20 tính từ (gồm ít nhất 3 màu, 2 hình dáng và 2 kích thước)"],["3","ít nhất 10 tính từ (5 trong số đó không phải là màu)"],["2","ít nhất là 5 tính từ (tất cả là màu cũng được)"],["1","có thể dùng ít nhất 1 tính từ"]]],["G14",1,6,"Kể tên các tranh ảnh có liên quan","Khi bày ra 1 loạt các vật hoặc ảnh, sau đó lại đưa thêm 1 vật hay ảnh khác và hỏi HS \"Cái này đi với cái nào?\", HS sẽ gọi được tên một trong những đồ vật có liên quan đến những vật được bày ra (VD nói \"ghế\" khi đưa ra ảnh 1 cái bàn và 1 loạt các ảnh gồm ghế, giày và chùm chìa khóa)","vợt và bóng; cốc và nước hoa quả; tất và giày, gối và giường",-1,[["4","Có thể gọi tên được ít nhất 2 hình ảnh có liên quan trong số ít nhất 20 vật"],["3","2 ảnh có liên quan trong số 10 vật"],["2","1 ảnh có liên quan trong số 10 vật"],["1","Ít nhất 1 ảnh có liên quan trong số 5 vật"]]],["G15",1,6,"Nói tên vật khi biết chức năng của vật","HS sẽ có thể nói tên vật khi biết mỗi chức năng của vật","Khi đưa xem ảnh cái kéo, giày và một con ngựa rồi hỏi: \"Em cắt bằng gì?\", HS sẽ nói \"kéo\"",-1,[["4","Gọi tên được ít nhất 25 vật, gồm ít nhất 4 ví dụ cho ít nhất 6 chức năng"],["3","Ít nhất 10 vật"],["2","Ít nhất 5 vật"],["1","2 vật"]]],["G16",1,6,"Nói tên vật khi biết một trong những đặc điểm của vật","HS sẽ có thể nói tên vật khi biết mỗi đặc điểm của vật đó","Khi được đưa xem ảnh về cái kéo, giày, 1 con ngựa và giáo viên bảo: \"nó có chân\" hay \"nó có đuôi\", HS sẽ nói \"ngựa\"",-1,[["4","Gọi tên được ít nhất 25 vật, gồm ít nhất 2 ví dụ cho ít nhất 6 đặc điểm"],["3","Ít nhất 10 vật"],["2","Ít nhất 5 vật"],["1","2 vật"]]],["G17",1,6,"Nói tên vật khi biết chủng loại của vật","HS sẽ có thể nói tên vật khi biết mỗi chủng loại của vật đó","Khi được đưa xem ảnh về cái kéo, áo sơ mi và ngựa và giáo viên hỏi: \"Cái nào là đồ để mặc?\" HS sẽ nói \"áo sơ mi\"",-1,[["4","Ít nhất 5 vật thuộc 4 chủng loại"],["3","Ít nhất 5 vật thuộc 3 chủng loại"],["2","Ít nhất 5 vật thuộc 2 chủng loại"],["1","Ít nhất 5 vật thuộc 1 chủng loại"]]],["G18",1,6,"Kể tên 2 vật (danh từ)","HS sẽ có thể kể tên 1 loạt vật được đưa xem","Khi đưa xem 2 ảnh con vật và hỏi: \"Đây là những con gì?\", HS sẽ nói \"Chó và mèo\"",-1,[["4","Ít nhất 20 cặp các vật"],["3","Ít nhất 10 cặp các vật"],["2","Ít nhất 5 cặp các vật"],["1","ít nhất 2 cặp các vật"]]],["G19",1,6,"Kể tên 2 vật (danh từ) trong ảnh","HS sẽ có thể kể tên nhiều hơn 1 vật trong ảnh","Khi đưa xem 1 ảnh sân chơi, HS sẽ nói \"xích đu, cầu trượt\" (không cần dùng từ \"và\")",-1,[["4","Ít nhất 20 cặp đồ vật"],["3","Ít nhất 10 cặp đồ vật"],["2","Ít nhất 5 cặp đồ vật"],["1","Ít nhất 2 cặp đồ vật"]]],["G20",1,6,"Kể tên 2 vật dùng cụm từ kết nối.","H/s có thể sử dụng 1 cụm từ kết nối khi gọi tên nhiều vật, và thường xuyên sử dụng những cụm từ kết nối đó mà không cần nhắc","\"Đây là máy bay và trực thăng\", \"Xem này, 1 chiếc máy bay và một chiếc trực thăng\", \"Tôi nhìn thấy một chiếc máy bay và 1 chiếc trực thăng\", \"Có 1 chiếc máy bay và 1 chiếc phản lực\"",-1,[["2","khi tự động gọi tên vật, HS sẽ dùng cụm từ kết nối 50% số lần với ít nhất 2 loại cụm từ kết nối khác nhau"],["1","Khi được nhắc, HS có thể gọi tên các vật có sử dụng ít nhất 2 cụm từ kết nối khác nhau"]]],["G21",1,6,"Gọi tên sử dụng danh từ-động từ","HS gọi tên vật kết hợp danh từ với động từ","Khi đang lăn bóng, HS có thể nói \"lăn bóng\" - Khi xem ảnh một cô gái đang đạp xe trong công viên, HS nói \"đạp xe\".",-1,[["4","sử dụng Ít nhất 10 động từ kết hợp với nhiều danh từ"],["3","sử dụng Ít nhất 5 động từ kết hợp với nhiều danh từ"],["2","sử dụng ít nhất 5 cặp danh từ - động từ"],["1","Ít nhất 2 cặp danh từ - động từ"]]],["G22",1,6,"Gọi tên sử dụng danh từ-tính từ","HS gọi tên vật kết hợp danh từ với tính từ","khi đưa cho xem một quả bóng đỏ, HS sẽ nói \"bóng đỏ\"",-1,[["4","Dùng ít nhất 10 tính từ kết hợp với nhiều danh từ"],["3","Ít nhất 5 tính từ kết hợp với nhiều danh từ"],["2","ít nhất 5 cặp danh từ - tính từ"],["1","ít nhất 2 cặp danh từ - tính từ"]]],["G23",1,6,"Gọi tên bằng cách xác nhận có/không","HS có thể trả lời có/không hay gật/lắc đầu để xác nhận tên một vật hay vật / hành động có đúng với tiêu chí nào đó không","khi xem ảnh 1 con mèo và hỏi \"Đây có phải con chó đây không?\", HS sẽ lắc đầu để trả lời \"không\"",-1,[["2","xác nhận đặc tính của các vật hiện hữu bằng cách nói có/không"],["1","xác nhận tên gọi của vật hiện hữu bằng cách nói có/không"]]],["G24",1,6,"Gọi tên chức năng của vật","HS có thể nói chức năng của vật khi được hỏi \"Em làm gì với cái này?\"","Khi cho xem ảnh về 1 cái cốc và hỏi \"Con dùng chén để làm gì?\", HS sẽ trả lời \"uống\"",-1,[["4","nói được ít nhất 25 chức năng gồm ít nhất 4 ví dụ cho ít nhất 6 chức năng"],["3","Ít nhất 10"],["2","Ít nhất 5"],["1","Ít nhất 2"]]],["G25",1,6,"Gọi tên chủng loại của vật","HS sẽ có thể nói được chủng loại của 1 vật nào đó","Khi cho xem ảnh 1 chiếc áo và hỏi \"Áo sơ mi là gì?\", HS sẽ nói \"quần áo\"",-1,[["4","5 vật thuộc 10 chủng loại"],["3","3 vật thuộc 5 chủng loại"],["2","2 vật thuộc 5 chủng loại"],["1","2 vật thuộc 2 chủng loại"]]],["G26",1,6,"Phân biệt các câu hỏi nêu các khía cạnh của vật","HS sẽ có thể phân biệt được câu hỏi về tên, chức năng, màu sắc, hay sở hữu của 1 vật","Khi xem 1 quả bóng màu đỏ, HS sẽ trả lời \"ném bóng\" khi được hỏi \"Con làm gì với quả bóng này?\", trả lời \"Của Tyler\" khi được hỏi \"Quả bóng này của ai?\", trả lời \"màu đỏ\" khi được hỏi \"Bóng màu gì?\", trả lời \"quả bóng\" khi được hỏi \"Cái gì đây?\", chứ không đơn thuần trả lời \"ném bóng\", \"bóng đỏ\"; \"bóng của Tyler\" hay \"ném quả bóng đỏ của Tyler\"",-1,[["2","có thể nói được ít nhất 3 khía cạnh của 1 vật khi được hỏi 1 câu nhất định về vật đó"],["1","Có thể gọi tên ít nhất 2 khía cạnh (tên chức năng, màu sắc, chủ sở hữu) của 1 vật khi được hỏi 1 câu về vật đó"]]],["G27",1,6,"Nói được chủng loại của 1 nhóm vật.","HS có thể nhìn tranh một nhóm vật hay vật thật và nói được chủng loại của những vật đó","Khi xem 1 chiếc vòng, 1 chiếc nhẫn và hoa tai, HS sẽ nói đồ trang sức",-1,[["4","5 vật thuộc 10 chủng loại"],["3","3 vật thuộc 5 chủng loại"],["2","2 vật thuộc 5 chủng loại"],["1","2 vật thuộc 2 chủng loại"]]],["G28",1,6,"Chỉ ra đặc tính của vật còn thiếu hay điểm bất hợp lý","HS sẽ có thể chỉ ra những bộ phận còn thiếu hay điểm bất hợp lý của 1 vật trong tranh (VD: ô tô không bánh)","Khi được hỏi \"Có gì sai?\", HS sẽ nói \"rắn lại có tai thỏ\" và khi được hỏi \"thiếu cái gì?\", HS sẽ nói \"con voi thiếu tai\".",-1,[["2","chỉ ra được ít nhất 5 ví dụ trong đó vật trong tranh bị thiếu các bộ phận VÀ 5 ví dụ trong đó có nhiều điểm bất hợp lý"],["1","chỉ ra được ít nhất 5 bộ phận còn thiếu của vật trong ảnh hay những điểm bất hợp lý"]]],["G29",1,6,"Chỉ ra vật không cùng loại với các vật còn lại","Khi xem một loạt các đồ vật trong đó chỉ có 1 đồ vật là không cùng loại (có thể dựa vào chức năng, đặc tính, chủng loại), HS có thể nói được tên vật không cùng loại với những vật còn lại","VD khi cho xem 4 đồ ăn và 1 chiếc ô tô,và hỏi \"Cái gì không cùng nhóm này?\", HS sẽ trả lời \"ôtô\" - Khi xem một quyển sách có tranh các vật, giáo viên yêu cầu HS nêu tên cái không phải là con vật, HS sẽ trả lời \"ôtô\" (khi có ảnh ôtô ở đó)",-1,[["4","Ít nhất 3 ví dụ thuộc 10 loại (có thể liên quan đến chức năng, đặc tính, chủng loại của vật)"],["3","3 ví dụ thuộc ít nhất 5 loại"],["2","3 ví dụ thuộc ít nhất 3 loại"],["1","3 ví dụ thuộc ít nhất 2 loại (có thể liên quan đến chức năng, đặc tính, chủng loại)"]]],["G30",1,6,"Chỉ ra các sự cố/bất ổn dễ thấy/rõ rệt","HS có thể chỉ ra một sự cố hiển hiện hay tình trạng khẩn cấp dễ thấy","1 căn nhà đang cháy, 1 vụ tai nạn ôtô, lũ lụt v.v...",-1,[["2","có thể chỉ ra được ít nhất 3 sự cố dễ thấy khác nhau"],["1","có thể chỉ ra được ít nhất 1 sự cố dễ thấy"]]],["G31",1,6,"Gọi tên những người nhân viên công ích","HS có thể gọi tên những nhân viên công ích thông thường qua ảnh","giáo viên, cảnh sát, lính cứu hỏa, nhà vật lý học, nhân viên...",-1,[["4","được ít nhất 4 lần gọi tên"],["3","được ít nhất 3 lần gọi tên"],["2","được ít nhất 2 lần gọi tên"],["1","được ít nhất 1 lần gọi tên"]]],["G32",1,6,"Gọi tên những vật ở đằng xa khi có người chỉ","HS có thể gọi tên đồ vật ở xa khi có người chỉ","Giáo viên chỉ vào 1 chiếc máy bay trên trời và nói \"Xem cô nhìn thấy cái gì này\", HS sẽ trả lời \"máy bay\", \"mây\" \"trăng\" v.v... \"1 chiếc xe cứu hỏa\", \"1 quán ăn nhanh hay đến\"",-1,[["2","có thể gọi tên hầu hết các vật quan trọng cách xa hơn 100 feet"],["1","Có thể gọi tên những đồ vật quan trọng cách xa ít nhất 10 feet"]]],["G33",1,6,"Gọi tên các âm thanh quen thuộc quanh mình","HS sẽ gọi tên các âm thanh quen thuộc quanh mình","Dụng cụ/máy móc: cưa, đục v.v... tiếng báo động: còi xe, còi xe lửa, cứu thương, còi công an, tiếng các con vật, các hoạt động: tiệc sinh nhật, trận bóng, tiếng xe, ô tô, tàu hỏa, máy bay v.v…",-1,[["4","Ít nhất 8 âm thanh"],["3","Ít nhất 6 âm thanh"],["2","Ít nhất 4 âm thanh"],["1","Ít nhất 2 âm thanh"]]],["G34",1,6,"Dùng những cụm từ kết nối khi gọi tên danh từ kèm động từ hoặc tính từ","HS sẽ dùng các cụm từ kết nói khi dùng danh từ kèm động từ hay tính từ và sẽ thường xuyên dùng những cụm từ kết nối đó mà không cần nhắc nhở","Khi được đưa 1 quả bóng, học sinh sẽ nói \"Đây là quả bóng màu đỏ\", \"Có 1 quả bóng to\", \"Đây là quả bóng cũ\", \"Xem kìa, 1 quả bóng nhỏ\" v.v...",-1,[["2","khi tự động gọi tên vật, HS sẽ dùng ít nhất 2 loại cụm từ kết nối 50% số lần"],["1","Khi được nhắc nhở, HS có thể dùng ít nhất 2 loại cụm từ kết nối để gọi tên vật"]]],["G35",1,6,"Gọi tên giới từ","HS có thể nói được vị trí của vật so với những vật khác","Khi cho xem 1 quả bóng trong cốc và hỏi \"Quả bóng ở đâu?\", HS sẽ trả lời \"trong cốc\"",-1,[["4","Ít nhất 10 giới từ"],["3","Ít nhất 6 giới từ"],["2","Ít nhất 4 giới từ"],["1","2 giới từ"]]],["G36",1,6,"Dùng cụm từ kết nối có giới từ","HS có thể sử dụng 1 cụm từ kết nối có giới từ và sẽ dùng những cụm từ này thường xuyên mà không cần nhắc nhở","Khi được hỏi \"cái cốc đâu?\", HS sẽ trả lời \"Nó ở trên bàn\"",-1,[["2","HS sẽ dùng ít nhất 2 loại cụm từ kết nối 50% số lần"],["1","Khi được nhắc nhở, HS có thể dùng ít nhất 2 loại cụm từ kết nối để chỉ ra vị trí của vật"]]],["G37",1,6,"Gọi tên đại từ","HS sẽ có thể gọi tên các đại từ","Khi được hỏi \"Ai đang nhảy?\", HS sẽ trả lời \"Cô\"",-1,[["4","Ít nhất 8 đại từ"],["3","Ít nhất 5 đại từ"],["2","Ít nhất 3 đại từ"],["1","Ít nhất 1 đại từ"]]],["G38",1,6,"Dùng cụm từ kết nối với đại từ","HS sẽ có thể dùng cụm từ kết nối có đại từ và sẽ thường xuyên dùng những loại cụm từ này mà không cần nhắc nhở","Khi được hỏi \"Ai đang nhảy\"?\", h/s sẽ trả lời \"Cô đang nhảy\"",-1,[["2","HS sẽ dùng ít nhất 2 loại cụm từ kết nối 50% số lần tự động gọi tên với đại từ"],["1","Khi được nhắc nhở, HS có thể dùng ít nhất 2 loại cụm từ kết nối để gọi tên vật với đại từ"]]],["G39",1,6,"Liệt kê và mô tả các sự kiện hoặc sự vật có trong tranh","Khi cho xem một bức tranh phong cảnh hoặc hoạt động và hỏi \"Hãy nói về bức tranh này\", HS sẽ liệt kê và miêu tả các sự kiện, sự vật, và các hoạt động diễn ra trong tranh","Khi xem cảnh một ngôi nhà đang cháy, HS sẽ nói: \"Có lửa trong nhà, xe cứu hỏa, kéo vòi dập lửa, phun nước vào nhà\". \"Ăn tối\" \"Đi tiệc\", \"Đó là một lần đi dã ngoại\"",-1,[["2","Có thể miêu tả 4 khía cạnh của 1 bức tranh gồm ít nhất 1 hành động hay miêu tả bối cảnh chung của bức tranh"],["1","Có thể mô tả ít nhất 1 hoạt động trong tranh hay miêu tả bối cảnh chung của bức tranh"]]],["G40",1,6,"Kể về một góc tranh cụ thể","Khi cho biết thông tin về một góc tranh nào đó, HS sẽ kể về góc tranh đó","khi cho xem ảnh một khu rừng và hỏi \"Con gì đang đậu trên cành?\", học sinh sẽ trả lời \"Con cú\"",-1,[["2","có thể nói tên vật khi biết chủng loại VÀ 1 chi tiết miêu tả khác (hành động, màu sắc, kích cỡ, vị trí v.v...)"],["1","có thể nói tên đồ vật khi biết chủng loại HOẶC chi tiết miêu tả khác (hành động, vị trí, màu sắc, kích cỡ v.v...)"]]],["G41",1,6,"Sử dụng phó từ","HS có thể dùng phó từ để mô tả","Trong khi quan sát một con rùa bò và hỏi \"Con rùa bò thế nào?\", HS trả lời \"chầm chậm\"",-1,[["4","Ít nhất 10 phó từ"],["3","Ít nhất 6"],["2","Ít nhất 4"],["1","2 phó từ"]]],["G42",1,6,"Nói được trạng thái cảm xúc của những người khác","HS có thể kể tên các cảm xúc biểu hiện bằng nét mặt và hành vi và tranh những gương mặt diễn tả các cảm xúc khác nhau","khi thấy một trẻ khác đang khóc vì bóng bị nổ và hỏi HS cảm giác của trẻ đó, HS sẽ trả lời \"Buồn ạ\"",-1,[["4","ít nhất 4 cảm xúc (qua ví dụ có thật và qua ảnh)"],["3","ít nhất 3 cảm xúc (qua ví dụ có thật và qua ảnh)"],["2","ít nhất 2 cảm xúc"],["1","ít nhất 1 cảm xúc (qua ví dụ có thật và qua ảnh)"]]],["G43",1,6,"Diễn biến cảm xúc nội tâm","HS có thể nói ra những cảm xúc và diễn biến nội tâm của mình mà người ngoài thể thấy được bằng trực quan","chỗ đau, vết thương nhỏ, chỗ ngứa, vui sướng, buồn, ngạc nhiên, sợ hãi, cáu, sợ sệt, lo lắng, mệt mỏi, buồn ngủ, bình tâm, cô đơn, v.v…",-1,[["4","Có thể nói ra tình thái cơ thể và cảm xúc, mà người khác không cảm nhận được bằng thị giác/thính giác/xúc giác/khứu giác"],["3","3 trạng thái bất kỳ"],["2","2 trạng thái bất kỳ"],["1","1 trạng thái bất kỳ"]]],["G44",1,6,"Kể ra 3 yếu tố về một vật","HS có thể kể ra 3 yếu tố về một vật","cho xem tranh và hỏi 'con nhìn thấy gì?', HS sẽ trả lời \"xe tải màu đỏ của bố\".",-1,[["4","Ít nhất 6 từ với 4 thành phần ngôn ngữ khác nhau"],["3","Ít nhất 5 từ với 3 thành phần ngôn ngữ khác nhau"],["2","Ít nhất 4 từ với 3 thành phần ngôn ngữ khác nhau"],["1","Ít nhất 3 từ với 3 thành phần ngôn ngữ khác nhau (danh từ, động từ, tính từ, đại từ, trạng từ, mạo từ)"]]],["G45",1,6,"Kể ra 3 yếu tố về một vật dùng cụm từ kết nối","HS có thể dùng cụm từ kết nối khi kể ra ít nhất 3 yếu tố riêng biệt và sẽ thường xuyên dùng những cụm từ kết nối đó mà không cần nhắc","cho xem một bức tranh và hỏi \"Con nhìn thấy gì?\", HS sẽ trả lời \"Em nhìn thấy chiếc xe tải to đang đi nhanh\".",-1,[["2","khi tự động kể về vật, HS sẽ dùng ít nhất 2 loại cụm từ kết nối 50% số lần"],["1","khi được nhắc, HS sẽ có thể gọi tên đồ vật dùng ít nhất 2 cụm từ kết nối"]]],["G46",1,6,"Gọi tên những hành vi giao tiếp xã hội.","HS sẽ có thể nói được bản chất của những loại giao tiếp xã hội (VD: chơi đùa, tranh cãi).","\"Cô ấy ngượng\", tranh cãi, đánh nhau, trò chuyện, trêu trọc, vui chơi, làm việc, thực hành, bận rộn, giận, thân thiện, căng thẳng, vui nhộn.",-1,[["4","10 lần kể tên"],["3","6 lần kể tên"],["2","4 lần kể tên"],["1","2 lần kể tên"]]],["G47",1,6,"Tự giác gọi tên","HS sẽ tự giác gọi tên các đồ vật, sự kiện suốt trong ngày","",-1,[["2","tự giác gọi tên đồ vật hay hành động ít nhất 20 lần/1 ngày"],["1","tự giác gọi tên đồ vật hay hành động ít nhất 10 lần/1 ngày"]]],["H1",1,7,"Hát theo vài từ trong lời bài hát","Khi có người hát 1 bài hát, h/s sẽ có thể hát vài từ và vài đoạn trong lời bài hát","Con cò bé…..",-1,[["4","Ít nhất 3 đoạn trong 6 bài hát"],["3","3 từ trong 3 bài hát"],["2","2 từ trong 2 bài hát"],["1","1 từ trong 2 bài hát"]]],["H2",1,7,"Điền từ vào chỗ trống trong những chuyện và những trò chơi vui nhộn","H/s có thể hoàn tất 1 câu bỏ lửng bằng cách điền thêm những từ thiếu liên quan đến những chuyện, những sinh hoạt vui","\"Nào cùng đi lên đi (xuống)\", Winnie chú____",-1,[["4","điền được ít nhất 10 câu"],["3","5 câu"],["2","2 câu"],["1","1 câu"]]],["H3",1,7,"Ra dấu (từ tiếng anh) (dành cho HS sử dụng ngôn ngữ ra hiệu kiểu Mỹ - ASL)","H/s biết ra dấu sử dụng ASL để thể hiện một từ tiếng anh","Khi ai đó nói \"hãy ra dấu trái táo\" h/s sẽ ra dấu theo ASL để thể hiện từ \"trái táo\"",-1,[["4","25 ký hiệu"],["3","15 ký hiệu"],["2","5 ký hiệu"],["1","2 ký hiệu"],["Không áp dụng","Nếu HS có thể nói được trên 50 từ và/hoặc không sử dụng ASL"]]],["H4",1,7,"Tiếng kêu của các con vật","H/s sẽ có thể nói tên của con vật khi nghe tiếng kêu của nó hay ngược lại","Khi có người nói \"Con chó kêu..., h/s sẽ nói \"gâu, gâu\"",-1,[["4","làm tiếng kêu của 8 con vật khi biết tên con vật và nói tên 8 con vật khi nghe tiếng kêu của con vật đó"],["3","6 tiếng kêu hay tên của con vật"],["2","4 tiếng kêu hay tên của con vật"],["1","2 tiếng kêu hay tên của con vật"]]],["H5",1,7,"Trả lời câu hỏi về thông tin cá nhân","H/s sẽ có thể trả lời những câu hỏi về thông tin cá nhân","Khi được hỏi \"Tên em là gì?\", h/s sẽ nói tên của mình",-1,[["4","ít nhất 4 thông tin về bản thân (VD: tên, tuổi, điện thoại, tên anh em, tên bố mẹ, v.v...)"],["3","3 thông tin về bản thân"],["2","2 thông tin về bản thân"],["1","1 thông tin về bản thân"]]],["H6",1,7,"Điền vào chỗ trống những từ mô tả các hoạt động thông thường","H/s sẽ có thể điền từ còn thiếu trong cụm từ mô tả 1 hành động đang xảy ra","Khi giáo viên dẫn h/s đến chậu nước và nói \"Đến lúc phải đi rửa ..........\", h/s sẽ nói \"tay\"",-1,[["4","Điền được ít nhất 10 từ"],["3","Điền được ít nhất 5 từ"],["2","Điền được ít nhất 2 từ"],["1","Điền được ít nhất 1 từ"]]],["H7",1,7,"Hỏi đáp về các cặp liên hệ","Khi được hỏi \"Cái gì đi với (...)?\" h/s sẽ có thể kể 1 vài đồ vật có liên quan đến vật được nhắc đến (VD sẽ nói \"giường\" khi được hỏi \"Cái gì đi với \"cái gối?\")","\"Cái gì đi với tất? \"giầy\",\"vợt - bóng\", \"chén- nước hoa quả\", \"gối - giường\"",-1,[["4","có thể nói được ít nhất 2 vật liên quan đến ít nhất 20 vật kể tên"],["3","2 vật liên quan đến từng vật trong số 10 hoặc hơn các vật kể tên"],["2","1 vật liên quan đến ít nhất 10 vật kể tên"],["1","ít nhất 1 vật liên quan đến một trong số 5 vật kể tên"]]],["H8",1,7,"Điền tên vật khi biết chức năng của vật đó","H/s sẽ có thể điền nốt tên vật trong một đoạn câu có liên quan đến chức năng của vật đó","Khi h/s nghe câu: \"Con đi xe___, h/s sẽ nói \"xe hơi\"",-1,[["4","điền ít nhất 20 chỗ với 2 lượt hồi đáp"],["3","ít nhất 10 chỗ với 2 lượt hồi đáp"],["2","ít nhất 5 chỗ với 2 lượt hồi đáp"],["1","ít nhất 2 chỗ với 2 lượt hồi đáp"]]],["H9",1,7,"Điền chức năng khi biết tên vật","H/s sẽ có thể điền từ còn thiếu trong một đoạn câu nêu chức năng của vật","\"Con dùng kéo để ...... cắt\", \"Con dùng thìa để...... ăn\"",-1,[["4","Điền ít nhất 20 chỗ với 2 lượt hồi đáp"],["3","10 chỗ với 2 lượt hồi đáp"],["2","5 chỗ với 2 lượt hồi đáp"],["1","2 chỗ với 2 lượt hồi đáp"]]],["H10",1,7,"Trả lời câu hỏi \"Cái gì?\" liên quan đến những đồ vật trong nhà","H/s sẽ có thể trả lời những câu hỏi \"Cái gì?\" liên quan đến những vật trong nhà","Khi được hỏi \"Em có thể tìm thấy gì trong nhà tắm?\" h/s trả lời \"toilet, khăn mặt, bồn tắm\", \"Em thấy gì trong tủ lạnh?\" h/s sẽ trả lời \"sữa, trứng, nước hoa quả\"",-1,[["4","Trả lời được ít nhất 30 câu hỏi gồm ít nhất 3 lượt hồi đáp liên quan đến ít nhất 5 vị trí (VD: phòng ngủ, tủ lạnh, bếp, nhà vệ sinh, phòng khách)"],["3","15 câu hỏi"],["2","10 câu hỏi"],["1","ít nhất 5 câu hỏi"]]],["H11",1,7,"Trả lời câu hỏi \"Cái gì?\" liên quan đến chức năng","H/s có thể trả lời câu hỏi \"Cái gì?\" liên quan đến chức năng của đồ vật","Khi được hỏi \"con dùng cái gì để cắt giấy?\", h/s sẽ trả lời \"kéo\". \"con dùng cái gì để viết?\" h/s trả lời \"bút\"",-1,[["4","Trả lời được ít nhất 50 câu hỏi"],["3","25 câu hỏi"],["2","10 câu hỏi"],["1","Trả lời được ít nhất 5 câu hỏi"]]],["H12",1,7,"Trả lời câu hỏi \"Ở đâu?\" liên quan đến đồ vật ở lớp hoặc ở nhà","H/s sẽ có thể trả lời câu hỏi \"Ở đâu?\" liên quan đến đồ vật ở lớp hoặc ở nhà","Khi được hỏi: \"Con thấy sữa ở đâu?\", h/s sẽ trả lời \"Trong tủ lạnh\", \"Con thấy toilet ở đâu?\", h/s trả lời \"trong nhà tắm\"",-1,[["4","Trả lời ít nhất 30 câu hỏi"],["3","15 câu hỏi"],["2","10 câu hỏi"],["1","Trả lời ít nhất 5 câu hỏi"]]],["H13",1,7,"Trả lời câu hỏi \"Ở đâu?\" liên quan đến các hoạt động ở nhà hoặc ở trường","H/s sẽ có thể trả lời câu hỏi \"Ở đâu?\" liên quan đến các hoạt động ở nhà hoặc ở trường","Khi được hỏi \"em ngủ ở đâu?\" h/s sẽ trả lời \"phòng ngủ\"",-1,[["4","Trả lời hơn 30 câu hỏi"],["3","15 câu hỏi"],["2","10 câu hỏi"],["1","Ít nhất 5 câu hỏi"]]],["H14",1,7,"Điền tên vật khi biết chủng loại","H/s sẽ có thể điền từ còn thiếu trong một đoạn câu nêu tên vật/ví dụ cho một chủng loại các vật nhất định","\"Một loại động vật là là... chó, mèo\", \"con đi bằng... xe hơi, thuyền, máy bay\"",-1,[["4","ít nhất 20 lần điền trong 4 lượt hồi đáp"],["3","10 lần điền trong 3 lượt hồi đáp"],["2","5 lần điền trong 2 lượt hồi đáp"],["1","2 lần điền trong 2 lượt hồi đáp"]]],["H15",1,7,"Cho nhiều phương án trả lời khi biết chủng loại","H/s có thể kể ra rất nhiều vật trong cùng chủng loại","Khi được hỏi \"Hãy kể tên một số con vật\", h/s nói: \"ngựa, chó, bò\". \"Đồ ăn bao gồm:\", h/s trả lời \"táo, bột ngũ cốc, bánh kẹp thịt, bánh piza\"",-1,[["4","20 chủng loại trong 4 lượt hồi đáp"],["3","10 chủng loại trong 3 lượt hồi đáp"],["2","5 chủng loại trong 2 lượt hồi đáp"],["1","2 chủng loại trong 2 lượt hồi đáp"]]],["H16",1,7,"Điền đặc tính khi biết tên vật","Khi nghe tên vật, h/s có thể điền từ còn thiếu trong một đoạn câu nêu đặc tính của vật","Xe hơi có ... \"bánh xe\" \"còi\", \"cửa xe\"",-1,[["4","Điền được ít nhất 20 chỗ với 2 câu trả lời"],["3","10 chỗ với 2 câu trả lời"],["2","5 chỗ với 2 câu trả lời"],["1","2 chỗ với 2 câu trả lời"]]],["H17",1,7,"Điền tên vật khi biết đặc tính của vật","Khi được biết đặc tính của 1 vật, h/s sẽ có thể điền từ còn thiếu trong một đoạn câu nêu tên vật","Con vật có đuôi là…con chó - Cái có bánh xe là... Ôtô",-1,[["4","Điền được ít nhất 20 chỗ với 2 câu trả lời"],["3","10 chỗ với 2 câu trả lời"],["2","5 chỗ với 2 câu trả lời"],["1","2 chỗ với 2 câu trả lời"]]],["H18",1,7,"Điền tên chủng loại khi biết tên vật","H/s sẽ có thể điền từ còn thiếu trong một đoạn câu nêu tên chủng loại của một đồ vật nào đó","Xe hơi là vật ta ...đi, táo là 1 loại....... Quả, mèo là 1 loài....... động vật",-1,[["4","Điền được ít nhất 20 chỗ với 2 câu trả lời"],["3","10 chỗ với 2 câu trả lời"],["2","5 chỗ với 2 câu trả lời"],["1","2 chỗ với 2 câu trả lời"]]],["H19",1,7,"Kể tên những đồ vật sau khi quan sát","H/s có thể kể tên những đồ vật mà chúng đã quan sát trước đó","Ra ngoài quan sát 1 chiếc xe cứu hỏa, sau đó quay lại lớp và kể tên những thứ đã quan sát được ở ngoài",-1,[["4","kể lại hơn 2 vật 1 giờ sau khi đi quan sát về"],["3","1 vật sau 10 phút đi quan sát về"],["2","1 vật sau 5 phút đi quan sát về"],["1","1 vật ngay sau khi đi quan sát về"]]],["H20",1,7,"Kể tên những hoạt động được quan sát trước đó","H/s có thể kể tên 1 hoạt động mà mình vừa quan sát","Ra ngoài và quan sát mọi người chơi bóng rổ, trở về và gọi tên hoạt động mà h/s quan sát khi ra ngoài. Thấy anh đọc sách trong phòng khách, đi vào bếp và nói lại anh đang làm gì",-1,[["4","kể lại hoạt động đó 1 tiếng sau khi quan sát thấy"],["3","10 phút sau khi quan sát thấy"],["2","5 phút sau khi quan sát thấy"],["1","ngay sau khi quan sát thấy"]]],["H21",1,7,"Gọi tên người nhìn thấy trước đó","H/s có thể gọi tên người mà mình trông thấy trước đó","Ra ngoài và cùng chơi với h/s khác trong hộp cát, về lớp và kể tên những h/s cùng chơi trong hộp cát",-1,[["4","Gọi tên được ít nhất 2 người 1 tiếng sau khi quan sát thấy"],["3","1 người 10 phút sau khi quan sát thấy"],["2","1 người 5 phút sau khi quan sát thấy"],["1","1 người ngay sau khi quan sát thấy"]]],["H22",1,7,"Phát ngôn liên quan đến vật cho xem (không tính tên vật)","H/s sẽ có thể đưa ra một số câu nhận xét có liên quan đến ảnh và vật hay hoạt động (không tính tên vật)","Khi xem ảnh mọi người đi cắm trại mang theo lò nướng (nhưng không thấy thức ăn trong ảnh) và nói với HS \"Họ đang cắm trại\", HS sẽ nhận xét chẳng hạn như: \"Họ đang nướng xúc xích và bánh kẹp thịt\" hay \"Đừng sờ vào, nóng đấy\"",-1,[["4","có nhận xét/bình luận về 20 bức ảnh"],["3","có nhận xét/bình luận về 10 bức ảnh"],["2","có nhận xét/bình luận về 5 bức ảnh"],["1","có nhận xét/bình luận về 1bức ảnh"]]],["H23",1,7,"Trả lời câu hỏi \"Cái gì\" liên quan đến những đồ vật hay thấy ở chỗ công cộng","H/s sẽ có thể trả lời một lượt những câu hỏi liên quan về những thứ đã từng nhìn thấy ở những nơi công cộng","Khi được hỏi \"Con thấy gì ở công viên?\", h/s trả lời \"xích đu\"",-1,[["4","Trả lời ít nhất 20 câu hỏi"],["3","Trả lời được 10 câu hỏi"],["2","Trả lời được 5 câu hỏi"],["1","Trả lời được 2 câu hỏi"]]],["H24",1,7,"Trả lời những câu hỏi \"Cái gì\" liên quan đến những hoạt động mà h/s có thể ở nơi công cộng","H/s sẽ có thể trả lời một lượt những câu hỏi liên quan đến những gì mình có thể làm ở nơi công cộng","Khi được hỏi \"Con có thể làm gì khi ở quầy bán thức ăn\", h/s trả lời \"mua bánh\", \"Con có thể làm gì ở công viên?\" h/s sẽ trả lời \"trượt cầu trượt\"",-1,[["4","Trả lời ít nhất 20 câu hỏi"],["3","Trả lời ít nhất 10 câu hỏi"],["2","Trả lời ít nhất 5 câu hỏi"],["1","Trả lời 2 câu hỏi"]]],["H25",1,7,"Trả lời những câu hỏi \"Ở đâu\" liên quan đến những hoạt động, sự vật thường thấy ở nơi công cộng","H/s sẽ có thể trả lời những câu hỏi \"Ở đâu\" liên quan đến những hoạt động, sự kiện thường thấy ở nơi công cộng","Khi được hỏi \"Em mua sữa ở đâu?\" h/s sẽ trả lời \"Cửa hàng tạp hóa\", \"em chơi hộp cát ở đâu?, \"ở trường\"",-1,[["4","Trả lời ít nhất 30 câu hỏi"],["3","Trả lời ít nhất 15 câu hỏi"],["2","Trả lời ít nhất 10 câu hỏi"],["1","ít nhất 5 câu hỏi"]]],["H26",1,7,"Trả lời những câu hỏi có nhiều đáp án về cộng đồng quanh mình","H/s sẽ có thể trả lời những câu hỏi có nhiều đáp án về cộng đồng quanh mình","Khi được hỏi \"Hãy liệt kê những thứ mà em có thể mua ở quầy tạp hóa càng nhiều càng tốt\", h/s sẽ nói \"chuối, thịt, sữa, bánh mì, gạo\"",-1,[["4","20 chủng loại với 3 đáp án"],["3","10 chủng loại với 3 đáp án"],["2","5 chủng loại với 2 đáp án"],["1","2 chủng loại với 2 đáp án"]]],["H27",1,7,"Nói tên chủng loại khi biết tên nhiều vật thuộc chủng loại đó","H/s sẽ có thể xác định được chủng loại khi biết 2 vật thuộc chủng loại đó","Khi nghe \"táo, chuối, lê đều là..., h/s sẽ trả lời \"trái cây\", \"đồ ăn\" hay \"thứ ăn được\"",-1,[["4","20 chủng loại khi biết ít nhất 2 vật trong chủng loại đó"],["3","10 chủng loại"],["2","5 chủng loại"],["1","2 loại khi biết ít nhất 2 vật trong chủng loại đó"]]],["H28",1,7,"Trả lời những câu hỏi \"Ai/của ai\"","H/s sẽ có thể trả lời những câu hỏi \"Ai/của ai\"","\"Đến lượt ai?\" \"Giày này của ai?\" \"Khi ốm con sẽ đến gặp ai?\" \"Ai dập tắt lửa?\"",-1,[["4","Trả lời trên 50 câu hỏi"],["3","25 câu hỏi"],["2","10 câu hỏi"],["1","trả lời ít nhất 5 câu hỏi"]]],["H29",1,7,"Trả lời câu hỏi \"Khi nào\"","H/s sẽ có thể trả lời những câu hỏi \"khi nào\"","\"Con ngủ khi nào?\". \"Con ăn khi nào?\"",-1,[["4","Trả lời ít nhất 50 câu"],["3","25 câu"],["2","10 câu"],["1","Ít nhất 5 câu"]]],["H30",1,7,"Phân biệt câu hỏi về đồ vật với câu hỏi về hoạt động","Khi thảo luận về một vật hay 1 hoạt động, h/s biết phân biệt các dạng câu hỏi \"Cái gì\", \"Ở đâu\", \"Ai\" hay \"Khi nào\"","Con đi mua sữa ở đâu? Ai đưa con đến cửa hàng? Con có thể mua đồ ăn gì ở đó? Khi nào thì con đi? Quả táo màu gì? Mình lấy táo ở đâu? Chúng ta làm gì với táo?",-1,[["2","Có thể trả lời được ít nhất 4 loại câu hỏi theo bất cứ trình tự nào"],["1","Có thể trả lời được ít nhất 2 loại câu hỏi theo bất cứ trình tự nào"]]],["H31",1,7,"Trả lời những câu hỏi \"Cái nào\"","H/s sẽ có thể trả lời những câu hỏi \"cái nào\"","\"Đâu là con thú?\". \"Cái nào là giày?\". \"Con nào là con chó?\"",-1,[["4","Trả lời ít nhất 50 câu hỏi"],["3","25 câu hỏi"],["2","10 câu hỏi"],["1","Ít nhất 5 câu hỏi"]]],["H32",1,7,"Trả lời câu hỏi \"Như thế nào\"","H/s sẽ có thể trả lời câu hỏi \"Như thế nào\"","Con làm thế nào để đi đến trường?",-1,[["4","Trả lời ít nhất 50 câu hỏi"],["3","25 câu hỏi"],["2","10 câu hỏi"],["1","Ít nhất 5 câu hỏi"]]],["H33",1,7,"Trả lời những câu hỏi \"Tại sao\"","H/s có thể trả lời được những câu hỏi \"Tại sao\"","Tại sao em lại rửa tay?, Tại sao em ngủ?",-1,[["4","Trả lời ít nhất 50 câu hỏi"],["3","25 câu hỏi"],["2","10 câu hỏi"],["1","Ít nhất 5 câu hỏi"]]],["H34",1,7,"Mô tả các bước trong sinh hoạt thường ngày","H/s có thể mô tả các bước trong sinh hoạt hàng ngày","Khi được hỏi \"Em rửa tay như thế nào? H/s sẽ trả lời\" đi đến bồn, mở vòi nước, xát xà phòng vào tay...\"",-1,[["4","ít nhất 5 bước trong 2 hay hơn các chuỗi hành động"],["3","4 bước trong 1 chuỗi hành động"],["2","3 bước trong 1 chuỗi hành động"],["1","2 bước trong 1 chuỗi hành động"]]],["H35",1,7,"Nói tên hành động khi biết trình tự các bước","H/s có thể gọi tên hành động khi biết trình tự các bước","Khi được hỏi \"cô đang làm gì?\" và nghe tả \"Đến bồn nước, mở vòi nước, làm ướt tay, cầm xà phòng...\" h/s sẽ trả lời \"rửa tay\"",-1,[["4","Trả lời ít nhất 20 câu hỏi"],["3","Trả lời ít nhất 10 câu hỏi"],["2","Trả lời ít nhất 5 câu hỏi"],["1","Trả lời 2 câu hỏi"]]],["H36",1,7,"Nói tên đồ vật khi biết chức năng, đặc tính hay chủng loại (nhiều đặc tính)","H/s có thể nói tên đồ vật khi biết nhiều khía cạnh về vật đó (vd chức năng, đặc tính, chủng loại)","Khi nghe miêu tả \"Nó giòn, để ăn, mặn, ở trong túi...\", h/s sẽ trả lời \"khoai tây chiên\"",-1,[["4","Trả lời ít nhất 20 câu hỏi"],["3","Trả lời ít nhất 10 câu hỏi"],["2","Trả lời ít nhất 5 câu hỏi"],["1","Trả lời 2 câu hỏi"]]],["H37",1,7,"Hội thoại liên tưởng với dạng câu hỏi Có/Không :có thể, có phải, ...sẽ….phải không","H/s biết lắc/gật đầu hoặc nói \"có/không\" để trả lời các câu hỏi về một vật hay hoạt động không hiện hữu","Khi được hỏi \"tôi có thể mua ga ở tiệm giày không?\", H/s sẽ trả lời \"không\"",-1,[["4","Trả lời ít nhất 50 câu hỏi"],["3","25 câu hỏi"],["2","10 câu hỏi"],["1","Ít nhất 5 câu hỏi về những vật không hiện hữu"]]],["H38",1,7,"Trả lời câu hỏi có 2 tiêu chí quan trọng (câu hỏi phức hợp có nhiều đáp án)","H/s có thể có nhiều đáp án cho những câu hỏi có 2 thông số trọng yếu","Khi được hỏi kể tên 1 vài món ăn nóng, h/s sẽ nói \"bánh piza, spaghetti…\"",-1,[["4","4 đáp án với 5 câu hỏi khác nhau"],["3","3 đáp án cho 4 câu hỏi khác nhau"],["2","2 đáp án cho 3 câu hỏi khác nhau"],["1","2 đáp án cho 1 câu hỏi"]]],["H39",1,7,"Trả lời những câu hỏi có 3 tiêu chí quyết định (câu hỏi phức hợp với nhiều đáp án)","H/s có thể có nhiều đáp án cho những câu có 3 tiêu chí quyết định","Khi được yêu cầu kể tên con vật to lớn ở trang trại, HS nói \"ngựa, và bò\"",-1,[["4","4 đáp án cho 5 câu hỏi khác nhau"],["3","3 đáp án cho 4 câu hỏi khác nhau"],["2","2 đáp án cho 3 câu hỏi khác nhau"],["1","2 đáp án cho 1 câu hỏi khác nhau"]]],["H40",1,7,"Mô tả đồ vật","H/s sẽ có thể mô tả đồ vật bằng cách kể ra bạn có thể làm gì với vật đó, kể vài đặc tính và chủng loại của vật đó","Khi yêu cầu HS mô tả 1 chiếc xe hơi, h/s có thể nói \"cô dùng xe đi các nơi, nó có bánh xe, và cô đỗ nó ở gara\". \"Ngũ cốc là thứ ta ăn buổi sáng, cho vào bát và đổ sữa vào\"",-1,[["2","có thể mô tả ít nhất 20 đồ vật, kể được ít nhất 3 chi tiết liên quan đến đồ vật (không tính tên vật)"],["1","Có thể mô tả ít nhất 10 đồ vật, kể ra 2 chi tiết liên quan đến đồ vật (không tính tên vật)"]]],["H41",1,7,"Mô tả các bước theo trình tự trước sau trong sinh hoạt thường ngày","HS có thể kể bước nào xảy ra trước/sau bước nào theo trình tự trong sinh hoạt thường ngày","Khi được hỏi \"em làm gì trước khi ăn trưa?\" h/s sẽ nói \"rửa tay\", khi được hỏi \"Ăn trưa xong em làm gì\", h/s sẽ nói \"đổ rác\"",-1,[["4","Kể các bước trước và sau trong 10 hoạt động khác nhau"],["3","Kể các bước trước và sau trong 5 hoạt động khác nhau"],["2","Kể một bước trước và sau trong 2 hoạt động khác nhau"],["1","Kể một bước trước và sau trong 1 hoạt động"]]],["H42",1,7,"Trả lời những câu hỏi liên quan đến những sự kiện trong quá khứ và tương lai","H/s sẽ trả lời những câu hỏi đòi hỏi câu trả lời có liên quan đến những sự kiện trong quá khứ và tương lai","Khi đến trường... Em có thể nói em ăn sáng với gì không? Em có thể cho cô biết em sẽ làm gì cuối tuần này không?",-1,[["4","Trả lời 4 câu hỏi liên quan đến quá khứ hoặc tương lai cách đó 1 tháng"],["3","Trả lời 2 câu hỏi liên quan đến quá khứ hoặc tương lai cách đó 1 tháng"],["2","Trả lời 2 câu hỏi liên quan đến quá khứ hoặc tương lai cách đó 1 tuần"],["1","Trả lời 2 câu hỏi liên quan đến quá khứ hoặc tương lai trong ngày đó"]]],["H43",1,7,"Duy trì hội thoại với người lớn hoặc bạn","HS có thể duy trì hội thoại về một chủ đề trao qua đổi lại được ít nhất 5 lượt","5 lần trao đổi giữa học sinh này và một h/s khác về trận đấu bóng rổ",-1,[["2","5 lần trao đổi qua lại về ít nhất 10 chủ đề gồm cả việc h/s hỏi ít nhất 1 câu hỏi mới hay 1 nhận xét mới"],["1","3 lần trao đổi về ít nhất 5 chủ đề khác nhau"]]],["H44",1,7,"Trả lời những câu hỏi mới","H/s sẽ có thể trả lời những câu hỏi khác với câu được dạy","Lúc đầu khi được dạy trả lời câu hỏi \"Em làm gì với chiếc xe hơi\" (đi), h/s cũng có thể được hỏi tương tự như: \"Em cho cô biết xe hơi làm gì?\" hay \"xe hơi để làm gì?\"",-1,[["4","Ít nhất 20 câu hỏi mới"],["3","Ít nhất 10 câu hỏi mới"],["2","Ít nhất 5 câu hỏi mới"],["1","Ít nhất 2 câu hỏi mới"]]],["H45",1,7,"Trả lời những câu hỏi về tại những sự kiện hiện tại","H/s sẽ có thể trả lời những câu hỏi liên quan đến những sự kiện hiện tại","Khi được hỏi \"Em cho cô biết em sẽ làm gì vào 4 tháng 7 này?, h/s sẽ trả lời \"xem pháo hoa\"",-1,[["4","ít nhất 20 câu hỏi"],["3","ít nhất 10 câu hỏi"],["2","ít nhất 5 câu hỏi"],["1","ít nhất 2 câu hỏi"]]],["H46",1,7,"Trả lời câu hỏi có nhiều đáp án liên quan đến những sự kiện hiện tại","H/s sẽ có thể đưa ra nhiều đáp án cho những câu hỏi liên quan đến những sự kiện hiện tại","Khi được hỏi \"Em có thể cho cô biết em có thể làm gì vào 4 tháng 7 không? H/s sẽ trả lời \"xem pháo hoa, ăn tiệc\"",-1,[["4","20 loại với 3 đáp án"],["3","10 loại với 3 đáp án"],["2","5 loại với 2 đáp án"],["1","2 loại với 1 hay 2 đáp án"]]],["H47",1,7,"Trả lời câu hỏi có nhiều đáp án trong những buổi thảo luận nhóm","H/s sẽ có thể có nhiều đáp án cho những câu hỏi về nhiều chủ đề trong thảo luận nhóm","Khi được hỏi \"Sáng nay khi chúng tôi đi vào thì có chuyện gì xảy ra vậy? h/s sẽ nói \"Trời mưa\", Jack bước vào lớp, giầy của cậu ướt hết, khi được hỏi \"Hôm qua chúng ta làm gì?\" H/s sẽ trả lời \"làm bánh ạ\"",-1,[["2","Có ít nhất 2 nhận xét cho ít nhất 3 chủ đề trong 1 buổi thảo luận kéo dài 20 phút"],["1","Ít nhất 1 nhận xét cho ít nhất 2 chủ đề trong 1 buổi thảo luận kéo dài 10 phút"]]],["H48",1,7,"Kể lại/kể về trải nghiệm của mình","H/s sẽ có thể kể một câu truyện hay mô tả 1 sự kiện liên quan đến 1 chủ đề có ít nhất 5 phần","H/s có thể tả chuyện đi đến vườn thú gần đây nhất của mình (làm gì, ai ở đó?, nhìn thấy gì v.v...) h/s có thể kể 1 câu truyện với 3 chú lợn con\" v.v…",-1,[["2","miêu tả ít nhất 5 sự kiện / câu chuyện có ít nhất 5 phần"],["1","miêu tả ít nhất 1 sự kiện / câu chuyện có ít nhất 3 phần"]]],["H49",1,7,"Giao tiếp một cách tự nhiên","H/s có thể đưa ra những câu nhận xét phù hợp trong buổi thảo luận hay nói chuyện","",-1,[["2","Nhận xét 1 cách tự nhiên trong khi nói chuyện hay thảo luận ít nhất 10 lần mỗi ngày"],["1","Nhận xét 1 cách tự nhiên trong khi nói chuyện hay thảo luận ít nhất 10 lần một tuần (không cần nhắc)"]]],["I1",1,8,"Phát âm những tiếng rõ ràng","HS tự nói nhiều âm bao gồm cả từ có nghĩa","",-1,[["4","HS thường xuyên tự nói các từ hoặc âm có nghĩa tổng cộng ít nhất là 10 phút/giờ"],["3","tổng cộng 5 phút/giờ"],["2","tổng cộng 2 phút/giờ"],["1","âm có nghĩa tổng cộng ít nhất 10 phút/ngày"]]],["I2",1,8,"Tự động nói thành chữ hay nghe gần giống lời nói","Học sinh sẽ tự động nói nhiều chữ hay nhiều âm thanh giống lời nói","",-1,[["4","tự động khoảng 30 chữ 1 giờ (bao gồm ít nhất 5 chữ khác nhau)"],["3","trung bình ít nhất 10 chữ 1 giờ"],["2","trung bình ít nhất 1 chữ 1 giờ"],["1","ít nhất 5 chữ 1 ngày"]]],["I3",1,8,"Tự động nói thành câu","Học sinh sẽ tự động nói nhiều câu","",-1,[["4","Tự đông nói trung bình 30 nhóm từ 1 ngày (bao gồm ít nhất 5 từ khác nhau)"],["3","trung bình 10 nhóm từ 1 ngày"],["2","trung bình 5 nhóm từ 1 ngày"],["1","tự động nói trung bình 1 nhóm từ 1 ngày"]]],["I4",1,8,"Hát bài hát theo mẫu","Học sinh sẽ tự động hát theo những người đang hát khác","",-1,[["4","hát ít nhất 2 câu từ 5 bài hát"],["3","hát 1 câu từ 5 bài hát"],["2","hát 1 câu từ 2 bài hát"],["1","hát 1 câu từ 1 bài hát"]]],["I5",1,8,"Hát bài hát","Học sinh sẽ tự động hát mà không có ai hát trước","",-1,[["4","hát ít nhất 2 nhóm từ 5 bài hát"],["3","1 nhóm từ từ 5 bài hát"],["2","hát 1 nhóm từ từ 2 bài hát"],["1","1 từ từ 1 bài hát"]]],["I6",1,8,"Tự động lập lại tiếng nói","Học sinh sẽ tự động lập lại những từ do người khác nói","",-1,[["2","tự nhắc lại lời của người khác ít nhất 5 lần một ngày"],["1","tự nhắc lại lời của người khác ít nhất 5 lần một tuần"]]],["I7",1,8,"Tự động yêu cầu","Học sinh sẽ tự động yêu cầu đồ vạt, hành động hay 1 sinh hoạt nào đó","",-1,[["2","tự yêu cầu ít nhất 10 vật/hành động một ngày"],["1","tự yêu cầu ít nhất 10 vật/hành động một tuần"]]],["I8",1,8,"Tự động đặt tên","Học sinh sẽ tự động đặt tên cho đồ vật, hành động hay sự kiện","",-1,[["2","tự gọi tên sự vật, hành động, hay sự kiện ít nhất 10 vật/ngày"],["1","tự gọi tên sự vật, hành động, hay sự kiện ít nhất 10 vật/tuần"]]],["I9",1,8,"Trò chuyện tự nhiên","Học sinh sẽ tự động thêm vào những ý kiến có liên quan đến 1 mẩu đối thoại hay đàm thoại đang xảy ra","",-1,[["2","tự bình phẩm khi đang đối thoại hay tranh luận ít nhất 10 lần/ngày"],["1","tự bình phẩm khi đang đối thoại hay tranh luận ít nhất 10 lần/tuần"]]],["J1",1,9,"Số lượng trung bình các từ trong câu trả lời","HS có thể nói đoạn câu hoặc cả câu bao gồm tới 5 từ","Cậu bé đang về nhà",-1,[["4","cụm từ / câu gồm 5 từ hay hơn"],["3","4 từ"],["2","3 từ"],["1","2 từ"]]],["J2",1,9,"Cú pháp (trật tự các từ)","Học sinh biết kết hợp các từ thành cụm từ / câu theo đúng trật tự từ (td: danh từ + tính từ, động từ + trạng từ, danh từ + động từ)","danh từ + tính từ: Quả bóng đỏ, danh từ + động từ: cậu bé đang chạy, mạo từ: cậu bé đang chạy",-1,[["4","câu gồm ít nhất 4 từ đúng trật tự"],["3","thỉnh thoảng nói câu 4 từ đúng trật tự"],["2","thỉnh thoảng nói câu 3 từ đúng trật tự"],["1","thỉnh thoảng nói câu 2 từ đúng trật tự"]]],["J3",1,9,"Mạo từ","Học sinh sẽ có thể dùng mạo từ (td \"cái\" bàn) khi nói thành câu / cụm từ","một con chó, một quả táo, con lợn",-1,[["2","thường dùng mạo từ đúng chỗ"],["1","thỉnh thoảng dùng mạo từ đúng chỗ"]]],["J4",1,9,"Động từ - hiện tại tiếp diễn (ĐANG)","Học sinh biết diễn tả thì hiện tại tiếp diễn bằng cách thêm từ ĐANG vào trước động từ","đang ăn, đang ngủ, đang rửa mặt",-1,[["2","thường biết thêm từ ĐANG vào trước động từ đúng ngữ cảnh"],["1","có lúc biết thêm từ ĐANG vào trước động từ đúng ngữ cảnh"]]],["J5",1,9,"Số nhiều","Học sinh biết thêm từ CÁC, NHỮNG… vào trước danh từ để chỉ số nhiều","những cái nón, những con mèo",-1,[["2","luôn thêm từ NHỮNG/CÁC trước danh từ đúng ngữ cảnh"],["1","có lúc thêm từ NHỮNG/CÁC trước danh từ đúng ngữ cảnh"]]],["J6",1,9,"Động từ - thời quá khứ","HS biết dùng từ ĐÃ trước động từ để diễn tả thời quá khứ","bơi - đã bơi",-1,[["2","thường dùng từ ĐÃ trước động từ đúng ngữ cảnh"],["1","có lúc dùng từ ĐÃ trước động từ đúng ngữ cảnh"]]],["J7",1,9,"Nói tắt","HS biết dùng từ tắt trong câu / cụm từ khi nói (vd Bà ấy - Bả)","",-1,[["2","luôn dùng từ tắt đúng ngữ cảnh"],["1","có lúc dùng từ tắt đúng ngữ cảnh"]]],["J8",1,9,"Chia trợ động từ đúng ngôi","KHÔNG ÁP DỤNG VỚI TIẾNG VIỆT"],["J9",1,9,"Động từ - thì quá khứ thường","KHÔNG ÁP DỤNG VỚI TIẾNG VIỆT"],["J10",1,9,"Sở hữu cách","Học sinh biết dùng từ CỦA để diễn tả sở hữu cách","Xe của bố… đuôi của con mèo",-1,[["2","thường dùng từ CỦA để diễn tả sở hữu cách đúng ngữ cảnh"],["1","có lúc dùng từ CỦA để diễn tả sở hữu cách đúng ngữ cảnh"]]],["J11",1,9,"Thể phủ định","Học sinh biết dùng từ KHÔNG để nói phủ định trong câu / cụm từ","Không làm, sẽ không làm, không làm được",-1,[["2","thường dùng thể phủ định đúng ngữ cảnh"],["1","có lúc dùng thể phủ định đúng ngữ cảnh"]]],["J12",1,9,"Từ chỉ nơi chốn","Học sinh biết diễn đạt nơi chốn (ĐÂY, KIA) khi nói cả câu / cụm từ","ĐÂY - KIA",-1,[["2","thường dùng định từ đúng ngữ cảnh"],["1","có lúc dùng định từ đúng ngữ cảnh"]]],["J13",1,9,"Thì tương lai","Học sinh biết dùng từ SẼ để diễn đạt thì tương lai trong câu / cụm từ (vd tôi sẽ về)","Tôi sẽ về…",-1,[["2","thường dùng từ SẼ để chỉ thì tương lai đúng ngữ cảnh"],["1","có lúc dùng từ SẼ để chỉ thì tương lai đúng ngữ cảnh"]]],["J14",1,9,"Từ nối","Học sinh biết dùng từ nối để kết nối từ và câu (nhưng, nếu, vì, chỉ, khi, và, bởi vì, sau đó, chỉ khi, hoặc là, không mà cũng không…)","chó và mèo; mẹ hay bố; ấm nhưng không nóng",-1,[["2","thường dùng từ nối phần lớn thời gian đúng chỗ"],["1","có lúc dùng từ nối đúng chỗ"]]],["J15",1,9,"Số nhiều bất quy tắc","KHÔNG ÁP DỤNG VỚI TIẾNG VIỆT"],["J16",1,9,"Từ so sánh","Học sinh biết dùng các tiền tố/hậu tố HƠN/KÉM/NHẤT kèm với tính từ để thể hiện cấp so sánh","to hơn… to nhất.",-1,[["2","thường dùng các tiền tố/hậu tố này để thể hiện cấp so sánh đúng ngữ cảnh"],["1","có lúc dùng các tiền tố/hậu tố này để thể hiện cấp so sánh đúng ngữ cảnh"]]],["J17",1,9,"Định từ","HS biết dùng định từ (đây, kia, này, đó) để chỉ rõ các vật trong câu nói / cụm từ","",-1,[["2","thường dùng định từ để chỉ rõ các vật đúng ngữ cảnh"],["1","có lúc dùng định từ để chỉ rõ các vật đúng ngữ cảnh"]]],["J18",1,9,"Nêu mức độ chắc chắn của lời nói","HS biết dùng các từ/cụm từ để nêu mức độ chắc chắn của lời mình nói (vd tôi nghĩ là, đoán là, biết là, tin là…)","tôi nghĩ tôi đã vẽ xong.. tôi đoán là, tôi biết là, tôi tin là, có lẽ, có vẻ như là",-1,[["2","thường dùng các từ khẳng định mức độ chắc chắn của lời mình nói khi cần"],["1","có lúc dùng các từ khẳng định mức độ chắc chắn của lời mình nói"]]],["J19",1,9,"Dùng từ định lượng trong lời nói","HS biết dùng các từ/cụm từ định lượng trong lời nói (vd tất cả, một vài, thỉnh thoảng, không bao giờ, một, luôn luôn)","Tôi muốn tất cả xe tải, tất cả, thỉnh thoảng, không bao giờ, luôn luôn…",-1,[["2","thường dùng các từ chỉ định lượng khi cần"],["1","có lúc dùng các từ chỉ định lượng khi cần"]]],["J20",1,9,"Diễn tả thái độ trong lời nói","HS biết dùng từ/cụm từ để diễn tả thái độ trong lời nói (vd Tôi lấy làm tiếc phải báo cho anh biết là, Xin lỗi nhưng…, Tôi rất vui được nói là…)","tôi rất tiếc khi nghe tin anh bệnh, rất buồn là tôi không đến được, tôi mừng là anh đã đi cùng",-1,[["2","thường dùng từ để diễn tả thái độ trong lời nói khi cần"],["1","có lúc dùng từ để diễn tả thái độ trong lời nói khi cần"]]],["K1",3,10,"Khám phá đồ chơi quanh mình","Học sinh sẽ tích cực khám phá nhiều loại đồ chơi quanh mình","",-1,[["2","chơi 1 hay nhiều loại đồ chơi ít nhất 2 phút trong khoảng thời gian 10 phút"],["1","cầm và/hay chơi ít nhất 1 món đồ chơi trong vòng 10 phút"]]],["K2",3,10,"Cho phép người khác được sờ/chơi đồ chơi","HS chịu để người lớn và trẻ khác ngồi gần khi đang chơi đồ chơi và cho phép người khác thỉnh thoảng chơi đồ chơi trong khi tương tác","",-1,[["2","cho phép người lớn và các trẻ khác thỉnh thoảng được chơi đồ chơi khi HS đang chơi"],["1","cho phép trẻ khác được ngồi gần khi đang chơi đồ chơi"]]],["K3",3,10,"Các hoạt động độc lập bên ngoài","HS có thể tham gia vào các hoạt động độc lập phù hợp bên ngoài","Chơi bóng rổ, cầu trượt, xích đu, xe trẻ em, hộp cát, v.v…",-1,[["4","chọn và tham gia ít nhất 3 hoạt động trong vòng ít nhất 15 phút"],["3","3 hoạt động trong 10 phút"],["2","2 hoạt động trong 10 phút"],["1","2 hoạt động trong 5 phút"]]],["K4",3,10,"Tham gia các hoạt động vui chơi độc lập trong phòng","HS có thể tham gia vào các hoạt động độc lập phù hợp trong phòng","Xem sách hoặc video, nghe nhạc, giải đố xếp hình",-1,[["4","chọn và tham gia chơi ít nhất 3 trò trong ít nhất 15 phút"],["3","3 trò trong 10 phút"],["2","2 trò trong 10 phút"],["1","2 trò trong 5 phút"]]],["K5",3,10,"Biết chơi và sử dụng đồ chơi đúng tính năng","HS tích cực chơi đồ chơi đúng tính năng","",-1,[["2","chơi ít nhất 2 đồ chơi đúng tính năng mà không cần nhắc trong ít nhất 10 phút"],["1","chơi ít nhất 1 đồ chơi đúng tính năng trong ít nhất 10 phút đôi khi còn phải nhắc"]]],["K6",3,10,"Chơi độc lập với đồ chơi và có đối đáp bằng lời","Học sinh sẽ có thể nói chuyện khi chơi các trò chơi một mình","",-1,[["4","trong lúc chơi độc lập, có tham gia đối đáp bằng lời ít nhất 10 lần trong vòng 20 phút"],["3","5 lần đối đáp"],["2","2 lần đối đáp"],["1","1 lần trong 20 phút"]]],["K7",3,10,"Tương tác nhiều lần với đồ chơi theo 1 chủ đề","Học sinh sử dụng đồ chơi đúng chủ đề (VD đồ nhà bếp, búp bê, các nhân vật hành động)","Đẩy ôtô đồ chơi xuống dốc, giả vờ đổ xăng vào xe, cho xe vào nhà xe. Giả vờ tổ chức tiệc trà",-1,[["4","tự chơi ít nhất 5 trò với 5 loại đồ chơi"],["3","ít nhất 5 trò với 2 loại đồ chơi"],["2","ít nhất 5 trò với 1 loại đồ chơi"],["1","ít nhất 2 trò với 1 loại đồ chơi"]]],["K8",3,10,"Chơi tương tác với các bạn","Học sinh sẽ có thể tham gia các trò chơi tương tác cùng các bạn","",-1,[["4","tương tác với các bạn và đồ chơi trong vòng 10 phút (có biết yêu cầu)"],["3","tương tác với các bạn và đồ chơi trong vòng 5 phút (có biết yêu cầu)"],["2","cho bạn đồ chơi khi bạn xin và nhận đồ chơi khi bạn cho mình"],["1","nhận đồ chơi bạn cho"]]],["K9",3,10,"Chơi tương tác với nhiều bạn","HS tham gia chơi tương tác với nhiều bạn","",-1,[["4","chơi tương tác với ít nhất 8 bạn (với từng bạn hoặc trong cả nhóm)"],["3","chơi tương tác với ít nhất 6 bạn (với từng bạn hoặc trong cả nhóm)"],["2","chơi tương tác với ít nhất 4 bạn (với từng bạn hoặc trong cả nhóm)"],["1","chơi tương tác với ít nhất 2 bạn (với từng bạn hoặc trong cả nhóm)"]]],["K10",3,10,"Đóng giả các tình huống xã hội","HS chơi đóng vai các nhân vật hoặc các hoạt động","",-1,[["4","biết đóng giả ít nhất 10 nhân vật hoặc 10 hoạt động"],["3","ít nhất 5 nhân vật hoặc hoạt động"],["2","ít nhất 2 nhân vật hoặc hoạt động"],["1","ít nhất 1 nhân vật hoặc hoạt động"]]],["K11",3,10,"Vừa chơi đồ chơi vừa nói chuyện với bạn cùng lứa","Học sinh sẽ yêu cầu đồ vật hay hành động, gọi tên đồ vật và hành động, và có những bình luận khi chơi","",-1,[["4","trong khi chơi với bạn, đối đáp ít nhất 10 lần trong vòng 10 phút"],["3","5 lần đối đáp trong 10 phút"],["2","2 lần đối đáp trong 10 phút"],["1","1 lần đối đáp trong 10 phút"]]],["K12",3,10,"Chơi bóng trò đơn giản","HS biết tự chơi các trò lăn, ném, đá và đập bóng với một bạn được 5 lượt","lăn, ném, đá bóng cho bạn",-1,[["4","tự chơi bóng được ít nhất 3 trò với bạn trong 5 lượt (đợi bạn ném bóng cho, chờ xem bạn đã sẵn sàng bắt bóng chưa)"],["3","tự chơi bóng được ít nhất 2 trò trong ít nhất 3 lượt"],["2","1 trò nếu thỉnh thoảng ta nhắc bé quan sát xem bạn đã sẵn sàng bắt bóng chưa HOẶC để ý bạn sắp làm gì"],["1","1 trò nếu thỉnh thoảng ta nhắc bé quan sát xem bạn đã sẵn sàng bắt bóng chưa VÀ để ý bạn sắp làm gì"]]],["K13",3,10,"Chơi phối hợp với bạn","HS để bạn hướng dẫn chơi một hoạt động phối hợp (làm theo chỉ dẫn của bạn)","Lăn bóng nhanh hoặc chậm (tùy theo hành động hoặc theo yêu cầu của bạn chơi), cho dù bay lên và xuống theo hướng dẫn hoặc động tác của bạn chơi, làm \"trợ lý\" khi cùng bạn xây nhà bằng các khối, đu trên lốp theo cùng nhịp với bạn, chuyển từ ném bóng sang đập bóng cho bạn, đợi tín hiệu cho tàu chạy",-1,[["4","làm theo chỉ dẫn bạn nói cho và ám chỉ với ít nhất 4 trò"],["3","làm theo chỉ dẫn bạn nói cho và ám chỉ với ít nhất 3 trò"],["2","làm theo chỉ dẫn bạn nói cho và ám chỉ với ít nhất 1 trò"],["1","làm theo chỉ dẫn bạn nói ra trong ít nhất 1 trò mà không cần nhắc nhiều"]]],["K14",3,10,"Các trò chơi tương tác về vận động","HS chơi trò chơi tương tác đòi hỏi phải để ý hành động của người khác và điều chỉnh mức độ tham gia của mình tùy theo hành vi của bạn","Chơi trò đuổi bắt, chơi hội đồng tổng cốc, chơi chạy tiếp sức, đá bóng chày",-1,[["4","có thể chơi được ít nhất 3 trò tương tác không cần trợ giúp"],["3","có thể chơi được ít nhất 2 trò tương tác không cần trợ giúp"],["2","chỉ cần nhắc đôi chút để tập trung xem bao giờ đến lượt mình HOẶC hoàn thành hành động"],["1","có thể tham gia chơi nhưng cần phải nhắc để tập trung xem bao giờ đến lượt mình VÀ để hoàn thành những việc cần thực hiện khi chơi (không phải nhắc hoàn toàn)"]]],["K15",3,10,"Chơi cờ các loại","HS biết chơi cờ với bạn","Carryland, Uno, Go Fish, v.v…",-1,[["4","chơi được ít nhất 3 loại cờ không cần giúp"],["3","chơi được ít nhất 2 loại cờ không cần giúp"],["2","chỉ cần nhắc đôi chút để tập trung xem bao giờ đến lượt mình HOẶC hoàn thành hành động"],["1","có thể tham gia chơi nhưng cần phải nhắc để tập trung xem bao giờ đến lượt mình VÀ để hoàn thành những việc cần thực hiện khi chơi (không phải nhắc hoàn toàn)"]]],["L1",3,11,"Cư xử thích hợp khi gần bạn học hay anh chị","Học sinh sẽ có những hành động giao tiếp đúng đắn khi gần bạn học hay người thân","",-1,[["4","cư xử thích hợp trong ít nhất 30 phút"],["3","trong 15 phút"],["2","trong 5 phút chỉ cần nhắc 1 lần"],["1","trong ít nhất 5 phút nhưng phải nhắc nhở nhiều lần"]]],["L2",3,11,"Nhận vật người khác cho","Nhận vật yêu thích từ bạn và anh chị","",-1,[["2","luôn đi đến và nhận vật đó từ bạn và người lớn ở cách khoảng 2,5m"],["1","nhận vật đó từ bạn và người lớn ở cách khoảng 1 m"]]],["L3",3,11,"Chấp nhận/phản ứng đúng mực khi bạn và anh chị sờ vào người","HS sẽ phản ứng đúng mực (VD không khóc hoặc không tìm cách tránh xa) với những tiếp xúc thiện ý từ người khác (VD nắm và cầm tay, giúp ngồi lên xích đu)","nắm và cầm tay, giúp giải quyết rắc rối",-1,[["2","sẵn lòng để bạn/anh chị và người lớn sờ vào người một cách thiện chí và thường luôn hỗ trợ họ"],["1","cho phép người khác sờ vào một cách thiện chí và hỗ trợ họ nếu họ tiếp cận HS một cách thận trọng"]]],["L4",3,11,"Tỏ ra quan tâm đến thái độ của người khác","HS sẽ để ý hay quan tâm đến hành vi bằng lời hoặc hành động của bạn","Xem các bạn chơi đồ chơi hoặc giả vờ đóng vai một nhân vật yêu thích của trẻ em",-1,[["2","chú ý đến hành vi bằng lời hoặc hành động của bạn"],["1","chú ý đến hành động của bạn"]]],["L5",3,11,"Nhìn người khác để bắt chuyện","Học sinh sẽ nhìn người khác (người lớn và bạn học) để bắt chuyện","",-1,[["2","học sinh chủ động giao tiếp với người lớn và bạn học bằng cách nhìn họ"],["1","học sinh chỉ thỉnh thoảng nhìn để bắt chuyện"]]],["L6",3,11,"Lại gần người khác để giao lưu","Học sinh sẽ đến gần người khác và tìm cách dùng hành động để lôi cuốn người khác cùng giao lưu kể cả khi người đó không có vật hấp dẫn HS","",-1,[["2","thường xuyên lại gần và tìm cách dùng hành động để rủ người khác giao lưu"],["1","thỉnh thoảng lại gần và tìm cách dùng hành động để rủ người khác giao lưu"]]],["L7",3,11,"Nhìn người khác đợi họ làm xong một hành động yêu thích","HS sẽ nhìn người đối thoại (chờ đợi) khi người đó sắp sửa làm một hành động đem lại điều HS muốn","Chờ con búp bê trong hộp nhô ra khi bạn quay tay quay - chờ bạn xì hơi từ quả bóng để xác bóng lượn quanh phòng",-1,[["2","luôn nhìn một người đợi người đó lặp lại một hành động mong muốn"],["1","nếu được nhắc, HS sẽ nhìn một người đợi người đó lặp lại một hành động mong muốn"]]],["L8",3,11,"Nghe và đáp ứng","Học sinh sẽ có thể nghe và làm theo hướng dẫn đơn giản của 1 người khác","Lại đây, ngồi xuống, quay lại… đứng lên",-1,[["2","làm theo chỉ dẫn của người lớn và bạn học ít nhất 75% số lần"],["1","thường làm theo chỉ dẫn của người lớn ít nhất 75% số lần"]]],["L9",3,11,"Bắt chước bạn","Học sinh sẽ chú ý để lặp lại những hành động và lời nói của bạn học","Làm điệu bộ chân và tay khi hát hay nghe nhạc",-1,[["2","bắt chước các chuỗi động tác hay lời nói gồm nhiều bước của bạn học"],["1","bắt chước những động tác đơn giản, một bước của bạn học"]]],["L10",3,11,"Chào lại","Học sinh sẽ đáp lại lời chào của người khác","nhắc nhở gián tiếp: \"Phải nói thế nào?\"",-1,[["2","chào đáp lại bạn không cần nhắc"],["1","chào đáp lại bạn nhưng còn phải nhắc gián tiếp"]]],["L11",3,11,"Dùng hành động giục người khác làm 1 việc","Học sinh có đến gần và dùng hành động giục người khác làm việc gì đó","",-1,[["4","tự động giục nhiều lần"],["3","thỉnh thoảng tự động giục nhiều lần"],["2","tự động giục chỉ một lần"],["1","giục chỉ 1 lần nếu được nhắc"]]],["L12",3,11,"Hưởng ứng khi có bạn lại gần và tìm cách giao lưu","HS sẽ hồi đáp đúng mực khi có bạn lại gần và tìm cách giao lưu (VD chơi đồ chơi hay trò chơi, tham giao một hoạt động bên ngoài)","Bạn rủ tham gia chơi trò \"Hội đồng tổng cốc\" và HS sẽ ngồi tham gia cùng",-1,[["2","sẵn sàng tham gia các trò bạn rủ một cách vui vẻ"],["1","nếu bạn tiếp cận một cách thận trọng, sẽ tham gia một số trò bạn rủ"]]],["L13",3,11,"Cùng chơi - cho bạn khác đồ của mình","HS đồng ý để người khác dùng đồ vật HS đang dùng hoặc của HS","Để người khác lấy đồ của mình",-1,[["2","luôn đồng ý không cần nhắc"],["1","đồng ý khi được nhắc"]]],["L14",3,11,"Đi tìm người vắng mặt","HS sẽ đi tìm một người quan trọng với HS nếu HS không thấy người đó đâu","Khi bạn đang chơi với HS rồi đi sang một phòng khác, HS sẽ đi tìm bạn",-1,[["2","luôn đi tìm người vắng mặt sau khi đã tham gia vào một hoạt động vui nhộn với người lớn và bạn"],["1","luôn đi tìm người vắng mặt nếu người đó mang theo vật HS thích"]]],["L15",3,11,"Chủ động yêu cầu người khác chú ý đến","HS sẽ chủ động giao lưu với người khác và nhìn xem có ai để ý đến HS không","HS trèo lên cầu trượt, dậm chân và nói \"Con trượt xuống đây\" rồi nhìn xem có ai để ý đến mình không trước khi trượt xuống",-1,[["2","tham gia các hoạt động để thu hút sự chú ý của người khác và nhìn xem họ có chú ý xem HS làm gì không ít nhất 3 lần/ngày"],["1","tham gia các hoạt động để thu hút sự chú ý của người khác và nhìn xem họ có chú ý xem HS làm gì không ít nhất 6 lần/tuần (Không kể những hành động quậy phá để người khác chú ý)"]]],["L16",3,11,"Nói tên các vật cho người khác biết","Học sinh tự động nói tên các vật cho người lớn và các bạn biết","Khi bé nhìn thấy máy bay trên trời, bé sẽ chỉ và nói \"máy bay kìa\"",-1,[["4","nói tên nhiều đồ vật cho 3 bạn học và người lớn biết không cần nhắc"],["3","làm 1 lần cho 1 bạn và nhiều lần cho người lớn mà không cần nhắc"],["2","làm 1 lần cho 1 bạn không cần nhắc"],["1","1 lần cho người lớn không cần nhắc"]]],["L17",3,11,"Giao tiếp mắt","Học sinh biết giao tiếp mắt hợp lý khi giao tiếp với người khác","",-1,[["2","Khi lắng nghe và đối đáp với người lớn và bạn học"],["1","Khi lắng nghe và đối đáp với người lớn mà thôi"]]],["L18",3,11,"Hỏi xin bạn học (từng) đồ vật","Học sinh sẽ hỏi xin bạn từng vật một","Xin bạn 1 ô tô đồ chơi",-1,[["2","tự động và thường xuyên hỏi xin bạn đồ vật không cần nhắc"],["1","chỉ hỏi khi được nhắc"]]],["L19",3,11,"Chơi/dùng chung - xin được chơi/dùng chung đồ vật gì đó","Học sinh biết xin được dùng/chơi chung (nhiều) vật dụng","Cùng chơi chung đồ vật, và mỗi học sinh có phần riêng của mình",-1,[["2","thường không cần nhắc nhở"],["1","chỉ làm khi có nhắc nhở"]]],["L20",3,11,"Chia sẻ - cho người khác đồ vật của mình","Học sinh mời người khác chơi chung/dùng chung đồ vật của mình","",-1,[["4","thường tự cho nhiều lần"],["3","thỉnh thoảng tự cho nhiều lần"],["2","tự cho một lần"],["1","cho một lần khi được nhắc"]]],["L21",3,11,"Chủ động chào trước","Học sinh sẽ chủ động chào trước","VD nhắc nhở gián tiếp: \"Hãy nhìn xem ai đến kìa!\"",-1,[["2","học sinh chào bạn không cần nhắc"],["1","học sinh chào bạn khi nhắc nhở bằng lời"]]],["L22",3,11,"Tham gia cùng các bạn trong các hoạt động","HS biết tiếp cận và tham gia cùng các bạn vào một hoạt động","Khi các bạn chơi rồng rắn lên mây, HS sẽ tham gia cùng, các bạn chơi xếp khối hình, HS sẽ đến chỗ các bạn và giúp đỡ",-1,[["2","HS sẽ tham gia vào nhóm trẻ đang làm một hoạt động thích thú mà không cần người lớn gợi ý"],["1","HS sẽ tham gia vào nhóm trẻ đang làm một hoạt động thích thú chỉ khi người lớn gợi ý"]]],["L23",3,11,"Quan sát hướng chú ý của các bạn","HS biết quan sát xem các bạn đang chú ý đến vật gì hay sự kiện gì","Bọn trẻ thấy cô giáo mở lọ thổi bong bóng ra liền chạy về phía cô… HS thấy các bạn chạy về phía cô và cũng chạy đến xem có cái gì",-1,[["2","thường đến xem hoặc lại gần để tìm hiểu xem có cái gì hay sự kiện gì khi một vài bạn chuyển hướng chú ý sang vật đó hay sự kiện đó"],["1","thường đến xem hoặc lại gần để tìm hiểu xem có cái gì hay sự kiện gì khi nhiều bạn chỉ một vật hoặc di chuyển và tập trung chú ý vào một vật hay sự kiện"]]],["L24",3,11,"Tiếp thu lời nói của bạn","HS biết nghe bạn điều chỉnh hành vi để gần gũi với các bạn hơn","Đứng cách các bạn một khoảng vừa phải, ngồi trật tự, nói với giọng vừa phải, chịu đứng trong hàng, tay không nghịch ngợm",-1,[["2","thường nghe theo những gì bạn nói hoặc ngầm định trong nhiều bối cảnh"],["1","chịu nghe lời ít nhất một bạn để điều chỉnh hành vi trong ít nhất một hoàn cảnh"]]],["L25",3,11,"Điều chỉnh hành vi khi thấy bạn thay đổi hành động","Khi đang tham gia hoạt động lớp, HS biết để ý những thay đổi trong hành vi của bạn để điều chỉnh ứng xử của mình đáp lại bạn","Dừng lại khi thấy các bạn dừng (khi không nắm tay), cùng bạn bê một cái một mà không làm đổ các thứ trong hộp",-1,[["2","thường xuyên để ý và điều chỉnh theo hành vi của bạn"],["1","đôi lúc để ý và điều chỉnh theo hành vi của bạn"]]],["L26",3,11,"Giúp người khác cùng tham gia","Khi người khác cho thấy họ không thể lấy được một vật hoặc không thể quan sát hay nghe được cái gì, HS biết sắp xếp lại các thứ để bạn có thể cùng tham gia hoạt động đó","Bạn không nhìn thấy một bức tranh trong sách, HS sẽ dịch sang một bên để bạn cũng có thể nhìn thấy",-1,[["2","thường xuyên điều chỉnh để giúp bạn khi bạn gián tiếp cho biết mình có khó khăn (mình không nhìn thấy)"],["1","thường xuyên điều chỉnh để giúp bạn khi bạn yêu cầu HS làm một hành động (VD dịch sang)"]]],["L27",3,11,"Nói được người khác thích/không thích cái gì","HS có thể nói được người khác thích cái gì và hoạt động gì cũng như ai thích cái gì và hoạt động gì","Nói được Jake thích chuối còn Emily không thích. Khi hỏi ai thích ăn chuối, HS sẽ nói \"Jake\"",-1,[["2","biết ít nhất 2 vật mà ít nhất 4 người khác thích và không thích"],["1","biết ít nhất 2 vật mà ít nhất 2 người khác thích và không thích"]]],["L28",3,11,"Hướng sự chú ý của người khác đến thứ họ quan tâm","HS biết hoạt động gì, tin gì hay vật gì sẽ được người nào đó đặc biệt quan tâm và hướng sự chú ý của người đó đến những thứ đó","HS biết Jason thích bóng bầu dục, vì thế liền bảo Jason là Tyler mang bóng bầu dục đến trường hôm nay",-1,[["2","thường xuyên hướng sự chú ý của một vài bạn và người lớn đến những thứ họ quan tâm"],["1","có thể hướng sự chú ý của ít nhất 1 người đến những gì người đó quan tâm ít nhất 2 lần/tuần"]]],["L29",3,11,"Để ý phản ứng của người khác","HS biết để ý và đáp lại phản hồi của người khác cho thấy quan tâm của họ với một chủ đề hay hoạt động","HS nói về nhân vật phim mình thích nhưng để ý thấy bạn không hứng thú lắm, liền tìm một bạn khác quan tâm đến chủ đề này",-1,[["2","luôn nhận ra phản hồi trên nét mặt của bạn (VD cười và tỏ ra quan tâm, nhìn ra chỗ khác) chứng tỏ người đó có quan tâm đến thứ gì đó không"],["1","có phản ứng với mức độ quan tâm của bạn chỉ khi bạn nói thẳng ra chúng có hay không quan tâm"]]],["L30",3,11,"Truyền đạt một thông điệp","HS sẽ biết đi đến chỗ một người và nhắc lại một lời nhắn ngắn do người khác yêu cầu nói lại","Mẹ bảo bé \"bảo bố đến giúp mẹ\" và bé sẽ đi sang phòng khác và nói \"Mẹ cần bố giúp\"",-1,[["2","biết đi tìm một người, thu hút sự chú ý của họ và nói lại một lời nhắn bốn từ sau khi đi sang phòng kế bên"],["1","biết nói lại lời nhắn ba từ sau khi đến hết phòng"]]],["L31",3,11,"Đợi đến khi những người đối thoại dừng lời mới nói xen vào","HS biết đợi đến khi những người đang đối thoại dừng lời mới nói với một người trong số đó","Hai người đang nói chuyện, bé sẽ đợi (nhìn) cho đến khi một trong hai người đồng ý thì mới nói",-1,[["2","khi người khác đang nói chuyện, bé luôn đợi một người nhìn bé rồi mới nói hoặc tập trung sự chú ý của họ một cách đúng mực (xin lỗi)"],["1","sẽ đợi người đối thoại nói xong nếu một trong số họ ra hiệu bé hãy đợi"]]],["L32",3,11,"Trò chuyện với người khác","HS sẽ trò chuyện với các bạn và người lớn trao đổi qua lại 3 lượt","",-1,[["4","ít nhất 3 lần trao đổi với bạn và người lớn"],["3","2 lần trao đổi với bạn và người lớn"],["2","1 lần trao đổi với bạn và người lớn"],["1","1 lần trao đổi với người lớn"]]],["L33",3,11,"Hỏi thông tin","Học sinh tự động hỏi người lớn và bạn để biết thông tin","",-1,[["2","thường xuyên tự động hỏi người lớn và bạn thông tin"],["1","thỉnh thoảng tự động hỏi người khác thông tin"]]],["L34",3,11,"Giành lấy và duy trì sự chú ý của người khác","Học sinh sẽ có thể giành lấy và duy trì sự chú ý của người khác trước khi hướng dẫn người đó","gọi tên người đó, vỗ vào vai người đó, đi đến trước mặt người đó",-1,[["4","giành và duy trì được tương tác với bạn và người lớn"],["3","kiên trì tìm cách thu hút sự chú ý của người lớn và bạn"],["2","có thể giành sự chú ý của những người lớn và bạn học đang quan tâm đến bé"],["1","có thể giành sự chú ý của những người lớn đang quan tâm đến bé"]]],["M1",2,12,"Ngồi sinh hoạt theo nhóm nhỏ","HS sẽ ngồi yên không quấy phá trong 1 nhóm học tập nhỏ","",-1,[["4","nhóm 1 cô : 4 trò trong 15 phút"],["3","nhóm 1:3 trong 10 phút"],["2","nhóm 1:2 trong 10 phút"],["1","nhóm 1:2 trong 5 phút"]]],["M2",2,12,"Ngồi sinh hoạt theo nhóm lớn","HS sẽ ngồi yên không quấy phá trong 1 nhóm học tập","",-1,[["4","nhóm 1 cô : 16 trò trong 15 phút"],["3","nhóm 1:12 (hay 1:16)"],["2","nhóm 1:8"],["1","nhóm 1:6 trong 15 phút"]]],["M3",2,12,"Chú ý đến GV trong nhóm","HS sẽ chú ý đến lời của GV trong lúc học nhóm nhỏ","HS chú ý và làm theo lệnh của GV",-1,[["4","nhóm 1:4 75% thời gian"],["3","nhóm 1:3 75% thời gian"],["2","nhóm 1:2 75% thời gian"],["1","nhóm 1:2 50% thời gian"]]],["M4",2,12,"Chú ý đến HS khác trong nhóm","HS sẽ chú ý đến những câu trả lời của HS khác trong giờ học nhóm nhỏ","HS quay sang theo dõi những HS khác đang nói và trả lời",-1,[["4","nhóm 1:4 75% thời gian"],["3","nhóm 1:3 75% thời gian"],["2","nhóm 1:2 75% thời gian"],["1","nhóm 1:2 50% thời gian"]]],["M5",2,12,"Tuân theo chỉ dẫn nhóm - thống nhất cách hiểu và trả lời","HS sẽ tuân theo chỉ dẫn chung của nhóm","Mọi người hãy cho tay lên đầu",-1,[["4","trong nhóm 1:4, trả lời cùng lúc với các bạn với 75% các câu hỏi đã biết"],["3","nhóm 1:3 với 75% các câu hỏi đã biết"],["2","nhóm 1:2 với 75% các câu hỏi đã biết"],["1","nhóm 1:2 với 50% các câu hỏi đã biết"]]],["M6",2,12,"Làm theo chỉ dẫn chung trong nhóm có phân biệt đối tượng","HS sẽ làm theo chỉ dẫn của nhóm yêu cầu HS biết phân biệt","Ai mặc áo xanh thì đứng lên - Ai mặc áo đỏ thì xếp thành hàng",-1,[["4","nhóm 1: 4 với 75% các câu hỏi đã biết"],["3","nhóm 1:3 với 75% các câu hỏi đã biết"],["2","nhóm 1:2 với 75% các câu hỏi đã biết"],["1","nhóm 1:2 với 50% các câu hỏi đã biết"]]],["M7",2,12,"Giơ tay để thu hút sự chú ý của GV đến một hoạt động","HS sẽ giơ tay xin trả lời câu hỏi ai muốn làm một hoạt động trước một nhóm HS","Khi GV hỏi \"Ai muốn hát bài hát tiếp theo nào?\" HS sẽ giơ tay xin trả lời câu hỏi",-1,[["2","tự giơ tay nhận làm một hoạt động nào đó với 50% số lần được hỏi trong nhóm có ít nhất 8 HS"],["1","tự giơ tay nhận làm một hoạt động nào đó với 50% số lần được hỏi trong nhóm có ít nhất 4 HS"]]],["M8",2,12,"Giơ tay để trả lời câu hỏi","HS biết giơ tay để trả lời những câu hỏi đơn giản","Ai đến lớp bằng xe buýt thì giơ tay, ai thích bánh sô cô la thì giơ tay --- chủ yếu là hồi đáp có/không",-1,[["2","có thể tự trả lời các câu hỏi"],["1","chỉ cần nhắc bằng cử chỉ với tối đa 50% các câu hỏi đã biết"]]],["M9",2,12,"Giơ tay và nói tên đồ vật","Học sinh biết giơ tay và nói tên 1 vật bày trước lớp/nhóm","GV hỏi cả nhóm: \"Có ai biết cái này là cái gì không?\", HS giơ tay và trả lời khi được GV gọi",-1,[["2","có thể tự trả lời các câu hỏi đã biết"],["1","chỉ cần nhắc bằng cử chỉ phải giơ tay xin trả lời với tối đa 50% các câu hỏi đã biết"]]],["M10",2,12,"Giơ tay và trả lời câu hỏi","HS biết giơ tay xin trả lời những câu hỏi đơn giản","GV hỏi cả nhóm: \"Mọi người, ai biết ….chúng ta có thể ăn gì vào bữa sáng?\"",-1,[["2","có thể trả lời câu hỏi 1 cách độc lập"],["1","chỉ cần nhắc bằng cử chỉ phải giơ tay xin trả lời với tối đa 50% các câu hỏi đã biết"]]],["M11",2,12,"Đợi đến lượt trong giờ học nhóm","HS sẽ biết chờ đến lượt mình trong giờ sinh hoạt nhóm","",-1,[["2","điềm tĩnh chờ đến lượt và 75% thời gian không cần nhắc"],["1","75% thời gian có nhắc nhở"]]],["M12",2,12,"Học tập thêm nhiều kỹ năng mới trong giờ học nhóm","HS sẵn sàng tiếp thu thêm những kỹ năng học đường mới trong lúc học nhóm","",-1,[["2","sẵn sàng học thêm kỹ năng mới"],["1","học thêm kỹ năng mới sau nhiều lần dạy"]]],["N1",2,13,"Tuân theo lịch sinh hoạt thường ngày (soạn balô…)","HS biết tự động làm theo các nếp sinh hoạt thường ngày của lớp","",-1,[["2","tự động làm"],["1","làm theo 50% chỉ dẫn không cần lời nhắc"]]],["N2",2,13,"Độc lập trong những sinh hoạt ngoại khóa","HS độc lập trong những sinh hoạt ngoại khóa","ráp hình",-1,[["4","trong vòng 20 phút"],["3","15 phút"],["2","10 phút"],["1","5 phút"]]],["N3",2,13,"Ngồi đợi trật tự khi đang chuyển giờ","Khi đang chuyển giờ học, HS sẽ ngồi đợi trật tự để bắt đầu giờ học tiếp theo","",-1,[["2","biết tự chờ trong 2 phút"],["1","tự chờ trong vòng 30 giây"]]],["N4",2,13,"Di chuyển sang khu vực khác","HS sẽ trật tự di chuyển theo yêu cầu đến một khu vực khác trong lớp để thay đổi hoạt động chính khóa","",-1,[["2","tự làm"],["1","làm theo 50% chỉ dẫn không cần nhắc"]]],["N5",2,13,"Chờ đến phiên mình để làm gì đó (rửa tay…)","Học sinh sẽ chờ đến phiên mình trong các sinh hoạt của lớp học","",-1,[["2","tự làm trong 2 phút"],["1","tự làm trong 30 giây"]]],["N6",2,13,"Xếp hàng khi được yêu cầu","Học sinh sẽ đứng thành hàng theo yêu cầu và chịu đứng yên trong hàng","",-1,[["2","tự động làm"],["1","làm theo 50% chỉ dẫn không cần nhắc"]]],["N7",2,13,"Độc lập trong những hoạt động chính khóa","Học sinh sẽ làm việc độc lập trong học tập","lập bảng tính toán",-1,[["4","trong vòng 20 phút"],["3","15 phút"],["2","10 phút"],["1","5 phút"]]],["N8",2,13,"Lấy và trả học cụ","Học sinh sẽ theo hướng dẫn lấy và trả học cụ của mình","Học sinh cất sách vở của mình lên kệ khi được yêu cầu vào cuối giờ học",-1,[["2","tự động làm"],["1","làm theo 50% chỉ dẫn không cần nhắc"]]],["N9",2,13,"Hoàn thành bài tập, mang bài làm đến nộp giáo viên hoặc cất đồ dùng đi","HS sẽ theo yêu cầu hoàn thành bài tập và mang bài đến nộp cho giáo viên hoặc cất đồ dùng đi","Khi làm xong, HS cất vở bài tập đúng chỗ khi làm xong bài mà không cần nhắc",-1,[["2","tự động làm"],["1","làm theo 50% chỉ dẫn không cần nhắc"]]],["N10",2,13,"Đứng chờ chuyển giờ","HS sẽ đứng chờ trật tự khi chuyển giờ sang hoạt động khác","",-1,[["2","tự động trong vòng 3 phút"],["1","50% số lần không cần nhắc"]]],["P1",2,14,"Tổng hợp khái quát các yêu cầu/bài tập","Học sinh có thể vận dụng kỹ năng đã có với một vật để áp dụng vào một vật tương tự","Nếu học sinh đã biết gọi một chiếc cốc màu nâu là \"cốc\", học sinh cũng sẽ biết gọi những chiếc cốc màu xanh, màu vàng và kẻ sọc là \"cốc\"",-1,[["2","khi đã biết thực hiện yêu cầu gọi tên và nhận biết, sẽ lập tức biết vận dụng thực hiện nhiều yêu cầu cùng loại sau 2 lần dạy"],["1","tổng hợp khái quát giữa các vật tương tự sau 10 lần dạy"]]],["P2",2,14,"Tổng hợp khái quát kỹ năng học được từ các giáo viên","Học sinh có thể vận dụng các kỹ năng học từ giáo viên này để hồi đáp với các giáo viên khác","Nếu học sinh đã được giáo viên này dạy cách gọi tên cái \"cốc\", thì sẽ biết gọi tên cái cốc khi giáo viên khác yêu cầu",-1,[["2","sẵn sàng vận dụng các kỹ năng đã biết để hồi đáp với giáo viên mới"],["1","có thể học với ít nhất 4 giáo viên"]]],["P3",2,14,"Tổng hợp khái quát trong các môi trường","Học sinh có thể vận dụng các kỹ năng đã thu nhận từ môi trường này sang môi trường khác.","Nếu học sinh đã biết gọi tên cái \"cốc\" ở trường thì sẽ biết gọi tên cái \"cốc\" khi ở nhà",-1,[["2","dễ dàng vận dụng các kỹ năng đã học trong lớp ra môi trường ngoài lớp học mà không cần nhắc"],["1","vận dụng các kỹ năng đã học trong lớp ra môi trường ngoài lớp học với lời nhắc không đáng kể"]]],["P4",2,14,"Vận dụng các kỹ năng đã biết trong hoạt động nhóm","Học sinh có thể vận dụng các kỹ năng đã học trong tiết học cá nhân vào tiết học nhóm với các bạn","Nếu học sinh biết gọi tên cái cốc trong tiết học cá nhân thì cũng sẽ biết gọi tên cái cốc khi tham gia học trong nhóm nhỏ",-1,[["2","tự biết vận dụng các kỹ năng đã học trong khi học nhóm"],["1","biết vận dụng các kỹ năng đã học khi học nhóm nếu được nhắc đôi chút bằng lời"]]],["P5",2,14,"Tổng hợp khái quát các dạng hồi đáp","Khi đã biết một cách hồi đáp với một tình huống, học sinh sẽ biết xử lý tình huống đó bằng nhiều cách khác","Khi nhìn thấy con chó, học sinh có thể nói \"chó\", \"cún\", \"cẩu\", \"ki ki\"… Khi được hỏi về \"những thứ để ăn\" học sinh có thể nói \"táo, chuối, bánh mì\" hay \"bánh ngọt, bánh piza, táo\"",-1,[["2","Tự biết dùng nhiều và đa dạng các cách trả lời phù hợp chứ không chỉ một dạng"],["1","biết vài cách trả lời khác nhau khi được nhắc đôi chút bằng lời"]]],["P6",2,14,"Tổng hợp khái quát các kỹ năng ngôn ngữ","Học sinh có thể vận dụng những từ học được từ kỹ năng ngôn ngữ này sang các kỹ năng ngôn ngữ khác","Khi đã biết dùng từ \"cốc\" để gọi tên cái cốc, học sinh sẽ biết dùng từ \"cốc\" để xin cái cốc và phân biệt nhận biết cốc. Nếu học sinh đã nhận ra cái cốc khi cô nói \"con uống bằng vật này\", học sinh sẽ biết trả lời \"cốc\" với câu hỏi \"con uống bằng cái gì?\"",-1,[["2","Khi học sinh đã biết nhận ra một vật khi biết chức năng, học sinh sẽ biết gọi tên vật đó khi biết chức năng"],["1","Khi đã biết gọi tên một vật, học sinh sẽ biết yêu cầu và nhận ra vật đó"]]],["Q1",4,15,"Nhận mặt chữ","Học sinh sẽ nhận được mặt chữ hoa và chữ thường","Khi được cho xem 3 chữ, học sinh có thể chỉ ra đâu là chữ B",-1,[["4","Nhận dạng được 26 chữ cái"],["3","có thể nhận dạng ít nhất 15 chữ cái"],["2","nhận dạng ít nhất là 10 chữ cái"],["1","nhận dạng ít nhất 5 chữ cái"]]],["Q2",4,15,"Nói tên các chữ cái","Học sinh sẽ nói được tên của các chữ hoa và chữ thường","Khi cho xem chữ B hoa, học sinh sẽ nói được \"đây là chữ B\"",-1,[["4","có thể nói được tên của 26 chữ cái"],["3","có thể nói được tên của 15 chữ cái"],["2","có thể nói được tên của ít nhất 10 chữ cái"],["1","có thể nói được tên của ít nhất 5 chữ cái"]]],["Q3",4,15,"Nhận ra âm của các chữ cái","Học sinh sẽ có thể chỉ ra chữ nào vừa được phát âm","Đưa cô chữ đọc là \"ssss\"",-1,[["4","có thể nhận ra âm của ít nhất 20 chữ cái"],["3","nhận dạng âm của 10 chữ cái"],["2","nhận dạng âm của ít nhất 5 chữ cái"],["1","nhận dạng âm của ít nhất 2 chữ cái"]]],["Q4",4,15,"Đọc được chữ cái","Học sinh sẽ có thể đọc được các chữ cái","Chữ này đọc thế nào nhỉ? (giơ cho học sinh thấy chữ B)",-1,[["4","có thể nhận ra âm của ít nhất 20 chữ cái"],["3","nhận dạng âm của 10 chữ cái"],["2","nhận dạng âm của ít nhất 5 chữ cái"],["1","nhận dạng âm của ít nhất 2 chữ cái"]]],["Q5",4,15,"Ghép chữ với ảnh","Học sinh có thể ghép chữ với ảnh","Khi được đưa thẻ chữ \"mèo\" và 3 ảnh con mèo, chó, và chim, học sinh sẽ ghép đúng thẻ chữ với ảnh tương ứng là mèo",-1,[["4","có thể ghép ít nhất 20 từ với ảnh tương ứng"],["3","có thể ghép 10 từ với ảnh tương ứng"],["2","ghép 5 từ với ảnh tương ứng"],["1","ghép 2 từ với ảnh tương ứng"]]],["Q6",4,15,"Ghép từ với từ","Học sinh có thể ghép 1 thẻ chữ với thẻ chữ tương ứng nhưng khác phông khi đưa ra 3 thẻ chữ khác nhau để lựa chọn","Khi đưa cho HS thẻ chữ \"con dơi\" và 3 thẻ chữ khác kiểu chữ (con dơi, mèo, và cái mũ), HS sẽ ghép đúng với thẻ chữ tương ứng",-1,[["4","khác phông có 1 chữ khác trong từ không định để ghép"],["3","cùng phông, chỉ 1 chữ khác"],["2","cùng phông, 2 chữ khác ở thẻ chữ không định để ghép"],["1","cùng phông, 3 chữ khác không phải ở thẻ chữ tương ứng"]]],["Q7",4,15,"Đọc từng chữ trong một từ từ trái sang phải","Học sinh sẽ có thể đọc từng chữ trong một từ từ trái sang phải","Khi cho xem chữ \"ma\", học sinh sẽ nói m-a",-1,[["2","có thể chỉ và đọc chữ trong từ 5 chữ (từ trái sang phải mà không cần nhắc)"],["1","có thể chỉ và đọc chữ trong từ 3 chữ (từ trái sang phải mà chỉ cần nhắc 1 lần cho 1 chữ)"]]],["Q8",4,15,"Ghép từng chữ rời thành từ trong thẻ chữ","Học sinh có thể ghép từng chữ rời thành từ trên thẻ 5 chữ","Khi có bảng chữ có từ \"tàu\", học sinh sẽ có thể tìm, những chữ cái thích hợp để ghép thành chữ \"tàu\"",-1,[["2","có thể ghép chữ rời thành từ có tới 5 chữ khi đưa cho cả những chữ không cần dùng đến (td: từ \"mai\" thì đưa cả chữ m-a-i- và e-a)"],["1","có thể ghép chữ rời thành từ có tới 3 chữ khi không đưa chữ thừa nào và kiểu chữ không giống nhau (td: từ \"ma\" thì chỉ đưa chữ m-a)"]]],["Q9",4,15,"Điền chữ / từ thiếu","Khi đưa ảnh của 1 vật và 2 - 3 chữ… học sinh biết lấy thêm 1 chữ điền vào cho đủ thành từ có nghĩa tương ứng với ảnh","Khi có ảnh con chó và có 2 chữ c-ó, học sinh sẽ lấy thêm chữ h để ghép thành từ \"chó\"",-1,[["2","có thể điền chữ ở bất cứ vị trí nào với 10 từ"],["1","có thể điền chữ ở ít nhất 1 vị trí với ít nhất 5 từ"]]],["Q10",4,15,"Đọc những từ đơn giản","Học sinh có thể đọc được các từ","",-1,[["4","có thể đọc ít nhất 50 từ"],["3","có thể đọc ít nhất 10 từ"],["2","có thể đọc ít nhất 10 từ"],["1","có thể đọc ít nhất 5 từ"]]],["Q11",4,15,"Tự luận ra/giải mã từ mới","Học sinh sẽ có thể tự luận ra/giải mã từ mới","",-1,[["2","có thể tự luận ra cách đọc của 20 từ mới (chưa biết mặt hoặc cách đọc) gồm ít nhất 4 chữ"],["1","có thể tự luận ra/giải mã bất cứ từ nào có phụ âm-nguyên âm-phụ âm dựa trên những âm vị đã biết"]]],["Q12",4,15,"Đọc tập hợp một số từ từ trái sang phải","Học sinh có thể đọc được các cụm từ","",-1,[["4","có thể đọc bất kỳ cụm từ nào có những từ đã biết"],["3","có thể đọc 10 cụm 3 từ"],["2","có thể đọc 5 cụm 3 từ"],["1","có thể đọc 2 cụm 3 từ"]]],["Q13",4,15,"Đọc câu đơn giản gồm 3 đến 6 từ","Học sinh sẽ có thể đọc cả câu","",-1,[["4","có thể đọc bất cứ câu nào có từ quen thuộc"],["3","có thể đọc 10 câu gồm 4 đến 6 từ"],["2","đọc 5 câu gồm 4 đến 6 từ"],["1","đọc 2 câu gồm 4 đến 6 từ"]]],["Q14",4,15,"Điền từ thiếu","Học sinh sẽ có thể chọn 1 trong số nhiều từ để điền cho chọn vẹn 1 câu không hoàn chỉnh","",-1,[["2","có thể chọn từ thích hợp trong số 3 từ khác nhau 50% mặt chữ"],["1","có thể chọn từ thích hợp trong số 2 từ khác hơn 50% mặt chữ"]]],["Q15",4,15,"Đọc và làm theo những chỉ dẫn đơn giản","HS biết đọc và làm theo những chỉ dẫn đơn giản","Lại lấy cốc, đặt búp bê lên giường, ôm búp bê, để cốc lên bệ rửa, đưa cho Jason cái bút chì, cho giày vào hộp, đội mũ của bố lên",-1,[["2","có thể đọc được ít nhất 20 câu và làm được ít nhất 6 hành động đơn giản"],["1","có thể đọc được ít nhất 10 câu và làm được ít nhất 3 hành động đơn giản (vd đưa, lấy, đặt, mặc vào, cho vào)"]]],["Q16",4,15,"Đọc và làm theo những chỉ dẫn đơn giản trên tờ giao việc","HS biết đọc và làm theo những chỉ dẫn đơn giản trên tờ giao việc","Vẽ một đường thẳng nối con khỉ với quả chuối, gạch chân chữ A và đánh dẫu X vào hình tròn, tô hình vuông màu đỏ, vẽ một hình khối quanh cái cây, viết số 3 trong hình tam giác",-1,[["2","có thể đọc được ít nhất 20 câu và làm được ít nhất 6 chỉ dẫn khác nhau"],["1","có thể đọc được ít nhất 10 câu và làm được ít nhất 3 chỉ dẫn khác nhau (vd khoanh tròn, gạch chân, tô màu)"]]],["Q17",4,15,"Đọc đoạn văn và trả lời câu hỏi về nội dung đoạn văn","Học sinh có thể đọc các câu và trả lời những câu hỏi đọc hiểu về các câu đó","",-1,[["2","có thể đọc 3 câu và trả lời những câu hỏi đơn giản liên quan đến nội dung"],["1","có thể đọc 1 câu đơn giản và trả lời 1 câu đơn giản về nội dung"]]],["R1",4,16,"Thuộc lòng số đếm khi được nhắc","Học sinh sẽ có thể tiếp tục đếm đến 10 khi có người đếm đoạn đầu","",-1,[["2","có thể tiếp tục đếm đến 10 khi có người đếm trước 1, 2"],["1","có thể đếm theo giáo viên đến 10 (bắt chước)"]]],["R2",4,16,"Thuộc lòng số đếm","Học sinh thuộc lòng số đếm đến 100","",-1,[["4","có thể đếm đến bất cứ số nào trong phạm vi 30"],["3","đếm đến 30"],["2","đến 20"],["1","đến 10"]]],["R3",4,16,"Đếm vật khi được nhắc","Học sinh có thể đếm vật tiếp đến 10 khi có người đếm lúc đầu","",-1,[["2","có thể đếm vật tiếp đến 10 nếu ta nhắc phần đầu 1, 2"],["1","có thể đếm theo GV đến 10 (nói theo) kể cả khi GV thay đổi tốc độ đếm (vd 1,2…(dừng) 3,…,4, 5…,6,v.v…)"]]],["R4",4,16,"Đếm vật được đưa","Học sinh sẽ có thể đếm vật được đưa kể cả khi các vật đó không được xếp thành hàng thẳng","",-1,[["4","có thể đếm đến đến bất cứ s
