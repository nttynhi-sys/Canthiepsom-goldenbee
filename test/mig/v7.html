ố nào trong phạm vi 100"],["3","trong phạm vi 20"],["2","trong phạm vi 10"],["1","trong phạm vi 5 kể cả khi các vật không được xếp thành hàng thẳng"]]],["R5",4,16,"Đếm để lấy ra một số lượng vật nhất định","HS có thể đếm để lấy ra một số lượng nhất định từ một lượng nhiều hơn","Khi đưa HS 7 khối gỗ và yêu cầu \"lấy cho cô 5 khối\", HS sẽ đếm để lấy ra 5 khối",-1,[["4","có thể đếm bất kỳ số lượng nào trong phạm vi 30"],["3","trong phạm vi 20"],["2","trong phạm vi 10"],["1","trong phạm vi 5"]]],["R6",4,16,"Đọc chữ số theo thứ tự","Học sinh biết đọc chữ số trong một dãy số (từ bé đến lớn hoặc ngược lại)","",-1,[["2","biết đọc dãy số từ 1 đến 10"],["1","biết đọc dãy số từ 1 đến 10 khi được nhắc \"1, 2…\" và GV chỉ vào từng số"]]],["R7",4,16,"Gọi tên các mặt số","Học sinh biết tên các số trong phạm vi 100","",-1,[["4","biết mặt số trong phạm vi 100"],["3","trong phạm vi 30"],["2","trong phạm vi 20"],["1","trong phạm vi 10"]]],["R8",4,16,"Ghép số với lượng vật tương ứng","Học sinh biết ghép số với lượng vật tương ứng và ngược lại","",-1,[["4","có thể ghép lượng vật với số (và ngược lại) trong phạm vi 30"],["3","có thể ghép lượng vật với số trong phạm vi 20"],["2","có thể ghép lượng vật với số trong phạm vi 10"],["1","có thể ghép lượng vật với số trong phạm vi 5"]]],["R9",4,16,"\"hơn\"","HS có thể phân biệt và chỉ ra những trường hợp ứng với từ \"hơn\"","",-1,[["2","biết phân biệt VÀ chỉ ra những trường hợp tương ứng"],["1","biết phân biệt HOẶC chỉ ra những trường hợp tương ứng"]]],["R10",4,16,"\"kém\"","HS có thể phân biệt và chỉ ra những trường hợp ứng với từ \"kém\"","",-1,[["2","biết phân biệt VÀ chỉ ra những trường hợp tương ứng"],["1","biết phân biệt HOẶC chỉ ra những trường hợp tương ứng"]]],["R11",4,16,"\"một vài\"","HS có thể phân biệt và chỉ ra những trường hợp ứng với từ \"một vài\"","",-1,[["2","biết phân biệt VÀ chỉ ra những trường hợp tương ứng"],["1","biết phân biệt HOẶC chỉ ra những trường hợp tương ứng"]]],["R12",4,16,"\"tất cả\"","HS có thể phân biệt và chỉ ra những trường hợp ứng với từ \"tất cả\"","",-1,[["2","biết phân biệt VÀ chỉ ra những trường hợp tương ứng"],["1","biết phân biệt HOẶC chỉ ra những trường hợp tương ứng"]]],["R13",4,16,"\"số không/không\"","HS có thể phân biệt và chỉ ra những trường hợp ứng với từ \"số không/không\"","Phân biệt - Khi đưa 2 cái bát, một đựng bỏng ngô, một không có gì, và hỏi \"cái nào không có gì?, HS chỉ sang cái bát không có gì. Chỉ ra trường hợp - khi cho HS xem một cái lọ bánh không có gì, và hỏi \"có mấy cái bánh trong lọ?\" HS trả lời \"không có gì\"",-1,[["2","biết phân biệt VÀ chỉ ra những trường hợp tương ứng"],["1","biết phân biệt HOẶC chỉ ra những trường hợp tương ứng"]]],["R14",4,16,"Thêm vật để có một lượng nhất định","Khi đưa cho học sinh một số lượng vật, HS biết số lượng phải lấy thêm để được một lượng nhất định","Đưa HS 2 cái thìa và yêu cầu cần có 4 cái thìa, HS sẽ lấy thêm 2 cái thìa",-1,[["2","biết lấy thêm vật để có được số lượng trong phạm vi 10"],["1","biết lấy thêm vật để có được số lượng trong phạm vi 5"]]],["R15",4,16,"\"giống\"","HS có thể phân biệt và chỉ ra những trường hợp ứng với từ \"giống\"","",-1,[["2","biết phân biệt VÀ chỉ ra những trường hợp tương ứng"],["1","biết phân biệt HOẶC chỉ ra những trường hợp tương ứng"]]],["R16",4,16,"\"khác\"","HS có thể phân biệt và chỉ ra những trường hợp ứng với từ \"khác\"","",-1,[["2","biết phân biệt VÀ chỉ ra những trường hợp tương ứng"],["1","biết phân biệt HOẶC chỉ ra những trường hợp tương ứng"]]],["R17",4,16,"\"lớn/nhiều hơn\"","HS có thể phân biệt và chỉ ra những trường hợp ứng với từ \"lớn/nhiều hơn\"","",-1,[["2","biết phân biệt VÀ chỉ ra những trường hợp tương ứng"],["1","biết phân biệt HOẶC chỉ ra những trường hợp tương ứng"]]],["R18",4,16,"\"thêm\"","HS có thể phân biệt và chỉ ra những trường hợp ứng với từ \"thêm\"","Phân biệt - khi đưa 5 khối hình để trong đĩa cùng một số khối để ngoài, và yêu cầu \"thêm 2 khối nữa\", HS sẽ đặt thêm khối vào đĩa. Chỉ ra trường hợp - khi cho HS thấy cô đang cho đậu n không quá 2 lần 1 tuần (ở nhà và trường)"],["1","không quá 4 lần 1 tuần"]]],["X8",7,24,"Tự lau sạch cho mình sau khi đi đại tiện","Học sinh sẽ có thể tự lau cho mình sau khi đi đại tiện","Khả năng nhớ để tự lau sạch cho mình sau khi đi đại tiện",-1,[["2","tự lau sạch cho mình mà không cần giúp đỡ"],["1","tự lau cho mình nhưng phải kiểm tra lại xem đã sạch hẳn chưa"]]],["X9",7,24,"Đi đại tiện trong nhà vệ sinh quen thuộc","Học sinh sẽ tự động đi đại tiện trong một nhà vệ sinh quen thuộc","Khả năng tự đi đại tiện trong một nhà vệ sinh quen thuộc (vd ở nhà, ở trường)",-1,[["2","tự hoàn toàn khi đi vệ sinh (kể cả đi đại tiện)"],["1","còn phải nhắc phần nào những việc cần làm khi đi vệ sinh"]]],["X10",7,24,"Sử dụng nhà vệ sinh không cần giúp đỡ","Học sinh sẽ có thể sử dụng nhà vệ sinh không cần giúp đỡ","",-1,[["2","tự hoàn toàn khi sử dụng nhà vệ sinh"],["1","còn phải nhắc phần nào những việc cần làm khi sử dụng nhà vệ sinh"]]]],"ed":[["GTN.1.1",0,25,"Định vị được nguồn phát ra âm thanh bằng cách quay về phía phát ra âm thanh đó.","Quay đầu và di chuyển ánh mắt để thể hiện nhận thức về âm thanh.","",0],["GTN.1.2",0,25,"Nhìn về phía phát ra những âm thanh vui nhộn (tiếng ồn bằng môi (raspberry noise), còi).","Trẻ trở nên tích cực hơn, quay đầu và di chuyển ánh mắt, nhìn về người chơi cùng để thể hiện nhận thức về âm thanh.","",0],["GTN.1.3",0,25,"Phản ứng lại với giọng nói bằng cách quay về phía người nói.","Quay đầu và nhìn vào người nói để thể hiện nhận thức về giọng nói bằng cách","",0],["GTN.1.4",0,25,"Nhìn vào tranh trong sách khi người lớn chỉ tay vào đó.","Dùng ánh mắt +/- cử chỉ (ví dụ: chạm vào bức tranh) để dõi theo tay chỉ của người lớn vào bức tranh.","",0],["GTN.1.5",0,25,"Dõi theo hướng tay chỉ vào cự ly gần (trong tầm với của trẻ) và đặt đồ vật vào trong hộp chứa, các miếng ghép vào bảng ghép,…","Đáp ứng với việc người lớn hướng tay chỉ vào cự ly gần bằng cách nhìn và đặt đồ vật ở chỗ đã được chỉ định","",0],["GTN.1.6",0,25,"Nhìn vào đồ vật khi người lớn đưa đồ vật đó ra và nói: “(tên trẻ), nhìn này”","Di chuyển ánh mắt và quay đầu và nhìn theo hướng đồ vật","",0],["GTN.1.7",0,25,"Nhìn vào đối tác khi được gọi tên","Di chuyển ánh mắt và quay đầu về phía cơ thể của đối tác","",0],["GTN.1.8",0,25,"Dõi theo hướng chỉ tay vào đồ vật hoặc vị trí ở phạm vi gần","Phản ứng lại với việc chỉ tay ở khoảng cách gần bằng cách quay đầu hướng về đồ vật hoặc vị trí nào đó","",0],["GTN.1.9",0,25,"Dõi theo hướng tay chỉ ở địa điểm xa để lấy đồ chơi","Phản ứng với việc chỉ tay ở xa bằng cách tiếp cận và cầm đồ chơi lên","",0],["GTN.1.10",0,25,"Nhìn, với tay hoặc mỉm cười đáp lại cử chỉ/điệu bộ và giọng nói của người lớn trong các trò chơi xã hội","Tham gia và phản ứng lại với một hoặc nhiều lần chơi các trò chơi xã hội gồm: “ú òa”, “các ngón tay cù”, “cù nhột” …","",0],["GTN.1.11",0,25,"Nhìn, với tay, mỉm cười và/hoặc có cử chỉ, điệu bộ phản ứng lại với ngôn ngữ/điệu bộ cử chỉ của người lớn trong bài hát","Tương tự như trên. Tham gia và phản ứng lại với một hoặc nhiều câu trong bài hát.","",0],["GTN.1.12",0,25,"Phản ứng dừng hoạt động ngay hoặc dừng trong giây lát khi có hiệu lệnh: “không”, “dừng lại”","Dừng một hành động đang diễn ra khi có ai đó nói “không, dừng lại”, hoặc thể hiện nhận thức bằng cách dừng tạm thời, quay đầu và nhìn vào người lớn, hoặc thể hiện sự khó chịu (ví dụ: khóc)","",0],["GTN.1.13",0,25,"Đặt đồ vật vào tay người lớn khi được yêu cầu bằng lời, đồng thời người lớn xòe tay ta.","Phản ứng lại với cử chỉ/điệu bộ hoặc lời nói của người lớn bằng cách đặt hoặc cố gắng đặt đồ vật vào tay người lớn","",0],["GTN.1.14",0,25,"Thực hiện những hành động quen thuộc hàng ngày có 1 bước khi được yêu cầu bằng lời nói hoặc gợi ý bằng điệu bộ cử chỉ (ví dụ: “ngồi xuống”, “lại đây”, “làm sạch” …)","Thể hiện hành động khi có tín hiệu về lời nói/cử chỉ/điệu bộ. Để qua được thì tối thiểu ở cơ hội đầu tiên cần có 5 hành động. Các ví dụ bao gồm người lớn lặp lại hướng dẫn, sử dụng các cử chỉ/điệu bộ để nhấn mạnh hành động (ví dụ: đập vào ghế để ngồi xuống, cầm xô để rửa) hoặc nhắc trẻ một phần nào đó trong suốt hành động","",0],["GTN.1.15",0,25,"Thực hiện những hành động quen thuộc hàng ngày có 1 bước khi được yêu cầu bằng lời nói không gợi ý bằng điệu bộ cử chỉ (ví dụ: “ngồi xuống”, “lại đây”, “làm sạch” …)","Hoàn thành hướng dẫn bằng cách thể hiện hành động mà không cần có cử chỉ/điệu bộ hoặc sự hướng dẫn về mặt thể chất của người lớn. Người lớn có thể nhắc lại yêu cầu lần thứ hai mà không cần có cử chỉ/điệu bộ","",0],["GTD.1.1",1,26,"Với tay có mục đích/với tay tới mục tiêu để yêu cầu","Với đồ vật mong muốn trong tay người lớn để thể hiện yêu cầu. Cử chỉ/điệu bộ này không đi kèm với giao tiếp mắt hoặc các từ/lời nói. Không bao gồm việc trẻ với tới chỉ để chộp","",0],["GTD.1.2",1,26,"Phát ra âm có mục đích","Phát âm đi kèm với giao tiếp mắt và/hoặc cử chỉ/điệu bộ (ví dụ: với tới) để yêu cầu đồ vật hoặc điều mong muốn","",0],["GTD.1.3",1,26,"“Yêu cầu” sự giúp đỡ bằng cách đưa đồ vật cho người lớn","Yêu cầu giúp đỡ bằng cách đặt đồ vật vào tay người lớn, phát âm hoặc nhìn vào người lớn. Cử chỉ/điệu bộ không đi kèm giao tiếp mắt hoặc phát âm/từ.","",0],["GTD.1.4",1,26,"Phát âm theo lượt với đối tác giao tiếp","Bập bẹ và/hoặc phát âm kèm giao tiếp mắt tối thiểu ở hai lượt.","",0],["GTD.1.5",1,26,"Thế hiện sự từ chối bằng cách đẩy đồ vật ra xa hoặc đưa đồ vật lại cho một người khác","Trẻ chỉ cần thực hiện cử chỉ/điệu bộ, không cần đi kèm với giao tiếp mắt hoặc dùng lời nói/từ. Khen ngợi trẻ nếu trẻ thực hiện các cử chỉ/điệu bộ khác (lắc đầu, trẻ thực hiện điệu bộ thể hiện “mọi thứ đã xong xuôi”) hoặc nói (“không”)","",0],["GTD.1.6",1,26,"Chỉ tay để yêu cầu đồ vật mong muốn ở gần","Chạm hoặc chỉ vào đồ vật trong khoảng cách 15 – 30 cm bằng ngón trỏ (không phải bằng cả bàn tay) để thể hiện yêu cầu. Đồ vật có thể ở trong tay người lớn hoặc trong tầm với của trẻ.","",0],["GTD.1.7",1,26,"Giao tiếp mắt để có được đồ vật mong muốn khi người lớn ngăn trẻ tiếp cận đồ vật/giữ lại đồ vật đó","Quay đầu nhìn về phía người lớn và giao tiếp mắt trong 1 – 2 giây +/- cử chỉ/điệu bộ (ví dụ: với, nắm lấy) để yêu cầu đồ vật. Giao tiếp mắt và cử chỉ/điệu bộ không cần đi kèm phát âm/lời nói.","",0],["GTD.1.8",1,26,"Chỉ tay để chọn lựa giữa 2 đồ vật","Người lớn mỗi tay cầm 1 đồ vật. Trẻ chạm hoặc chỉ về phía đồ vật mong muốn bằng ngón trỏ (không mở lòng bàn tay). Cử chỉ/điệu bộ không cần đi kèm giao tiếp mắt hoặc phát âm/lời nói.","",0],["GTD.1.9",1,26,"Kết hợp phát âm và ánh mắt để thể hiện yêu cầu","Quay đầu và mắt, nhìn người lớn, giao tiếp mắt (1 – 2 giây) kèm theo phát âm để yêu cầu thứ mong muốn. Phát âm có thể chỉ là từ tương đương. Các ví dụ gồm “ahh” cho ball (bóng) hoặc “ooh” cho go (đi).","",0],["GTD.1.10",1,26,"Chỉ tay để yêu cầu đồ vật mong muốn ở xa","Sử dụng ngón trỏ (không mở lòng bàn tay) để chỉ về hướng đồ vật mong muốn, cách >90 cm hoặc xa hơn","",0],["GTD.1.11",1,26,"Chỉ tay để chọn lựa giữa 2 đồ vật ở xa","Người lớn mỗi tay cầm 1 đồ vật nhưng ngoài tầm với của trẻ và chỉ cho trẻ thấy cũng như gọi tên từng đồ vật cho trẻ. Trẻ chỉ về hướng đồ vật mong muốn bằng ngón trỏ (không mở lòng bàn tay). Cử chỉ/điệu bộ không cần đi kèm giao tiếp mắt hoặc phát âm.","",0],["GTD.1.12",1,26,"Phát âm theo kiểu bập bẹ (không nhất thiết phải tương đương như từ)","Các ví dụ gồm “ba-ba”, “ma-ma”. Phát âm không cần đi kèm giao tiếp mắt hoặc cử chỉ/điệu bộ.","",0],["GTD.1.13",1,26,"Phát âm một cách tự phát 5 phụ âm hoặc nhiều hơn","Phát âm kèm hoặc không người lớn làm mẫu. Những trò chơi phát âm cũng được tính.","",0],["GTD.1.14",1,26,"Phát nhiều âm bập bẹ theo các cách khác nhau/đa dạng","Các ví dụ gồm “ba-bu”, “ma-wa” và chuỗi biệt ngữ (theo cách riêng của từng trẻ)","",0],["XH.1.1",3,27,"Trẻ tiếp nhận các hoạt động/trò chơi giác quan - xã hội ngắn và sự động chạm","Trẻ không thể hiện sự trốn tránh, rút lui hoặc phản ứng tiêu cực","",0],["XH.1.2",3,27,"Trẻ dùng cách nhắc/gợi ý bằng thể chất để khởi xướng hoặc tiếp tục (một) thói quen giác quan xã hội","Các ví dụ về nhắc thể chất gồm: với tới, bắt chước chuyển động của người lớn, cầm đưa một vật cho người lớn. Nhắc nhở thể chất không cần đi kèm giao tiếp mắt.","",0],["XH.1.3",3,27,"Có sự giao tiếp mắt ngắn (2 giây) với một người khác","Tham gia bằng cách nhìn và duy trì giao tiếp mắt với một người khác trong 2 giây","",0],["XH.1.4",3,27,"Duy trì việc tham gia vào các thói quen giác quan xã hội trong 2 phút","Thể hiện sự quan tâm đến thói quen giác quan xã hội bằng cách tiếp cận, quan sát, hoặc tham gia tích cực và yêu cầu sự tiếp tục thông qua giao tiếp mắt, cử chỉ/điệu bộ (ví dụ: với tới, bắt chước chuyển động của người lớn), hoặc phát âm.","",0],["XH.1.5",3,27,"Phản ứng lại đối với những đồ vật/hoạt động yêu thích bằng ánh nhìn, với tay, mỉm cười và chuyển động","Phản ứng không cần đi kèm với giao tiếp mắt","",0],["XH.1.6",3,27,"Nhìn và bắt chước người lớn trong suốt các hoạt động chơi song song với đồ vật","Thể hiện sự quan tâm vào hoạt động bằng cách quan sát và bắt chước hành động chơi của người lớn và tiếp tục trò chơi bằng cách bắt chước.","",0],["XH.1.7",3,27,"Thể hiện được trong 5 – 10 trò chơi về giác quan xã hội","Trong một trò chơi, trẻ có tham gia vào 2 hoặc nhiều lần, bằng bất kỳ hành vi nào đó (với tới, bắt chước, phát âm). Nếu chỉ giao tiếp mắt và cười thôi là chưa đủ. Các ví dụ gồm “Ú òa”, đọc thơ/hát (“Eensy-Weensy Spider”, “If you’re happy and you know it”), các trò chơi (“đi vòng quanh”, “đập bánh”), chơi thổi bong bóng, bóng bay, sách, máy bay,…","",0],["XH.1.8",3,27,"","","",0],["XH.1.9",3,27,"Phản ứng với lời chào bằng cách nhìn, quay lại,…","Thể hiện nhận thức về lời chào bằng cách quay đầu, thân người và nhìn vào người lớn trong 2 – 3 giây. Phản ứng không cần đi kèm cử chỉ/điệu bộ hoặc phát âm.","",0],["XH.1.10",3,27,"Phản ứng lại với lời chào bằng cách thể hiện điệu bộ cử chỉ hoặc phát âm","Thể hiện nhận thức về lời chào bằng cách quay đầu, thân người và vẫy tay hoặc phát âm “Chào/tạm biệt” kèm giao tiếp mắt trong 2 – 3 giây.","",0],["XH.1.11",3,27,"","","",0],["XH.1.12",3,27,"Cười với đối tác trong khi cùng/phối hợp chơi","Cười kèm giao tiếp mắt trong 2 – 3 giây trong suốt hoạt động chơi với người lớn","",0],["BC.1.1",2,28,"Bắt chước 8 – 10 hành động có 1 bước với đồ vật (trong vòng 5 giây theo mẫu)","Bắt chước 8 hoặc nhiều hơn các hành động với đồ vật trong vòng 5 giây tiếp theo mẫu của người lớn. Các ví dụ gồm đập hai đồ vật với nhau, đặt một vật vào trong hộp chứa, hoặc lăn tròn một đồ vật","",0],["BC.1.2",2,28,"Bắt chước 10 hành động vận động thể chất được nhìn thấy trong bài hát/trò chơi quen thuộc","Bắt chước 10 hành động khác nhau trong vòng 5 giây theo mẫu người lớn. Bắt chước hai hành động khác nhau ở mỗi bài hát và 4 – 5 thói quen khác nhau (ví dụ: “5 con khỉ nhỏ”, “nhện giăng tơ”) các trò chơi vận động (ví dụ: “bơi thuyền”, “đi vòng quanh”) hoặc các thói quen chơi khác (ví dụ: ú òa)","",0],["BC.1.3",2,28,"Bắt chước 6 hành động vận động ở đầu và khuôn mặt trong bài hát/trò chơi quen thuộc (không nhìn thấy khi thực hiện)","Bắt chước 6 hành động khác nhau mà trẻ không thể nhìn thấy bản thân nó khi thực hiện. Ví dụ: đặt tay lên đầu, tai hoặc vỗ má","",0],["BC.1.4",2,28,"Bắt chước 6 chuyển động miệng – mặt","Bắt chước chuyển động miệng – mặt trong 5 giây theo mẫu của người lớn. Các ví dụ gồm ngọ nguậy lưỡi, thổi trề môi hoặc phồng má thổi phù phù","",0],["NT.1.1",4,29,"Xếp/phân loại các vật giống nhau (tối thiểu 5 loại đồ vật)","Có thể trong phản ứng với giọng nói của người lớn (ví dụ: “đặt ở đây”) hoặc các tín hiệu về mặt thể chất (ví dụ: chuyền tay nọ sang tay kia) với vài lần thử đầu tiên, nhưng trẻ cần hoàn thiện việc tự xếp/phân loại với tối thiểu là 5 loại đồ vật khác nhau. Các ví dụ gồm xếp/phân loại đoàn tàu, xe ô tô, bút màu và giấy, hoặc que và hình tròn vào các hộp chứa riêng biệt","",0],["NT.1.2",4,29,"Xếp/phân loại các bức tranh giống nhau (tối thiểu 5 tranh khác nhau)","Có thể trong phản ứng với giọng nói của người lớn (ví dụ: “đặt ở đây”) hoặc tín hiệu về mặt thể chất (ví dụ: chuyền tay nọ sang tay kia) với vài lần thử đầu tiên, nhưng trẻ cần tự hoàn thành việc xếp/phân loại với tối thiểu là 5 tranh khác nhau","",0],["NT.1.3",4,29,"Ghép/phân loại tranh tương ứng với đồ vật (tối thiểu 5 cặp tranh/vật)","Có thể trong phản ứng với giọng nói của người lớn (ví dụ: “đặt ở đây”) hoặc tín hiệu về mặt thể chất (ví dụ: chuyền tay nọ sang tay kia) với vài lần thử đầu tiên, nhưng trẻ cần tự hoàn thành việc ghép/phân loại với tối thiểu 5 cặp vật/tranh khác nhau","",0],["NT.1.4",4,29,"Xếp/phân loại vật theo màu sắc (tối thiểu 5 màu)","Xếp/phân loại 5 màu hoặc nhiều hơn. Có thể trong phản ứng với giọng nói của người lớn (ví dụ: “đặt ở đây”) hoặc tín hiệu về mặt thể chất (ví dụ: chuyền tay nọ sang tay kia) với vài lần thử đầu tiên, nhưng trẻ cần tự hoàn thành việc xếp/phân loại. Các ví dụ gồm ghép/phân loại các khối gỗ màu đỏ và màu xanh da trời, màu cam và màu xanh lá cây, hoặc các quả bóng màu vàng và màu tím vào các hộp chứa riêng biệt","",0],["C.1.1",3,30,"Có hành vi phù hợp với các đặc tính của 5 đồ vật khác nhau","Trẻ cần khởi xướng hành động không phải trong phản ứng lại với người lớn. Hành vi cần phù hợp với đặc tính của đồ vật. Các ví dụ gồm gõ búa, lăn hoặc nảy bóng hay thả khối","",0],["C.1.2",3,30,"Chơi độc lập và phù hợp với 10 đồ chơi chỉ cần 1 hành động chơi (cách chơi linh hoạt, không hạn chế hoặc lặp đi lặp lại)","Chơi phù hợp với thang phát triển (ví dụ: không hạn chế hoặc không lặp đi lặp lại), liên quan đến đồ vật/hành động, và bao gồm các hành động chỉ có 1 bước. Các ví dụ gồm đặt các khối trong một hộp sắp xếp, đế bóng vào đường zíc zắc, đóng cọc vào lỗ hoặc tách rời các hạt","",0],["C.1.3",3,30,"Chơi độc lập với đồ chơi yêu cầu sự lặp lại cùng hành động tương tự ở trên đồ vật có số lượng nhiều (thả vòng, lồng cốc)","Chơi bao gồm việc hoan thành một cách độc lập hoạt động/đồ vật. Vượt qua với 5 đồ chơi hoặc nhiều hơn. Các ví dụ gồm đặt vòng vào hộp thả, xếp lồng cốc hoặc lấy cốc ra, thả hình khối hoặc đóng cọc vào lỗ.","",0],["C.1.4",3,30,"Chứng tỏ hành vi chơi phù hợp với rất nhiều đồ chơi ở tuổi của trẻ chỉ cần 1 hành động chơi: ném bóng, thả hình khối, gõ chốt vào lỗ, lăn xe ô tô (đồ chơi phù hợp với cả khả năng di chuyển, vận động của trẻ)","Chơi với đồ vật/hoạt động chỉ cần hành động một bước. Vượt qua với 8 – 10 đồ chơi dành cho lứa tuổi của trẻ. Ví dụ: các trò chơi ném bóng, lăn xe ô tô hoặc đánh trống","",0],["C.1.5",3,30,"Chơi độc lập với những đồ chơi yêu cầu 2 hành động khác nhau (ví dụ: lấy ra, cho vào)","Chơi hoàn thành một cách độc lập với đồ vật/hoạt động. Vượt qua với 8 – 10 đồ chơi. Các ví dụ gồm thả/lấy khối gỗ ra khỏi hộp chứa, lăn và đập đất nặn ra, hoặc đặt hoặc tách các hạt ra","",0],["C.1.6",3,30,"Chơi độc lập với những đồ chơi yêu cầu một số hành động khác nhau (cho vào, mở ra, di chuyển, đóng lại)","Chơi hoàn thành một cách độc lập với đồ vật/hành động. Vượt qua với 6 – 8 đồ chơi. Các ví dụ gồm mở/đóng các hộp chứa, lấy các đô vật ra/bỏ các đồ vật vào, thực hiện các hành động khác nhau với đồ vật","",0],["C.1.7",3,30,"Tự thực hiện những hành động có chủ đích với một loạt đồ vật","Các hành động có chủ đích và do bản thân tự định hướng. Có thể trong phản ứng với mẫu của người lớn nhưng thực hiện một cách độc lập, tự phát trong tối thiểu là một hành động. Các ví dụ gồm để điện thoại lên tai, chải đầu bằng lược, cho thìa/dĩa vào miệng, lau mũi bằng khăn giấy, đưa cốc lên môi, nhặt các hạt vào","",0],["C.1.8",3,30,"Hoàn thành hoạt động chơi và cắt đồ","Hoàn thiện một cách phù hợp hoạt động và thể hiện sự nỗ lực thu dọn sạch sẽ (ví dụ: cho đồ vật vào hộp chứa, đưa đồ dùng cho người lớn). Có thể là phản ứng với giọng nói hoặc cử chỉ/điệu bộ của người lớn để bắt đầu thói quen nhưng cần thực hiện mà không cần nhắc nhở về mặt thể chất","",0],["VDT.1.1",5,31,"Đặt 1 đến 2 hình dạng vào bảng phân loại hình","Có thể trong phản ứng lại với tín hiệu của người lớn đế bắt đầu thói quen, nhưng cần tự đặt 1 – 2 hình dạng","",0],["VDT.1.2",5,31,"(Đồ chơi phân loại hình khối: tam giác, hình vuông,…)","","",0],["VDT.1.3",5,31,"Đặt các vòng tròn vào cột xếp vòng","Có thể trong phản ứng lại với tín hiệu của người lớn đế bắt đầu thói quen, nhưng cần tự đặt được 3 vòng tròn hoặc nhiều hơn","",0],["VDT.1.4",5,31,"Hoàn thành 3 miếng ghép hình có núm cầm tay trong bảng ghép hình gỗ","Có thể trong phản ứng lại với tín hiệu của người lớn đế bắt đầu thói quen, nhưng cần tự đặt được 3 miếng ghép hoặc nhiều hơn","",0],["VDT.1.5",5,31,"Đút các khối hình dạng cây nấm vào bảng (pegboard)","Có thể trong phản ứng lại với tín hiệu của người lớn đế bắt đầu thói quen, nhưng cần tự đút được 3 hình khối hoặc nhiều hơn","",0],["VDT.1.6",5,31,"Ấn các nút của 5 loại đồ chơi nguyên nhân – kết quả khác nhau","Có thể trong phản ứng lại với tín hiệu của người lớn đế bắt đầu thói quen nhưng cần tự ấn được nút","",0],["VDT.1.7",5,31,"Tách rời các hạt (dạng chuỗi hoặc dạng Lego)","Có thể trong phản ứng lại với tín hiệu của người lớn đế bắt đầu thói quen nhưng cần tự lấy ra được 3 hạt/khối hình Lego hoặc nhiều hơn","",0],["VDT.1.8",5,31,"Sử dụng 2 ngón và 3 ngón để cầm những đồ chơi phù hợp","Người lớn của thể đặt đồ chơi trong tầm với của trẻ nhưng không hỗ trợ gì","",0],["VDT.1.9",5,31,"Xếp chồng 3 khối lớn thành một ngọn tháp (hoặc chồng các cốc)","Có thể trong phản ứng lại với tín hiệu của người lớn đế bắt đầu thói quen nhưng cần tự chồng được tối thiểu là 3 khối/cốc","",0],["VDT.1.10",5,31,"Tạo dấu, các đường kẻ, chữ viết nguệch ngoạc và các dấu chấm bằng bút dấu/bút sáp màu","Có thể trong phản ứng lại với tín hiệu của người lớn đế bắt đầu thói quen nhưng cần tự cầm và tạo dấu được. Dấu không cần theo mẫu được nhận dạng","",0],["VDT.1.11",5,31,"Đập búa đồ chơi vào bóng, chốt, …","Có thể trong phản ứng lại với tín hiệu của người lớn đế bắt đầu thói quen nhưng cần tự cầm nắm và đập được đồ chơi","",0],["VDT.1.12",5,31,"Xúc/cào/rót cát, nước, gạo, …","Có thể trong phản ứng lại với tín hiệu của người lớn đế bắt đầu thói quen nhưng cần cầm được đồ vật và xúc/cào rót một cách độc lập","",0],["VDT.1.13",5,31,"Xếp chồng các hình khối Lego to","Có thể trong phản ứng lại với tín hiệu của người lớn đế bắt đầu thói quen nhưng cần xếp chồng được tối thiểu là 3 Lego một cách độc lập","",0],["VDTH.1.1",6,32,"Đá quả bóng to","Có thể không vịn vào người lớn hoặc đồ vật (bàn, ghế) để đá bóng. Duy trì được thăng bằng; không ngã; có thể có dáng điệu kỳ quặc","",0],["VDTH.1.2",6,32,"Lên xuống cầu thang có hỗ trợ, hai chân không luân phiên","Có thể vịn vào rào hoặc tay người lớn, đặt cả hai chân vào một bậc. Có thể không để tay hoặc đầu gối xuống các bậc","",0],["VDTH.1.3",6,32,"Trèo từ 1 – 2 bước lên cầu thang nhỏ để trượt","Có thể thực hiện mà không cần giúp đỡ","",0],["VDTH.1.4",6,32,"Trèo lên và xuống các dụng cụ chơi lớn","Có thể thực hiện mà không cần giúp đỡ. Các ví dụ gồm xe đạp, ngựa cưỡi, ghế lắc dành cho trẻ con hoặc người lớn","",0],["VDTH.1.5",6,32,"Tự bảo vệ khi bị mất thăng bằng","Sử dụng các phản ứng tự bảo vệ hoặc giữ thăng bằng (ví dụ: chống tay xuống, vươn tay ra, bảo vệ đầu)","",0],["VDTH.1.6",6,32,"Đi xung quanh đồ vật trên sàn chứ không bước lên chúng","Thể hiện nhận thức về cơ thể trong mối tương quan với đồ vật bằng cách bước qua hoặc đi quanh đồ vật","",0],["VDTH.1.7",6,32,"Ném bóng và túi hạt theo bất kì hướng nào","Có thể thực hiện mà không cần giúp đỡ và có lực đẩy về trước","",0],["VDTH.1.8",6,32,"Lăn bóng qua lại với một người khác (tối thiểu 2 vòng)","Người lớn có thể bắt đầu thói quen nhưng trẻ thể hiện sự quan tâm bằng cách lăn bóng về hướng người lớn","",0],["HV.1.1",7,33,"Thể hiện tối thiểu những hành vi có vấn đề","Các ví dụ gồm hành vi tự làm đau bản thân, hung hăng, các triệu chứng ở mức độ thường xuyên và/hoặc nghiêm trọng","",0],["HV.1.2",7,33,"Ngồi trên ghế hoặc đối mặt với người lớn trong các hoạt động vui nhộn mà không có khó khăn gì trong 1 – 2 phút","Ngồi yên/thoải mái trong tối thiểu là 60 giây trong khi tương tác với người lớn","",0],["HV.1.3",7,33,"Sẵn lòng tham gia vào những trò chơi đơn giản trên ghế và trên sàn với người lớn trong 5 phút","Các trò chơi có thể gồm “Ú òa”, bài hát hoặc các thói quen vận động (ví dụ: cù, nâng lên/hạ xuống vạt áo của người lớn)","",0],["HV.1.4",7,33,"Để người lớn tiếp cận và tương tác (người lớn hạn chế tối thiểu yêu cầu) mà không có vấn đề hành vi trong khoảng 20 phút","Các yêu cầu của người lớn nằm trong khả năng hiện tại của trẻ. Có thể gây ồn ào, nhặng xị nhưng không có hành vi hung hăng","",0],["HV.1.5",7,33,"Tương tác một cách phù hợp với các thành viên gia đình (Ví dụ: không hung hăng hoặc có những tương tác không phù hợp)","Không hung hăng hoặc không có tương tác không phù hợp theo như quan sát trong báo cáo của phụ huynh","",0],["TL.1.1",7,34,"Ăn đồ ăn chính và đồ ăn nhẹ (phụ) tại bàn","Ngồi tại bàn suốt bữa ăn (Ví dụ: không đứng dậy hoặc đi khỏi bàn trong bữa ăn; không cần ngồi trong suốt bữa ăn của gia đình)","",0],["TL.1.2",7,34,"Ăn bữa chính một cách độc lập","Người lớn dọn đồ ăn ra nhưng không trợ giúp gì khác","",0],["TL.1.3",7,34,"Sử dụng một chiếc cốc không nắp","Cầm và đưa cốc lên miệng mà không cần trợ giúp. Có thể đổ một chút khi đang uống","",0],["TL.1.4",7,34,"Sử dụng thìa","Cầm và đưa thìa lên miệng mà không cần trợ giúp cho hầu hết các lần cắn vào. Thỉnh thoảng có đổ một chút","",0],["TL.1.5",7,34,"Sử dụng dĩa","Cầm và đưa dĩa lên miệng mà không cần trợ giúp cho hầu hết các lần cắn vào. Thỉnh thoảng có đổ một chút","",0],["TL.1.6",7,34,"Ăn nhiều loại thức ăn và các nhóm đồ ăn khác nhau","Báo các của phụ huynh là đủ","",0],["TL.1.7",7,34,"Chấp nhận thức ăn mới có trong đĩa (bát)","Cho phép thức ăn mới ở trong đữa và có thể cố ăn (ví dụ: chạm, ngửi hoặc cho vào miệng). Không nhất thiết phải ăn.","",0],["TL.1.8",7,34,"Uống bằng ống hút","Người lớn có thể để ống hút vào miệng trẻ nếu chưa bao giờ trẻ thực hiện","",0],["TL.1.9",7,35,"Cởi một phần trang phục có sự hỗ trợ","Không cần mở cúc hoặc kéo khóa nhưng có thể cởi bò trang phục (Ví dụ: áo phông, quần đùi, giày, tất) có trợ giúp. Các ví dụ gồm người lớn giúp trẻ kéo tay áo và trẻ kéo áo qua khỏi đầu, người lớn cởi dây giày và trẻ kéo giày ra khỏi chân, hoặc người lớn kéo khóa quần và trẻ tụt nó xuống khỏi chân.","",0],["TL.1.10",7,35,"Mặc vào một phần trang phục có sự hỗ trợ","Không cần cài cúc hoặc kéo khóa trang phục, nhưng có thể mặc được (ví dụ: áo phông, quần đùi, giày, tất) có trợ giúp. Các ví dụ gồm người lớn kéo áo lên và trẻ thì chui đầu vào, người lớn giữ giầy còn trẻ xỏ vào, hoặc người lớn giúp trẻ cầm quần cho trẻ xỏ vào và kéo lên.","",0],["TL.1.11",7,36,"Để tay dưới dòng nước chảy","Có thể được gợi ý, nhưng phải để tay được dưới vòi nước trong tối thiểu 5 giây.","",0],["TL.1.12",7,36,"Lau khô tay bằng khăn","Có thể được gợi ý, nhưng phải sử dụng được khăn lau để lau khô cả hai tay.","",0],["TL.1.13",7,36,"","Báo cáo của phụ huynh là đủ. Lau khô người bằng khăn tắm","",0],["TL.1.14",7,36,"","Báo cáo của phụ huynh là đủ.","",0],["TL.1.15",7,36,"Chịu chải tóc, lau mũi và đánh răng","Có thể gây ồn ào nhưng người lớn có thể thực hiện thói quen mà không có các vấn đề hành vi hung hăng, tự làm đau bản thân hoặc các hành vi nghiêm trọng Giúp đỡ trong việc chải tóc","",0],["TL.1.16",7,36,"Cho bản chải đánh răng vào miệng","Cho bàn chải vào miệng, nếm kem đánh răng. Không cần phải chải răng.","",0],["TL.1.17",7,37,"Cho quần áo bẩn vào giỏ","Có thể được nhắc nhở hoặc gợi ý (Ví dụ: người lớn cầm quần áo, chỉ vào giỏ) nếu cần thiết, nhưng có thể thả quần áo vào giỏ được","",0],["TL.1.18",7,37,"Bỏ rác vào thùng rác","Có thể được nhắc nhở hoặc gợi ý (Ví dụ: người lớn cầm khăn giấy, chỉ vào thùng rác) nếu cần thiết, nhưng có thể thả được rác vào thùng rác","",0],["GTN.2.1",0,25,"Làm theo các chỉ dẫn “dừng lại” hoặc “chờ đợi” mà không cần nhắc hay ra hiệu cử chỉ/điệu bộ.","Trẻ phản ứng lại với hướng dẫn bằng lời; dừng hoàn toàn hoạt động, nhìn vào người lớn và chờ người lớn hướng dẫn.","",1],["GTN.2.2",0,25,"Làm theo 8 – 10 hướng dẫn bằng lời để thực hiện hoạt động có một bước bao gồm cả hành động cơ thể và hành động với đồ vật.","Trẻ phản ứng lại với những hướng dẫn bằng lời bao gồm các động từ (VD: lắc chùy lắc, đập gậy, ôm bé, đập bột nặn, cắt, đứng dậy, vỗ tay, ngọ nguậy tai; phải theo cả hai hình thức – các hành động của cơ thể và hành động lên đồ vật).","",1],["GTN.2.3",0,25,"Nhận biết được các bộ phận cơ thể của mình hoặc của người khác bằng cách chỉ tay hay gọi tên.","Đạt yêu cầu khi nhận diện được 5 bộ phận cơ thể hoặc nhiều hơn.","",1],["GTN.2.4",0,25,"Phản ứng lại với hướng dẫn bằng lời yêu cầu đưa/chỉ tay/cho xem 8 – 10 đồ vật cụ thể nào đó trong khi chơi, khi mặc quần áo, khi ăn (VD: em bé, ghế, xe ô tô, khối gỗ, cốc, con gấu).","Tự diễn giải.","",1],["GTN.2.5",0,25,"Nhận ra được 3 bức tranh trong sách bằng cách chỉ tay hoặc chú ý nhìn (bao gồm: cốc, ô tô, con chó, con mèo, em bé).","Phản ứng lại với “… ở đâu?” hoặc “Chỉ cho cô… ?” bằng việc chỉ trỏ bằng ngón trỏ và nhìn.","",1],["GTN.2.6",0,25,"Hiểu được các khái niệm về không gian đơn giản (VD: trong, trên).","Đạt yêu cầu khi trẻ thể hiện được hiểu biết chung về 3 giới từ hoặc hơn bằng cách làm theo những chỉ dẫn bằng lời trong đó có sử dụng đồ vật.","",1],["GTN.2.7",0,25,"Nhìn vào người và ảnh của người đó khi được gọi tên – người thân gia đình, thú cưng, giáo viên.","Đạt yêu cầu khi phản ứng lại với 4 tên gọi khác nhau hoặc hơn. Nếu người/vật nuôi có mặt ở đó, trẻ phải nhìn vào người hoặc vật nuôi đó khi tên được gọi (cũng có thể chỉ). Nếu là tranh ảnh, trẻ chạm hoặc chỉ vào bức tranh khi được gọi tên.","",1],["GTN.2.8",0,25,"Lấy 8 – 10 đồ vật ở trong phòng nhưng không trực tiếp ở trước mặt trẻ mà cần phải tìm kiếm một chút, theo yêu cầu bằng lời.","Khi phản ứng với yêu cầu bằng lời “Lấy…”, trẻ lấy đồ vật trong phòng nhưng ngoài tầm nhìn. Nhiệm vụ bao gồm nhớ được yêu cầu đủ lâu để thực hiện việc tìm kiếm bằng mắt ở trong phòng, và lấy được đồ vật trên sàn, trên bàn, ghế hoặc trên giá.","",1],["GTN.2.9",0,25,"Với yêu cầu bằng lời (có kèm cử chỉ/điệu bộ), hoàn thành 2 hành động với 1 đồ vật.","Trẻ xâu chuỗi 2 hành động với nhau trên 1 đồ vật đáp lại một hướng dẫn bằng lời kèm cử chỉ/điệu bộ. Cần phải thể hiện được 3 chuỗi hành động khác nhau hoặc nhiều hơn mới đạt yêu cầu (Vd: “Đi kiếm và đem giày của con lại cho cô”).","",1],["GTN.2.10",0,25,"Chỉ vào các bộ phận cơ thể được gọi tên ở trong tranh.","Nhận diện được 5 bộ phận cơ thể hoặc nhiều hơn trong một bức ảnh lớn hoặc bản vẽ khi được hỏi.","",1],["GTD.2.1",1,26,"Sử dụng các kí hiệu riêng hoặc cử chỉ/điệu bộ kèm phát âm để thể hiện (yêu cầu, công việc đã hoàn thành, sự chia sẻ, sự giúp đỡ, sự phản đối).","Trẻ kết hợp cử chỉ/điệu bộ đặc biệt và giọng nói hoặc phát âm từ gần đúng (nói không chuẩn) để giao tiếp tất cả 4 chức năng này.","",1],["GTD.2.2",1,26,"Phát âm 6 – 10 từ đơn hoặc cố phát âm từ gần đúng trong ngữ cảnh quen thuộc hàng ngày, các thói quen về giác quan – xã hội, các bài hát.","Phát âm 5 từ tương đương khác nhau hoặc nhiều hơn trong các thói quen xã hội quen thuộc. Có thể tự phát hoặc bắt chước nhưng không được nhắc.","",1],["GTD.2.3",1,26,"Phát âm tự phát các từ có liên quan đến một thói quen chơi nào đó (lăn, đi, dừng).","Phát âm 3 từ tương đương khác nhau hoặc nhiều hơn gồm các động từ liên quan đến các hành động cơ thể hoặc tương tác với đồ vật – tự phát hoặc bắt chước nhưng không được nhắc.","",1],["GTD.2.4",1,26,"Sử dụng được tối thiểu 20 từ (có thể nói chưa chuẩn hoặc gần đúng), trong đó gồm có danh từ (tên của đồ vật, con vật, người) và những loại từ khác (chẳng hạn như động từ hoặc giới từ: đã xong, lên…).","Trẻ tự phát sử dụng từ, dù có thể chưa đúng hoàn toàn, để yêu cầu hoạt động hay đồ vật. Phải dùng được cả danh từ và các loại từ khác mới đạt yêu cầu.","",1],["GTD.2.5",1,26,"Gắn tên một cách tự phát cho các đồ vật và tranh ảnh.","Đạt yêu cầu nếu trẻ nói được tên của 5 đồ vật hoặc nhiều hơn và 5 bức tranh hoặc nhiều hơn một cách tự phát.","",1],["GTD.2.6",1,26,"Phát âm với các ngữ điệu khác nhau trong các bài hát.","Trẻ có các ngữ điệu khác nhau khi phát âm một số từ trong bài hát hoặc ngâm nga, thể hiện nhận thức về ngữ điệu trong đó.","",1],["GTD.2.7",1,26,"Yêu cầu và từ chối bằng cách sử dụng các từ đơn có kèm ánh nhìn.","Trẻ sử dụng các từ đơn với ánh nhìn để truyền tải cả yêu cầu và phản đối, từ chối hoặc phủ nhận.","",1],["GTD.2.8",1,26,"Gắn tên cho các hành động trong ngữ cảnh (VD: trong khi di chuyển cơ thể và/hoặc các hành động với các đồ vật).","Trẻ phát âm tối thiểu 10 động từ, cả bắt chước lẫn tự phát để gắn tên cho những hành động của bản thân, của người khác hay đối với đồ vật.","",1],["GTD.2.9",1,26,"Sử dụng gần đúng tên của 3 người quan trọng (bao gồm cả bản thân).","Trẻ sử dụng tên để gọi người trong bức tranh, trong gương và ngoài đời thực hoặc để thu hút sự chú ý của người đó. Có thể trong phản ứng lại với câu hỏi “Ai đó?”.","",1],["GTD.2.10",1,26,"Lắc đầu và nói “Không” để từ chối.","Trẻ kết hợp một cách tự phát việc lắc đầu kèm nói “Không” để từ chối một lời đề nghị.","",1],["GTD.2.11",1,26,"Gật đầu thể hiện ý “có” và nói “Có” để xác nhận.","Trẻ kết hợp một cách tự phát việc gật đầu kèm nói “Có” để chấp nhận một đề nghị.","",1],["GTD.2.12",1,26,"Hỏi (hoặc tương đương) “Cái gì?” khi bắt gặp cái gì đó lạ.","Trẻ nhìn vào người lớn một cách tự phát và cử chỉ/điệu bộ hướng về đồ vật trong khi hỏi “Cái gì đó?” trong vài ngữ cảnh khác nhau.","",1],["CYC.2.1",2,38,"Khi người khác yêu cầu “Nhìn…” và đưa đồ vật ra, trẻ phản ứng bằng cách chuyển ánh nhìn, quay người và nhìn vào đồ vật được đưa ra.","Tự diễn giải.","",1],["CYC.2.2",2,38,"Phản ứng lại yêu cầu “Nhìn” và chỉ tay bằng cách hướng về phía đồ vật /người được chỉ định ở xa.","Tự diễn giải.","",1],["CYC.2.3",2,38,"Đưa hoặc lấy đồ vật từ người khác có phối hợp giao tiếp mắt.","Việc này gồm việc đưa và nhận. Nếu là nhận, người lớn không nên đưa ngay đồ vật ra. Ánh nhìn thể hiện sự giao tiếp “yêu cầu”.","",1],["CYC.2.4",2,38,"Đáp ứng lại với “Cho xem” bằng cách chìa đồ vật cho người lớn.","Tự diễn giải.","",1],["CYC.2.5",2,38,"“Cho người khác xem” đồ vật một cách tự phát.","Trẻ biết đưa đồ chơi ra trước mặt người lớn, nhìn vào người lớn và chờ đợi một lời nhận xét. Nếu trẻ tự thể hiện hành vi này vài lần trong một giờ chơi là đạt yêu cầu.","",1],["CYC.2.6",2,38,"Dõi theo tay chỉ hoặc ánh nhìn một cách tự phát (không có tín hiệu bằng lời) để nhìn vào đích.","Thu hút được ánh nhìn của trẻ trong tương tác mặt đối mặt và sau đó quay ra nhìn đồ vật. Vượt qua nếu trẻ có quay đầu và tìm kiếm một chút. Không cần phải tìm được đích.","",1],["CYC.2.7",2,38,"Tự phát chỉ tay vào những đồ vật yêu thích.","Trẻ tự thể hiện hành vi này vài lần trong mỗi giờ. Trẻ cần phải chỉ được đích và nhìn vào người lớn rồi chờ đợi lời bình luận thì mới đạt yêu cầu.","",1],["CYC.2.8",2,38,"Cười với người lớn trong hoạt động với đồ vật yêu thích.","Trẻ đưa ánh mắt nhìn từ đồ vật sang mắt người lớn và quay trở lại đồ vật để chia sẻ niềm vui. Cần phải thấy vài lần trong thời gian 10 phút của trò chơi xã hội để đạt yêu cầu.","",1],["XH.2.1",3,39,"Khởi xướng và duy trì giao tiếp mắt trong giao tiếp.","Trẻ bắt đầu trao đổi giao tiếp (bất kì dạng nào) với ánh nhìn và duy trì ánh nhìn đó theo một cách tự nhiên trong suốt quá trình trao đổi.","",1],["XH.2.2",3,39,"Yêu cầu bằng lời hoặc khởi xướng bằng hành động thể chất trong các trò chơi xã hội quen thuộc.","Trẻ khởi xướng và đưa ra tín hiệu ánh nhìn khi di chuyển cơ thể, cử chỉ/điệu bộ hoặc giọng nói cụ thể trong một trò chơi nào đó. Để vượt qua, cần phải yêu cầu được 3 trò chơi hoặc nhiều hơn.","",1],["XH.2.3",3,39,"Đáp lại những hành vi thể hiện sự yêu mến: ôm, hôn những người thân khác.","Trẻ ôm những người lớn quen thuộc một cách tự phát, hôn vào má hoặc môi.","",1],["XH.2.4",3,39,"Sử dụng cử chỉ/điệu bộ hoặc các từ để thu hút sự chú ý của người lớn.","Trẻ tìm kiếm giao tiếp mắt từ người lớn bằng cách sử dụng từ hoặc cử chỉ/điệu bộ rõ ràng (vẫy tay, chỉ, quay mặt, vỗ nhẹ…).","",1],["XH.2.5",3,39,"Đáp lại lời chào “Hi” hoặc tạm biệt “Bai bai” và bắt chước vẫy tay.","Trẻ phản ứng lại với lời chào hỏi bằng cả các từ và cử chỉ/điệu bộ không cần nhắc nhở.","",1],["XH.2.6",3,39,"Yêu cầu sự giúp đỡ bằng lời hoặc bằng cử chỉ/điệu bộ.","Trẻ khởi xướng yêu cầu giúp đỡ bằng cách sử dụng các kí hiệu thông thường/theo quy ước hoặc từ tương đương kết hợp với ánh nhìn. Không tính chuyển động của tay và cơ thể trừ phi đi kèm với cả ánh nhìn và các từ phù hợp.","",1],["XH.2.7",3,39,"Kết hợp một cách nhất quán giao tiếp mắt với phát âm và/hoặc cử chỉ/điệu bộ trong giao tiếp trực tiếp.","Trẻ kết hợp nhất quán các hành động giao tiếp tự phát với ánh nhìn.","",1],["XH.2.8",3,39,"“Nhảy” với người khác trong các trò chơi vòng tròn theo nhạc.","Trẻ chơi một số trò chơi vòng tròn khác nhau và bắt chước chuyển động nhảy theo nhạc (“Hokey Pokey”, “Chơi vòng quanh”, “Cầu Luân Đôn”).","",1],["XH.2.9",3,39,"Chạy với người khác trong trò chơi “đuổi bắt”.","Trẻ đuổi theo người khác và bắt được người đó trong trò chơi “đuổi bắt” và cũng chạy khi bị người khác đuổi trong trò chơi đó.","",1],["XH.2.10",3,39,"Thu hút sự chú ý giao tiếp của đối tác bằng cách sử dụng tên của người hoặc trò chơi, và khởi xướng trò chơi hoặc hoạt động xã hội.","Trẻ khởi xướng một cách tự phát các trò chơi xã hội quen thuộc với một đối tác bằng cách thiết lập giao tiếp mắt và sử dụng cử chỉ/điệu bộ đi kèm tên hoặc một từ chỉ hành động (VD: “cù”, “đuổi”).","",1],["XH.2.11",3,27,"Đưa đồ vật cho bạn đồng lứa khi được yêu cầu.","Trẻ phản ứng lại một cách nhất quán với yêu cầu bằng lời của bạn cùng lứa cho một đồ vật bằng cách nhìn và đưa nó cho người bạn đó.","",1],["XH.2.12",3,27,"Tham gia vào các trò chơi và bài hát quen thuộc trong nhóm.","Trẻ tham gia hát một bài quen thuộc và các trò chơi xã hội với mô hình chuyển động phù hợp trong một nhóm nhỏ (1 – 2 trẻ khác) mà không có bất kì tín hiệu đặc biệt nào.","",1],["XH.2.13",3,27,"Tiếp tục hoạt động khi có bạn cùng lứa tham gia chơi song song.","Trẻ tiếp tục hoạt động khi bạn cùng lứa tham gia vào, hiểu và tiếp nhận sự tham gia của bạn cùng lứa. Trẻ không “giữ” đồ chơi cho riê ng mình hay từ chối sự tiếp cận đó.","",1],["XH.2.14",3,27,"Phản ứng lại một cách phù hợp với sự chào hỏi của bạn cùng lứa.","Trẻ phản ứng lại một cách tự phát với “Chào” và “Tạm biệt” từ một người bạn cùng lứa bằng việc nhìn, có cử chỉ/điệu bộ và từ phù hợp.","",1],["XH.2.15",3,27,"Chơi lần lượt với bạn cùng lứa trong các hoạt động đơn giản với đồ chơi khi được yêu cầu; đưa và lấy lại.","Trong tình huống chơi song song, trẻ phản ứng lại một cách đều đặn với yêu cầu chơi lần lượt của bạn bằng cách đưa đồ vật khi được yêu cầu và yêu cầu chơi khi tới lượt của mình bằng ngôn ngữ hoặc cử chỉ, kết hợp cả với ánh nhìn.","",1],["XH.2.16",3,27,"Ngồi trong nhóm với các bạn cùng lứa và tham gia vào các hướng dẫn quen thuộc của người lớn.","Trẻ ngồi trong một nhóm nhỏ mà không cần một chỗ đặc biệt nào hoặc sự trợ giúp từ người lớn, tham gia chú ý tới người lớn và làm theo các chỉ dẫn bằng lời trong khả năng của trẻ. Người lớn có thể gọi tên trẻ để chuyển tải chỉ dẫn nhưng không nhắc thêm gì khác.","",1],["XH.2.17",3,27,"Lấy đồ vật từ bạn cùng lứa khi được đưa.","Trẻ lấy đồ vật một cách đều đặn kèm giao tiếp mắt khi một bạn cùng lứa đưa cho.","",1],["XH.2.18",3,27,"Chuyển đồ vật cho bạn cùng lứa tại bàn hoặc trong nhóm khi được yêu cầu.","Trẻ phản ứng lại một cách nhất quán phù hợp với các yêu cầu về đồ vật trong các tình huống ở nhóm nhỏ (VD: vòng tròn buổi sáng, bàn ăn bữa phụ, bàn vẽ/nghệ thuật, góc diễn kịch).","",1],["XH.2.19",3,27,"Thỉnh thoảng bắt chước hành vi của bạn cùng lứa trong các hoạt động chơi.","Trong suốt các hoạt động chơi song song, trẻ sẽ bắt chước một vài hành động của bạn cùng lứa một cách tự phát.","",1],["XH.2.20",3,27,"Chơi các trò chơi ghép tranh (theo trí nhớ, lô tô….) một mình và với bạn cùng lứa.","Đạt yêu cầu nếu trẻ biết chơi theo lượt với bạn và hoàn thành trò chơi ghép tranh. Chỉ cần có các kỹ năng này là vượt qua mục này.","",1],["BC.2.1",2,28,"Bắt chước gần đúng các nguyện âm và phụ âm trong các giao tiếp có nghĩa.","Gồm 4 – 5 các nguyên âm khác nhau và 4 – 5 phụ âm khác nhau.","",1],["BC.2.2",2,28,"Bắt chước âm thanh của loài vật và những âm thanh khác.","Bắt chước được ít nhất 5 âm thanh khác nhau.","",1],["BC.2.3",2,28,"Bắt chước một cách tự phát và thường xuyên các từ đơn trong các tương tác.","Bắt chước 10 từ (gần đúng) hoặc hơn.","",1],["BC.2.4",2,28,"Bắt chước các chuyển động trong 5 bài hát, bắt chước ít nhất là 10 hành động khác nhau.","Có một số hành động quen thuộc; không nhắc.","",1],["BC.2.5",2,28,"Bắt chước/Mô phỏng các hành động mới trong các bài hát.","Thực hiện được gần đúng tối thiểu 5 hành động ở ngay lần làm mẫu đầu tiên.","",1],["BC.2.6",2,28,"Bắt chước các hành động với đồ vật – có nhiều bước khác nhau (hoạt động chơi).","Việc này bao gồm bắt chước một chuỗi gồm 3 hành động có liên quan hoặc nhiều hơn (VD: mở nắp hộp phân loại hình khối, lấy các hình khối ra, đậy nắp lại và sắp xếp các hình khối).","",1],["BC.2.7",2,28,"Bắt chước cá hành động chơi giả vờ với mô hình, tự với bản thân hoặc với bạn.","Trẻ bắt chước một cách nhất quán tối thiểu 4 hành động chơi giả vờ với mô hình theo tự nhiên, với bản thân cũng như với bạn.","",1],["BC.2.8",2,28,"Bắt chước 2 chuỗi chuyển động trong bài hát/trò chơi.","Trẻ bắt chước một cách tự phát 2 hoặc nhiều hơn các hành động trong mỗi bài hát đơn mà không cần nhắc nhở hay chờ đợi.","",1],["BC.2.9",2,28,"Bắt chước các cụm 2 từ.","Trẻ bắt chước một cách đều đặn các cụm 2 từ.","",1],["NT.2.1",4,29,"Ghép/Phân loại theo hình dạng.","Ghép và phân loại ít nhất 5 hình dạng khác nhau.","",1],["NT.2.2",4,29,"Ghép/Phân loại theo kích cỡ.","Ghép và phận loại được ít nhất 3 kích cỡ khác nhau của các đồ vật giống nhau.","",1],["NT.2.3",4,29,"Ghép/Phân loại theo kiểu dáng, đường nét.","Trẻ ghép và phân loại theo kiểu dáng, đường nét.","",1],["NT.2.4",4,29,"Phân loại các đồ vật tương tự nhau vào các nhóm (dựa theo một danh tính chung).","Trẻ ghép và phân loại các đồ vật không giống nhau dựa theo một danh tính chung (VD: các ô tô, các con ngựa, tất, bóng, giày, cốc).","",1],["NT.2.5",4,29,"Phân loại các đồ vật thông dụng vào các nhóm theo chức năng.","Trẻ nhóm các đồ vật theo chức năng: ăn, mặc, đồ chơi, vẽ.","",1],["NT.2.6",4,29,"Tìm kiếm/Yêu cầu đồ vật bị mất/còn thiếu.","Trẻ nhận biết được khi thiếu một đồ vật trong một bộ và có yêu cầu về đồ vật đó hoặc tìm kiếm nó (VD: một miếng ghép bị thiếu, một chiếc giày bị mất, một chiếc cốc bị thiếu).","",1],["NT.2.7",4,29,"Ghép/Phân loại theo 2 tiêu chí.","Trẻ ghép/phân loại các đồ vật theo màu sắc và hình dạng, hoặc hình dạng và kích cỡ…","",1],["NT.2.8",4,29,"Ghép nhóm số lượng từ 1 đến 3.","Trẻ ghép các đồ vật khác nhau vào nhóm có số lượng từ 1 – 3 (VD: các miếng ghép domino, các miếng ghép hình thú trên đĩa).","",1],["C.2.1",3,40,"Kết hợp 2 đồ vật có liên quan trong trò chơi (bộ chén và đĩa nhỏ, bộ thìa và đĩa).","Trẻ thể hiện nhận thức về chức năng liên quan đến bộ trò chơi.","",1],["C.2.2",3,40,"Bắt chước/Phát ra âm thanh tương ứng trong trò chơi (nói chuyện điện thoại, giả tiếng ồn ô tô, tiếng các loài vật).","Đạt yêu cầu nếu trẻ tạo ra được 5 âm thanh hoặc nhiều hơn trong trò chơi.","",1],["C.2.3",3,40,"Thực hiện hành động đơn lẻ với trang phục hay đồ vật gì đó trên búp bê hay con vật.","Trẻ cần tự phát hành động: không đạt nếu chỉ bắt chước.","",1],["C.2.4",3,40,"Kết hợp các hành động theo chức năng có liên quan đến một chủ đề chơi nào đó (cho ăn uống, đặt lên giường và đắp chăn).","Trẻ cần tự phát thực hiện liên tiếp tối thiểu 2 hành động có liên quan đến một hoạt động. Không vượt qua nếu chỉ bắt chước.","",1],["C.2.5",3,40,"Thể hiện khả năng giải quyết vấn đề bằng việc “thử và sai” với đồ chơi xây dựng; cách thức linh hoạt, không lặp đi lặp lại.","Vượt qua nếu trẻ có thử nghiệm và giải quyết vấn đề khi mắc lỗi trong trò chơi có đồ vật.","",1],["C.2.6",3,41,"Chơi phù hợp và linh hoạt trong 10 phút mà thỉnh thoảng người lớn mới phải để ý đến.","Người lớn có thể đưa ra một vài bộ xếp hình hoặc các dụng cụ hình ảnh không gian, nhưng trẻ cần chơi một mình bằng cách thực hiện trò chơi phù hợp mà không cần chỉ dẫn bằng lời quá 2 lần, thì cho vượt qua mục này. Không phạt/vẫn cho qua nếu có một số hành động lặp đi lặp lại trong trò chơi.","",1],["C.2.7",3,41,"Có thể tự thích ứng một cách phù hợp với các vật liệu chơi mở đầu – kết thúc trong ít nhất 10 phút thỉnh thoảng có sự hướng dẫn của người lớn.","Người lớn có thể bày vật liệu ra (đất nặn, các dụng cụ nghệ thuật, sách, đồ để chơi giả vờ), nhưng trẻ cần chơi một mình bằng cách thực hiện các hành động chơi phù hợp không cần quá 2 chỉ dẫn bằng lời thì vượt qua mục này.","",1],["C.2.8",3,41,"Lấy đồ vật, mang tới bàn, hoàn thành nhiệm vụ chơi và cất đồ.","Trẻ chơi độc lập gồm lấy dụng cụ, di chuyển đến địa điểm chơi, biết thu dọn và cất dụng cụ khi kết thúc. Việc này có thể bao gồm cả các hoạt động chơi tự do theo hướng mở và có kết thúc.","",1],["VDT.2.1",5,31,"Đặt 3 hình hoặc nhiều hơn vào đúng khuôn hình.","Trẻ hoàn thành đặt hình dạng vào khuôn một cách độc lập; có thể thử và mắc lỗi nhưng không được nhắc hay hỗ trợ.","",1],["VDT.2.2",5,31,"Xếp chồng 8 – 10 khối có kích cỡ 1 inch.","Trẻ tự mình dựng một hình tháp gồm 8 – 10 khối gỗ giữ được thăng bằng.","",1],["VDT.2.3",5,31,"Sao chép 3 hoặc nhiều hơn mô hình khối đơn giản.","Trẻ sao chép một vài mô hình khối bao gồm tối thiểu 3 khối gỗ (VD: tháp thẳng đứng, đường ngang, cây cầu).","",1],["VDT.2.4",5,31,"Ghép theo các cách khác nhau 5 hoặc nhiều hơn các khối xếp hình, xâu hạt, khối gỗ.","Trẻ sử dụng các dạng đồ vật đan cài vào nhau và lắp ráp số lượng 5 hoặc nhiều hơn theo một số cách khác nhau.","",1],["VDT.2.5",5,31,"Bắt chước 5 hoặc nhiều hơn các hành động đơn giản trong trò chơi với đất nặn (lăn tròn, chọc, vỗ dẹt, nặn).","Tự diễn giải.","",1],["VDT.2.6",5,31,"Dán các miếng dán đa dạng lên giấy.","Người lớn có thể phải giúp bóc một góc để trẻ bóc được miếng dán ra, nhưng trẻ phải tự bóc hẳn miếng dán ra khỏi tờ miếng dán và dán vào tờ giấy một cách độc lập.","",1],["VDT.2.7",5,31,"Mở ra và đóng vào các hộp đựng khác nhau, trong đó có loại có nắp vặn xoáy.","Đây không phải là một bài kiểm tra về sức khỏe – nắp nên dễ mở.","",1],["VDT.2.8",5,31,"Kéo khóa và mở khóa.","Trẻ có thể tự kéo khóa hết xuống; trẻ có thể kéo khóa lên trên cùng; mặc dù người lớn có thể phải giúp chập 2 đường khóa vào nhau cho trẻ.","",1],["VDT.2.9",5,31,"Xâu các đồ vật với nhau bằng dây thừng, dây to bản.","Trẻ xâu tối thiểu 5 hạt, các miếng hình mì ống, các vòng nhẫn….vào 1 dây to mà không cần trợ giúp hay nhắc nhở.","",1],["VDT.2.10",5,31,"Bắt chước các đường nét, chữ viết nguệch ngoạc, các dấu chấm bằng bút dầu, bút chì màu.","Trẻ bắt chước tối thiểu 3 hình thức hành động khác nhau với các dụng cụ viết.","",1],["VDT.2.11",5,31,"Cắt giấy bằng kéo.","Không cần phải cắt rời. Có thể sử dụng kéo của trẻ hoặc của người lớn. Ngườ lớn có thể chỉ cách cầm kéo nhưng trẻ phải tự cắt. Không cần phải cầm kéo một cách hoàn hảo. Cần phải thực hiện được 3 lần cắt.","",1],["VDT.2.12",5,31,"Đặt miếng nhựa dẹt và đồng xu vào một khe cắm.","Trẻ tự đặt 5 miếng hoặc nhiều hơn trên bàn và đặt từng miếng vào khe, cả theo đường thẳng và ngang mà không cần nhắc nhở, và thành công với các đồng xu.","",1],["VDT.2.13",5,31,"Xâu chuỗi các hạt khác nhau bằng nhiều loại dây khác nhau.","Trẻ có thể xâu chuỗi các đồ vật trên nhiều loại dây khác nhau.","",1],["VDT.2.14",5,31,"Hoàn thành bảng ghép hình gồm 4 – 6 miếng khớp với nhau.","Trẻ tự hoàn thành bảng ghép; có thể thử nghiệm và mắc lỗi nhưng không được nhắc hay hỗ trợ.","",1],["VDTH.2.1",6,32,"Bắt chước các hành động vận động thô ở nhiều tình huống khác nhau (ngồi, đứng, di chuyển).","Trẻ có thể bắt chước một cách nhất quán và tự phát các hành động (có thể được hướng dẫn) bất kể là ở chỗ nào.","",1],["VDTH.2.2",6,32,"Nhảy xuống một bậc và nhảy qua chướng ngại vật trên mặt đất.","Trẻ nhảy và di chuyển về địa điểm nào đó, từ một bậc thấp đến một mặt phẳng.","",1],["VDTH.2.3",6,32,"Sử dụng một số trang thiết bị ở sân chơi (trèo, trượt).","Trẻ khởi xướng một cách nhất quán các hành động phù hợp với một số trang thiết bị thấp ở sân chơi.","",1],["VDTH.2.4",6,32,"Ngồi trên xe 3 bánh và đẩy bằng chân hoặc bắt đầu với bàn đạp.","Trẻ tự ngồi lên xe 3 bánh đúng chỗ để lái và cố gắng/thử đạp bàn đạp nhưng có thể càn sự hỗ trợ.","",1],["VDTH.2.5",6,32,"Kéo xe hoặc đẩy xe cút kít.","Trẻ có thể tự xoay sở với xe kéo hoặc xe cút kít để di chuyển đồ vật trên sân chơi.","",1],["VDTH.2.6",6,32,"Đá bóng vào mục tiêu.","Trẻ đá quả bóng lớn vào trúng đích.","",1],["VDTH.2.7",6,32,"Đào bằng xẻng.","Trẻ đào bằng xẻng, xúc vật liệu lên, và tự chuyển vào thùng/hộp chứa.","",1],["TL.2.1",7,34,"Sử dụng khăn ăn khi có gợi ý.","Khi được hướng dẫn nhưng không trợ giúp, trẻ cầm khăn ăn lên và lau một cách phù hợp ở mỗi phần hướng dẫn. Không cần làm suốt mà chỉ cần làm lướt qua một chút.","",1],["TL.2.2",7,34,"Tự lấy thức ăn từ bát với các dụng cụ.","Khi người lớn cầm hoặc đặt bát hoặc đĩa trước trẻ, trẻ sử dụng dụng cụ ăn để chuyển đồ ăn sang đĩa của nó một cách độc lập. Có thể lung túng. Người lớn có thể dùng tín hiệu.","",1],["TL.2.3",7,34,"Chuyển các hộp đựng khi được hướng dẫn.","Tại bàn, khi một người yêu cầu trẻ chuyển đồ, trẻ nhìn đồ vật đó và cầm lên, sau đó chuyển nó cho người ở bên trái hoặc phải. Trẻ cần phản ứng lại với yêu cầu bằng cách tìm kiếm đồ vật và cố gắng tự cầm nó lên. Nếu ai đó chuyển một hộp đựng cho trẻ và hướng dẫn trẻ chuyển nó cho người kế tiếp, trẻ làm theo chỉ dẫn mà không cần nhắc nhở.","",1],["TL.2.4",7,34,"Mang đĩa, cốc và đồ ăn bằng bạc (kim loại) ra bồn khi ăn xong.","Khi trẻ rời bàn, trẻ làm theo các hướng dẫn của người lớn là mang đi một số đồ vật nào đó tới một địa điểm cụ thể mà không cần nhắc nhở.","",1],["TL.2.5",7,34,"Duy trì ở tại bàn ăn cùng người khác trong suốt thời gian ăn.","Trẻ ngồi trong suốt bữa ăn và ở nguyên không cần nhắc hoặc trợ giúp cho đến khi ăn xong, và người lớn ra tín hiệu là nó có thể đi.","",1],["TL.2.6",7,34,"Ăn uống và cư xử một cách phù hợp ở cửa hàng đồ ăn nhanh.","Trẻ tham gia tất cả các bước trong bữa ăn nhanh – chờ đợi, yêu cầu món, mang đi, ngồi, ăn, dọn, và rời khỏi mà không cần nhắc nhở. Trẻ ngồi cho đến khi kết thúc và cho đến khi người khi ăn xong. Trẻ vui vẻ đi bộ cùng người lớn ra cửa. Không cần người lớn phải giữ tay.","",1],["TL.2.7",7,34,"Chạm hoặc thử một đồ ăn mới đã được giới thiệu nhiều lần.","Trẻ phản ứng lại một cách vui vẻ với hướng dẫn nếm hoặc cắn hay uống một món nào đó.","",1],["TL.2.8",7,34,"Ăn tất cả các nhóm thức ăn.","Trẻ tự phát ăn một số quả/rau, bơ, sữa, ngũ cốc, và thịt (ngoại trừ những hạn chế thường xuyên nào đó).","",1],["TL.2.9",7,34,"Tự uống nước.","Trẻ tự phát lấy cốc và lấy nước từ vòi hoặc tủ lạnh mà không cần bất kì một hướng dẫn hoặc trợ giúp nào từ phía người lớn. Khi dùng xong, trẻ vặn vòi lại một cách tự phát.","",1],["TL.2.10",7,35,"Tự cởi quần áo và bỏ vào giỏ đựng quần áo bẩn (quần áo không có nút/khuy).","Khi được hướng dẫn, trẻ cởi áo, quần, quần áo lót, tất và giày mà không cần trợ giúp của người khác, và đặt tất cả quần áo vào nơi đựng phù hợp. Có thể nhắc bằng lời hoặc dùng cử chỉ/điệu bộ 1 hoặc 2 lần, nhưng không nhắc bằng hành động.","",1],["TL.2.11",7,35,"Tự thực hiện được một số bước mặc quần áo (cần hỗ trợ nếu có nút/khuy).","Tự giải thích.","",1],["TL.2.12",7,35,"Cởi bỏ áo khoác, mũ (không có khóa, dây buộc) và treo trên móc.","Tự cởi bỏ áo khoác và mũ; có thể được nhắc treo vào đúng chỗ.","",1],["TL.2.13",7,42,"Lau mặt bằng khăn ẩm khi được hướng dẫn.","Sau khi người lớn đưa khăn ẩm và hướng dẫn “Lau mặt con đi”, trẻ lau toàn bộ mặt mà không cần trợ giúp thêm, sau đó đưa lại, hoặc đặt xuống khi xong.","",1],["TL.2.14",7,42,"Lau mũi khi được hướng dẫn.","Khi được hướng dẫn xì hoặc lau mũi, trẻ đi tới hộp đựng khăn giấy, lấy giấy, xì hoặc lau mũi, và ném giấy đi mà không cần thêm một lời nhắc nào.","",1],["TL.2.15",7,42,"Thực hiện tất cả các bước rửa tay.","Trẻ thực hiện đều đặn hành động cho mỗi bước rửa tay chứ không chỉ là vặn nước mà không cần sự nhắc nhở nào bằng hành động. Người lớn có thể nhắc một số bước bằng cử chỉ/điệu bộ hoặc một phần bằng hành động.","",1],["TL.2.16",7,42,"Hợp tác khi được gội đầu/cắt tóc.","Trẻ không chống cự, khóc hoặc các hành động chống đối khi chải đầu hay cắt tóc. Trẻ tham gia bằng cách trợ giúp lau dầu gội, lau khăn. Có thể sử dụng các dụng cụ thúc đẩy mạnh mẽ trong quá trình thực hiện.","",1],["TL.2.17",7,42,"Chơi với 5 đồ chơi khi đi tắm một cách phù hợp.","Tự giải thích – đối với những đồ chơi khi đi tắm thông thường.","",1],["TL.2.18",7,42,"Cất đồ chơi đi theo yêu cầu khi tắm xong.","Trẻ phải đặt tất cả đồ chơi khi tắm vào hộp chứa phù hợp mà không cần nhắc nhở thêm sau khi đã có hướng dẫn khởi đầu.","",1],["TL.2.19",7,42,"Hỗ trợ bôi kem dưỡng da.","Trẻ trợ giúp cha mẹ bằng cách thoa kem lên tay, cánh tay, chân, bụng.","",1],["TL.2.20",7,42,"Chà bàn chải đánh răng trên bề mặt răng.","Trể chà bàn chải lên hàm dưới và hàm trên, ở trước và ở trong khi được hướng dẫn. Có thể nhắc ở các cấp độ hoặc bằng hành động.","",1],["TL.2.21",7,42,"Tự đi ngủ sau khi hoàn thành các hoạt động theo thói quen trước giờ đi ngủ.","Trẻ ngủ trên giường của nó và đi ngủ mà không cần sự hiện diện của người lớn trong phòng khi đến giờ và đèn tắt.","",1],["TL.2.22",7,42,"Hiểu chuỗi thói quen trước giờ đi ngủ.","Trẻ hiểu thói quen trước giờ đi ngủ bằng cách khởi xướng 1 hoặc nhiều hoạt động, và tham gia thực hiện các bước khác nhau theo thói quen mà không cần nhắc nhở hoàn toàn.","",1],["TL.2.23",7,43,"Sắp xếp các dụng cụ bằng bạc (kim loại) từ bồn rửa/máy rửa bát vào khay đựng.","Người lớn có thể đặt ra tình huống, nhưng sau khi đặt ra và hướng dẫn, trẻ lấy được khoảng 20 đồ ăn từ bồn và đặt chúng vào khay mà không cần bất kì sự trợ giúp nào từ phía người lớn.","",1],["TL.2.24",7,43,"Tháo đồ từ máy sấy khô cho vào giỏ.","Khi bố hoặc mẹ mở máy sấy và đưa giỏ, trẻ kéo tất cả các thứ trong máy sáy ra và cho vào giỏ mà không cần nhắc nhở thêm. Trẻ có thể cần trọ giúp thêm ở một mục khó nào đó.","",1],["TL.2.25",7,43,"Xếp đôi tất với nhau.","Thực hiện với khoảng một nhóm 10 đôi tất hoặc hơn trong một giỏ, trẻ để tất theo đôi, gập hoặc xếp chúng lại, sau đó thả vào thùng chứa.","",1],["TL.2.26",7,43,"Đổ nước/thức ăn vào đĩa dành cho vật nuối.","Người lớn có thể cung cấp vật liệu và hướng dẫn, nhưng trẻ phải thực hiện hành động mà không cần trợ giúp thêm.","",1],["GTN.3.1",0,25,"Tập trung chú ý và tham gia với sự thích thú trong 5-10 phút khi người lớn đọc một cuốn sách quen thuộc có sử dụng các câu đơn giản.","Ở cùng với người lớn, rất tập trung chú ý và tham gia vào câu chuyện mà người lớn đang đọc. Các VD như giao tiếp mắt giữa các trang sách và người lớn, chỉ vào tranh ảnh trong sách, lật các trang sách, nói tên các bức tranh trong sách.","",2],["GTN.3.2",0,25,"Thực hiện các câu lệnh mới có 1 yêu cầu với các đồ vật / hành động quen thuộc.","Thực hiện chỉ dẫn bằng cách nhìn vào người lớn và thực hiện hành động mà không cần người lớn phải dùng cử chỉ/điệu bộ hoặc hành động để hướng dẫn. Người lớn có thể nhắc lại chỉ dẫn một lần nữa mà không cần ra tín hiệu cử chỉ/điệu bộ.","",2],["GTN.3.3",0,25,"Nhận diện được nhiều đồ vật phổ biến và tranh ảnh về chúng: quần áo, đồ dùng ăn uống,vệ sinh, chơi, thức ăn.","Vượt qua nếu nhận được hơn 50 đồ vật phổ biến hoặc hơn.","",2],["GTN.3.4",0,25,"Phản ứng lại một cách phù hợp với câu hỏi \"có/ không\" về sở thích.(Nói kèm giao tiếp mắt)","Nói \" có/ không\" phù hợp với ngữ cảnh yêu cầu hoặc từ chối. Cần có cả giao tiếp mắt, mặc dù không cần đi kèm cử chỉ/điệu bộ(VD: gật/ lắc đầu). Có thể sử dụng các cụm như \" yes, please\", \" không, cảm ơn\".","",2],["GTN.3.5",0,25,"Nhận ra hoặc 5 hoặc nhiều hơn các hành động trong tranh hoặc sách (Phát âm và / hoặc ra cử chỉ/điệu bộ)","Phát âm và / hoặc ra cử chỉ/điệu bộ (VD chỉ tay) đáp lại câu hỏi của người lớn. Các VD: \"Chỉ cho cô em bé đang ngủ?\" hoặc \" Con có nhìn thấy con chó đang chạy không?\". Phản ứng không cần đi kèm với giao tiếp mắt.","",2],["GTN.3.6",0,25,"Làm theo hai hoặc nhiều hơn các chỉ dẫn được đưa ra trong tình huống quen thuộc hàng ngày (giờ đi ngủ: lấy một quyển sách và vào giường; lấy bằng chải và kem đánh răng).","Đều đặn làm theo chỉ dẫn từ 2 - 3 phần gồm các hành động và đồ vật theo thói quen đã được làm hàng ngày.","",2],["GTN.3.7",0,25,"Hiểu được mối liên hệ về không gian của các đồ vật (VD: dưới, cạnh).","Các VD là sử dụng các khái niệm một cách phù hợp khi được đề nghị (\" Đặt quả bóng ở cạnh xe ô tô \" hoặc \" Đặt quả bóng ở dưới gầm bàn \").","",2],["GTN.3.8",0,25,"Phân biệt được những khái niệm ban đầu về kích cỡ- to/ nhỏ","Phát âm hoặc dùng cử chỉ/điệu bộ (VD: chỉ tay, cầm đồ vật) để phản ứng lại với câu hỏi của người lớn. Các VD: \" Quả bóng to đâu?\" hoặc \" Chỉ cho cô chiếc ô tô nhỏ\". Phản ứng lại không cần đi kèm giao tiếp mắt.","",2],["GTN.3.9",0,25,"Phân biệt được tối thiểu là 4 màu sắc khác nhau theo yêu cầu.","Phát âm hoặc dùng cử chỉ/điệu bộ (VD: chỉ tay, cầm đồ vật) để phản ứng lại với yêu cầu của người lớn. Các VD: \" Bút màu xanh da trời đâu?\" hoặc \" Chỉ cho cô chiếc xe tải màu đỏ\". Phản ứng lại không cần đi kèm giao tiếp mắt.","",2],["GTN.3.10",0,25,"Nhận ra được 20 âm thanh (VD: tiếng con vật, chuông điện thoại; \" Con gì kêu ' meo meo'?\").","Phát âm hoặc dùng cử chỉ/điệu bộ (VD: chỉ tay, cầm đồ vật) để phản ứng lại với câu hỏi của người lớn. Các VD: \" Con gì kêu ' meo meo'?\", \" Con chó kêu thế nào nhỉ\" hoặc \" Con nghe thấy gì?\". Phản ứng lại không cần đi kèm giao tiếp mắt.","",2],["GTN.3.11",0,25,"Hiểu được chức năng của các đồ vật thông thường/ phổ biến (đi xe, xắt, ăn, ngủ, đi vào chân, uống,..).","Phát âm hoặc dùng cử chỉ/điệu bộ (VD: chỉ tay, cầm đồ vật) để phản ứng lại với câu hỏi của người lớn. Các VD: \" Chúng ta lái bằng gì?\" hoặc \" Chúng ta dùng gì để uống?\". Phản ứng lại không cần đi kèm giao tiếp mắt. Vượt qua khi xác định tối thiểu 3 chức năng của đồ vật.","",2],["GTN.3.12",0,25,"Hiểu được các đại từ sở hữu \" của tôi\" và \" của bạn\".","Phát âm hoặc dùng cử chỉ/điệu bộ (VD: chỉ tay, cầm đồ vật) để phản ứng lại với câu hỏi của người lớn. Người lớn có thể sử dụng một đồ vật thuộc sở hữu của trẻ để thăm dò khả năng hiểu. Các VD: \" Lượt này của ai?\" hoặc \" Chiếc giày này của ai?\". Phản ứng lại không cần đi kèm giao tiếp mắt.","",2],["GTN.3.13",0,25,"Xác định được 10 hành động thông qua tranh ảnh, chọn lựa, thể hiện hành động","Phát âm hoặc dùng cử chỉ/điệu bộ (VD: chỉ tay, cầm đồ vật, thể hiện hành động) để phản ứng lại với câu hỏi của người lớn. Các VD: \" Chỉ cho cô cách con ném bóng\" hoặc \" Cho cô xem con lợn đang ăn\".","",2],["GTN.3.14",0,25,"Làm theo hai hoặc nhiều hơn các chỉ dẫn độc lập trong ngữ cảnh mới lạ","Hoàn thành chỉ dẫn bằng cách nhìn vào người lớn và thực hiện hành động mà không cần chỉ dẫn bằng cử chỉ/điệu bộ hoặc hành động của người lớn. Người lớn có thể nhắc lại chỉ dẫn một lần nữa mà không cần dùng tín hiệu cử chỉ/điệu bộ. Các VD: \" Đưa cho cô chiếc xe ô tô và đóng sách lại\" hoặc \" Đặt quả bóng vào xô, và đặt búp bê lên bàn\"","",2],["GTD.3.1",1,26,"Nói được cụm 2-3 từ cho các ngữ cảnh giao tiếp khác nhau (VD: yêu cầu, chào hỏi, thu hút sự chú ý, phản đối)","Phát âm cần kèm cả giao tiếp mắt. Các VD: \" Muốn thêm nước hoa quả\". \" Tạm biệt Sally\". \" Giúp con mở\" hoặc \" Không bóng\". Phát âm không cần hoàn hảo.","",2],["GTD.3.2",1,26,"Nói được các câu 2 từ trở lên để bình luận với người khác","Phát âm cần kèm cả giao tiếp mắt và không liên quan đến việc được yêu cầu bình luận về đồ vật hoặc hành động. Các VD: \" Xem con bò\". \" Máy bay bay nhanh\" hoặc \" Con cho con\". Phát âm không cần hoàn hảo.","",2],["GTD.3.3",1,26,"Gọi tên được các hành động trong tranh và sách.","Phát âm không cần kèm cả giao tiếp mắt. Các VD: \" Em bé ăn\" hoặc \" Con chim bay\". Phát âm không cần hoàn hảo.","",2],["GTD.3.4",1,26,"Bình luận và yêu cầu về vị trí (lên, xuống, trong, trên)","Phát âm cần kèm cả giao tiếp mắt. Các VD: \" Con chó trên bàn\" hoặc \" Quả bóng ở đó\".Phát âm không cần hoàn hảo.","",2],["GTD.3.5",1,26,"Bình luận và yêu cầu bằng cách sử dụng cấu trúc sở hữu đơn giản (của tôi, của bạn)","Phát âm cần kèm cả giao tiếp mắt. Người lớn có thể sử dụng một đồ vật thuộc sở hữu của trẻ. Các VD: \" Cái đó (cốc) của con\" hoặc \" Lượt cô\" hoặc \" Em bé của con\". Phát âm không cần hoàn hảo.","",2],["GTD.3.6",1,26,"Thể hiện cử chỉ/điệu bộ hoặc nói \" Tôi/ con không biết\" trong ngữ cảnh","Phát âm hoặc dùng cử chỉ/điệu bộ (VD: nhún vai, giơ hai tay lên) cần bao gồm cả giao tiếp mắt.","",2],["GTD.3.7",1,26,"Sử dụng tên của người khác một cách nhất quán khi cần thu hút sự chú ý của họ","Phát âm cần kèm cả giao tiếp mắt. Phát âm không cần hoàn hảo.","",2],["GTD.3.8",1,26,"Gửi một thông điệp đơn giản đén người khác (Đi tới nói với mẹ \" Con chào mẹ\")","Phát âm cần kèm cả giao tiếp mắt. Các VD: \"Đi tới nói với mẹ ' Con chào mẹ'\" hoặc \"Đi gọi bố tới đây\". Phát âm không cần hoàn hảo.","",2],["GTD.3.9",1,26,"Nói \" Xin chào\" và \" Tạm biệt\" một cách phù hợp, cả khởi xướng và hồi đáp lại.","Phát âm cần kèm cả giao tiếp mắt.","",2],["GTD.3.10",1,26,"Sử dụng đúng các đại từ chỉ bản thân và người khác (các biến thể tôi và bạn)","Phát âm cần kèm cả giao tiếp mắt. Người có thể muốn sử dụng gương để thăm dò. Phản ứng có thể gồm các biến thể \" bạn và tôi\". Các VD : \" Đó là con\" hoặc \" Con thấy mẹ/ cô…\"","",2],["GTD.3.11",1,26,"Sử dụng các từ và điệu bộ cử chỉ đơn giản để diễn tả trải nghiệm cá nhân.","Phát âm và / hoặc cử chỉ/điệu bộ (VD: làm hành động) cần kèm cả giao tiếp mắt. Trẻ có thể sử dụng các từ đơn hoặc các cụm đơn giản. Các VD: \" Con chó con\", \" Bắt bóng\" hoặc \" Bóng bay lên\". Phát âm không cần hoàn hảo.","",2],["GTD.3.12",1,26,"Gọi tên 1 đến 2 màu sắc (tên sự vật+ màu sắc)","Phát âm không cần kèm cả giao tiếp mắt. Người lớn có thể hỏi \" Xe ô tô màu gì?\" nhưng trẻ cần tự trả lời (\" ô tô đỏ\", \" đó là quả bóng màu xanh\"). Từ tương đương cũng chấp nhận được.","",2],["GTD.3.13",1,26,"Phản ứng lại một cách phù hợp với câu hỏi \" Cái gì?\"","Phát âm không cần kèm cả giao tiếp mắt. Người lớn có thể hỏi lại lần nữa.","",2],["GTD.3.14",1,26,"Phản ứng lại một cách phù hợp với câu hỏi \" Ở đâu?\"","Phát âm không cần kèm cả giao tiếp mắt. Người lớn có thể hỏi lại lần nữa.","",2],["GTD.3.15",1,26,"Phản ứng lại một cách phù hợp với câu hỏi \" Ai?\"","Phát âm không cần kèm cả giao tiếp mắt. Người lớn có thể hỏi lại lần nữa.","",2],["GTD.3.16",1,26,"Hỏi các câu hỏi \" Có/ không\" đơn giản bằng cách tăng ngữ điệu (có thể tăng ngữ điệu ở câu có 1 từ)","Phát âm cần kèm cả giao tiếp mắt. Câu hỏi có thể là câu có 1 từ với ngữ điệu tăng. Các VD : \" Bánh ?\" hoặc \" Đi?\"","",2],["GTD.3.17",1,26,"Hỏi các câu hỏi \" Cái gì?\" và \" Ở đâu?\"","Phát âm cần kèm cả giao tiếp mắt. Cần hỏi được hai loại câu hỏi thì vượt qua.","",2],["GTD.3.18",1,26,"Trả lời một số câu hỏi thông tin đơn giản: tên, tuổi, màu sắc áo,...","Phát âm không cần kèm cả giao tiếp mắt. Các VD: \" Tên con là gì?\", \" Còn bao nhiêu tuổi?\", hoặc \" Áo con màu gì?\".","",2],["XH.3.1",3,44,"Chơi các trò chơi vận động thô đơn giản (Ví dụ: bóng, trốn tìm, trò chơi vòng tròn)","Có tối thiểu 2 lần tham gia các hành động tích cực (chạm tới, bắt chước, phát âm) trong ít nhất 3 trò chơi. Chỉ giao tiếp mắt và cười là không đủ. Các ví dụ: “trốn tìm”, “chơi vòng quanh”, chơi bóng.","",2],["XH.3.2",3,44,"Chia sẻ và chỉ cho xem “đối tượng” khi đối tác yêu cầu","Phản ứng lại trong vòng 3 giây với yêu cầu của đối tác. Đối tác có thể lặp lại lần thứ 2. Phản ứng có thể bao gồm phát âm (Ví dụ: “em bé”) hoặc cử chỉ/điệu bộ (Ví dụ: mang đồ vật cho người lớn, cầm đồ vật trong tay).","",2],["XH.3.3",3,44,"Bắt chước và thể hiện các bài hát mới/các trò chơi ngón tay trong tính huống nhóm","Có tối thiểu 2 lần tham gia các hành động tích cực trong 2 thói quen hoặc nhiều hơn. Chỉ giao tiếp mắt và cười là không đủ. Các ví dụ: “các ngón tay ngoắc ngoắc”, “cù”, “nhện giăng tơ” …","",2],["XH.3.4",3,44,"Phản ứng lại một cách phù hợp với các yêu cầu/hướng dẫn đơn giản từ các bạn cùng lứa","Báo cáo của phụ huynh có thế được chấp nhận. Các ví dụ: “lấy bóng”, “bạn là mẹ”, hoặc “đặt nó ở đây”","",2],["XH.3.5",3,44,"Khởi xướng tương tác và bắt chước các bạn cùng lứa","Báo cáo của phụ huynh có thể được chấp nhận. Khởi xướng/bắt chước tối thiểu 2 vòng trong ít nhất 3 trò chơi phù hợp độ tuổi (Ví dụ: “đuổi bắt), “trốn tìm”, chơi với đoàn tàu, trang phục)","",2],["XH.3.6",3,44,"Chơi đóng vai quen thuộc hàng ngày với bạn cùng lứa","Báo cáo của phụ huynh có thể được chấp nhận. Tham gia tối thiểu 2 vòng. Các hành vi có thể gồm phát âm (Ví dụ: “em bé đói”), bắt chước, hoặc quan sát đối tác chơi. Các ví dụ trò chơi quen thuộc hàng ngày như chơi ngôi nhà, mặc quần áo, chơi đóng vai.","",2],["XH.3.7",3,44,"Chơi lần lượt trong các trò chơi bảng ghép đơn giản","Tham gia vào nhiều hơn 2 vòng trong ít nhất 3 trò chơi phù hợp lứa tuổi. Các ví dụ: “Nối 4 điểm”, “Săn tuần lộc” hoặc “vịt may mắn”.","",2],["XH.3.8",3,44,"Sử dụng những thuật ngữ thể hiện sự lịch sự: “Làm ơn”, “cảm ơn”, “xin lỗi”","Các ví dụ: “Làm ơn”, “cảm ơn” hoặc “xin lỗi” một cách tự phát và phù hợp. Từ tương đương có thể chấp nhận được. Vượt qua nếu sử dụng thường xuyên được 2 trong 3 từ","",2],["XH.3.9",3,44,"Bắt chước một loạt các hành động vận động thô mới lạ khi đứng hoặc khi di chuyển, ví dụ: “làm theo người dẫn đầu” hoặc đi giống các con vật","Các ví dụ: “Làm theo người dẫn đầu”, “Simon nói” hoặc giả vờ di chuyển như các con vật. Tự phát bắt chước 10 hành động mới lạ hoặc hơn. Có thể không chính xác","",2],["XH.3.10",3,44,"Tham gia vào các hoạt động chơi liên quan đến kịch bản bằng lời nói","Tham gia vào 3 hoạt động hoặc nhiều hơn với các hành vi chủ động (nói, thực hiện hành động, bắt chước). Chỉ giao tiếp mắt và cười là không đủ. Các ví dụ: chơi gia đình, đóng vai giáo viên hoặc cho em bé vào giường ngủ.","",2],["XH.3.11",3,44,"Thường xuyên lôi kéo sự chú ý của người khác vào “đối tượng” bằng cách sử dụng lời nói hoặc cử chỉ/điệu bộ để bình luận, chỉ cho xem, chia sẻ và yêu cầu","Khởi xướng các hành vi tối thiểu 3 lần có giáo tiếp mắt. Các ví dụ lời nói (Ví dụ: “mẹ, nhìn, mèo”, “Đổ khối gỗ”, hoặc “Bố, thêm bánh”) kèm cử chỉ/điệu bộ (Ví dụ: đưa hoặc cầm đồ vật cho người lớn, chỉ vào mục).","",2],["XH.3.12",3,44,"Phản ứng lại sự mời gọi của người khác để cùng nhau tham gia chú ý bằng cách cùng nhìn và cùng bình luận","Phản ứng lại trong vòng 3 giây với sự mời gọi của người lớn. Người lớn có thể lặp lại thêm một lần nữa.","",2],["XH.3.13",3,44,"Nhận ra được các trạng thái tình cảm (vui, buồn, giận dữ, sợ hãi) từ ảnh, từ những cái khác và/hoặc qua các nét vẽ","Phản ứng lại trong vòng 3 giây với khởi xướng của người lớn. Người lớn có thể lặp lại thêm một lần nữa. Xác định được 2 hoặc nhiều hơn loại cảm xúc đang tác động (Ví dụ: vui, buồn, ngô nghê, sợ, ngạc nhiên). Lời nói không cần đi kèm giao tiếp mắt.","",2],["XH.3.14",3,44,"Diễn tả được các trạng thái tình cảm từ ảnh, từ những cái khác và/hoặc qua các nét vẽ","Diễn tả được 2 hoặc nhiều hơn loại cảm xúc đang tác động (Ví dụ: vui, buồn, ngô nghê, sợ, ngạc nhiên). Lời nói không cần đi kèm giao tiếp mắt.","",2],["XH.3.15",3,44,"Tự thể hiện cảm xúc trên khuôn mặt mình (vui, buồn, ngô nghê, sợ hãi)","Thể hiện 2 cảm xúc tác động hoặc nhiều hơn (Ví dụ: vui, buồn, ngô nghê, sợ, ngạc nhiên). Phản ứng lại không cần đi kèm giao tiếp mắt.","",2],["NT.3.1",4,29,"Ghép các chữ cái thành tên mình","Ghép tất cả các chữ cái thành tên mình","",2],["NT.3.2",4,29,"Ghép các chữ cái (Nhận diện mặt từng chữ cái)","Ghép 5 chữ hoặc nhiều hơn. Có thể là phản ứng lại với tín hiệu bằng lời nói của người lớn (Ví dụ: “Chữ A ở đâu?”) hoặc thực hiện một vài lần thử đầu tiên, nhưng trẻ cần ghép được độc lập ít nhất ở 5 lần thử.","",2],["NT.3.3",4,29,"Ghép các từ (Nhận diện đồng thời cụm chữ cái tạo nên từ)","Ghép/phân loại 5 từ hoặc nhiều hơn. Có thể là phản ứng lại với tín hiệu bằng lời nói của người lớn (Ví dụ: “từ m-è-o ở đâu?”) hoặc thực hiện một vài thử ……..","",2],["NT.3.4",4,29,"Ghép các số Nhận diện mặt từng số","Ghép/ phân loại 5 số hay nhiều hơn. Có thể phản ứng lại với tín hiệu bằng lơi nói của người lớn VD : số 6 đâu? Hay thực hiện một vài lần thử đầu tiên nhưng trẻ cần ghép được độc lập it́ nhất ở 5 lần thử.","",2],["NT.3.5",4,29,"Nhận biết thể hiện được một số chữ cái, con số, hìng dạng và màu sắc","Xác định được số lượng tối thiểu 5 trong mỗi hạng mục. Có thể phản ứng lại với tín hiệu bằng lơi nói của người lớn (VD : “số 6 đâu”?, “Chỉ cho cô bút màu xanh”? Hay “Chữ cái…đâu?)”Hay thực hiện một vài lần thử đầu tiên nhưng trẻ cần ghép được độc lập it́ nhất ở 5 lần thử.","",2],["NT.3.6",4,29,"Chơi trò liên quan đến việc nhớ ra đồ vật bị giấu","Xác định được ít nhất 3 đồ vật bị giấu. Người lớn thăm dò bằng cách cho trẻ xem 3 đồ vật (VD: đồng xu, quả bóng nhỏ, que) và sau đó chụp mỗi cái cốc vào từng món.. Đợi 7 giây và sau đó cho xem bản copy thứ hai của các món bị giấu (Vd : Quả bóng nhỏ và hỏi quả bóng đâu?). Phản ứng cuả trẻ có thể là lời nói “Kia” hay cử chỉ điệu bộ (Vd: Chỉ tay/ cầm cốc lên.) Giao tiếp mắt không cần thiết. Nên cho thử nhiều lần","",2],["NT.3.7",4,29,"Phân loại các đồ vật/tranh ảnh theo 8 mục","Phân loại theo bộ có số lượng 3 cho đến 8 mục","",2],["NT.3.8",4,29,"Hiểu được mối quan hệ giưã các biểu tượng về số lượng và chữ số từ 1->5","Hiểu được mối quan hệ cả bằng lời nói (VD : Đếm đến 5 đồ vật) hay bằng cử chỉ điệu bộ (VD : Chạm vào hay ghép nhóm 5 đồ vật)","",2],["NT.3.9",4,29,"Đếm đúng số đối tượng từ 5 trở lên","Xác định được số lượng 5 đối tượng hay nhiều hơn. Người lớn có thể cho trẻ đếm những đồ vật yêu thích như kẹo,đoàn tàu và những khối gỗ. Người lớn có thể đếm mục đầu tiên để bắt đầu nhưng trẻ phải tiếp tục và tự kết thúc.","",2],["NT.3.10",4,29,"Xâu chuỗi từ 3 tranh trở lên đúng theo trình tự và diễn tả lại trình tự bằng cách sử dụng các từ “ đầu tiên, sau đó”","Có thể trong phản ứng với tín hiệu băng lời nói của người lớn Vd: Tiếp theo làm gì . Trẻ cần tự xâu chuỗi và kể lại khi được hỏi “ Kể cho cô về cái đó” đối với 3 chuỗi tranh khác nhau","",2],["C.3.1",3,30,"Chơi trò xây dựng bao gồm một chuỗi các chủ đề chơi phức tạp, kết hợp sử dụng các đồ vật đa dạng Vd: Xe tải trên đường, viên gạch xây nhà, xâu hạt thành vòng cổ","Xây dựng được ba chủ đề chơi hay nhiều hơn","",2],["C.3.2",3,30,"Kết nối từ 3 hành động có liên quan trở lên trong trò chơi xâu chuỗi","Vd: Xây dựng đường ray, đẩy tàu hoả và đâm vào tàu hay chia đất nặn, dụng cụ cắt theo hình dạng lấy hình cắt ra.","",2],["C.3.3",3,30,"Thực hiện từ 2 hành động kết nối với nhau trở lên khi chơi với búp bê hay thú nhồi bông khi được hướng dẫn","Vd: Rót nước và cho bé uống, lấy chăn và cho búp bê lên giường đi ngủ hay đặt thú bông lên xe và đẩy thú bông đi.","",2],["C.3.4",3,30,"Xếp đặt chỗ phù hợp lên các mô hình đồ vật, phương tiện thu nhỏ một cách thích hợp","Xếp đặt chỗ trong bối cảnh phù hợp khi chơi. Vd: Ba ngồi trong ghế bành đề xem tivi, mẹ ngồi trong xe để đi chợ.","",2],["C.3.5",3,30,"Thực hiện các hành động với búp bê hay thú đồ chơi một cách tự phát","Thực hiện ba hành động trở lên không cần người lớn nhắc.","",2],["C.3.6",3,30,"Sắp xếp các đồ dùng theo chủ đề chơi","Chỉ dùng 2 (hoặc nhiều hơn) số lần nhắc trong 3 (hoặc nhiều hơn) chủ đề chơi khác nhau. Vd: sắp xếp nĩa và cho em bé ăn, đặt mũ lên đầu của mình và người khác để chơi mặc quần áo.","",2],["VDT.3.1",5,31,"Hoàn thiện bảng ghép với 5-6 miếng ăn khớp nhau","Đã giải thích","",2],["VDT.3.2",5,31,"Bắt chước vẽ hình tròn, chữ thập, hình vuông, đường chéo","Bắt chước mỗi hình ở tối thiểu một lần. Người lớn làm mẫu và có thể sử dụng lời nhắc Vd: “vẽ đi”","",2],["VDT.3.3",5,31,"Bắt chước và xây dựng các cấu trúc bằng khối khác nhau có sử dụng đa dạng các vật liệu xây dựng các khối, Lego, các đồ chơi Tinker","Sử dụng 5 khối hay nhiều hơn để xây dựng 3 cấu trúc khác nhau hay nhiều hơn .","",2],["VDT.3.4",5,31,"Xâu qua lỗ trong mảnh xâu hình","Xâu qua 3 lỗ hay nhiều hơn. Người lớn có thể dùng hình thức nhắc bằng lời hoặc làm mẫu lần đầu.","",2],["VDT.3.5",5,31,"Di/ tô theo các đường thẳng, đường cong bằng ngón tay hay các dụng cụ tập viết.","Di/ tô theo các đường thẳng, đường cong bằng ngón tay và dụng cụ vẽ. Người lớn có thể làm mẫu.","",2],["VDT.3.6",5,31,"Sử dụng các kẹp hay cái nĩa để thả thả nhặt đồ vật.","Biết dùng 2 (hoặc nhiều hơn) loại dụng cụ để kẹp và thả 2 (hoặc nhiều hơn) đồ vật. Vd: Sử dụng một thià to để xúc/ thả một miếng đồ ăn hay cái kẹp để kẹp lên","",2],["VDT.3.7",5,31,"Di/tô theo các hình dạng khác nhau","Di/tô theo các 3 hình dạng khác nhau hay nhiều hơn Vd : Hình vuông, hình tròn, hình tam giác, hình chữ nhật","",2],["VDT.3.8",5,31,"Sử dụng kéo ngón tay ở vị trí/tư thế thích hợp và dùng tay còn lại để giữ và xoay giấy","Cắt không cần theo một đường nhưng phải cắt giấy ra làm hai. Người lớn có làm mẫu cách cầm cầm kéo và cắt dọc giấy.","",2],["VDT.3.9",5,31,"Cắt theo đường kẻ - đường thẳng và cong","Cắt dọc chính xác theo đường. Người lớn có thể làm mẫu ở lần thử đầu tiên.","",2],["VDT.3.10",5,31,"Tạo sản phẩm nghệ thuật gồm hai bước cắt và dán, đóng dấu và chấm mực","Người lớn có thể gợi ý bằng lời. Vd: làm cái này sau đó làm cái này hay thể hiện các bước làm trong lần thử đầu tiên.","",2],["VDT.3.11",5,31,"Sử dụng các công cụ để tạo ra hìng dạng của đất nặn, từ đó sáng tạo ra nhiều chủ đề chơi.","Thực hiện ba chủ đề chơi + dùng được 2 dụng cụ (hay nhiều hơn). Vd: vo tròn đất nặn, kẹp đất và cắt bằng dao để tạo hình con rắn; hoặc tạo hình cầu và dùng nĩa để tưởng tượng là đang ăn,…","",2],["VDTH.3.1",6,32,"Đi xe ba bánh (đạp xe, chỉnh hướng, giữ đúng hướng)","Đạp pê đan và tự lái theo một đường nhất định","",2],["VDTH.3.2",6,32,"Đá và giữ thăng bằng tốt","Đá không cần bám vào đồ vật, không vấp ngã. Thực hiện được ba lần (hoặc nhiều hơn)","",2],["VDTH.3.3",6,32,"Sử dụng các thiết bị ở sân chơi có người lớn hỗ trợ","Vd : Đu quay, ván trượt nhỏ, ván bập bênh, xà đu,..","",2],["VDTH.3.4",6,32,"Chơi trò đuổi bắt với người lớn và các bạn, chạy dễ dàng, thay đổi hướng, giữ thăng bằng tốt","Chơi tối thiểu năm phút","",2],["VDTH.3.5",6,32,"Bắt chước các hành động vận động thô với chuyển động theo bài hát","Năm hành động hay nhiều hơn trong tối thiểu ba bài hát","",2],["VDTH.3.6",6,32,"Ném thấp tay vào mục tiêu","Tối thiểu ba lần, không cần trúng đích hoàn hảo","",2],["VDTH.3.7",6,32,"Nhảy chụm hai chân về phiá trước","Nhảy về phía trước ba lần hay nhiều hơn","",2],["VDTH.3.8",6,32,"Nhảy lò cò","Nhảy lò cò bằng một chân ít nhất một lần có thể vịn vào người/đồ vật khác. Không ngã.","",2],["TL.3.1",7,45,"Sử dụng thià dĩa và li một cách gọn gàng và không đổ","Không cần cầm đúng","",2],["TL.3.2",7,45,"Cư xử phù hợp trong nhà hàng","Không có hành vi nghiêm trọng nào Vd: Ném, bò dưới gầm bàn, chạy đi. Thỉnh thoảng gây ôǹ ào nhưng có thể thu hút vào hoạt động khác Vd: Vẽ trên bàn, chơi với đồ chơi","",2],["TL.3.3",7,45,"Biết sử dụng độc lập hệ thống các biểu tượng (icon/symbol) để lựa chọn, thực hiện các hoạt động (nếu ở nhà và ở trường có yêu cầu)","Biết tìm các biểu tượng thích hợp trong sách, hoàn thành hoạt động mà không cần sự trợ giúp (>80%). Nếu nhà trường không yêu cầu vấn đề này, bỏ qua.","",2],["TL.3.4",7,45,"Tự mang đồ dùng cá nhân vào hay lấy ra từ xe, trường hay nhà","Vd : Ba lô, áo khoác,....","",2],["TL.3.5",7,45,"Mở và khoá balô một cách độc lập, cho vào và lấy ra khi được yêu cầu","cho vào và lấy ra khi được yêu cầu","",2],["TL.3.6",7,45,"Mặc và cởi quần áo phù hợp","Tự kéo khóa và đóng cúc","",2],["TL.3.7",7,46,"Sử dụng toilet độc lập, tất cả các bước","Có thể yêu cầu trợ giúp rửa tay nếu không thể với tới bồn","",2],["TL.3.8",7,46,"Tự thao tác với trang phục khi đi vệ sinh nhưng không cần kéo khóa/gài nút","Kéo đồ lót và quần lên xuống, người lớn có thể giúp cầm quần áo nhưng trẻ phải tự kéo lên xuống","",2],["TL.3.9",7,46,"Rửa tay một cách độc lập","Mở/ đóng vòi, xoa tay xà bông và lau khô tay. Có thể cần phải nhắc.","",2],["TL.3.10",7,46,"Lau mặt bằng khăn ấm khi đưa khăn cho trẻ","Đưa khăn lên mặt và lau. Có thể cần phải nhắc.","",2],["TL.3.11",7,46,"Chải tóc bằng lược","Có thể cần phải nhắc.","",2],["TL.3.12",7,46,"Che miệng khi ho và hắt xì","Có thể cần phải nhắc.","",2],["TL.3.13",7,46,"Tắm và lau khô, có thể cần hỗ trợ tích cực khi","Hỗ trợ: cung cấp khăn, dầu gội, bỏ dầu gội/sữa tắm lên khăn. Trẻ tự lau/chà người và lau khô.","",2],["TL.3.14",7,46,"Đánh răng bằng bàn chải, it́ nhất vài đường","Người lớn có thể bôi kem vào bàn chải","",2],["TL.3.15",7,47,"Cho vật nuôi ăn uống","Cho đồ ăn, nước uống vô tô và đem tới vật nuôi. Người lớn có thể giúp mở gói đồ ăn, đo lường và nhắc.","",2],["TL.3.16",7,47,"Giúp đỡ dọn bàn","Dọn dẹp ít nhất 2 hay nhiều đồ vật để vào bồn rửa. Có thể cần phải nhắc.","",2],["TL.3.17",7,47,"Giúp đỡ dọn dẹp máy rửa chén","Dọn dẹp ít nhất 5 hay nhiều đồ vật. Người lớn chỉ đồ nào đặt ở đâu. Dọn dẹp ít nhất 2 hay nhiều đồ vật để vào bồn rửa. Có thể cần phải nhắc.","",2],["TL.3.18",7,47,"Xếp quần áo sạch vào tủ","Đăṭ 3 món quần áo hay nhiều hơn gọn gàng vào tủ. Không cần biết gấp quần áo. Có thể cần phải nhắc.","",2],["TL.3.19",7,47,"Dọn vật dụng cá nhân khi được yêu cầu","Cầm vật dụng cá nhân cất đi khi được yêu cầu. Để đồ vật đúng chỗ. Có thể cần phải nhắc.","",2],["GTN.4.1",0,25,"Hiểu được nhiều khái niệm về mối liên hệ thể chất.","Cầm lên, đưa cho, chỉ tay hoặc chọn 1 trong 2 đồ vật đúng cho người lớn. Trẻ xác định đúng 5 khái niệm khác nhau. VD: nóng/lạnh, hết/đầy, ướt/khô, cứng/mềm, nặng/nhẹ, cao/thấp, dài/ngắn, lớn/bé.","",3],["GTN.4.2",0,25,"Lấy ra được 10-15 đồ vật bằng cách sử dụng 2-3 dấu hiệu khác nhau (VD: kích cỡ, số lượng, màu sắc, nhãn mác).","Cầm lên, đưa, chỉ hoặc cho người lớn xem đồ vật đúng (VD: người lớn hỏi \"Con có thể lấy cho cô chiếc bút màu xanh không?\" và trẻ đưa đúng đồ.","",3],["GTN.4.3",0,25,"Hiểu được các đại từ liên quan đến giới tính.","Trẻ cầm lên, đưa, chỉ hoặc cho xem nhân vật nam hoặc nữ, tượng hoặc người thực phản ứng lại một cách phù hợp với những chỉ dẫn gồm \"anh ấy hay cô ấy\". VD: \"Đặt cậu bé vào ô tô\" hoặc \"Cô ấy muốn một vài cây kem\". Trẻ cần vượt qua ít nhất một đại từ về giới tính.","",3],["GTN.4.4",0,25,"Hiểu được các đại từ so sánh: lớn hơn, ngắn hơn, nhỏ hơn, nhất, ít nhất, một vài, nhiều,…","Cầm lên, đưa chỉ tay hoặc cho xem đồ vật đúng cho người lớn trong một nhóm có 4-5 vật để lựa chọn. Để vượt qua, trẻ cần phải hiểu được 3 nhóm so sánh hoặc nhiều hơn.","",3],["GTN.4.5",0,25,"Hiểu được mối liên hệ không gian bao gồm các đồ vật và các giới từ đằng sau, đằng trước.","Trẻ hiểu được những khái niệm: bên cạnh, đằng sau, ở phía trước bằng cách để đồ vật đúng vị trí hoặc nhìn vào địa điểm đúng khi được hướng dẫn. (VD: Nhìn đằng sau ghế).","",3],["GTN.4.6",0,25,"Hiểu được các khái niệm phủ định (VD: hộp không có bóng, cậu bé không ngồi).","Cầm lên, đưa, chỉ tay hoặc cho xem các đồ vật dùng để xác định đúng để xác định đúng sự thiếu vắng một đồ vật nào đó (chiếc bát không có quả sơ ri) hoặc tìm bạn không đội mũ) hoặc một hành động bị thiếu (người đang không ngủ).","",3],["GTN.4.7",0,25,"Hiểu được sở hữu của mối liên hệ trong tổng thể.","Với đồ vật và tranh ảnh, trẻ chỉ tay hoặc cho xem bộ phận nào đó khi được yêu cầu (VD: mũi con thỏ, bánh xe, cánh cửa xe ô tô).","",3],["GTN.4.
